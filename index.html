      '<details><summary style="padding:10px 14px;cursor:pointer;color:var(--ink-2);font-size:12.5px">Open the primer \u2014 who the trader groups are and why they behave differently</summary>' +
      '<div class="nrg-grid">' +
      '<div class="nrg-cell"><h4>Managed money (funds, CTAs)</h4><p>Hedge funds and commodity trading advisers trading for profit. No physical oil to protect, so their position <b>is</b> their view. Many run systematic trend and momentum models, which is why they tend to buy after prices rise and sell after they fall. They are the group most likely to move price in the short run and the one most watched.</p></div>' +
      '<div class="nrg-cell"><h4>Producers, merchants, processors, users</h4><p>Oil producers, refiners, traders and airlines hedging real barrels. Producers sell futures to lock in future revenue, so this group is usually <b>net short</b>, and sells harder when prices rise (better prices to hedge at). Their short is insurance, not a bearish bet.</p></div>' +
      '<div class="nrg-cell"><h4>Swap dealers</h4><p>Banks that write over-the-counter swaps for clients (e.g. an airline buying a fixed fuel price) and hedge the resulting exposure in futures. Their position mirrors their clients\u2019 hedging, not a house view.</p></div>' +
      '<div class="nrg-cell"><h4>Other reportables &amp; small traders</h4><p>Large traders that fit no other bucket (proprietary firms, some family offices), plus non-reportable positions below CFTC/ICE reporting size. Useful as residual context.</p></div>' +
      '<div class="nrg-cell"><h4>Timing</h4><p>Positions are as of <b>Tuesday</b> close and published <b>Friday</b> (3 days late). So a Friday report describes a market that has already traded three more sessions. EIA inventory data arrives Wednesday (oil) and Thursday (gas) for the week ending the previous Friday.</p></div>' +
      '<div class="nrg-cell"><h4>Every contract has two sides</h4><p>Total longs always equal total shorts. If managed money adds 20k longs, someone else sold 20k \u2014 usually producers and swap dealers. That is why the commercial and fund lines below look like mirror images.</p></div>' +
      "</div>" +
      '<div class="mo-sub" style="padding:0 14px">The four moves \u2014 read the two legs, not just the net</div>' +
      '<div class="nrg-act">' +
      '<div><b>Fresh buying</b>New long positions opened. Conviction that price goes up; adds new money.</div>' +
      '<div><b>Short covering</b>Existing shorts bought back. Can be fear or profit-taking rather than a bullish view, and often fuels sharp rallies that fade once covering ends.</div>' +
      '<div><b>Long liquidation</b>Existing longs sold. Funds giving up on (or banking) a bullish trade; money leaving.</div>' +
      '<div><b>Fresh shorting</b>New short positions opened. An active bearish bet.</div>' +
      "</div></details></section>";
  }

  function nrgBoard() {
    var ms = (ENERGY && ENERGY.markets) || [];
    var rows = ms.map(function (m) {
      var L = m.latest || {}, mm = (L.cats || {}).mm || {};
      var streak = L.streak ? L.streak + " wk " + (L.streakUp ? "adding" : "cutting") : "\u2014";
      return '<tr data-nrg="' + esc(m.key) + '"' + (m.key === NRG_SEL ? ' class="on"' : "") + ">" +
        '<td class="lft"><b>' + esc(m.label) + '</b><div class="kpi-m">' + esc(m.venue) + "</div></td>" +
        "<td>" + nrgK(mm.net, true) + "</td>" +
        '<td class="' + cls(mm.dNet) + '">' + nrgK(mm.dNet, true) + "</td>" +
        '<td class="lft">' + nrgActionPill(L.action, mm.dNet) + "</td>" +
        '<td class="lft">' + nrgPbar(L.pct3y) + "</td>" +
        "<td>" + streak + "</td>" +
        "<td>" + (L.longShare == null ? "\u2014" : nrgN(L.longShare, 0) + "%") + "</td>" +
        '<td class="' + cls(L.ret) + '">' + (L.ret == null ? "\u2014" : nrgPct(L.ret)) + "</td></tr>";
    }).join("");
    return '<section class="card"><div class="card-hd"><h2>Managed money across energy \u2014 this week</h2>' +
      '<span class="sub">positions to ' + esc(nrgD(ENERGY.asOf)) + " \u00b7 click a row to study that market</span></div>" +
      '<div class="tablewrap"><table class="dt nrg-board"><thead><tr><th class="lft">Market</th><th>Net</th><th>Week \u0394</th>' +
      '<th class="lft">Largest leg</th><th class="lft">3-year percentile</th><th>Streak</th><th>Long share</th><th>Price wk</th></tr></thead><tbody>' +
      rows + "</tbody></table></div>" +
      '<div class="caution"><p><b>How to use this.</b> The percentile places today\u2019s net against the last 156 weekly reports for the same market: near 100 = funds hold about as much net length as they have in three years (crowded long; fewer new buyers left), near 0 = the opposite. <i>Long share</i> is longs \u00f7 (longs + shorts) for managed money. Price is the front-month future over the same Tuesday-to-Tuesday window; ICE Gasoil and Dubai have no stored price.</p></div></section>';
  }

  function nrgHolders(m, rows) {
    var last = rows[rows.length - 1], back = rows[rows.length - 5];
    var body = ["mm", "pm", "sw", "or", "nr"].map(function (k) {
      var c = last.c[k], b = back && back.c[k];
      var d4 = b && c.net != null && b.net != null ? c.net - b.net : null;
      var lab = (ENERGY.categories || {})[k] || k;
      return "<tr><td class=\"lft\">" + esc(lab) + "</td><td>" + nrgN(c.L) + "</td><td>" + nrgN(c.S) + "</td>" +
        "<td>" + nrgK(c.net, true) + '</td><td class="' + cls(c.dNet) + '">' + nrgK(c.dNet, true) + "</td>" +
        '<td class="' + cls(d4) + '">' + nrgK(d4, true) + "</td>" +
        "<td>" + (last.oi ? nrgPct(c.net / last.oi * 100) : "\u2014") + "</td></tr>";
    }).join("");
    var L = m.latest || {}, t = L.traders || {}, mm = last.c.mm;
    var tr = t.mmL != null ? '<p class="mo-sub" style="padding:0 14px 10px">Managed-money traders: <b>' + t.mmL + "</b> long, <b>" + t.mmS +
      "</b> short" + (t.mmSp != null ? ", " + t.mmSp + " spreading" : "") + ". Average long " + nrgN(mm.L / t.mmL) +
      " contracts per trader, average short " + nrgN(mm.S / t.mmS) + ". Many traders holding small positions is a broad consensus; few traders holding large ones is concentrated and can unwind fast.</p>" : "";
    return '<section class="card"><div class="card-hd"><h2>Who holds what \u00b7 ' + esc(m.label) + "</h2>" +
      '<span class="sub">contracts, week to ' + esc(nrgD(last.d)) + " \u00b7 open interest " + nrgN(last.oi) + "</span></div>" +
      '<div class="tablewrap"><table class="dt"><thead><tr><th class="lft">Trader group</th><th>Long</th><th>Short</th><th>Net</th><th>1-week \u0394</th><th>4-week \u0394</th><th>Net / OI</th></tr></thead><tbody>' +
      body + "</tbody></table></div>" + tr + "</section>";
  }

  function nrgCharts(m, rows) {
    var hasPx = rows.some(function (r) { return r.px != null; });
    var u = m.unit || "";
    var last52 = rows.slice(-52);
    return '<section class="card"><div class="card-hd"><h2>Positions vs price \u00b7 ' + esc(m.label) + "</h2>" +
      '<span class="sub">' + rows.length + " weekly reports \u00b7 same time axis \u00b7 hover for the week</span></div>" +
      '<div class="nrg-two"><div class="nrg-ch">' +
      (hasPx ? '<div class="nrg-ch-h">Price \u00b7 ' + esc(u) + '</div><div class="nrg-ch-s">front-month close on each report Tuesday</div>' +
        nrgLine(rows, [{ label: "Price", color: "var(--ink-2)", get: function (r) { return r.px; } }],
          { h: 120, fmt: function (v) { return nrgN(v, u.indexOf("gal") >= 0 || u.indexOf("MMBtu") >= 0 ? 3 : 2); },
            aria: m.label + " price on each report date",
            rows: function (r) { return [["MM net", nrgK(r.c.mm.net, true)], ["3y pctile", nrgOrd(r.pct3y)]]; } })
        : '<div class="nrg-ch-h">Price</div><div class="caution"><p>No price series is stored for this ICE contract, so price-response statistics are not computed.</p></div>') +
      '</div><div class="nrg-ch"><div class="nrg-ch-h">Managed money net position</div><div class="nrg-ch-s">contracts \u00b7 above the dashed line = net long</div>' +
      nrgLine(rows, [{ label: "Managed money net", color: "var(--calls)", get: function (r) { return r.c.mm.net; } }],
        { h: 120, zero: true, fmt: function (v) { return nrgK(v, true); }, aria: "Managed money net position by week",
          rows: function (r) { return [["Longs", nrgN(r.c.mm.L)], ["Shorts", nrgN(r.c.mm.S)], ["3y pctile", nrgOrd(r.pct3y)], ["Price", r.px == null ? "\u2014" : nrgN(r.px, 2)]]; } }) +
      '</div><div class="nrg-ch"><div class="nrg-ch-h">Who is on each side</div><div class="nrg-ch-s">net contracts by group \u00b7 notice the mirror image</div>' +
      nrgLine(rows, NRG_CAT.map(function (c) { return { label: c.label, color: c.color, get: function (r) { return r.c[c.k].net; } }; }),
        { h: 140, zero: true, fmt: function (v) { return nrgK(v, true); }, aria: "Net positions of four trader groups by week" }) +
      '</div><div class="nrg-ch"><div class="nrg-ch-h">Managed money weekly change \u00b7 last 52 weeks</div><div class="nrg-ch-s">blue = net length added \u00b7 orange = removed \u00b7 hover for the two legs</div>' +
      nrgBars(last52, function (r) { return r.c.mm.dNet; }, { h: 140, aria: "Managed money weekly net change, last 52 weeks" }) +
      "</div></div></section>";
  }

  function nrgThisWeek(m) {
    var L = m.latest || {};
    return '<section class="card" id="nrg-focus"><div class="card-hd"><h2>What managed money did this week \u00b7 ' + esc(m.label) + "</h2>" +
      '<span class="sub">' + esc(m.contract || "") + " \u00b7 positions to " + esc(nrgD(m.asOf)) + "</span></div>" +
      '<ol class="nrg-story">' + (L.story || []).map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol>" +
      '<div class="caution"><p><b>Facts vs. reasons.</b> Line 1 is the reported position change. The other lines are what was <i>observably true in the same window</i> (price, inventories against their seasonal norm, the dollar, who took the other side). They are the conditions funds were reacting to, not a statement of any trader\u2019s motive. Use the statistics below to judge how often each kind of condition has actually lined up with fund flows in this market.</p></div></section>';
  }

  function nrgLessons(m) {
    var s = m.stats || {}, a = s.after || {};
    var f = function (x) { return x && x.r != null ? "r = " + nrgR(x.r) + " (" + x.read + ", n = " + x.n + ")" : "not enough data"; };
    var cells = [];
    if (s.withTrendPct != null) {
      var wt = s.withTrendPct;
      cells.push('<div class="nrg-cell nrg-lesson"><h4>Do they follow price?</h4><div class="nrg-big">' + nrgN(wt, 0) + "% of weeks</div>" +
        "<p>Share of weeks since " + esc(nrgD(s.from)) + " in which managed money changed its net position in the <b>same direction</b> as that week\u2019s price move. Same-week link: " + f(s.sameWeek) + ".</p>" +
        "<p><b>Lesson:</b> " + (wt >= 60 ? "this group mostly <b>follows</b> price. Its buying usually confirms a rally already under way rather than anticipating one; its selling confirms a decline. Treat a fund-buying headline as a description of momentum, not a forecast."
          : wt >= 52 ? "a mild tendency to move with price, not a strong one."
          : "in this market funds do not systematically chase price; flows are closer to independent of the weekly move.") + "</p></div>");
    }
    cells.push('<div class="nrg-cell nrg-lesson"><h4>Does their move predict the next month?</h4><div class="nrg-big">' + nrgR((s.next4w || {}).r) + "</div>" +
      "<p>Correlation between a week\u2019s fund flow and the price change over the <b>following 4 weeks</b>: " + f(s.next4w) + ". Next week only: " + f(s.next1w) + ".</p>" +
      "<p><b>Lesson:</b> " + ((s.next4w || {}).r == null ? "no price series to test against." :
        Math.abs(s.next4w.r) < 0.1 ? "almost no forecasting power. Positioning explains the move that just happened far better than the next one, so on its own a weekly COT change is not a trade signal."
        : s.next4w.r > 0 ? "some follow-through: weeks of fund buying have tended to be followed by further gains (still a correlation, not a guarantee)."
        : "a contrarian tendency: heavy fund buying has tended to be followed by weaker prices.") + "</p></div>");
    cells.push('<div class="nrg-cell nrg-lesson"><h4>Who takes the other side?</h4><div class="nrg-big">' + nrgR((s.vsCommercials || {}).r) + "</div>" +
      "<p>Correlation between the weekly change of managed money and of producers + swap dealers combined: " + f(s.vsCommercials) + ".</p>" +
      "<p><b>Lesson:</b> " + ((s.vsCommercials || {}).r != null && s.vsCommercials.r < -0.5 ?
        "near mirror image. When funds buy, hedgers sell \u2014 producers lock in higher prices for future output and banks offload client hedges. Commercial selling into a rally is hedging, not a bearish call."
        : "the mirror is looser here; other reportables and small traders absorb a meaningful part of fund flow.") + "</p></div>");
    if (s.vsInventory) {
      cells.push('<div class="nrg-cell nrg-lesson"><h4>Do inventories drive them?</h4><div class="nrg-big">' + nrgR(s.vsInventory.r) + "</div>" +
        "<p>Fund flow vs. the " + esc(s.vsInventory.series) + " change <i>relative to its 5-year seasonal norm</i> released in the same window: " + f(s.vsInventory) + ". Negative = funds add length when stocks draw more than usual.</p>" +
        "<p><b>Lesson:</b> " + (s.vsInventory.r == null ? "not enough overlapping data." : Math.abs(s.vsInventory.r) < 0.15 ?
          "one weekly inventory surprise explains little of the weekly flow; price momentum dominates. Inventories matter through the trend they build over months, which shows up in price first."
          : s.vsInventory.r < 0 ? "a visible link: tighter-than-normal weeks coincide with fund buying, looser weeks with selling."
          : "an unexpected positive link; treat with caution, it may reflect seasonal timing rather than reaction.") + "</p></div>");
    }
    cells.push('<div class="nrg-cell nrg-lesson"><h4>The dollar</h4><div class="nrg-big">' + nrgR((s.vsDollar || {}).r) + "</div>" +
      "<p>Fund flow vs. the US dollar index move in the same window: " + f(s.vsDollar) + ". Prior 4-week price trend vs. this week\u2019s flow: " + f(s.prior4w) + ".</p>" +
      "<p><b>Lesson:</b> " + (((s.vsDollar || {}).r != null && Math.abs(s.vsDollar.r) >= 0.15) ? "the dollar shows a measurable association here." : "weekly dollar moves explain little of fund flow in this market.") +
      " A weak 4-week-trend link means funds react within the same week rather than on a lag.</p></div>");
    var row = function (lab, b, hint) {
      return "<tr><td class=\"lft\">" + lab + '<div class="kpi-m">' + hint + "</div></td><td>" + (b && b.n || 0) + "</td>" +
        '<td class="' + cls(b && b.avg) + '">' + (b && b.avg != null ? nrgPct(b.avg) : "\u2014") + "</td>" +
        "<td>" + (b && b.up != null ? nrgN(b.up, 0) + "%" : "\u2014") + "</td></tr>";
    };
    var ext = s.after ? '<div class="mo-sub" style="padding:0 14px">What price did over the next 4 weeks after\u2026</div>' +
      '<div class="tablewrap"><table class="dt"><thead><tr><th class="lft">Situation</th><th>Weeks</th><th>Avg 4-wk return</th><th>% up</th></tr></thead><tbody>' +
      row("Any week (baseline)", a.all, "compare every row to this") +
      row("Funds crowded long", a.crowdedLong, "net \u2265 90th percentile of trailing 3 years") +
      row("Funds crowded short / very light", a.crowdedShort, "net \u2264 10th percentile") +
      row("Unusually large fund buying", a.bigBuy, "weekly change \u2265 2 standard deviations") +
      row("Unusually large fund selling", a.bigSell, "weekly change \u2264 \u22122 standard deviations") +
      "</tbody></table></div>" +
      '<div class="caution"><p><b>Read the n.</b> A row built from a handful of weeks is an anecdote, not a pattern. Extremes matter because when nearly every fund is already long, the pool of new buyers is thin and the position itself becomes a source of selling if the story changes \u2014 but the table shows whether that has actually paid off here.</p></div>' : "";
    return '<section class="card"><div class="card-hd"><h2>How managed money behaves in ' + esc(m.label) + "</h2>" +
      '<span class="sub">' + (s.weeks || 0) + " weekly reports since " + esc(nrgD(s.from)) + " \u00b7 correlations, not causes</span></div>" +
      '<div class="nrg-grid">' + cells.join("") + "</div>" + ext + "</section>";
  }

  function nrgLog(m) {
    var items = (m.log || []).map(function (w, i) {
      return "<details" + (i === 0 ? " open" : "") + "><summary>" +
        "<span>" + esc(nrgD(w.d)) + "</span>" +
        "<span>" + nrgActionPill(w.action, w.dNet) + ' <span style="color:var(--ink-3);font-size:11.5px">' + esc((w.combo || "").split(" \u2014 ")[0]) + "</span></span>" +
        '<span class="num ' + cls(w.dNet) + '">' + nrgK(w.dNet, true) + "</span>" +
        '<span class="num ' + cls(w.ret) + '">' + (w.ret == null ? "\u2014" : nrgPct(w.ret)) + "</span>" +
        "<span>" + nrgPbar(w.pct3y) + "</span></summary>" +
        '<ol class="nrg-story">' + (w.story || []).map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") +
        (w.fr4 != null ? '<li style="color:var(--ink-3)">Hindsight: over the next 4 weeks price moved ' + nrgPct(w.fr4) + ".</li>" : "") +
        "</ol></details>";
    }).join("");
    return '<section class="card"><div class="card-hd"><h2>Decision log \u00b7 ' + esc(m.label) + "</h2>" +
      '<span class="sub">last ' + (m.log || []).length + " reports, newest first \u00b7 open a week to see what was true when they moved</span></div>" +
      '<div class="nrg-log"><div class="nrg-log-h"><span>Week to</span><span>What they did</span><span>Net \u0394</span><span>Price</span><span>Crowding</span></div>' +
      items + "</div>" +
      '<div class="caution"><p><b>Learning drill.</b> Before opening a week, guess the move from the context lines, then check. The hindsight line shows whether following the funds that week would have paid over the next month.</p></div></section>';
  }

  function nrgInventory(m) {
    var inv = (ENERGY && ENERGY.inventories) || {};
    var keys = { WTI: ["crude", "cushing", "refutil", "production"], BRENT: ["crude", "refutil"], DUBAI: ["crude"],
      NATGAS: ["natgas"], RBOB: ["gasoline", "refutil"], ULSD: ["distillate", "refutil"], GASOIL: ["distillate"] }[m.key] || [];
    var cells = keys.filter(function (k) { return inv[k]; }).map(function (k) {
      var s = inv[k], L = s.latest || {}, u = s.unit;
      var rows = (s.hist || []).map(function (h) { return { d: h[0], v: h[1] }; });
      var tight = L.surprise != null && L.surprise < 0;
      var verdict = k === "refutil" || k === "production" ? "" :
        L.surprise == null ? "" : '<p><b>' + (tight ? "Tighter" : "Looser") + " than seasonal</b> by " + nrgN(Math.abs(L.surprise)) + " " + u +
          " (normal change for this week: " + sgn(L.norm, 0) + "). " + (L.vs5yPct != null ? "Level is " + nrgPct(L.vs5yPct) + " vs. the 5-year average for this week." : "") + "</p>";
      return '<div class="nrg-cell"><h4>' + esc(s.label) + '</h4><div class="nrg-big">' + nrgN(L.value, u === "%" ? 1 : 0) + " " + esc(u) +
        ' <span class="' + (k === "refutil" || k === "production" ? "neu" : cls(-(L.chg || 0))) + '" style="font-size:12px">' + sgn(L.chg, u === "%" ? 1 : 0) + "</span></div>" +
        '<p style="font-size:11.5px;color:var(--ink-3)">week to ' + esc(nrgD(L.weekEnd)) + "</p>" + verdict +
        nrgLine(rows, [{ label: s.label, color: "var(--ink-2)", get: function (r) { return r.v; } }],
          { h: 70, fmt: function (v) { return nrgN(v, u === "%" ? 1 : 0); }, aria: s.label + " weekly, two years" }) + "</div>";
    }).join("");
    if (!cells) return "";
    return '<section class="card"><div class="card-hd"><h2>Fundamentals funds watch \u00b7 EIA weekly</h2>' +
      '<span class="sub">US data; drawn more than seasonal = tighter market</span></div><div class="nrg-grid">' + cells + "</div>" +
      '<div class="caution"><p><b>Why seasonal.</b> Crude stocks normally build in spring refinery maintenance and draw in summer; gas storage builds April\u2013October and draws in winter. A 2-million-barrel draw can be bullish in one month and normal in another, so each change is compared with the average change for the same week over the prior five years. US-only data; Brent, Gasoil and Dubai respond to global balances these do not capture.</p></div></section>';
  }

  function nrgDrivers(m) {
    var A = typeof ANALYSIS !== "undefined" ? ANALYSIS : null;
    if (!A || !A.instruments || !m.priceSymbol) return "";
    var it = null;
    for (var i = 0; i < A.instruments.length; i++) if (A.instruments[i].symbol === m.priceSymbol) it = A.instruments[i];
    if (!it || !(it.why || []).length) return "";
    return '<section class="card"><div class="card-hd"><h2>Price drivers today \u00b7 ' + esc(m.label) + "</h2>" +
      '<span class="sub">from the cross-asset Market analysis \u00b7 ' + esc(it.asOf || "") + "</span></div>" +
      '<ol class="nrg-story">' + it.why.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol></section>";
  }

  function nrgPositioning() {
    var ms = (ENERGY && ENERGY.markets) || [];
    if (!ms.length) {
      return '<section class="card"><div class="card-hd"><h2>Energy positioning</h2></div>' +
        '<div class="caution"><p>The energy positioning snapshot (energy.json) is not loaded. Run <code>python energy_cot.py</code> to fetch CFTC/ICE positions and EIA inventories.</p></div></section>';
    }
    var m = nrgMarket(NRG_SEL);
    NRG_SEL = m.key;
    var rows = nrgRows(m);
    var tabs = '<div class="nrg-tabs" role="group" aria-label="Energy market">' + ms.map(function (x) {
      return '<button class="nrg-tab" data-nrg="' + esc(x.key) + '" aria-pressed="' + (x.key === m.key) + '">' + esc(x.label) + "</button>";
    }).join("") + "</div>";
    var note = m.key === "DUBAI" ? '<div class="coverage-note"><b>Murban proxy.</b> No exchange publishes Murban positioning in a public COT file. ICE Dubai 1st-line is the nearest published Middle-East sour crude benchmark; it is related to, but not the same as, Murban.</div>' : "";
    return nrgBoard() + nrgPrimer() + tabs + note + nrgThisWeek(m) + nrgCharts(m, rows) + nrgHolders(m, rows) +
      nrgLessons(m) + nrgLog(m) + nrgInventory(m) + nrgDrivers(m);
  }

  function viewEnergyIndex() {
    var date = METOIL.asOf || "\u2014";
    return pageIntro("Energy Index",
      "Who is positioned in crude, products and gas, when they change, and what was true when they did. Positions are weekly CFTC and ICE reports; inventories are EIA weekly data. Built to learn how positioning decisions form, not to forecast.",
      "Positions to " + esc(nrgD(ENERGY.asOf)) + " \u00b7 benchmark settlement " + esc(date)) +
      marketGroup("Crude benchmarks", "BRENT \u00b7 MURBAN \u00b7 WTI", "energy-index", [
        assetFromInst("BRENT", "Brent crude"),
        marketAsset("Murban crude", "Quote not connected", "Positioning proxy: ICE Dubai 1st line", true),
        assetFromInst("WTI", "WTI crude")
      ], "Brent and WTI have stored benchmarks; no Murban quote or physical differential is connected.") +

        return '<tr><td class="lft" data-term="Market analysis">' + esc(f.input) + '</td><td class="lft">' + esc(f.asOf || "\u2014") +
          '</td><td class="lft">' + esc(f.source || "") + '</td><td class="ana-' + esc(f.status) + '">' +
          esc(f.status) + "</td></tr>";
      }).join("") + "</tbody></table></div>";

    var rules = ANALYSIS.rules || {};
    return '<section class="card"><div class="card-hd"><h2>Market analysis</h2>' +
      '<span class="sub">what moved, why, and what could happen \u00b7 built ' +
      esc(ANALYSIS.generatedAt || "") + "</span></div>" + pick + head +
      '<div class="ana-grid">' +
      '<div class="ana-block"><h3>Why it moved</h3>' + paras(r.why) + drv + "</div>" +
      '<div class="ana-block"><h3>What could happen</h3>' + paras(r.next) + "<h3>Events ahead</h3>" + ev + "</div>" +
      '<div class="ana-block"><h3>What the news says</h3>' + news + "</div>" +
      '<div class="ana-block"><h3>Sources and freshness</h3>' + fresh +
      '<p class="kpi-m">Rules: prices ' + (rules.priceDays || "?") + " days, CFTC " +
      (rules.positionsDays || "?") + " days, headlines " + (rules.newsHours || "?") +
      " hours. Tier is a reputation label for the publisher, not a filter; read the article before relying on it.</p></div>" +
      "</div></section>" + analysisSourcesCard();
  }
  function analysisSourcesCard() {
    var src = (ANALYSIS && ANALYSIS.sources) || [];
    var cal = (ANALYSIS && ANALYSIS.calendar) || [];
    if (!src.length && !cal.length) return "";
    return '<section class="card"><div class="card-hd"><h2>Calendar and source status</h2>' +
      '<span class="sub">central-bank dates from the banks, cross-checked; every provider\u2019s last fetch</span></div>' +
      '<div class="ana-grid"><div class="ana-block"><h3>Decisions ahead</h3><ul class="ana-news">' +
      cal.map(function (e) {
        return "<li><b>" + esc(e.date) + "</b> \u00b7 " + esc(e.label) + '<span class="ana-meta">' +
          (e.confirmed ? "confirmed by " : e.official ? "official \u00b7 " : "single source \u00b7 ") +
          esc((e.sources || []).map(function (s) { return s.name; }).join(", ")) +
          (e.detail ? " \u00b7 " + esc(e.detail) : "") + "</span></li>";
      }).join("") + "</ul></div>" +
      '<div class="ana-block"><h3>Providers</h3><div class="tablewrap"><table class="dt"><thead><tr>' +
      '<th class="lft">Provider</th><th class="lft">Kind</th><th>Items</th><th class="lft">Last success</th></tr></thead><tbody>' +
      src.map(function (s) {
        return '<tr><td class="lft" data-term="Market analysis">' + esc(s.provider) + '</td><td class="lft">' + esc(s.kind) +
          "</td><td>" + (s.items == null ? "\u2014" : n0(s.items)) + '</td><td class="lft ' +
          (s.error ? "ana-stale" : "ana-ok") + '">' + esc(s.lastOk ? anaAge(s.lastOk) : "never") +
          (s.error ? " \u00b7 " + esc(s.error) : "") + "</td></tr>";
      }).join("") + "</tbody></table></div></div></div></section>";
  }

  function viewInternational() {

      var cells = tenors.map(function (tenor) {
        var item = internationalRate(region, tenor);

            esc(item.asOf || "") + " \u00b7 " + esc(item.source || "official source") + "</div>"

        return "<td>" + value + "</td>";

    return pageIntro("International",

      "Snapshot through " + esc((INTERNATIONAL && INTERNATIONAL.asOf) || "date unavailable")) +

      analysisSection() +
      '<section class="card"><div class="card-hd"><h2>Cross-asset levels &amp; changes</h2>' +
      '<span class="sub">FX and crypto in percent; yields in basis points</span></div>' +
      internationalMovesTable([["INR=X", "USD/INR"], ["EURUSD=X", "EUR/USD"],
        ["JPY=X", "USD/JPY"], ["CNY=X", "USD/CNY"], ["DX-Y.NYB", "US Dollar Index"],
        ["BTC-USD", "Bitcoin"], ["ETH-USD", "Ethereum"],
        ["^IRX", "US 13-week bill yield"], ["^TNX", "US 10-year yield index"],
        ["^TYX", "US 30-year yield index"]]) + "</section>" +
      '<section class="card"><div class="card-hd"><h2>Sovereign yield curve</h2>' +
      '<span class="sub">Requested benchmark maturities \u00b7 yield levels, not bond prices</span></div>' +
      '<div class="tablewrap"><table class="dt"><thead><tr><th class="lft">Market</th>' +
      tenors.map(function (t) { return "<th>" + t + "</th>"; }).join("") +
      "</tr></thead><tbody>" + rateRows + "</tbody></table></div>" +
      '<div class="mo-sub">United States \u00b7 official par-yield changes</div>' +
      internationalYieldMovesTable() +
      '<div class="caution"><p><b>Coverage limit.</b> US tenors use the U.S. Treasury daily par-yield curve and show its observation date. India, euro-area, Japan and China curves remain unconnected; blank cells do not imply zero movement.</p></div></section>' +
      '<section class="card"><div class="card-hd"><h2>Purchasing Managers\u2019 Index</h2>' +
      '<span class="sub">manufacturing and services \u00b7 latest released value/date required</span></div>' +
      '<div class="tablewrap"><table class="dt"><thead><tr><th class="lft">Region</th>' +
      "<th>Latest PMI</th><th class=\"lft\">Release / source status</th></tr></thead><tbody>" +
      pmiRows + "</tbody></table></div></section>" +
      '<section class="card"><div class="card-hd"><h2>Positioning, hedging &amp; build-up</h2>' +
      '<span class="sub">CFTC Traders in Financial Futures (TFF) and Disaggregated reports \u00b7 contracts, not intent</span></div>' +
      internationalPositionsTable() +
      '<div class="caution"><p><b>Coverage and interpretation.</b> CFTC reports are weekly Tuesday snapshots, usually published Friday. Weekly net changes are contract-count changes in the named trader category, not proof of hedging, covering or a directional view. The contracts shown cover selected CME/NYMEX markets; they are not spot USD/INR, USD/CNY or exchange-wide crypto positions. Missing rows mean no selected report observation is available.</p></div></section>' +
      '<section class="card"><div class="card-hd"><h2>Cross-asset research notes</h2><span class="sub">curated references \u00b7 item dates shown</span></div>' +
      '<div class="research-feed">' +
      '<article class="research-item"><div class="research-source">World Bank \u00b7 3 Nov 2026</div><div><h3>Energy strengthened while metals weakened in October</h3>' +
      '<p>Monthly commodity-index context: energy +7.1%, Brent +7%, metals \u22123.0%, precious metals \u22126.2%. Useful backdrop, but not a substitute for daily benchmark quotes. <a href="https://www.worldbank.org/en/research/commodity-markets" target="_blank" rel="noopener">Open source</a>.</p></div></article>' +
      '<article class="research-item"><div class="research-source">IEA \u00b7 solar PV supply chains</div><div><h3>Solar is a long-run silver-demand catalyst; material intensity is part of the balance</h3>' +
      '<p>The IEA\u2019s net-zero scenario highlighted potentially substantial solar-PV silver demand by 2030, while also documenting efficiency, concentration and trade risks in the supply chain. <a href="https://www.iea.org/reports/solar-pv-global-supply-chains/executive-summary" target="_blank" rel="noopener">Open source</a>.</p></div></article>' +

      sourceItem("Federal Reserve \u00b7 H.15 / H.10", "https://www.federalreserve.gov/releases/h15/", "US interest-rate statistics and foreign exchange releases.") +
      sourceItem("RBI \u00b7 Database of Indian Economy", "https://dbie.rbi.org.in/DBIE/", "Official India macroeconomic, interest-rate and FX statistics.") +
      sourceItem("ECB \u00b7 yield curves", "https://www.ecb.europa.eu/stats/financial_markets_and_interest_rates/euro_area_yield_curves/html/index.en.html", "Euro-area zero-coupon, forward and par yield curves; updated on TARGET business days.") +
      sourceItem("Bank of Japan \u00b7 statistics", "https://www.boj.or.jp/en/statistics/", "Official market and monetary statistics; use released observation dates.") +
      sourceItem("CFTC \u00b7 Commitments of Traders", "https://www.cftc.gov/MarketReports/CommitmentsofTraders/index.htm", "Weekly aggregated futures positions; not a record of individual trade purpose.") +
      sourceItem("People\u2019s Bank of China", "http://www.pbc.gov.cn/en/3688006/index.html", "Official monetary policy and financial statistics; market-yield series require a suitable published source.") +
      sourceItem("S&P Global PMI", "https://www.pmi.spglobal.com/Public/Release/PressReleases", "Regional PMI release calendar and press releases; access may vary.") +
      sourceItem("Reuters \u00b7 Markets", "https://www.reuters.com/markets/", "Fast global reporting; integration requires a permitted feed/license.") +
      sourceItem("WSJ \u00b7 Markets", "https://www.wsj.com/market-data", "Market coverage and data; subscription and redistribution terms apply.") +
      sourceItem("J.P. Morgan \u00b7 Global Research", "https://www.jpmorgan.com/insights/global-research", "Institutional macro/commodities research; client access may be required.") +
      "</div></section>";
  }

  /* The chain and the build-up were two tabs reading the same rows. Only
     "Chg OI" appeared in both, so merging them costs nothing and stops you
     paging back and forth to line a strike's OI up against what that OI
     was doing. Column order runs outside-in on each side: what the strike
     holds, then what changed, then what it costs. */
  function viewChain(m) {
    var rows = m.rows.slice().reverse().map(function (r) {
      var c = r.strike < m.cfg.spot ? " itm-c" : "";
      var p = r.strike > m.cfg.spot ? " itm-p" : "";
      var bc = classify(r.ce.chgPct, r.ce.chgOi);
      var bp = classify(r.pe.chgPct, r.pe.chgOi);
      return '<tr class="clickable' + (r.strike === m.atm ? " atm" : "") +
        '" data-strike="' + r.strike + '">' +
        '<td class="lft' + c + '">' + buildupPill(bc, r, "ce", r.strike) + "</td>" +
        '<td class="' + c + '">' + n2(r.ce.oi) + "</td>" +
        '<td class="' + c + " " + cls(r.ce.chgOi) + '">' + sgn(r.ce.chgOi, 2) + "</td>" +
        '<td class="' + c + '">' + n1(r.ce.vol) + "L</td>" +
        '<td class="' + c + '">' + n1(r.ce.iv) + "</td>" +
        '<td class="' + c + '">' + n2(r.ce.ltp) + "</td>" +
        '<td class="' + c + " " + cls(r.ce.chgPct) + '">' + sgn(r.ce.chgPct, 1) + "%</td>" +
        '<td class="strike-cell">' + n0(r.strike) + "</td>" +
        '<td class="' + p + " " + cls(r.pe.chgPct) + '">' + sgn(r.pe.chgPct, 1) + "%</td>" +
        '<td class="' + p + '">' + n2(r.pe.ltp) + "</td>" +
        '<td class="' + p + '">' + n1(r.pe.iv) + "</td>" +
        '<td class="' + p + '">' + n1(r.pe.vol) + "L</td>" +
        '<td class="' + p + " " + cls(r.pe.chgOi) + '">' + sgn(r.pe.chgOi, 2) + "</td>" +
        '<td class="' + p + '">' + n2(r.pe.oi) + "</td>" +
        '<td class="lft' + p + '">' + buildupPill(bp, r, "pe", r.strike) + "</td></tr>";
    }).join("");

    return chainAnalysis(m) +
      '<section class="card"><div class="card-hd"><h2>Option chain &amp; OI</h2>' +
      '<span class="sub">' + esc(m.cfg.label) + " \u00b7 " + esc(m.cfg.expiry) + "</span>" +
      '<div class="right"><span class="kpi-m">OI and volume in lakh &middot; ' +
      "shaded = in-the-money &middot; click a row to drill in</span></div></div>" +
      '<div class="tablewrap tall"><table class="dt chain"><thead>' +
      '<tr class="grp-hd"><th class="grp-c lft" colspan="7">CALLS</th>' +
      '<th>&nbsp;</th><th class="grp-p lft" colspan="7">PUTS</th></tr>' +
      "<tr>" +
      '<th class="grp-c lft">Action</th><th class="grp-c">OI</th>' +
      '<th class="grp-c">Chg OI</th><th class="grp-c">Volume</th>' +
      '<th class="grp-c">IV</th><th class="grp-c">LTP</th><th class="grp-c">Chg LTP</th>' +
      '<th style="text-align:center">Strike</th>' +
      '<th class="grp-p">Chg LTP</th><th class="grp-p">LTP</th><th class="grp-p">IV</th>' +
      '<th class="grp-p">Volume</th><th class="grp-p">Chg OI</th>' +
      '<th class="grp-p">OI</th><th class="grp-p lft">Action</th>' +
      "</tr></thead><tbody>" + rows + "</tbody></table></div></section>" +
      chainLegend(m);
  }

  /* Every column, in the order it appears. A table nobody can read is a
     table nobody uses, and the four build-up quadrants are the part people
     most often get backwards. */
  function chainLegend(m) {
    function row(term, text) {
      return '<tr><td class="lft"><b>' + term + '</b></td>' +
             '<td class="lft">' + text + "</td></tr>";
    }
    var cols =
      row("Action", "The four quadrants below, computed from that strike's " +
          "change in OI against its change in premium.") +
      row("OI", "Open interest &mdash; contracts still held at that strike, " +
          "in lakh. Not volume: volume counts trades made today, OI counts " +
          "positions that survived the day.") +
      row("Chg OI", "The day's move in open interest. Positive means new " +
          "positions were opened at that strike; negative means positions " +
          "were closed.") +
      row("Volume", "Contracts traded today, in lakh. High volume with " +
          "little OI change means intraday churn rather than commitment.") +
      row("IV", "Implied volatility for that strike, annualised. The market's " +
          "price for uncertainty. Rising IV makes every option dearer " +
          "regardless of direction.") +
      row("LTP", "Last traded price of the contract, in rupees per unit. " +
          "Multiply by the lot (" + m.cfg.lot + ") for the rupee value.") +
      row("Chg LTP", "The day's percentage move in that premium. Read it " +
          "against Chg OI &mdash; the pair is what the Action column means.") +
      row("Strike", "The price at which the option can be exercised. The " +
          "highlighted row is the strike nearest spot.") +
      row("Shading", "Shaded cells are in-the-money: calls below spot, puts " +
          "above it. Their premium is mostly intrinsic value.");

    var quad =
      row("Long build-up", "OI <b>up</b>, premium <b>up</b>. Fresh buyers " +
          "entering. Conviction in that direction.") +
      row("Short build-up", "OI <b>up</b>, premium <b>down</b>. Fresh writers " +
          "selling that strike. It becomes a barrier &mdash; and as a seller, " +
          "this is the company you are keeping.") +
      row("Short covering", "OI <b>down</b>, premium <b>up</b>. Writers buying " +
          "back. The barrier is breaking, and that is how a level fails.") +
      row("Long unwinding", "OI <b>down</b>, premium <b>down</b>. Buyers " +
          "leaving. Interest draining from the strike.");

    function tbl(inner) {
      return '<div class="tablewrap"><table class="dt legend"><tbody>' +
             inner + "</tbody></table></div>";
    }

    return '<section class="card"><div class="card-hd">' +
      "<h2>How to read this table</h2>" +
      '<span class="sub">every column, and the four quadrants</span></div>' +
      tbl(cols) +
      '<div class="card-hd" style="margin-top:14px"><h2>The Action column</h2>' +
      '<span class="sub">open interest against premium</span></div>' +
      tbl(quad) +
      '<div class="caution"><p><b>Open interest is a two-sided number.</b> ' +
      "Every contract has a buyer and a writer, so OI rising says a position " +
      "was opened, never who was right. What gives it meaning is the premium " +
      "moving with it &mdash; that is the whole content of the Action column. " +
      "And none of it is a forecast: this desk grades the OI walls, and the " +
      "call wall has held on 92.9% of graded sessions while max pain has " +
      "resolved on 50.2%, which is a coin flip.</p></div></section>";
  }

  /* The numbers you would otherwise have to read off the table yourself. */
  function chainAnalysis(m) {
    var rows = m.rows || [];
    var ceOi = 0, peOi = 0, ceChg = 0, peChg = 0, ceVol = 0, peVol = 0;
    var counts = { "Long build-up": 0, "Short build-up": 0,
                   "Short covering": 0, "Long unwinding": 0 };
    rows.forEach(function (r) {
      ceOi += r.ce.oi || 0; peOi += r.pe.oi || 0;
      ceChg += r.ce.chgOi || 0; peChg += r.pe.chgOi || 0;
      ceVol += r.ce.vol || 0; peVol += r.pe.vol || 0;
      [classify(r.ce.chgPct, r.ce.chgOi), classify(r.pe.chgPct, r.pe.chgOi)]
        .forEach(function (b) { if (counts[b.t] != null) counts[b.t]++; });
    });

    var pcr = m.pcr;
    var pcrRead = pcr > 1.15 ? "put writers dominant \u2014 supportive"
                : pcr < 0.85 ? "call writers dominant \u2014 capped upside"
                : "near balance \u2014 no directional conviction";

    var netRead = (ceChg > peChg)
      ? "Writers added more to calls than puts, which caps rallies before it supports dips."
      : "Writers added more to puts than calls, which builds a floor before it caps upside.";

    var top = Object.keys(counts).sort(function (a, b) {
      return counts[b] - counts[a];
    })[0];

    return '<section class="card"><div class="card-hd"><h2>What the chain says</h2>' +
      '<span class="sub">' + esc(m.cfg.expiry) + " \u00b7 " + rows.length +
      " strikes</span>" +
      '<div class="right"><span class="kpi-m">computed from the table below</span></div></div>' +
      '<div class="probs">' +
        pr("Put / call ratio", n2(pcr), "", pcrRead) +
        pr("Call wall", n0(m.callWall), "", "heaviest call OI \u00b7 resistance") +
        pr("Put wall", n0(m.putWall), "", "heaviest put OI \u00b7 support") +
        pr("Max pain", n0(m.maxPain), "", "weak signal \u00b7 50.2% historically") +
      "</div>" +
      '<div class="probs">' +
        '<div class="prob"><div class="prob-k">Call OI</div><div class="prob-v">' +
          n1(ceOi) + 'L</div><div class="kpi-m">' + sgn(ceChg, 1) + "L today</div></div>" +
        '<div class="prob"><div class="prob-k">Put OI</div><div class="prob-v">' +
          n1(peOi) + 'L</div><div class="kpi-m">' + sgn(peChg, 1) + "L today</div></div>" +
        '<div class="prob"><div class="prob-k">Volume</div><div class="prob-v">' +
          n1(ceVol + peVol) + 'L</div><div class="kpi-m">C ' + n1(ceVol) +
          "L \u00b7 P " + n1(peVol) + "L</div></div>" +
        '<div class="prob"><div class="prob-k">ATM IV</div><div class="prob-v">' +
          n2(m.atmIv) + '%</div><div class="kpi-m">strike ' + n0(m.atm) + "</div></div>" +
      "</div>" +
      '<div class="caution"><p><b>Positioning.</b> ' + netRead +
      " Across " + (rows.length * 2) + " legs the commonest pattern is <b>" +
      top + "</b> (" + counts[top] + " legs): " +
      "long build-up " + counts["Long build-up"] +
      " \u00b7 short build-up " + counts["Short build-up"] +
      " \u00b7 short covering " + counts["Short covering"] +
      " \u00b7 long unwinding " + counts["Long unwinding"] + ". " +
      "The expected range implied by the walls is <b>" + n0(m.putWall) +
      "\u2013" + n0(m.callWall) + "</b>.</p></div></section>";
  }

  /* ---------------------------------------------------------------
     Tech-Fund: the fundamental half, and today's note.

     The option chain prices the next few sessions; P/E and dividend yield
     price the next several years. A raw multiple says nothing on its own,
     so every figure is shown against its own percentile -- and the reading
     inverts for yield, where HIGH is cheap and low is dear.
     --------------------------------------------------------------- */
  function pctBar(pct, cheapLow) {
    if (pct == null) return "";
    var cheap = cheapLow ? pct <= 33 : pct >= 67;
    var dear = cheapLow ? pct >= 67 : pct <= 33;
    var col = cheap ? "var(--up)" : dear ? "var(--down)" : "var(--maxpain)";
    return '<div class="pbar"><i style="left:' + pct.toFixed(1) +
           '%;background:' + col + '"></i></div>';
  }

  function fundBlock(m) {
    var d = (TECHFUND || {})[m.cfg.key] || {};
    var v = d.valuation;
    if (!v) return "";

    var rows = [
      ["P/E", v.pe, v.pe_pctile, v.pe_min, v.pe_max, true,
       "earnings multiple \u2014 low is cheap"],
      ["P/B", v.pb, v.pb_pctile, v.pb_min, v.pb_max, true,
       "price to book \u2014 low is cheap"],
      ["Dividend yield", v.div_yield, v.div_yield_pctile,
       v.div_yield_min, v.div_yield_max, false,
       "HIGH is cheap \u2014 this one reads the other way"]
    ];

    var body = rows.map(function (r) {
      if (r[1] == null) return "";
      return '<tr><td class="lft"><b>' + r[0] + "</b></td>" +
        "<td>" + n2(r[1]) + (r[0] === "Dividend yield" ? "%" : "") + "</td>" +
        "<td>" + (r[2] == null ? "\u2014" : n0(r[2]) + "th") + "</td>" +
        "<td>" + n2(r[3]) + " \u2013 " + n2(r[4]) + "</td>" +
        '<td class="lft" data-pt="' + esc(JSON.stringify({
            t: r[0], s: "valuation against its own history",
            big: n2(r[1]) + (r[0] === "Dividend yield" ? "%" : ""),
            rows: [["Now", n2(r[1])], ["Percentile", r[2] == null ? null : n0(r[2]) + "th"],
                   ["Lowest seen", n2(r[3])], ["Highest seen", n2(r[4])],
                   ["Sessions", v.pe_n]],
            note: r[5]
              ? "Low is cheap for this measure."
              : "<b>High is cheap</b> for dividend yield &mdash; it reads the " +
                "opposite way to the other two."
          })) + '">' + pctBar(r[2], r[5]) + "</td>" +
        '<td class="lft"><span class="kpi-m">' + r[6] + "</span></td></tr>";
    }).join("");

    var erp = v.equity_risk_premium, erpNote = "";
    if (erp != null) {
      erpNote = '<div class="caution"><p><b>Earnings yield ' +
        n2(v.earnings_yield) + "% against a 6.50% risk-free rate is an equity " +
        "risk premium of " + sgn(erp, 2) + "pp.</b> " +
        (erp < 0
          ? "Negative: the index earns less than doing nothing. That times " +
            "nothing \u2014 it can stay negative for years \u2014 but it is the " +
            "condition in which a shock has least valuation support beneath it."
          : "Positive: equities are paid for the risk taken over the " +
            "risk-free alternative.") + "</p></div>";
    }

    return '<section class="card"><div class="card-hd"><h2>Valuation</h2>' +
      '<span class="sub">' + esc(v.trade_date) + " \u00b7 exchange-published</span>" +
      '<div class="right"><span class="kpi-m">percentile over ' +
      (v.pe_n || 0) + " stored sessions</span></div></div>" +
      '<div class="tablewrap"><table class="dt"><thead><tr>' +
      '<th class="lft">Measure</th><th>Now</th><th>Pctile</th><th>Range</th>' +
      '<th class="lft">&nbsp;</th><th class="lft">&nbsp;</th>' +
      "</tr></thead><tbody>" + body + "</tbody></table></div>" + erpNote +
      "</section>";
  }

  function noteBlock(m) {
    var d = (TECHFUND || {})[m.cfg.key] || {};
    var n = d.note;
    if (!n) {
      return '<section class="card"><div class="card-hd"><h2>Today\u2019s note</h2>' +
        '</div><div class="caution"><p><b>Not composed yet.</b> Run ' +
        "<code>./run.sh</code> once the evening archives publish.</p></div></section>";
    }

    var c = n.call || {}, s = n.structure || {}, i = n.internals || {};
    var q = n.quality || {}, sc = n.scorecard || {}, p = n.positioning || {};
    var a = n.appendix || {}, rng = c.next_range || [];
    var out = "";

    function card(title, sub, right, body) {
      return '<section class="card"><div class="card-hd"><h2>' + title + "</h2>" +
        (sub ? '<span class="sub">' + sub + "</span>" : "") +
        (right ? '<div class="right"><span class="kpi-m">' + right + "</span></div>" : "") +
        "</div>" + body + "</section>";
    }
    function para(t) { return '<div class="caution"><p>' + t + "</p></div>"; }

    /* ---------------------------------------------- the call */
    var call = s.kind === "stand_aside"
      ? "Stand aside \u2014 no strike pays enough to be worth selling into it."
      : "Sellers of premium, not buyers of direction. Stand down below " +
        n0(rng[0]) + ".";

    out += card("Today\u2019s note",
      "on the " + esc(n.data_date) + " close \u00b7 published for " + esc(n.note_date),
      "one session only \u2014 every past session is in reports/",
      '<div class="notecall"><b>' + call + "</b> Expected range <b>" +
      n0(rng[0]) + "\u2013" + n0(rng[1]) + "</b>." +
      (c.p_positive == null ? "" :
        " Positive close <b>" + n1(c.p_positive) + "%</b>, inside the band <b>" +
        n1(c.p_inside) + "%</b>, break above " + n0((n.range1 || [])[1]) +
        " <b>" + n1(c.p_break_up) + "%</b>. " +
        '<span class="kpi-m">from the ' + esc(c.p_source || "") + "</span>") +
      "</div>" +
      '<div class="probs">' +
        '<div class="prob"><div class="prob-k">Close</div><div class="prob-v ' +
          cls(i.move) + '">' + n2(n.spot) + '</div><div class="kpi-m">' +
          sgn(i.move, 2) + " pts</div></div>" +
        '<div class="prob"><div class="prob-k">VWAP</div><div class="prob-v">' +
          n2(i.vwap) + '</div><div class="kpi-m">constituent-weighted</div></div>' +
        '<div class="prob"><div class="prob-k">India VIX</div><div class="prob-v">' +
          n2(n.vix) + '</div><div class="kpi-m">' + sgn(n.vix_chg, 2) + "%</div></div>" +
        '<div class="prob"><div class="prob-k">ATM IV</div><div class="prob-v">' +
          n2(n.atm_iv) + '%</div><div class="kpi-m">' + esc(n.expiry || "") + "</div></div>" +
        '<div class="prob"><div class="prob-k">IV / RV</div><div class="prob-v ' +
          ((q.vrp || {}).ratio > 1.1 ? "pos" : "") + '">' + n2((q.vrp || {}).ratio) +
          '</div><div class="kpi-m">' +
          ((q.vrp || {}).ratio > 1.1 ? "implied rich" : "roughly fair") + "</div></div>" +
      "</div>");

    /* ------------------------------- 1. the argument against us */
    var body1 = "<p>The " + esc(n.data_date) + " session moved <b>" +
      sgn(i.move, 2) + "</b> points on " + i.advances + " advances against " +
      i.declines + " declines.</p>";

    if (i.attribution_ok && i.drivers && i.drivers.length) {
      var names = i.drivers.map(function (x) {
        return esc(x[0]) + " " + sgn(x[1], 1);
      }).join(", ");
      /* On a near-flat session the constituents cancel and a percentage of
         the net move is not a share -- 21-Aug produced "280.9% of the
         advance". The points are still exactly true, so say those. */
      var lead = i.driver_share
        ? "<b>Three stocks produced " + n1(i.driver_share) + "% of the " +
          ((i.move || 0) < 0 ? "decline" : "advance") + ".</b>"
        : "<b>Three stocks contributed " + sgn(i.driver_points, 1) +
          " points against a net " + sgn(i.move, 1) + ".</b>";
      body1 += "<p>" + lead + " " + names + ". Attribution reconciles to " +
        n1(i.attributed) + " points against an actual " + n1(i.move) +
        " \u2014 a residual of " + n1(Math.abs(i.residual)) + ".</p>";
    } else {
      body1 += "<p><b>Contribution is not reported for this session.</b> The " +
        "attribution reconciles to " + n1(i.attributed) + " against an actual " +
        n1(i.move) + ", and a residual that size cannot support a claim about " +
        "which stocks drove the day.</p>";
    }
    if (i.above_dma != null) {
      body1 += "<p><b>Participation.</b> " + i.above_dma + " of 50 above their " +
        i.dma_window + "-session average" +
        (i.above_dma_prev == null ? "" :
          ", " + (i.above_dma < i.above_dma_prev ? "down" : "up") + " from " +
          i.above_dma_prev + " a week ago") + ".</p>";
    }
    if (i.delivery != null && i.delivery_avg != null) {
      var rich = i.delivery > i.delivery_avg;
      body1 += "<p><b>Delivery " + (rich ? "corroborates" : "does not corroborate") +
        " the move.</b> " + n2(i.delivery) + "% against a 20-session " +
        n2(i.delivery_avg) + "% \u2014 " +
        (rich ? "real stock changed hands." : "churn, not accumulation.") + "</p>";
    }
    var peers = i.peers || {}, pr = [];
    ["NIFTY BANK", "NIFTY MIDCAP 100", "NIFTY IT"].forEach(function (k) {
      if (peers[k] != null) pr.push(k.replace("NIFTY ", "") + " " + sgn(peers[k], 2) + "%");
    });
    if (pr.length) {
      body1 += "<p><b>Across the market.</b> " + pr.join(" \u00b7 ") +
        " against the index " + sgn(peers["NIFTY 50"], 2) + "%.</p>";
    }
    out += card("1 \u00b7 The argument against us", "taken first", "", para(body1));

    /* ----------------------------------------- 2. positioning */
    var f = p.fii || {}, body2 = "";
    if (f.ratio != null) {
      body2 += "<p><b>FII index-futures long/short is " + n2(f.ratio) + ".</b> " +
        n0(f.long) + " long against " + n0(f.short) + " short, net " + n0(f.net) +
        ". That is the <b>" + n1(f.pctile) + "th percentile</b> of " + f.n +
        " stored sessions, against a 20-session " + n2(f.avg20) + ".</p>";
    }
    var fl = p.flows || {}, fk = Object.keys(fl);
    if (fk.length) {
      body2 += "<p><b>Cash flows.</b> " + fk.sort().map(function (k) {
        return esc(k) + " " + sgn(fl[k].net_cr, 0) + "cr";
      }).join(" \u00b7 ") + ".</p>";
    }
    var g = p.gamma || {};
    if (g.regime) {
      body2 += "<p><b>Dealer gamma is " + g.regime + " across the whole \u00b1" +
        n0(g.span_pct) + "% band</b> \u2014 " + n0(g.at_spot_cr) +
        " crore per point at spot" +
        (g.flip == null ? ", with no flip between " + n0(g.lo) + " and " + n0(g.hi)
                        : ", flip at " + n0(g.flip)) + ". " +
        (g.regime === "long"
          ? "Long gamma means dealer hedging sells rallies and buys weakness \u2014 a range being enforced."
          : "Short gamma means hedging amplifies whatever the market starts doing.") +
        ' <span class="kpi-m">Estimated: the participant file gives aggregate ' +
        "positions, not their distribution across strikes.</span></p>";
    }
    var fw = p.forward || {};
    if (fw.basis != null) {
      body2 += "<p>Futures carry a <b>" + n1(fw.basis) +
        "-point basis</b> with the forward at " + n2(fw.forward) + ".</p>";
    }

    var divTable = "";
    if (p.divergence && p.divergence.length) {
      divTable = '<div class="tablewrap"><table class="dt"><thead><tr>' +
        '<th class="lft">Outcome at expiry</th><th>Chain</th><th>Lognormal</th>' +
        "<th>Divergence</th></tr></thead><tbody>" +
        p.divergence.map(function (x) {
          return '<tr><td class="lft">Close ' + (x.side === "below" ? "&lt;" : "&gt;") +
            " " + n0(x.level) + "</td><td>" + n1(x.market) + "%</td><td>" +
            n1(x.lognormal) + '%</td><td class="' + cls(x.diff) + '">' +
            sgn(x.diff, 1) + "pp</td></tr>";
        }).join("") + "</tbody></table></div>";
    } else if (p.rnd_reason) {
      divTable = para("<b>Chain-implied distribution not reported.</b> " +
        esc(p.rnd_reason) + " \u2014 a density whose mean is not the forward is " +
        "not risk-neutral, so it is withheld rather than published.");
    }
    out += card("2 \u00b7 Why we override it", "positioning", "", divTable + para(body2));

    /* -------------------------------------- 3. qualification */
    var rel = q.reliability || {}, keys = Object.keys(rel);
    var relTable = "";
    if (keys.length) {
      keys.sort(function (x, y) { return rel[y].pct - rel[x].pct; });
      relTable = '<div class="tablewrap"><table class="dt"><thead><tr>' +
        '<th class="lft">Claim</th><th>Graded</th><th>Correct</th><th>Hit rate</th>' +
        '<th class="lft">&nbsp;</th></tr></thead><tbody>' +
        keys.map(function (k) {
          var v = rel[k];
          var col = v.pct >= 70 ? "var(--up)" : v.pct >= 55 ? "var(--maxpain)" : "var(--down)";
          return '<tr><td class="lft">' + esc(k.replace(/_/g, " ")) + "</td><td>" +
            v.n + "</td><td>" + v.k + '</td><td style="color:' + col +
            ';font-weight:600">' + n1(v.pct) + '%</td><td class="lft">' +
            '<div class="pbar" style="background:var(--surface-3)"><i style="left:' +
            Math.min(100, v.pct).toFixed(1) + "%;background:" + col +
            '"></i></div></td></tr>';
        }).join("") + "</tbody></table></div>";
    }
    var v3 = q.vrp || {}, har = q.har || {}, body3 = "";
    if (v3.ratio) {
      body3 = "<p><b>Premium.</b> ATM implied " + n2(v3.iv) +
        "% against a forecast realised " + n2(v3.rv) + "%" +
        (har.r2 ? " (HAR-RV, R\u00b2 " + n2(har.r2) + ")" : "") +
        " is " + sgn(v3.spread_vol_pts, 2) + " vol points, a ratio of " +
        n2(v3.ratio) + ". IV rank " + n1(q.iv_rank) + ", percentile " +
        n1(q.iv_pctile) + ".</p>";
    }
    out += card("3 \u00b7 The honest qualification",
      "every graded claim this desk has made", "", relTable +
      para("<b>Read the ranges and the walls. Discount the direction.</b> " +
           "That ordering is not modesty, it is what the table says.") + (body3 ? para(body3) : ""));

    /* ------------------------------------------- 4. levels */
    var lv = n.levels || [];
    if (lv.length) {
      var marks = { 1: "\u25c6", 2: "\u25c7", 3: "\u25b2" };
      var groups = {};
      lv.forEach(function (x) {
        if (x.cluster) (groups[x.cluster] = groups[x.cluster] || []).push(x);
      });
      var conf = Object.keys(groups).map(function (gid) {
        var mem = groups[gid];
        var lo = Math.min.apply(null, mem.map(function (x) { return x.value; }));
        var hi = Math.max.apply(null, mem.map(function (x) { return x.value; }));
        return "<p><b>Confluence " + (marks[gid] || gid) + "</b> \u2014 " +
          mem.map(function (x) { return esc(x.name); }).join(", ") +
          " within " + n0(hi - lo) + " points, at " + n0(lo) + "\u2013" + n0(hi) +
          ". Independent methods agreeing makes that zone more significant " +
          "than any single line.</p>";
      }).join("");

      out += card("4 \u00b7 Levels", "with derivation", "",
        '<div class="tablewrap"><table class="dt"><thead><tr>' +
        '<th class="lft">Level</th><th>Value</th><th class="lft">Derived from</th>' +
        "</tr></thead><tbody>" + lv.map(function (x) {
          var mk = x.cluster ? " " + (marks[x.cluster] || "") : "";
          return "<tr" + (x.cluster ? ' style="background:var(--puts-dim)"' : "") +
            '><td class="lft"><b>' + esc(x.name) + mk + "</b></td><td>" +
            n0(x.value) + '</td><td class="lft"><span class="kpi-m">' +
            esc(x.source) + "</span></td></tr>";
        }).join("") + "</tbody></table></div>" + (conf ? para(conf) : ""));
    }

    /* --------------------------------------- 5. expression */
    var body5;
    if (s.kind === "stand_aside") {
      body5 = para("<b>No position.</b> " + esc(s.reason || "") +
        ". For a seller that is a valid answer \u2014 forcing a trade when " +
        "premium does not compensate for gap risk is how sellers give back " +
        "months of gains.");
    } else {
      var chips = (s.legs || []).map(function (l) {
        return '<span class="leg-chip ' + (l.act === "sell" ? "sell" : "buy") + '">' +
          (l.act === "sell" ? "Sell" : "Buy") + " " + n0(l.strike) + " " + l.side +
          " @ " + n2(l.prem) + "</span>";
      }).join("");
      body5 = '<div class="legs-row">' + chips + "</div>" +
        '<div class="probs">' +
        '<div class="prob"><div class="prob-k">Net credit</div><div class="prob-v">&#8377;' +
          n0(s.credit_rs) + '</div><div class="kpi-m">lot ' + s.lot + "</div></div>" +
        '<div class="prob"><div class="prob-k">Combined POP</div><div class="prob-v">' +
          n1((s.pop || 0) * 100) + '%</div><div class="kpi-m">both legs expire worthless</div></div>' +
        '<div class="prob"><div class="prob-k">Breakevens</div><div class="prob-v">' +
          n0((s.breakevens || [])[0]) + "\u2013" + n0((s.breakevens || [])[1]) +
          '</div><div class="kpi-m">at expiry</div></div>' +
        '<div class="prob"><div class="prob-k">Max loss</div><div class="prob-v neg">' +
          (s.max_loss ? "&#8377;" + n0(s.max_loss) : "Unlimited") +
          '</div><div class="kpi-m">' + (s.defined ? "capped by wings" : "naked") + "</div></div>" +
        '<div class="prob"><div class="prob-k">Return on margin</div><div class="prob-v">' +
          n1(s.rom) + '%</div><div class="kpi-m">' + n.dte + " days</div></div>" +
        "</div>" +
        para("<b>Exit, set now.</b> Take profit at combined " + n2(s.take_profit) +
          " (half the credit) \u00b7 stop at " + n2(s.stop) + " (2\u00d7) \u00b7 " +
          "hard close <b>" + esc(s.close_by || "") + "</b>, the session before expiry." +
          (s.defined ? " Wings are not optional at VIX " + n2(s.vix) +
            ", below the " + n1(s.vix_gate) + " gate." : ""));
    }
    out += card("5 \u00b7 How we express it",
      s.kind === "stand_aside" ? "no position" : esc(s.kind.replace(/_/g, " ")),
      "", body5);

    /* ------------------------------------ 6. what kills this */
    var kills = "";
    if (rng[0]) {
      kills += '<div class="killrow"><b>Hard stand-down</b> \u2014 sustained trade below ' +
        n0(rng[0]) + ", the \u22121\u03c3 session boundary" +
        (g.regime === "long" ? " and the lower edge of the long-gamma shelf" : "") +
        ". Size for it rather than widening the stop.</div>";
    }
    kills += '<div class="killrow"><b>Volatility</b> \u2014 close the short premium if ' +
      "India VIX gains more than 15% in a session. IV expansion hurts a " +
      "short-premium book before direction does, and at " + n2(n.vix) +
      " there is more room above than below.</div>";
    if (f.ratio != null) {
      kills += '<div class="killrow"><b>Positioning</b> \u2014 abandon the range if the ' +
        "FII short base covers hard. The ratio moving from " + n2(f.ratio) +
        " toward " + n2(f.avg20) + " with the index rising is short-covering.</div>";
    }
    if (peers["NIFTY BANK"] != null) {
      kills += '<div class="killrow"><b>Leadership</b> \u2014 reduce if Bank Nifty rolls ' +
        "over while the index holds. It closed " + sgn(peers["NIFTY BANK"], 2) +
        "% against the index " + sgn(peers["NIFTY 50"], 2) + "%.</div>";
    }
    out += card("6 \u00b7 What kills this view", "decided now, not in the drawdown", "", kills);

    /* --------------------------------------- 7. scorecard */
    var claims = sc.claims || [], scTable = "";
    if (claims.length) {
      scTable = '<div class="tablewrap"><table class="dt"><thead><tr>' +
        '<th class="lft">Called</th><th class="lft">Outcome</th><th>&nbsp;</th>' +
        "</tr></thead><tbody>" + claims.map(function (x) {
          var mark = x.correct == null ? '<span class="kpi-m">\u00b7</span>'
            : x.correct ? '<span style="color:var(--up)">\u2713</span>'
                        : '<span style="color:var(--down)">\u2717</span>';
          var res = x.correct == null ? "not yet resolved"
            : (x.actual == null ? (x.correct ? "held" : "missed") : n2(x.actual));
          return '<tr><td class="lft">' + esc(x.claim.replace(/_/g, " ")) +
            " \u2014 " + esc(x.stated || "") + '</td><td class="lft">' +
            '<span class="kpi-m">' + res + "</span></td><td>" + mark + "</td></tr>";
        }).join("") + "</tbody></table></div>";
    }
    var roll = sc.rolling || {}, rk = Object.keys(roll);
    var at = sc.all_time || {};
    out += card("7 \u00b7 Scorecard",
      "the note published " + esc(sc.for_date || "previously"), "", scTable +
      para("<b>" + (sc.correct || 0) + " of " + (sc.graded || 0) + " graded.</b>" +
        (rk.length ? " Rolling next-session containment " + rk.sort(function (x, y) { return x - y; })
          .map(function (k) { return n1(roll[k].pct) + "% over " + roll[k].n; })
          .join(" \u00b7 ") + "." : "") +
        (at.n ? " All claims all time " + at.k + "/" + at.n + " = " + n1(at.pct) + "%." : "")));

    /* ---------------------------------------- appendix */
    var fit = a.weights || {}, rv = a.realised || {}, ha = a.har || {};
    var rvTxt = Object.keys(rv).sort(function (x, y) { return x - y; })
      .map(function (k) { return k + "d " + n2(rv[k].yang_zhang) + "%"; }).join(" \u00b7 ");
    var app = "";
    if (fit.sessions) {
      app += "<p><b>Index weights</b> \u2014 NSE publishes none. Recovered by " +
        "non-negative least squares of index changes on the 50 constituent " +
        "changes over " + fit.sessions + " sessions (" + fit.kept +
        " kept after trimming corporate actions), rescaled once so the level " +
        "identity holds. Residual <b>" + n2(fit.rmse_pts) + " index points</b>, " +
        "R\u00b2 " + n2(fit.r2) + ", no negative weights. Fit dated " +
        esc(fit.as_of || "") + ".</p>";
    }
    app += "<p><b>Contribution</b> \u2014 (close \u2212 exchange-adjusted previous " +
      "close) \u00d7 coefficient per name, from the UDiFF cash bhavcopy.</p>" +
      "<p><b>Index VWAP</b> \u2014 per-stock turnover \u00f7 volume, combined " +
      "through the same coefficients as a ratio to the reconstructed close, " +
      "which makes it immune to coefficient drift.</p>" +
      "<p><b>Delivery</b> \u2014 index-weighted from the MTO file, " +
      (i.delivery_matched || 0) + " of 50 matched.</p>" +
      "<p><b>Dealer gamma</b> \u2014 \u03a3 \u0393(S,K,\u03c3,T) \u00d7 OI \u00d7 sign, " +
      "lot " + n.lot + ". The sign is taken from the observed proprietary net " +
      "position, not assumed. <b>Still an estimate:</b> the file gives aggregate " +
      "positions, not their strike distribution.</p>";
    if (rvTxt) {
      app += "<p><b>Realised volatility</b> \u2014 Yang-Zhang, gap-aware and " +
        "drift-independent. " + rvTxt + ".</p>";
    }
    if (ha.forecast) {
      app += "<p><b>HAR-RV</b> \u2014 RV(t+1) = c + \u03b2d\u00b7RVd + \u03b2w\u00b7RVw + " +
        "\u03b2m\u00b7RVm \u2192 <b>" + n2(ha.forecast) + "%</b>, R\u00b2 " +
        n2(ha.r2) + " over " + ha.n_obs + " observations.</p>";
    }
    app += "<p><b>Bands</b> \u2014 trading-time scaling; variance accrues only on " +
      "sessions the market is open. " + a.sessions_to_expiry +
      " sessions to expiry, not " + n.dte + " calendar days.</p>";

    var mp = rel.max_pain_pull || {};
    app += "<p><b>Reported as no signal today</b> \u2014 PCR (OI) " + n2(n.pcr) +
      ", mid-range. Max pain " + n0(n.max_pain) + ", correct on " +
      n1(mp.pct) + "% of " + (mp.n || 0) + " graded sessions, which is a coin " +
      "flip and is stated as one.</p>";

    app += '<p class="kpi-m">Personal research tool. Not investment advice, ' +
      "not a recommendation, and not produced by a registered research analyst. " +
      "Generated automatically from public NSE data. Estimated quantities are " +
      "labelled at the point of use. Past accuracy is measured in section 7 and " +
      "is not indicative of future results.</p>";

    out += card("Appendix", "workings and disclosures",
      "the same document is in reports/NIFTY/report.docx", para(app));

    return out;
  }

  function viewTechnicals(m) {
    var c = m.cfg, p = m.piv;

    /* Chronological closes from stored history. Indicators that need more
       sessions than exist say so rather than showing a number. */
    var closes = m.hist.slice().reverse().map(function (h) { return h.close; })
                  .filter(function (v) { return v != null; });

    function sma(n) {
      if (closes.length < n) return null;
      var s = closes.slice(-n).reduce(function (a, b) { return a + b; }, 0);
      return s / n;
    }

    function rsi14() {
      if (closes.length < 15) return null;
      var g = 0, l = 0;
      for (var i = closes.length - 14; i < closes.length; i++) {
        var d = closes[i] - closes[i - 1];
        if (d >= 0) g += d; else l -= d;
      }
      if (l === 0) return 100;
      var rs = (g / 14) / (l / 14);
      return 100 - 100 / (1 + rs);
    }

    function tcell(k, v, m2, meterPct, meterCol) {
      return '<div class="tcell"><div class="tcell-k">' + k + '</div><div class="tcell-v">' + v + "</div>" +
        (meterPct != null ? '<div class="meter"><i style="width:' + meterPct + "%;background:" + meterCol + '"></i></div>' : "") +
        '<div class="tcell-m">' + m2 + "</div></div>";
    }

    function maCell(label, n) {
      var v = sma(n);
      if (v == null) {
        return tcell(label, "&mdash;", "needs " + n + " sessions &middot; have " + closes.length, null);
      }
      return tcell(label, n0(v), c.spot > v ? "Price above" : "Price below", null);
    }

    var r = rsi14();
    var tech =
      (r == null
        ? tcell("RSI (14)", "&mdash;", "needs 15 sessions &middot; have " + closes.length, null)
        : tcell("RSI (14)", n1(r), r > 60 ? "Strong, not extended" : r < 40 ? "Weak" : "Neutral zone",
                r, r > 60 ? "var(--up)" : r < 40 ? "var(--down)" : "var(--calls)")) +
      tcell("ATM IV", m.atmIv != null ? n2(m.atmIv) + "%" : "&mdash;",
            m.atmIv != null && m.atmIv < 11 ? "Low \u2014 thin premium" : "Workable", null) +
      maCell("20 DMA", 20) + maCell("50 DMA", 50) + maCell("200 DMA", 200) +
      tcell("India VIX", c.vix ? n2(c.vix) : "&mdash;",
            c.vix && c.vix < 13 ? "Low \u2014 complacent" : "Elevated", null);

    var lv = [["R3", p.r3], ["R2", p.r2], ["R1", p.r1], ["Pivot", p.p], ["S1", p.s1], ["S2", p.s2], ["S3", p.s3]];

    return '<section class="card"><div class="card-hd"><h2>Indicators</h2>' +
      '<span class="sub">' + esc(c.label) + " \u00b7 daily</span></div>" +
      '<div class="tech">' + tech + "</div></section>" +
      '<section class="card"><div class="card-hd"><h2>Classic pivots</h2>' +
      '<span class="sub">from today\u2019s high / low / close</span>' +
      '<div class="right"><span class="kpi-m">H ' + n0(c.high) + " \u00b7 L " + n0(c.low) + " \u00b7 C " + n2(c.spot) + "</span></div></div>" +
      '<div class="levels">' + lv.map(function (x) {
        var isP = x[0] === "Pivot";
        return '<div class="lvl"><div class="lvl-k">' + x[0] + '</div><div class="lvl-v"' +
          (isP ? ' style="color:var(--ink);font-weight:700"' : "") + ">" + n0(x[1]) + "</div></div>";
      }).join("") + "</div></section>" +
      '<section class="card"><div class="card-hd"><h2>Option-implied levels</h2>' +
      '<span class="sub">from OI, not price</span></div><div class="levels">' +
      '<div class="lvl"' + wallCtx("CE") + ' data-term="Call wall">' +
        '<div class="lvl-k">Call wall</div><div class="lvl-v" style="color:var(--calls)">' + n0(m.callWall) + "</div></div>" +
      '<div class="lvl"' + maxPainCtx() + ' data-term="Max pain">' +
        '<div class="lvl-k">Max pain</div><div class="lvl-v" style="color:var(--maxpain)">' + n0(m.maxPain) + "</div></div>" +
      '<div class="lvl"' + wallCtx("PE") + ' data-term="Put wall">' +
        '<div class="lvl-k">Put wall</div><div class="lvl-v" style="color:var(--puts)">' + n0(m.putWall) + "</div></div>" +
      '<div class="lvl"><div class="lvl-k">Implied range</div><div class="lvl-v">' + n0(m.putWall) + "&ndash;" + n0(m.callWall) + "</div></div>" +
      "</div></section>" + fundBlock(m) + noteBlock(m);
  }

  function viewHistory(m) {
    var rows = m.hist.map(function (h, i) {
      var prev = m.hist[i + 1];
      var chg = h.chgPct != null ? h.chgPct
              : (prev ? (h.close - prev.close) / prev.close * 100 : null);

        "<td>" + n2(h.o) + "</td>" +

    }).join("");

    var stored = m.sessionsStored || m.hist.length;
    return '<section class="card"><div class="card-hd"><h2>Session history</h2>' +
      '<span class="sub">' + esc(m.cfg.label) + " \u00b7 " + m.hist.length +
        " of " + stored + " sessions</span>" +
      '<div class="right"><span class="kpi-m">shares in units &middot; turnover &#8377; Cr</span></div></div>' +
      '<div class="tablewrap"><table class="dt hist"><thead><tr>' +
      '<th class="lft">Date</th>' +
      "<th>Open</th><th>High</th><th>Low</th><th>Close</th><th>Chg</th>" +
      "<th>Shares traded</th><th>Turnover</th>" +
      "<th>PCR</th><th>Max pain</th><th>Spot &minus; MP</th><th>ATM IV</th><th>VIX</th>" +
      "</tr></thead><tbody>" + rows + "</tbody></table></div></section>";
  }

  function DTL(d) {
    return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" })
            .replace(/ /g, "-").toUpperCase();
  }

  function pipeline(m) {
    var logRows = (MANIFEST.pipeline || []).filter(function (r) {
      return !r.idx || r.idx === state.idx;
    }).slice(0, 3);

    var s = logRows.map(function (r) {
      var tone = r.status === "ok" ? "ok" : r.status === "skipped" ? "idle" : "warnd";
      return [tone, esc(r.source) + (r.attempt ? " \u00b7 try " + r.attempt : ""),
              r.status === "ok" ? "OK" : r.status.charAt(0).toUpperCase() + r.status.slice(1),
              esc((r.message || "").slice(0, 60))];
    });

    var stored = m.sessionsStored || 0;
    s.push(["ok", "Option chain", "OK", m.nStrikes + " strikes \u00b7 expiry " + esc(m.cfg.expiry)]);
    s.push([stored >= 100 ? "ok" : "warnd", "History depth", stored + " / 100",
            stored >= 100 ? "window full" : "building toward window"]);
    s.push(["ok", "Store", (((MANIFEST.dbBytes || 0) / 1048576).toFixed(1)) + " MB",
            "SQLite \u00b7 E:\\Options\\data"]);

    return '<section class="card"><div class="card-hd"><h2>Fetch pipeline</h2>' +
      '<span class="sub">daily &middot; retry ladder 18:00 &rarr; 18:30 &rarr; 19:30 IST</span>' +
      '<div class="right"><span class="kpi-m">model ' + esc(MANIFEST.modelVersion || "") + "</span></div></div>" +
      '<div class="pipe">' +
      s.map(function (x) {
        return '<div class="step"><div class="step-k"><span class="dot ' + (x[0] === "ok" ? "" : x[0]) + '"></span> ' +
          x[1] + '</div><div class="step-v">' + x[2] + '</div><div class="step-m">' + x[3] + "</div></div>";
      }).join("") + "</div></section>";
  }

  /* ==========================================================
     6b. OPTION MATH &mdash; Black-Scholes probabilities, expected move,
         payoff modelling. Used by the seller's strategy view.
     ========================================================== */
  var RFR = 0.065;          /* India risk-free, approx */
  var DTE = 0, TT = 0;      /* set per render from the active index */
  var MARGIN_PCT = 0.12;    /* naked index short, SPAN+exposure approx */

  /* Normal CDF &mdash; Abramowitz & Stegun 26.2.17 */
  function normCdf(x) {
    var t = 1 / (1 + 0.2316419 * Math.abs(x));
    var d = 0.3989422804014327 * Math.exp(-x * x / 2);
    var p = d * t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 +
            t * (-1.821255978 + t * 1.330274429))));
    return x >= 0 ? 1 - p : p;
  }

  function bs(S, K, sig, t) {
    var v = sig * Math.sqrt(t);
    var d1 = (Math.log(S / K) + (RFR + sig * sig / 2) * t) / v;
    var d2 = d1 - v;
    return {
      callDelta: normCdf(d1),
      putDelta:  normCdf(d1) - 1,
      pCallItm:  normCdf(d2),
      pPutItm:   normCdf(-d2)
    };
  }

  /* One standard-deviation move implied by ATM IV over the holding period. */
  function expMove(S, ivPct, t) { return S * (ivPct / 100) * Math.sqrt(t); }

  /* The candidate scan runs in compute.py; the page only reads its verdicts.
     Recomputing here would let the dashboard and the prediction ledger
     disagree about what was recommended on a given day. */
  function candidates(m) { return m.cands || []; }

  function payoff(legs, S, lot) {
    var pl = 0;
    legs.forEach(function (l) {
      var intrinsic = l.side === "CE" ? Math.max(0, S - l.strike) : Math.max(0, l.strike - S);
      pl += l.qty * (intrinsic - l.credit);
    });
    return pl * lot;
  }

  function viewStrategy(m) {
    var c = m.cfg;
    var atmIv = m.atmIv;
    if (!atmIv || !m.sd1) {
      return '<section class="card"><div class="card-hd"><h2>Direction &amp; strategy</h2></div>' +
        '<div class="caution"><p><b>No ATM implied volatility in the last snapshot.</b> ' +
        "Every probability on this tab derives from IV, so nothing is shown rather than " +
        "something derived from a placeholder.</p></div></section>";
    }
    var sd1 = m.sd1, sd2 = sd1 * 2;
    var lo1 = m.range1[0], hi1 = m.range1[1];
    var lo2 = m.range2[0], hi2 = m.range2[1];

    var cands = candidates(m);
    var ok = cands.filter(function (x) { return x.verdict.c === "go"; });
    var bestCE = ok.filter(function (x) { return x.side === "CE"; })
                   .sort(function (a, b) { return b.rom - a.rom; })[0];
    var bestPE = ok.filter(function (x) { return x.side === "PE"; })
                   .sort(function (a, b) { return b.rom - a.rom; })[0];

    /* Regime gate: low IV means thin compensation for tail risk. */
    var lowVol = c.vix < 12.5;
    var haveBoth = bestCE && bestPE;

    /* ---- directional probabilities (at expiry, lognormal) ---- */
    var gHi = bs(c.spot, hi1, atmIv / 100, TT), gLo = bs(c.spot, lo1, atmIv / 100, TT);
    var pAbove = gHi.pCallItm, pBelow = gLo.pPutItm, pInside = 1 - pAbove - pBelow;

    /* ---- range visual domain ---- */
    var dLo = Math.min(lo2, m.putWall) * 0.998, dHi = Math.max(hi2, m.callWall) * 1.002;
    var pct = function (v) { return ((v - dLo) / (dHi - dLo) * 100).toFixed(2); };

    /* One reusable bar. `t` and `sigma` ride along as data attributes so the
       crosshair can price the probability at the cursor without re-deriving
       anything the view already knows. */
    function rangeBar(o) {
      var span = o.hi - o.lo;
      var p = function (v) { return ((v - o.lo) / span * 100).toFixed(2); };
      var marks = (o.marks || []).filter(function (k) {
        return k.v != null && k.v >= o.lo && k.v <= o.hi;
      });
      return '<div class="rb" data-lo="' + o.lo + '" data-hi="' + o.hi +
          '" data-spot="' + o.spot + '" data-sigma="' + o.sigma +
          '" data-t="' + o.t + '">' +
        '<div class="rb-band rb-2sd" style="left:' + p(o.b2[0]) + "%;width:" +
          (p(o.b2[1]) - p(o.b2[0])).toFixed(2) + '%"></div>' +
        '<div class="rb-band rb-1sd" style="left:' + p(o.b1[0]) + "%;width:" +
          (p(o.b1[1]) - p(o.b1[0])).toFixed(2) + '%"></div>' +
        marks.map(function (k) {
          return '<div class="rb-tick" style="left:' + p(k.v) + "%;background:" + k.color + '"></div>' +
            (k.label ? '<div class="rb-lab top" style="left:' + p(k.v) + '%">' + k.label + "</div>" : "");
        }).join("") +
        '<div class="rb-lab bot" style="left:' + p(o.b1[0]) + '%">' + n0(o.b1[0]) + "</div>" +
        '<div class="rb-lab bot" style="left:' + p(o.b1[1]) + '%">' + n0(o.b1[1]) + "</div>" +
        '<div class="rb-cross"></div><div class="rb-tip"></div>' +
      "</div>";
    }

    var marks = [
      { v: c.spot, color: "var(--ink)", label: "Spot " + n0(c.spot) },
      { v: m.callWall, color: "var(--calls)", label: "Call wall" },
      { v: m.putWall, color: "var(--puts)", label: "Put wall" },
      { v: m.maxPain, color: "var(--maxpain)", label: null }
    ];

    /* ---- next session ---- */
    var sdN = m.sdNext, nextBlock = "";
    if (sdN) {
      var nLo1 = c.spot - sdN, nHi1 = c.spot + sdN;
      var nLo2 = c.spot - 2 * sdN, nHi2 = c.spot + 2 * sdN;
      var nDomLo = nLo2 - sdN * 0.35, nDomHi = nHi2 + sdN * 0.35;
      var cal = m.rangeNextCalibrated;

      nextBlock =
        '<div class="bar-cap" style="padding-top:18px">Next trading session' +
          '<b>' + n0(nLo1) + " &ndash; " + n0(nHi1) + "</b>" +
          '<span class="tagx">1&sigma; &middot; 68%</span>' +
          '<span class="tagx">&plusmn;' + n0(sdN) + " pts</span>" +
          '<span class="tagx">trading-day basis</span>' +
          (cal ? '<span class="tagx" style="color:var(--maxpain);border-color:var(--maxpain)">' +
                 "calibrated " + n0(cal[0]) + "&ndash;" + n0(cal[1]) + "</span>" : "") +
        "</div>" +
        '<div class="rangebar" style="padding-top:8px">' +
        rangeBar({
          lo: nDomLo, hi: nDomHi, spot: c.spot, sigma: atmIv / 100,
          t: 1 / 252, b1: [nLo1, nHi1], b2: [nLo2, nHi2],
          marks: [{ v: c.spot, color: "var(--ink)", label: "Spot " + n0(c.spot) }]
            .concat(cal ? [{ v: cal[0], color: "var(--maxpain)", label: null },
                           { v: cal[1], color: "var(--maxpain)", label: null }] : [])
        }) + "</div>";
    }

    var rangeCard =
      '<section class="card"><div class="card-hd"><h2>Expected range</h2>' +
      '<span class="sub">ATM IV ' + n1(atmIv) + "%</span>" +
