        null, "Direction &amp; strategy") +
      T("25&Delta; risk reversal and butterfly",
        "<b>Risk reversal</b> = call IV &minus; put IV at 25 delta. Negative is normal " +

    /* ------------------------------------------- 5. selling */
    var sell = S("5. Selling premium",

          " gives <b>&#8377;" + n0(ex.creditRs) + "</b> credit." : null,

      T("ROM (return on margin)", "Credit as a percentage of margin blocked, for the " +
        "holding period. This desk rejects anything under 0.80% &mdash; below that the " +

        ex ? "ROM <b>" + n2(ex.rom) + "%</b>." : null,
        "Direction &amp; strategy") +
      T("Breakeven", "Short strike plus (or minus) the credit received. Beyond it the " +
        "position starts losing.", null, "Direction &amp; strategy") +
      T("Why a wing (defined risk)", "Buying a further-out option caps the loss. A " +

        null, "Model data") +

    return head + basics + oi + vol + prob + sell + score;
  }

  /* Sort state for the constituents table. Kept out of `state` because it
     is local to one view and should not survive an index switch. */
  var stockSort = { key: "weightPct", dir: -1 };

  function viewStocks(m) {
    /* normalise() exposes the index as cfg.key, not cfg.index. Reading the
       wrong one returned undefined and the view rendered its empty state
       with the data sitting right there in the snapshot. */
    var d = (STOCKS || {})[m.cfg.key] || (STOCKS || {})[state.idx];
    if (!d || !d.rows || !d.rows.length) {
      return '<section class="card"><div class="card-hd"><h2>NIFTY 50 stocks</h2></div>' +
        '<div class="caution"><p><b>Not exported yet.</b> Run ' +
        "<code>./run.sh</code> to build the constituent table.</p></div></section>";
    }

    var rows = d.rows.slice().sort(function (a, b) {
      var k = stockSort.key;
      var x = a[k], y = b[k];
      if (x === null || x === undefined) return 1;
      if (y === null || y === undefined) return -1;
      if (typeof x === "string") return stockSort.dir * x.localeCompare(y);
      return stockSort.dir * (x - y);
    });

    var up = d.advances, dn = d.declines;
    var totTurn = 0;
    rows.forEach(function (r) { totTurn += r.turnover || 0; });

    var cols = [
      ["symbol", "Stock", "lft"],
      ["close", "Close", ""],
      ["chgPct", "Chg %", ""],
      ["contribPts", "Index pts", ""],
      ["weightPct", "Weight %", ""],
      ["chg5Pct", "5-day %", ""],
      ["deliveryPct", "Delivery %", ""],
      ["vwap", "VWAP", ""],
      ["turnover", "Turnover", ""],
      ["dma50", "50-DMA", ""]
    ];

    var head = cols.map(function (c) {
      var on = stockSort.key === c[0];
      /* The arrow sorts; the header explains. Both are always present, so
         a column never looks like it does one thing and does another. */
      var arrow = '<span class="so' + (on ? " on" : "") + '" data-sort="' +
        c[0] + '" tabindex="0" role="button" title="Sort by ' + esc(c[1]) +
        '">' + (on && stockSort.dir < 0 ? "\u25be" : "\u25b4") + "</span>";
      return '<th class="' + c[2] + ' sortable' + (on ? " on" : "") + '">' +
        c[1] + arrow + "</th>";
    }).join("");

    var body = rows.map(function (r) {
      var turn = r.turnover ? (r.turnover / 1e7) : null;   // rupees -> crore
      return '<tr class="clickable" data-stock="' + esc(r.symbol) + '">' +
        '<td class="lft"><b>' + esc(r.symbol) + "</b></td>" +
        "<td>" + n2(r.close) + "</td>" +
        '<td class="' + cls(r.chgPct) + '">' + sgn(r.chgPct, 2) + "%</td>" +
        '<td class="' + cls(r.contribPts) + '"><b>' + sgn(r.contribPts, 1) + "</b></td>" +
        "<td>" + n2(r.weightPct) + "</td>" +
        '<td class="' + cls(r.chg5Pct) + '">' + (r.chg5Pct == null ? "\u2014" : sgn(r.chg5Pct, 2) + "%") + "</td>" +
        "<td>" + (r.deliveryPct == null ? "\u2014" : n1(r.deliveryPct) + "%") + "</td>" +
        "<td>" + n2(r.vwap) + "</td>" +
        "<td>" + (turn == null ? "\u2014" : n0(turn)) + "</td>" +
        '<td class="' + (r.aboveDma ? "pos" : "neg") + '">' + n0(r.dma50) + "</td>" +
      "</tr>";
    }).join("");

    return '<section class="card"><div class="card-hd"><h2>NIFTY 50 stocks</h2>' +
      '<span class="sub">' + esc(d.tradeDate) + " &middot; settled close</span>" +
      '<div class="right"><span class="kpi-m">click a column to sort</span></div></div>' +
      '<div class="probs">' +
        '<div class="prob"><div class="prob-k">Advancing</div><div class="prob-v pos">' + up + "</div>" +
          '<div class="kpi-m">of ' + d.count + "</div></div>" +
        '<div class="prob"><div class="prob-k">Declining</div><div class="prob-v neg">' + dn + "</div>" +
          '<div class="kpi-m">of ' + d.count + "</div></div>" +
        '<div class="prob"><div class="prob-k">Above 50-DMA</div><div class="prob-v">' + d.aboveDma + "</div>" +
          '<div class="kpi-m">participation</div></div>' +
        '<div class="prob"><div class="prob-k">Turnover</div><div class="prob-v">&#8377;' + n0(totTurn / 1e7) + "cr</div>" +
          '<div class="kpi-m">index constituents</div></div>' +
      "</div>" +
      '<div class="tablewrap tall"><table class="dt strat"><thead><tr>' + head +
      "</tr></thead><tbody>" + body + "</tbody></table></div>" +
      '<div class="caution"><p><b>Index pts</b> is the name\u2019s own contribution to the ' +
      "session\u2019s move, price change multiplied by its recovered coefficient. It is the " +
      "column that separates a real move from a loud one: a 2% move in a 0.3% name is noise, " +
      "the same move in HDFC Bank is a third of the day. Weights are recovered, not published " +
      "by NSE \u2014 see the report appendix for the method and its residual.</p></div>" +
      "</section>";
  }

  var RENDER = {
    overview: viewOverview, strategy: viewStrategy,
    model: viewModelData,
    /* Merged away, kept as aliases so a saved view key still resolves. */
    accuracy: viewModelData, modelhist: viewModelData,
    chain: viewChain, technicals: viewTechnicals,
    /* The build-up tab merged into the chain. Kept as an alias so a saved
       view key does not land on a blank page. */
    buildup: viewChain,
    history: viewHistory, watchlist: viewWatchlist,
    learning: viewLearning,
    stocks: viewStocks
  };

  /* ==========================================================
     6d. CROSSHAIR READOUTS
         Every band and every line reports the value under the
         cursor. innerHTML is replaced on each render, so the
         listeners are re-attached rather than delegated.
     ========================================================== */
  function attachRangeHover(el) {
    var lo = +el.getAttribute("data-lo"), hi = +el.getAttribute("data-hi");
    var spot = +el.getAttribute("data-spot");
    var sigma = +el.getAttribute("data-sigma"), t = +el.getAttribute("data-t");
    var cross = el.querySelector(".rb-cross"), tip = el.querySelector(".rb-tip");
    if (!cross || !tip) return;

    function move(ev) {
      var r = el.getBoundingClientRect();
      var x = Math.min(Math.max(ev.clientX - r.left, 0), r.width);
      var price = lo + (x / r.width) * (hi - lo);

      var txt = "<b>" + n0(price) + "</b>";
      var away = price - spot;
      txt += ' <i>' + (away >= 0 ? "+" : "&minus;") + n0(Math.abs(away)) + " pts</i>";

      if (sigma > 0 && t > 0 && price > 0) {
        var g = bs(spot, price, sigma, t);
        var above = g.pCallItm * 100;
        txt += '<br><i>' + n1(above) + "% above &middot; " + n1(100 - above) + "% below</i>";
      }
      cross.style.left = x + "px";
      tip.style.left = x + "px";
      tip.innerHTML = txt;
      el.classList.add("live");
    }

    el.addEventListener("mousemove", move);
    el.addEventListener("mouseleave", function () { el.classList.remove("live"); });
  }

      "The SQLite database holding every session the desk has fetched: " +

    "Expiry range claim": [
      "A claim, lodged on the day, that the index will settle inside a " +
      "stated range at expiry. The one-sigma version covers about 68% of " +
      "outcomes if the model is honest; the two-sigma version about 95%.",
      "It is the claim a premium seller actually lives on. Every short " +
      "strangle is a bet that settlement lands inside a range, so the rate " +
      "at which this claim holds is the rate at which the strategy works.",
      "Read the hit rate against the promise, not against 100%. A one-sigma " +
      "claim holding 73% of the time is running slightly wide -- honest, but " +
      "leaving premium uncollected. Holding 55% would mean the bands are too " +
      "narrow and the model is quietly selling more risk than it admits."
    ],
    "Next-session range claim": [
      "The same claim over one session instead of to expiry: the index " +
      "closes tomorrow inside a stated band, scaled from today's implied " +
      "volatility by the square root of one trading day.",
      "It is the fastest-resolving thing the desk claims, which makes it the " +
      "only one that accumulates enough observations to be tested properly. " +
      "Everything to expiry resolves weekly; this resolves daily.",
      "Useful precisely because it is boring. It is the claim that catches a " +
      "band factor drifting out of calibration long before the expiry claims " +
      "would have gathered the sample size to notice."
    ],
    "Wall holds claim": [
      "A claim that the index will not close beyond the strike carrying the " +
      "heaviest open interest -- the call wall above, the put wall below.",
      "It is the desk's strongest structural claim and the only one that " +
      "rests on where money is actually committed rather than on a model. " +
      "Writers defend those strikes because that is where their losses start.",
      "The asymmetry is the useful part. The call wall holds materially more " +
      "often than the put wall, which is what you would expect in a market " +

      "sessions where everything moves at once."
    ],
    "Short strike holds claim": [
      "A claim that a specific strike the desk proposed selling would not " +
      "have been breached. It is only lodged on sessions where a trade " +
      "passed the filters, so it is graded over fewer sessions than the rest.",
      "This is the claim closest to money. The range claims describe the " +
      "market; this one describes the position, including the strike choice " +

      "Compare it against the range claim on the same day. A session where " +

    "Vol premium call": [
      "A claim that implied volatility was richer than the volatility that " +
      "followed -- that selling was being paid. It resolves by comparing the " +
      "implied level on the day against the realised move afterwards.",
      "It is the gate on whether to sell at all, expressed as something that " +

      "one is about whether the price for taking that risk was fair.",
      "A hit rate near 60% is what a genuine but modest edge looks like. If " +

    "Directional stance": [
      "A claim about which way the index closes next session, lodged only " +

      "It is included precisely because it is expected to fail. Publishing a " +

      "This one sitting at a coin flip is the single most useful number on " +
      "the page. It is the standing evidence that the range claims -- which " +

    ],
    "Max pain pull claim": [
      "A claim that the index drifts toward the strike where the most option " +
      "value would expire worthless, between now and expiry.",
      "It is folklore that is widely repeated and rarely tested. The desk " +
      "lodges it as a claim for exactly that reason: an untested belief costs " +

      "Graded at roughly a coin flip across the whole record. That is the " +

    "IV-implied band": [
      "The range implied by Black-Scholes on the at-the-money volatility: " +

      "It is the market's own answer, and the only one of the five that " +

      "It assumes moves are lognormal and symmetric, which they are not. " +

    "Bootstrap band": [
      "A range built by resampling the desk's own history in blocks of five " +

      "Blocks rather than single days because volatility clusters: drawing " +

      "It is usually the widest of the five, and that is the point. When the " +

    "Which claims hold up": [
      "The desk's full record, one row per kind of assertion, each graded " +
      "separately against what happened. A single daily verdict would hide " +
      "which part of the model works.",
      "This is the table that decides what to trust. A session can call the " +

      "The spread from top to bottom is the finding. Structural claims about " +

    "Fetch pipeline": [
      "What ran, in order, to produce the numbers on this page: the option " +

      "A dashboard that cannot say where its data came from is a dashboard " +

      "Read it when a figure surprises you. A skipped step or a stale date " +

    ],
    "One-sigma range, five ways": [
      "The same question -- where does this end up, one standard deviation " +
      "either side -- answered by five methods that share almost no " +
      "assumptions: the market's own volatility, the option-implied density, " +
      "a skew-and-kurtosis correction, a resampling of real history, and a " +
      "forecast of realised volatility.",
      "Agreement is the signal. Five independent methods landing on the same " +
      "range is evidence; one method producing a number is an opinion, and " +
      "an opinion is what a single band on a screen looks like.",
      "Disagreement is more informative than agreement. When the bands fan " +
      "out, the honest reading is that the distribution is genuinely " +
      "uncertain and the position should be smaller -- not that one of the " +

    "Directional probability": [
      "The chance of closing above, below or inside the one-sigma band at " +
      "expiry, read off the option-implied distribution rather than " +
      "forecast. It is what current pricing implies, not what will happen.",
      "For a seller the middle number is the one that matters: it is the " +

      "expires worthless in your favour.",
      "These are the market's probabilities, so they are only as good as the " +

    "Recommended structure": [
      "The trade the filters actually permit, or the explicit statement that " +

      "The word none is a result, not a failure. A seller's returns are made " +

    ],
    "Model stack": [
      "The named methods this desk runs, in the order the output depends on " +

      "density, a Cornish-Fisher correction, Black-Scholes for probability, " +
      "a GARCH cross-check, and the calibration haircut applied last.",
      "It exists so that every number on the desk can be traced to a named, " +

      "The haircut at the end is the important one. It is fitted from the " +

    "Lookback window": [
      "How many past sessions a statistic is computed over -- 10 days, 21 " +
      "(about a month), 63 (about a quarter). The desk shows several rather " +
      "than choosing one.",
      "The window is a choice, and it is the choice that most often decides " +
      "the answer. A short window is responsive and noisy; a long one is " +
      "stable and late, and neither is right in general.",
      "Where the windows disagree, the market is changing regime. Ten-day " +

    ],
    "NIFTY 50": [
      "India's benchmark index: fifty large companies weighted by free-float " +
      "market capitalisation, calculated by NSE Indices. This desk trades " +
      "its options and recovers its weights by fitting daily index changes " +
      "on the fifty constituent changes.",
      "It is a weighted average, not a market. It can rise while most of its " +
      "members fall, which is why the breadth and contribution figures exist " +
      "beside the level.",
      "The membership changes, usually twice a year, and the free-float " +

,
    "Bid / Ask": [
      "The best price a buyer is currently offering and the best price a " +
      "seller is currently asking for that exact contract. The gap between " +
      "them is the spread, and it is a cost paid on entry and again on exit.",
      "It is the difference between the price on the screen and the price " +
      "you get. A strike quoted at 42 with a bid of 39 and an ask of 45 is " +
      "not a 42 trade; it is a 39 trade if you are selling into it.",
      "This is the field that decides whether a strategy is real. Far strikes " +
      "on an index show attractive credit and spreads wide enough to eat all " +
      "of it, which is what the &lsquo;illiquid&rsquo; pill on the strategy " +
      "card is refusing. A model that ignores the spread will always prefer " +
      "exactly the trades that cannot be filled."
    ],
    "Previous close": [
      "The contract's settlement price at the end of the prior session, " +
      "published by the exchange. Not the last trade of the day -- a thin " +
      "contract can print a stale last trade, and settlement is computed " +
      "from a closing window instead.",
      "It is the reference every change figure on the drawer is measured " +
      "from, and the price margin was calculated against overnight.",
      "Worth checking when a change looks implausible. A large move against " +
      "a stale previous close is usually the previous close being wrong " +
      "rather than the option having moved, and on an illiquid strike that " +
      "is the more common of the two."
    ]
,
    "Confidence": [
      "How much of the evidence points the same way, not how likely the " +
      "call is to be right. Each input -- positioning, the option-implied " +
      "range, volatility, breadth -- votes, and the figure is the weighted " +
      "share agreeing with the stated read.",
      "It is the difference between a view and a conviction. Four indicators " +
      "saying the same thing is a different situation from four indicators " +
      "split two against two, even when both produce the same headline.",
      "Read it as position size, not as direction. Sixty per cent means the " +
      "evidence leans but does not insist, which for a seller argues for the " +
      "smaller of two clip sizes rather than for standing aside. The claims " +
      "ledger scores whether these numbers have earned their confidence, and " +
      "the Model data tab is where that verdict lives."
    ],
    "The positioning read": [
      "One sentence combining where open interest is built, where the " +
      "option-implied range sits, what volatility is doing and how broad " +
      "the move was. It is the desk's summary, not a forecast.",
      "It exists so the page has a single line you can act on. Everything " +
      "below it is the working; this is the conclusion, and it is written " +
      "the same way every session so it can be scored afterwards.",
      "Treat it as a starting hypothesis. It is recorded in the claims " +
      "ledger the day it is made and graded against what actually happened, " +
      "which is the only reason it deserves any weight at all -- an unscored " +
      "opinion repeated daily is just a habit."
    ],
    "Moving average": [
      "The mean closing price over a fixed number of past sessions. The desk " +
      "shows 20, 50 and 200 sessions, each recomputed every evening from the " +
      "settled closes rather than from live prices.",
      "It is a slow reference line. Price above its own 200-session mean and " +
      "price below it are different market states, and most trend-following " +
      "money treats the crossing as an event whether or not it deserves to be.",
      "The number itself matters less than how many constituents are on each " +
      "side of their own -- that is the breadth reading, and it is where the " +
      "one statistically robust finding in the study document lives. A single " +
      "index sitting a few points above its average is noise."
    ],
    "RSI (14)": [
      "The relative strength index over fourteen sessions: average gain " +
      "divided by average loss, mapped onto a 0-100 scale. Above 70 is the " +
      "conventional overbought reading, below 30 oversold.",
      "It is a bounded measure of how one-sided recent sessions have been. " +
      "Unlike a price level it cannot run away, which is what makes it " +
      "comparable across months and across indices.",
      "The conventional thresholds are folklore, not evidence -- an index can " +
      "sit above 70 for weeks in a trend. The desk shows it because it is " +
      "widely watched and therefore occasionally self-fulfilling, and treats " +
      "it as context rather than as a signal. Nothing in the claims ledger " +
      "is placed on it."
    ],
    "GARCH(1,1)": [
      "A volatility model in which today's variance is a weighted blend of a " +
      "long-run average, yesterday's forecast, and yesterday's squared " +
      "return. The three weights are fitted to the desk's own history.",
      "It captures the one thing everyone agrees volatility does: cluster. A " +
      "violent session raises the forecast for tomorrow, and the effect " +
      "decays over the following weeks rather than vanishing overnight.",
      "It is used here as a cross-check on the HAR-RV forecast rather than as " +
      "the forecast itself. When the two disagree materially, the honest " +
      "reading is that the volatility path is genuinely uncertain and the " +
      "band should be widened rather than one model picked."
    ],
    "Why the desk stands aside": [
      "A pill on the strategy card explaining why no trade was proposed. " +
      "Illiquid means the strikes cannot be traded at the quoted prices; " +
      "thin premium means the credit does not pay for the risk; too close " +
      "means the short strike sits inside the expected range; marginal means " +
      "it passed every rule by too little to be worth the margin; needs " +
      "history means the figure has too few sessions behind it to be ranked.",
      "Standing aside is a decision, and one the record has to hold. A desk " +
      "that only logs the days it traded will flatter itself, because the " +
      "days it refused are exactly the ones it would have lost on.",
      "This is the most important thing on the card on a bad day. A seller's " +
      "returns are made far more by the trades not taken than by the ones " +
      "taken well -- the loss on one badly-priced strangle undoes weeks of " +
      "collected premium, and no amount of sizing discipline recovers it."
    ],
    "Trading-day basis": [
      "A note that a figure is scaled by trading sessions rather than by " +
      "calendar days. A weekend adds two days to the calendar and nothing to " +
      "the count of sessions in which the market can move.",
      "It changes the width of every range. Scaling a daily volatility to a " +
      "four-session expiry by the square root of four rather than of six " +
      "gives a band about eighteen per cent narrower, and which one is right " +
      "is not a matter of taste.",
      "It matters most across a long weekend or an exchange holiday, which " +
      "is precisely when a seller is deciding whether to carry a position " +
      "through. Options decay on the calendar and risk accrues on sessions, " +
      "and the gap between those two clocks is where holiday premium lives."
    ]
,
    "Delivery percentage": [
      "The share of a stock's traded volume that ended in an actual transfer " +
      "of shares rather than being squared off the same day. NSE publishes it " +
      "each evening in the MTO file; intraday turnover is netted out of it.",
      "It separates conviction from churn. Two sessions with identical volume " +
      "mean different things if one settled 70% of it into delivery and the " +
      "other 25% -- the first moved ownership, the second moved paper.",
      "Most useful on a large move in a heavy constituent. A rally on thin " +
      "delivery tends to be positioning that has to be unwound; the same " +
      "rally on heavy delivery has buyers who have already paid for it."
    ],
    "Index Price/Earnings": [
      "The index level divided by the trailing twelve-month earnings of its " +
      "constituents, published by NSE each evening alongside price-to-book " +
      "and dividend yield. The desk stores it and ranks today against every " +
      "session it holds, which is why a percentile sits beside the level.",
      "It is the slowest-moving thing on the desk and the only one that says " +
      "anything about value. Options price the next few weeks; this prices " +
      "the next few years, and the two disagree far more often than not.",
      "It matters at the extremes and almost nowhere else. A reading in its " +
      "top decile does not tell a premium seller anything about tomorrow, " +
      "but it does say what a shock would have to unwind if one arrives."
    ],
    "Market breadth": [
      "How many of the fifty constituents rose and how many fell. Advancing " +
      "minus declining is the advance-decline line; the desk also counts how " +
      "many sit above their own 50-session average.",
      "The index is a weighted average, so it can rise while most of its " +
      "members fall. Breadth is the check on that: it says whether a move " +
      "was the market or a handful of heavy names carrying it.",
      "A move with narrow breadth is fragile in a way the index level hides. " +
      "This is also where the one finding in the study document lives -- in " +
      "a calm market, unusually broad participation was followed by weaker " +
      "sessions, not stronger ones."
    ],
    "Z-score of the move": [
      "The realised move divided by the standard deviation the model expected " +
      "for that session. A Z of 1.0 means the market did exactly what a " +
      "one-sigma band allowed; 2.5 means it did two and a half times that.",
      "It is the unit that makes days comparable. Ninety points is enormous " +
      "in a quiet week and unremarkable in a frightened one, and Z is what " +
      "removes the volatility level so the surprise itself can be read.",
      "Watch the distribution rather than any single value. If roughly a " +
      "third of sessions exceed Z = 1 the bands are honest; if far fewer do, " +
      "the model is selling ranges wider than it needs to and leaving " +
      "premium on the table."
    ]
,
    "Classic pivots": [
      "Support and resistance levels computed from the previous session's " +
      "high, low and close. The pivot itself is their average; R1 to R3 and " +
      "S1 to S3 are arithmetic reflections around it. No open interest, no " +
      "volatility, no positioning -- only yesterday's three prices.",
      "They are the most widely watched arithmetic levels in the market, " +
      "which is the whole of their claim to work: enough participants place " +
      "orders at them that they occasionally become self-fulfilling. This " +
      "desk shows them beside the option-implied levels precisely so you can " +
      "see how differently the two disagree.",
      "Treat them as crowd coordinates rather than evidence. Where a pivot " +
      "coincides with an open-interest wall the level is worth respecting -- " +
      "but it is the wall doing the work, because that is where money is " +
      "committed rather than merely where a formula landed."
    ],
    "Weight": [
      "A constituent's share of the index, recovered by non-negative least " +
      "squares because NSE publishes the membership list but not the weights.",
      "It converts a stock's percentage move into index points. Without it " +
      "you cannot tell whether a session was driven by something that " +
      "matters or by something loud.",
      "Always, when reading the constituents table. A two per cent move in a " +
      "0.3% weight is noise; the same move in the largest holding is a third " +
      "of the day."
    ],
    "Index points": [
      "How many points a single constituent contributed to the index move: " +
      "its price change multiplied by its recovered coefficient.",
      "This is the column that separates a real move from a loud one, and it " +
      "is the reason the weight recovery was worth building at all.",
      "The desk withholds it when the attribution does not reconcile with " +
      "the actual index move -- on a near-flat session the names cancel and " +
      "a share of the move stops being a meaningful quantity."
    ]
,
    "Spot": ["The index level itself, a weighted average of 50 constituent prices. It is a number, not an instrument &mdash; nobody can buy or sell it. Every option on the desk is priced off it, and the exchange settles weekly contracts against an average of the last half-hour rather than the last tick.", "Every strike distance, delta and probability on this desk is measured from spot. A stale spot silently mis-states all of them, which is why the desk refuses to store a session captured while the market is open.", "Always the reference point. Where it stops being enough is expiry day, when settlement is that half-hour average, so a violent last-minute move can settle somewhere the screen never printed."],
    "Strike": ["The price at which an option can be exercised. NIFTY lists them every 50 points, so the chain is a ladder either side of spot. A strike is a level you are taking a view on, not a price you pay.", "Choosing a strike is choosing your probability. Each step further out lowers the chance of being breached and lowers the premium with it &mdash; the whole trade-off a seller makes.", "Decisive on entry. Strikes near a heavy open-interest wall behave differently from strikes in empty space: the wall has writers defending it, empty strikes have nobody."],
    "CE and PE": ["CE is a call, the right to buy at the strike; PE is a put, the right to sell. Selling a call is a bet the index stays below that strike; selling a put, that it stays above.", "As a seller you are on the opposite side of the buyer's hope. You collect a known premium against an unknown loss, which is why position size and wings matter more than being right.", "Both sides always. Reading only the call side of a chain hides half the positioning, and the interesting information is usually the asymmetry between them."],
    "ATM, ITM, OTM": ["At the money is the strike nearest spot. In the money has intrinsic value &mdash; calls below spot, puts above. Out of the money is all time value and expires worthless if nothing moves.", "A seller lives in OTM strikes, where the entire premium is time value and decays. ITM options carry intrinsic value that does not decay at all, so selling them is a directional bet wearing a seller's clothes.", "The distinction sharpens as expiry nears. Far from expiry the categories blur because time value swamps intrinsic; on the last day an option is essentially one or the other."],
    "Expiry": ["The date the contract settles. NIFTY has weekly expiries on Tuesday and a monthly on the last Tuesday. Time value collapses toward it, slowly at first and then very fast.", "It sets the clock on every position. The same strike is a different trade with six sessions left than with one, because gamma &mdash; the rate at which your risk changes &mdash; explodes in the final day.", "This desk closes the session before expiry regardless of profit. Expiry-day gamma is the worst risk-per-rupee a seller can hold, and the last day's decay is rarely worth the exposure to collect it."],
    "Lot size": ["The contract multiplier. NIFTY is 65, so a premium of 20.00 is &#8377;1,300 per lot. The exchange revises it periodically.", "It converts every price on the chain into money. A stale lot size mis-states credit, margin and expected shortfall by the same percentage while every ratio still looks right, because credit and margin scale together and cancel in ROM.", "Check it after any SEBI revision. This desk reads it from the exchange's own bhavcopy field rather than a hardcoded number, precisely because the error is so quiet."],
    "LTP and premium": ["Last traded price of the option. For an illiquid strike it can be hours stale, which is why the settlement price in the bhavcopy and the live LTP disagree on deep contracts.", "It is what you actually receive on entry. But an LTP with no volume behind it is a quote, not a price &mdash; you may not get filled anywhere near it.", "Trust it at liquid strikes near the money. Distrust it far out, where the last trade may be from a different session and the bid-ask is wide enough to eat the edge."],
    "Open interest (OI)": ["Contracts still open at a strike. Volume counts trades made today; OI counts positions that survived the day. It rises when a new position opens and falls when one is closed.", "It is the only public read on where money is committed rather than merely active. The heaviest strikes are where writers have the most to defend.", "Most informative on the walls and least informative in aggregate. Total OI rising says little; OI concentrating at a specific strike says a great deal."],
    "Change in OI": ["The day's move in open interest, contract by contract. Positive means positions were opened at that strike; negative means positions were closed.", "Paired with the change in premium it becomes the Action column &mdash; the difference between money arriving and money leaving. On its own it says only that something happened.", "Read it daily on the strikes near your position. A wall that grew overnight is stronger than yesterday; one that shrank while premium rose is being abandoned."],
    "Build-up (the four quadrants)": ["OI and premium move together or apart, giving four cases. Long build-up: both up, fresh buyers. Short build-up: OI up, premium down, fresh writers. Short covering: OI down, premium up, writers buying back. Long unwinding: both down.", "It tells you whether a level is being built or dismantled. Short build-up at a strike above spot means writers are defending it and it becomes resistance; short covering at that same strike means the defence is failing.", "Most decisive at the walls and near your own short strikes. Least meaningful at strikes with negligible OI, where a handful of contracts flips the quadrant."],
    "OI walls": ["The strikes carrying the most call and put open interest. Writers defend them because that is where their losses begin, and that defence tends to slow price as it approaches.", "They give a range that is independent of any volatility model. This desk grades the claim: the call wall has held on 92.9% of graded sessions and the put wall on 80.0%.", "Strong intraweek, weaker into expiry as positions roll to the next contract. And a wall that is being covered is not a wall &mdash; check the Action column before trusting it."],
    "PCR (put-call ratio)": ["Total put OI divided by total call OI. Above 1 means more puts are open than calls, which is conventionally read as supportive because put writers are the ones with capital at risk below.", "It is a crowd-positioning gauge, not a signal. This desk carries it for context and says so &mdash; it has never been graded as a standalone claim because the mid-range readings carry no information.", "Only worth attention at extremes, and even then as confirmation rather than cause. Between roughly 0.85 and 1.15 it is noise."],
    "Max pain": ["The strike at which the most option value would expire worthless &mdash; the point of maximum loss for buyers in aggregate. The theory is that price gravitates there into expiry.", "Almost none. This desk grades it and it has resolved correctly on 50.2% of 255 sessions, which is a coin flip, and it is reported as one.", "Effectively never as a reason to act. It is kept on the desk because leaving it out would invite the question, and because a measured coin flip is more useful than an unmeasured belief."],
    "Sigma (&sigma;)": ["One standard deviation of expected move, derived from implied volatility and the time remaining. About 68% of outcomes fall inside &plusmn;1&sigma; and 95% inside &plusmn;2&sigma; if the distribution behaves.", "It is the unit this whole desk speaks in. Every expected range, every band and every probability quoted here is a sigma multiple.", "Reliable for ranges, unreliable for tails. The desk's own scoring shows the 2&sigma; band holding 96.5% of the time against a nominal 95% &mdash; but real gaps are fatter than the model, so the failures cluster and are large."],
    "Implied volatility (IV)": ["The volatility the market is charging, backed out of the option price. Not a forecast anyone made &mdash; it is whatever number makes the pricing model agree with the traded premium.", "It sets every premium on the chain. Rising IV makes options dearer regardless of direction, which is why a short-premium book can lose while being right about where the index goes.", "Watch the change more than the level. A 15% single-session jump in VIX is this desk's stated reason to cut size, because IV expansion hurts a seller before direction does."],
    "How a range is built": ["Spot multiplied by IV, scaled by the square root of time remaining. This desk uses trading time, not calendar time &mdash; variance accrues only on sessions the market is open.", "Using calendar days over a weekend inflates the band by roughly 30%, which was a real error found here: a band that looked correct was being measured against the wrong clock.", "The distinction bites hardest across weekends and holidays. Within a single week the two clocks barely differ."],
    "Realised volatility (RV)": ["What the index actually did, measured from price history rather than option prices. The desk computes five estimators over four windows.", "It is the yardstick that turns IV from a number into a judgement. Implied volatility alone tells you the price; realised tells you whether that price was fair.", "Short windows react fast and mislead often; long windows are stable and slow. The desk quotes several precisely so a single noisy window cannot drive a decision."],
    "Why five RV estimators": ["Close-to-close sees only closes and is noisiest. Parkinson uses the high-low range but cannot see overnight gaps. Garman-Klass and Rogers-Satchell add open and drift handling. Yang-Zhang is gap-aware and drift-independent, so it is the reference here.", "Where they disagree, the disagreement is the information. A short-window verdict resting on close-to-close alone is not evidence about the market, it is evidence about one estimator's blind spot.", "Compare them after a gap. If Parkinson is calm while Yang-Zhang is elevated, the move happened overnight and intraday ranges are hiding it."],
    "IV / RV &mdash; the seller&rsquo;s edge": ["Implied divided by forecast realised. Above about 1.10 the market is charging more than the risk has been costing; below 0.95 it is charging less.", "It is the single gate on whether to sell at all. Selling into a ratio below 1 is taking unbounded tail risk for less than the tail has historically cost &mdash; that is a reason to stand aside, not to size down.", "Decisive on every entry. The desk's own record shows the sessions that broke their range were disproportionately the ones entered on a thin ratio."],
    "Variance risk premium": ["The gap between implied and realised volatility, expressed in vol points. It is the compensation a seller earns for carrying variance risk, and it is positive most of the time.", "It is the reason option selling pays at all. But it is payment for the tail, not free money, and it inverts precisely when the tail arrives &mdash; the premium is richest just before it stops being enough.", "Positive and wide is the seller's condition. Negative or thin means the market is not paying for the risk, which historically clusters before volatility expands."],
    "HAR-RV forecast": ["A regression of tomorrow's realised volatility on its own daily, weekly and monthly averages. It captures the fact that volatility clusters across several horizons at once.", "It gives the denominator in IV/RV a forward-looking value rather than a backward one. Comparing today's implied against last month's realised would answer the wrong question.", "Strongest in normal conditions, weakest at regime turns &mdash; it extrapolates recent behaviour, so it is late to a genuine break. The desk publishes its R&sup2; so you can see how much weight it deserves."],
    "IV rank vs IV percentile": ["Rank places today's IV between the year's low and high. Percentile counts what fraction of sessions were lower. They can disagree sharply when one extreme spike stretches the range.", "Rank answers 'how far from the extremes', percentile answers 'how unusual'. A rank of 20 with a percentile of 50 means one outlier is distorting the scale.", "Prefer percentile for judging whether today is unusual; use rank when you care about distance from the extremes. Quoting only one invites the wrong conclusion."],
    "India VIX": ["The market's 30-day implied volatility for NIFTY, published by NSE from the near-month option chain. A broader gauge than any single strike's IV.", "It sets this desk's structural gate: below 12.5 the premium is judged too thin to sell naked, and wings become mandatory. That single rule is what caps the loss on a low-volatility entry.", "Level matters less than change. A low VIX is not a reason to expect calm &mdash; it is the condition in which a shock has the furthest to travel."],
    "Variance ratio": ["The Lo-MacKinlay test for whether price is a random walk. Above 1 suggests trending, below 1 mean reversion, near 1 no memory at all.", "If price trended reliably, the volatility bands would need widening; if it reverted, narrowing. The desk applies no adjustment while the test fails to reject a random walk &mdash; which it usually does.", "Worth checking after a sustained move. A brief caution from experience: the normaliser already contains the horizon, and dividing by it twice makes every ratio look like mean reversion &mdash; a bug a control test caught here."],
    "Delta": ["The rate at which an option's price changes with the index, and a workable approximation of the probability it finishes in the money. A 0.20 delta call is roughly a one-in-five chance of being breached.", "It is the cleanest way to compare strikes across different expiries and volatilities. Selling 0.20 delta means about the same risk today as it did last month, even if the strike distance has changed.", "Reliable as a comparison, unreliable as a promise. Delta is computed from the same lognormal that understates tails, so the true probability of a large breach is higher than delta suggests."],
    "POP (probability of profit)": ["The model's estimate that a short option expires worthless, from N(d&#8322;) in Black-Scholes. An 85% POP means the model expects the strike to survive 85 times in 100.", "It is the headline number on every candidate strike and the basis for ranking them. It also sets expectations that the next entry deliberately corrects.", "Useful for comparing strikes, dangerous as reassurance. It says nothing about the size of the loss in the 15% of cases where it is wrong."],
    "Why POP understates risk": ["The lognormal behind it assumes well-behaved moves. Real markets gap on budgets, results and global shocks, and those tails are far fatter than the model allows.", "An 85% POP trade does not lose 15% of the time in a tidy way. It loses rarely and large, and that asymmetry is the entire risk of selling options. Expected shortfall, not POP, is the number that describes it.", "Always, but especially at low volatility. When IV is cheap the model's tails are narrowest exactly when the real ones are widest."],
    "Risk-neutral density": ["The market's own implied probability distribution, extracted from the chain by Breeden-Litzenberger &mdash; the second derivative of call price with respect to strike. It needs a smoothing spline first, because differentiating a noisy chain twice amplifies every wobble.", "It replaces the assumed lognormal with what the market is actually pricing, including skew and fat tails the model would miss.", "Only when it passes its own check. Its mean must equal the forward, or it is not risk-neutral &mdash; this desk rejects it on roughly one session in five and falls back to the lognormal, saying which it used."],
    "Cornish-Fisher": ["An adjustment to normal quantiles for skew and excess kurtosis, giving bands that lean the way the distribution actually leans instead of assuming symmetry.", "It widens the tail that is genuinely fatter rather than both equally. On a skewed chain the symmetric band is too generous on one side and too tight on the other.", "Useful when skew is pronounced. When the risk reversal is near zero it barely differs from the Gaussian band, and the added complexity buys nothing."],
    "25&Delta; risk reversal and butterfly": ["Risk reversal is the IV difference between a 25-delta call and put &mdash; the market's directional lean. Butterfly is how much both wings exceed the money &mdash; how fat the tails are priced.", "Together they describe the shape of the smile in two numbers. A negative risk reversal means puts are bid, which is the normal state for an equity index.", "Watch changes rather than levels. Skew steepening while the index is calm is protection being bought quietly, which historically precedes volatility more reliably than the level of VIX does."],
    "Forward and basis": ["The forward is where the index should trade for future delivery given carry; basis is the futures premium over spot. The desk derives the forward from put-call parity rather than assuming it.", "A positive basis with a heavy foreign short base tells you who is on which side: the shorts are hedged and foreign, the longs domestic and unlevered.", "Most informative near expiry, when basis should converge to zero. A stubborn premium into settlement means positioning, not carry."],
    "Straddle expected move": ["The combined price of the at-the-money call and put, which is roughly what the market is charging for the move between now and expiry.", "It is a model-free sanity check on the sigma band. If the straddle and the computed range disagree materially, one of them is wrong and it is usually the IV input.", "Best as a cross-check on entry. It cannot tell you direction, only magnitude, and it is the cleanest single number for what the market thinks is coming."],
    "Credit and margin": ["Credit is what you receive for selling; margin is what the exchange blocks against the risk. Naked shorts carry SPAN plus exposure margin; defined-risk spreads block roughly the maximum loss.", "The ratio between them is the whole economics of the trade. A large credit on a vast margin can be a worse use of capital than a small one on a small margin.", "Check margin before credit, always. This desk keeps a 40% cash buffer as a rule, because what kills a seller is being force-closed into a gap rather than the gap itself."],
    "ROM (return on margin)": ["Credit divided by margin blocked, as a percentage, for the days held. This desk's floor is 0.80% &mdash; below that the premium does not compensate for the tail risk carried.", "It makes strikes comparable across expiries and structures. An iron condor and a naked strangle look nothing alike until you express both as return on capital at risk.", "Decisive when filtering candidates. Misleading across different risk profiles &mdash; a defined-risk 26% ROM and a naked 26% ROM are not the same trade, because one has a floor and the other does not."],
    "Breakeven": ["The index level at which the position stops making money at expiry: the short strike plus the credit for a call, minus it for a put.", "It is the honest boundary, wider than the strike itself. A trade is not losing the moment the strike is touched &mdash; the credit is a buffer, and knowing its width prevents panicked exits.", "Useful at expiry, misleading before it. Mark-to-market loss can exceed the expiry payoff well before that level, because time value and IV expansion both work against you on the way."],
    "Why a wing (defined risk)": ["Buying a further strike to cap the loss. It costs part of the credit and turns an unbounded downside into a known one.", "It converts a trade that could take a year of gains into one with a floor. On this desk's current session the wings cost 33 of 53 points of gross credit and capped the loss at under four times the credit instead of infinity.", "Mandatory below 12.5 VIX on this desk. Selling naked into low implied volatility collects thin premium against a tail that has not shrunk at all, and it is the single most common way sellers blow up."],
    "VaR and expected shortfall": ["Value at risk is the loss exceeded on the worst few percent of days. Expected shortfall is the average loss when that happens &mdash; it describes the tail rather than merely locating it.", "Expected shortfall is the number a seller should size against. VaR tells you a threshold; only shortfall tells you what a breach actually costs.", "Most useful when set beside POP. A high POP and a large expected shortfall together are the exact signature of a trade that wins often and loses badly."],
    "Iron condor / short strangle": ["A strangle sells an out-of-the-money call and put. A condor adds bought wings outside both, capping the loss for part of the credit.", "It is the structural choice this desk makes on your behalf, and the gate is India VIX at 12.5. Below it, condor; above it, a strangle can be justified.", "Both need a range to work. Neither is a directional trade, and both fail the same way &mdash; a single fast move through one side &mdash; which is why exit rules matter more than entry."],
    "Claims": ["Each session the desk lodges ten separate, falsifiable assertions rather than one verdict, each with a horizon and an explicit statement of what would make it wrong.", "It is what makes the record honest. A single daily verdict hides which part of the model works; ten graded claims show that ranges and walls hold up while direction does not.", "Read the per-claim table before trusting any part of the note. The desk's strongest and weakest claims differ by nearly fifty percentage points."],
    "Brier score": ["The mean squared error of probabilistic forecasts. Zero is perfect; 0.25 is what you get by always saying fifty-fifty. Skill compares the model against that baseline.", "It scores confidence, not just correctness. Being right while overconfident is penalised, which is the behaviour that matters for someone sizing positions off the numbers.", "Read it alongside calibration. A good Brier score with poor calibration means the model is right for reasons it cannot articulate reliably."],
    "Calibration (ECE)": ["Expected calibration error: when the desk says 80%, does it happen 80% of the time? Buckets the forecasts and measures the gap between stated and observed.", "It is the difference between a number you can size against and one you cannot. A well-calibrated 80% can be traded; an overconfident 80% quietly ruins the arithmetic of every position sized from it.", "Check it before trusting any probability on the desk. It is the one measure that catches systematic overconfidence, which no single outcome ever reveals."],
    "Coverage and the Kupiec test": ["Coverage is how often the outcome landed inside the stated band. Kupiec tests whether the difference from the nominal rate is more than chance.", "It answers whether the ranges can be believed. A 1&sigma; band covering 67.3% against a nominal 68.3%, with Kupiec passing, means the band is honest &mdash; the desk is not quietly too wide or too narrow.", "The right check whenever bands feel wrong. It distinguishes a genuinely mis-sized band from an ordinary run of bad luck, which eyeballing never can."],
    "Band factor": ["The multiple by which stated bands would need scaling to achieve their nominal coverage. Above 1 means the bands are too narrow; below 1, too wide.", "It converts a coverage failure into a correction you can apply. It is also where this desk was badly wrong once: a factor of 0.60 suggested wildly overpriced implied volatility.", "Trust it only after checking the inputs. That 0.60 came from three bugs &mdash; calendar-day scaling, degenerate expiry-day rows and overlapping observations. The real answer was 1.087, and the bands were fine."],
    "What the record says so far": ["Ranges and structural levels hold up; directional signals do not. Expiry 2&sigma; 96.5%, call wall 92.9%, next-session range 72.4%, max pain 50.2%, directional stance 49.2%.", "It should change how you read every note this desk produces. The sections about ranges, walls and volatility have earned attention; the line at the top stating a direction has not.", "Every session. It is the reason the note leads with the case against itself and quotes its own directional record beside the call &mdash; a desk that grades itself and then ignores the grade is worse than one that never graded at all."],
  };

  /* ---------------------------------------------------------------
     Clicking anything drawn.

     Every chart on the desk already knows the numbers behind each point;
     until now it only whispered them on hover and forgot them when the
     mouse left. One shared panel and one delegated handler mean a new
     chart becomes clickable by emitting data-pt, rather than by growing
     its own bespoke interaction.
     --------------------------------------------------------------- */

  /* ---------------------------------------------------------------
     Clickable figures.

     label -> { deep: key into DEEP, how: builds the arithmetic behind
     THIS figure using today's stored values }. A label absent from here
     simply renders as it always did, so nothing breaks by omission.
     --------------------------------------------------------------- */
  var TERMS = {
    "IV-implied": {
      deep: "IV-implied band",
      how: function (m) {
        var b = m.an.bands.implied;
        return "<b>spot &times; ATM IV &times; &radic;(sessions &divide; 252)" +
          "</b><br>" + n0(m.cfg.spot) + " &times; " + n2(m.an.atmIv) +
          "% &times; &radic;(" + m.an.sessionsToExpiry + " &divide; 252) = <b>&plusmn;" +
          n0((b[1] - b[0]) / 2) + " pts</b><br>giving <b>" + n0(b[0]) +
          " &ndash; " + n0(b[1]) + "</b>, a width of " + n0(b[1] - b[0]) +
          " points. No history is used: this is the market&rsquo;s own number.";
      }
    },
    "Bootstrap": {
      deep: "Bootstrap band",
      how: function (m) {
        var b = m.an.bootstrap;
        return "<b>" + n0(b.draws) + " resamples</b> of real history in blocks " +
          "of 5 sessions, over a " + b.sessions + "-session horizon.<br>" +
          "The 16th and 84th percentiles of the result are <b>" + n0(b.q16) +
          "</b> and <b>" + n0(b.q84) + "</b> &mdash; a width of " +
          n0(b.q84 - b.q16) + " points, against a median of " + n0(b.q50) +
          ".<br>Blocks rather than single days, because volatility clusters " +
          "and shuffling day by day would destroy exactly that.";
      }
    },
    "Realised forecast": {
      deep: "HAR-RV forecast",
      how: function (m) {
        var h = m.an.harRv, c = h.components;
        return "<b>HAR-RV: a blend of yesterday, last week and last month.</b>" +
          "<br>daily " + n2(c.daily) + "% &times; " + n2(h.beta.daily) +
          " + weekly " + n2(c.weekly) + "% &times; " + n2(h.beta.weekly) +
          " + monthly " + n2(c.monthly) + "% &times; " + n2(h.beta.monthly) +
          " + " + n2(h.beta.const) + " = <b>" + n2(h.forecast) + "%</b>" +
          "<br>Fitted on " + h.n_obs + " sessions, R&sup2; = <b>" + n2(h.r2) +
          "</b>. The weekly term is negative, which is the model taking back " +
          "part of a one-day spike rather than extrapolating it.";
      }
    },
    "Cornish-Fisher": {
      deep: "Cornish-Fisher",
      how: function (m) {
        var c = m.an.cornishFisher;
        return "<b>The Gaussian band, corrected for the shape of the actual " +
          "distribution.</b><br>skew <b>" + n2(c.skew) + "</b>, excess " +
          "kurtosis <b>" + n2(c.excessKurtosis) + "</b>.<br>At two sigma " +
          "that moves the band from " + n0(c.gaussian2sdLower) + " &ndash; " +
          n0(c.gaussian2sdUpper) + " to <b>" + n0(c.lower2sd) + " &ndash; " +
          n0(c.upper2sd) + "</b> &mdash; the downside stretched by " +
          n0(c.gaussian2sdLower - c.lower2sd) + " points, the upside barely " +
          "moved. Negative skew is the market falling faster than it rises.";
      }
    }
,
    "Put / call ratio": {
      deep: "PCR (put-call ratio)",
      how: function (m) {
        return "<b>total put OI \u00f7 total call OI</b> = " +
          n1(m.totP) + "L \u00f7 " + n1(m.totC) + "L = <b>" + n2(m.pcr) +
          "</b><br>It counts <b>contracts</b>, and every contract has a " +
          "writer and a buyer \u2014 so this is equally 'put writers vs call " +
          "writers' and 'put buyers vs call buyers'. That is exactly why it " +
          "cannot tell you who moved first, and why this desk grades it at " +
          "a coin flip and never lodges it as a claim.";
      }
    },
    "Call wall": {
      deep: "OI walls",
      how: function (m) {
        return "The strike carrying the most call open interest, <b>" +
          n0(m.callWall) + "</b>. Writers defend it because that is where " +
          "their losses begin. Graded by this desk: holds on <b>92.9%</b> " +
          "of sessions \u2014 the strongest structural claim it makes.";
      }
    },
    "Put wall": {
      deep: "OI walls",
      how: function (m) {
        return "The strike carrying the most put open interest, <b>" +
          n0(m.putWall) + "</b>. Graded: holds on <b>80.0%</b> of sessions.";
      }
    },
    "Max pain": {
      deep: "Max pain",
      how: function (m) {
        return "The strike at which the most option value would expire " +
          "worthless, <b>" + n0(m.maxPain) + "</b>. Graded by this desk: " +
          "correct on <b>50.2% of 255 sessions</b>, which is a coin flip " +
          "and is reported as one.";
      }
    },
    "Above 50-DMA": {
      deep: "What the record says so far",
      how: function () {
        return "How many of the fifty constituents closed above their own " +
          "50-session average. It is the only measure in this desk's study " +
          "that survived every robustness check: in a low-volatility " +
          "regime, strong participation was followed by weaker sessions at " +
          "<b>t = -3.56</b>.";
      }
    },
    "Delivery": {
      deep: "Delivery percentage",
      how: function () {
        return "Index-weighted share of traded volume that ended in actual " +
          "delivery of shares, against its 20-session average. High " +
          "delivery on a decline means real stock changed hands rather " +
          "than intraday churn.";
      }
    },
    "P/E": {
      deep: "Index Price/Earnings",
      how: function () {
        return "Published by the exchange in the same settled file as the " +
          "closes. Shown against its own percentile because a raw multiple " +
          "means nothing without knowing where it usually sits. A " +
          "<b>years</b>-horizon measure \u2014 it says nothing about tomorrow.";
      }
    },
    "25&Delta; risk reversal": {
      deep: "25&Delta; risk reversal and butterfly",
      how: function (m) {
        var k = (m.an || {}).skew || {};
        return "IV of the 25-delta call minus IV of the 25-delta put: <b>" +
          n2(k.call_iv) + "% \u2212 " + n2(k.put_iv) + "% = " +
          sgn(k.risk_reversal, 3) + "</b><br>Negative means puts are bid, " +
          "which is the resting state for an equity index because demand " +
          "for downside protection is structural.";
      }
    },
    "25&Delta; butterfly": {
      deep: "25&Delta; risk reversal and butterfly",
      how: function (m) {
        var k = (m.an || {}).skew || {};
        return "<b>(call IV + put IV) \u00f7 2 \u2212 ATM IV</b> = " +
          sgn(k.butterfly, 3) + "<br>How much both wings exceed the money. " +
          "It is how fat the market is pricing the tails.";
      }
    },
    "ATM straddle": {
      deep: "Straddle expected move",
      how: function (m) {
        var st = (m.an || {}).straddle || {};
        return "Call plus put at the <b>" + n0(st.atm_strike) + "</b> strike " +
          "= <b>" + n2(st.straddle) + "</b> points, or " + n2(st.move_pct) +
          "% of spot. A model-free read on the move the market is charging " +
          "for between now and expiry.";
      }
    },
    "Straddle move": {
      deep: "Straddle expected move",
      how: function (m) {
        var st = (m.an || {}).straddle || {};
        return "The straddle as a percentage of spot, <b>" +
          n2(st.move_pct) + "%</b>. Cross-check it against the sigma band: " +
          "if the two disagree materially, the IV input is usually why.";
      }
    },
    "Implied forward": {
      deep: "Forward and basis",
      how: function (m) {
        var f = (m.an || {}).forward || {};
        return "Derived from put-call parity across " + f.n_strikes +
          " strikes rather than assumed: <b>" + n2(f.forward) + "</b>. This " +
          "is where the market says the index trades for delivery at expiry.";
      }
    },
    "Basis": {
      deep: "Forward and basis",
      how: function (m) {
        var f = (m.an || {}).forward || {};
        return "<b>forward \u2212 spot</b> = " + n2(f.forward) + " \u2212 " +
          n2(m.cfg.spot) + " = <b>" + sgn(f.basis, 2) + "</b> points (" +
          n2(f.basis_pct) + "%). It should converge to zero at expiry; a " +
          "stubborn premium into settlement is positioning, not carry.";
      }
    },
    "IV rank": {
      deep: "IV rank vs IV percentile",
      how: function (m) {
        return "Where today's implied volatility sits between the year's low " +
          "and high, as a percentage of that range: <b>" +
          n1((m.an || {}).ivRank) + "</b>. Distinct from percentile, and the " +
          "two disagree sharply when one spike stretches the range.";
      }
    },
    "IV percentile": {
      deep: "IV rank vs IV percentile",
      how: function (m) {
        return "The share of stored sessions with a lower implied volatility " +
          "than today: <b>" + n1((m.an || {}).ivPercentile) + "</b>. Prefer " +
          "this to rank when the question is whether today is unusual.";
      }
    },
    "Expected shortfall": {
      deep: "VaR and expected shortfall",
      how: function () {
        return "The <b>average</b> loss across the days worse than the VaR " +
          "threshold, so it describes the tail rather than merely locating " +
          "it. This is the number a seller should size against: VaR says " +
          "where the cliff is, shortfall says how far down.";
      }
    },
    "VaR 95%": {
      deep: "VaR and expected shortfall",
      how: function () {
        return "The loss exceeded on the worst 5% of sessions. Not a coherent " +
          "risk measure: it ignores everything beyond the threshold, which " +
          "is precisely the part that ends accounts.";
      }
    },
    "P(profit)": {
      deep: "POP (probability of profit)",
      how: function () {
        return "The model's estimate that the position finishes profitable, " +
          "from the lognormal behind N(d\u2082). Read it beside expected " +
          "shortfall, never alone \u2014 a high probability with a large tail " +
          "is the exact signature of a trade that wins often and loses badly.";
      }
    },
    "Expected P&amp;L": {
      deep: "POP (probability of profit)",
      how: function () {
        return "Probability-weighted profit and loss across the terminal " +
          "distribution. It must be integrated over <b>forecast realised</b> " +
          "volatility, not implied: implied is the volatility the options " +
          "were priced on, so using it values the trade at fair by " +
          "construction and no edge can ever appear.";
      }
    },
    "Worst path": {
      deep: "VaR and expected shortfall",
      how: function () {
        return "The worst outcome among the simulated paths. One draw, not a " +

            "<b>no session has resolved yet</b> for this claim. The rate " +
            "appears here as soon as one has.";

        var pct = (r.rate || 0) * 100;
        var out = "<b>" + r.hits + " correct out of " + r.n +
          " graded</b> = <b>" + n1(pct) + "%</b><br>";
        var tgt = CLAIM_TARGET[ck];

          /* No stated coverage, so the only honest reference is chance.
             Reporting the distance in standard errors stops a rate near
             50% from reading as "on target" when it means "no skill". */
          /* Standard error of a proportion at p = 0.5, in percentage
             points: 100 * sqrt(0.25 / n), which is 50 / sqrt(n). */

            "is measured against <b>chance</b>. At " + r.n + " sessions one " +
            "standard error is <b>" + n1(se) + " points</b>, and this sits <b>" +

            (Math.abs(z) < 2

                "nothing on this desk is sized on it."
              : " That is a real effect at this sample size, which is why " +
                "it is one of the claims the desk will act on.");

        var gap = pct - tgt;
        return out + "It promised <b>" + n1(tgt) + "%</b>, so it is running " +
          "<b>" + (gap >= 0 ? "+" : "") + n1(gap) + " points</b> " +
          (Math.abs(gap) < 3

                "premium collected by somebody else."

                "record supports, which is the direction that costs money.") +
          "<br>Sample: " + r.n + " graded session(s). At this size the " +
          "standard error on the rate is about " +
