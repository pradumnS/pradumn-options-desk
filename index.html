        "<b>" + n0(m.callWall) + "</b>.", "OI ladder, Option chain &amp; OI") +
      T("Change in OI", "The day's move in open interest. Read alongside the price " +
        "change &mdash; the pair tells you what kind of money moved.",
        null, "Option chain &amp; OI") +
      T("Build-up (the four quadrants)",
        "<b>Long build-up</b>: OI up, price up &mdash; fresh buyers, conviction.<br>" +
        "<b>Short build-up</b>: OI up, price down &mdash; fresh writers; the strike " +
        "becomes a barrier.<br>" +
        "<b>Short covering</b>: OI down, price up &mdash; writers buying back; the " +
        "barrier is breaking.<br>" +
        "<b>Long unwinding</b>: OI down, price down &mdash; buyers leaving.",
        null, "Option chain &amp; OI") +
      T("OI walls", "The strikes with the most open interest. Writers defend them, so " +
        "they often act as support (put wall) and resistance (call wall).",
        "Expected range between <b>" + n0(m.putWall) + "</b> and <b>" +
        n0(m.callWall) + "</b>.<br>This desk grades that claim: the call wall has held " +
        "<b>92.8%</b> of the time, the put wall <b>80.0%</b>.",
        "OI ladder, Model history") +
      T("PCR (put-call ratio)", "Total put OI divided by total call OI. Above 1 means " +
        "more puts are written than calls, usually read as supportive; below 1, the " +
        "reverse. It is <em>context, not a signal</em> &mdash; weak on its own.",
        "PCR is <b>" + n2(m.pcr) + "</b>" +
        (m.pcr < 0.9 ? " &mdash; call-heavy, upside capped."
          : m.pcr > 1.1 ? " &mdash; put-heavy, supportive." : " &mdash; neutral."),
        "Overview") +
      T("Max pain", "The strike where option writers as a group lose least if the " +
        "index settles there. Theory says price drifts toward it.<br>" +
        "<b>On this desk&rsquo;s own record it is a coin flip &mdash; 50.8% over 250 " +
        "sessions.</b> Shown for context, never acted on.",
        "Max pain <b>" + n0(m.maxPain) + "</b>, spot " + n0(m.cfg.spot) + ".",
        "Overview, Model history"));

    /* ------------------------------------------- 3. volatility */
    var vol = S("3. Volatility &mdash; the core of this desk",
      "what the market charges for risk, versus what risk has cost",
      T("Sigma (&sigma;)", "One standard deviation &mdash; the statistical unit of " +
        "'a normal-sized move'. Roughly <b>68%</b> of outcomes fall within &plusmn;1&sigma;, " +
        "<b>95%</b> within &plusmn;2&sigma;.",
        "1&sigma; to expiry is <b>&plusmn;" + n0(m.sd1) + " points</b>, so the 68% range " +
        "is <b>" + n0(m.range1[0]) + " &ndash; " + n0(m.range1[1]) + "</b>.",
        "Direction &amp; strategy") +
      T("Implied volatility (IV)", "The volatility the market is <em>pricing in</em>, " +
        "backed out of option prices. Quoted annualised. High IV means expensive " +
        "options; low IV means cheap.",
        "ATM IV is <b>" + n2(m.atmIv) + "%</b>.", "Overview, Option chain") +
      T("How a range is built", "spot &times; IV &times; &radic;(time). Time is measured " +
        "in <em>trading</em> days, not calendar days &mdash; volatility only accrues " +
        "while the market is open, so counting the weekend inflates the band by ~15%.",
        n0(m.cfg.spot) + " &times; " + n2(m.atmIv) + "% &times; &radic;(" +
        m.dte + "/252) = <b>&plusmn;" + n0(m.sd1) + "</b>.",
        "Direction &amp; strategy") +
      T("Realised volatility (RV)", "What volatility <em>actually was</em>, measured " +
        "from price history. Implied is a forecast; realised is the outcome.",
        "10-day Yang-Zhang RV is <b>" + n2(rv.yang_zhang) + "%</b>.",
        "Direction &amp; strategy") +
      T("Why five RV estimators", "They disagree, and the disagreement is the " +
        "information. <b>Close-to-close</b> sees only closes and is noisiest. " +
        "<b>Parkinson</b> uses the high-low range but is blind to overnight gaps. " +
        "<b>Yang-Zhang</b> is both gap-aware and drift-independent, and ~14&times; more " +
        "efficient than close-to-close &mdash; it is the one to trust.",
        "Today: Yang-Zhang <b>" + n2(rv.yang_zhang) + "%</b> vs close-to-close <b>" +
        n2(rv.close_to_close) + "%</b> on identical data. A verdict built on the " +
        "second number would be badly wrong.",
        "Direction &amp; strategy") +
      T("IV / RV &mdash; the seller&rsquo;s edge",
        "Implied divided by realised. Above 1 the market charges more than volatility " +
        "has been costing, and selling premium is compensated. Below 1 it is not.",
        "Today <b>" + n2(vrp.ratio) + "</b> " +
        (vrp.ratio > 1.1 ? "&mdash; implied is rich, the seller is being paid."
          : vrp.ratio < 0.95 ? "&mdash; implied is thin; selling is not compensated."
          : "&mdash; roughly fair."),
        "Direction &amp; strategy") +
      T("Variance risk premium", "The name for that gap. It is real and persistent " +
        "&mdash; index IV exceeds later RV most of the time. But it is <em>payment for " +
        "the tail</em>, not free money, and it inverts exactly when the tail arrives.",
        null, "Direction &amp; strategy") +
      T("HAR-RV forecast", "A model that predicts tomorrow's realised volatility from " +
        "its daily, weekly and monthly averages. Better than assuming today repeats.",
        "Forecast <b>" + n2(a.harRv ? a.harRv.forecast : null) + "%</b>" +
        (a.harRv ? " (R&sup2; " + n2(a.harRv.r2) + ")" : ""),
        "Direction &amp; strategy") +
      T("IV rank vs IV percentile", "<b>Rank</b>: where IV sits between its window low " +
        "and high. <b>Percentile</b>: the share of days it was lower than today. Rank " +
        "is pinned by two extremes; percentile uses the whole distribution. When they " +
        "diverge, trust percentile.",
        "Rank <b>" + n1(a.ivRank) + "</b>, percentile <b>" + n1(a.ivPercentile) + "</b>.",
        "Direction &amp; strategy") +
      T("India VIX", "The market's own 30-day volatility index. Low VIX means calm and " +
        "thin premium; a spike hurts a short-premium book before direction does.",
        "VIX <b>" + n2(m.cfg.vix) + "</b>.", "Market strip") +
      T("Variance ratio", "Tests whether moves compound (trending) or fade " +
        "(mean-reverting). At 1.0 the index is a random walk, which is what " +
        "&radic;time scaling assumes.",
        "5-day VR <b>" + n3(vr5.vr) + "</b> &mdash; " + esc(vr5.regime || "-") + ".",
        "Direction &amp; strategy"));

    /* ------------------------------------------- 4. probability */
    var prob = S("4. Probability and pricing",
      "how the odds on each strike are worked out",
      T("Delta", "How much the option price moves for a 1-point move in the index. " +
        "Also a rough proxy for the chance of finishing in the money &mdash; a " +
        "0.15 delta option has roughly a 15% chance.",
        ex ? "The " + n0(ex.strike) + " " + ex.side + " has delta <b>" +
          n2(ex.delta) + "</b>." : null,
        "Direction &amp; strategy") +
      T("POP (probability of profit)", "For a seller, the chance the option expires " +
        "worthless. Computed from Black-Scholes as 1 &minus; N(d&#8322;).",
        ex ? "The " + n0(ex.strike) + " " + ex.side + " has POP <b>" +
          n1(ex.pop * 100) + "%</b>." : null,
        "Direction &amp; strategy") +
      T("Why POP understates risk", "It assumes returns are lognormal. Real markets gap " +
        "further than that. An 85% POP trade does not lose 15% of the time in a tidy " +
        "way &mdash; it loses <em>rarely and large</em>. That asymmetry is the whole " +
        "risk of selling options.",
        null, "Direction &amp; strategy") +
      T("Risk-neutral density", "The market's own probability distribution for where " +
        "the index settles, read straight out of option prices by differentiating the " +
        "call curve twice. No lognormal assumption &mdash; skew and fat tails appear " +
        "because they are in the prices.",
        null, "Direction &amp; strategy") +
      T("Cornish-Fisher", "Adjusts a normal range for real-world skew and fat tails. " +
        "It widens the downside more than the upside, which is the direction that " +
        "matters for a seller.",
        null, "Direction &amp; strategy") +
      T("25&Delta; risk reversal and butterfly",
        "<b>Risk reversal</b> = call IV &minus; put IV at 25 delta. Negative is normal " +
        "for equity indices: puts cost more because indices fall faster than they rise. " +
        "<b>Butterfly</b> measures how curved the smile is.",
        "RR <b>" + sgn(sk.risk_reversal, 2) + "</b> (" + esc(sk.tilt || "-") + "), " +
        "BF <b>" + sgn(sk.butterfly, 2) + "</b>.",
        "Direction &amp; strategy") +
      T("Forward and basis", "The forward is where the market prices the index for a " +
        "future date, recovered from put-call parity. <b>Basis</b> is forward minus " +
        "spot &mdash; normally a small positive cost of carry.",
        fwd.forward ? "Forward <b>" + n0(fwd.forward) + "</b>, basis <b>" +
          sgn(fwd.basis, 1) + "</b>." : null,
        "Direction &amp; strategy, Watchlist") +
      T("Straddle expected move", "The ATM call plus put. It is the market's traded " +
        "breakeven &mdash; the move a straddle buyer needs just to break even. Not the " +
        "same as 1&sigma;: it prices the <em>average</em> move, about 0.8&sigma;.",
        st.straddle ? "Straddle <b>" + n2(st.straddle) + "</b> = &plusmn;<b>" +
          n0(st.move_pts) + "</b> points." : null,
        "Direction &amp; strategy"));

    /* ------------------------------------------- 5. selling */
    var sell = S("5. Selling premium",
      "the numbers that decide whether a trade is worth taking",
      T("Credit and margin", "Credit is what you receive. Margin is what the broker " +
        "blocks. The trade is only as good as the ratio between them.",
        ex ? "Selling the " + n0(ex.strike) + " " + ex.side + " at " + n2(ex.credit) +
          " gives <b>&#8377;" + n0(ex.creditRs) + "</b> credit." : null,
        "Direction &amp; strategy") +
      T("ROM (return on margin)", "Credit as a percentage of margin blocked, for the " +
        "holding period. This desk rejects anything under 0.80% &mdash; below that the " +
        "premium does not pay for the tail risk.",
        ex ? "ROM <b>" + n2(ex.rom) + "%</b>." : null,
        "Direction &amp; strategy") +
      T("Breakeven", "Short strike plus (or minus) the credit received. Beyond it the " +
        "position starts losing.", null, "Direction &amp; strategy") +
      T("Why a wing (defined risk)", "Buying a further-out option caps the loss. A " +
        "naked short has no cap &mdash; a gap can cost many multiples of the credit. " +
        "In low IV, where premium is thin, the wing is not optional.",
        null, "Direction &amp; strategy") +
      T("VaR and expected shortfall", "<b>VaR 95%</b> is the loss at the 5th worst " +
        "percentile. <b>Expected shortfall</b> is the <em>average</em> loss once you are " +
        "in that worst 5%. ES is the honest number &mdash; max loss tells you the cap, " +
        "ES tells you what bad days actually cost.",
        null, "Direction &amp; strategy") +
      T("Iron condor / short strangle", "Sell an OTM call and an OTM put. A " +
        "<b>strangle</b> is naked on both sides; an <b>iron condor</b> adds protective " +
        "wings. Both profit if the index stays between the strikes.",
        null, "Direction &amp; strategy"));

    /* ------------------------------------------- 6. scoring */
    var score = S("6. How this desk grades itself",
      "the part that makes the rest trustworthy",
      T("Claims", "Each session the model makes about nine separate assertions &mdash; " +
        "ranges, walls, max pain, stance, the volatility call, each strike. Every one " +
        "is scored on its own, so you learn <em>which part</em> works rather than only " +
        "that something was wrong.",
        null, "Model data") +
      T("Brier score", "Mean squared error of a probability forecast. 0 is perfect, " +
        "0.25 is a coin flip. <b>Brier skill</b> compares it to always guessing the " +
        "base rate &mdash; above zero means the model adds something.",
        null, "Model data") +
      T("Calibration (ECE)", "When the model says 85%, does it happen 85% of the time? " +
        "The reliability chart plots said against happened; on the diagonal is honest, " +
        "below it is overconfident.",
        null, "Model data") +
      T("Coverage and the Kupiec test", "A 1&sigma; band should contain the outcome " +
        "68.3% of the time. Kupiec is the statistical test of whether it does. " +
        "LR above 3.84 rejects the band.",
        null, "Model data") +
      T("Band factor", "The measured multiple of the stated 1&sigma; band that actually " +
        "contained 68% of outcomes. At 1.00 the band is honest; below, it is too wide.",
        null, "Model data") +
      T("What the record says so far",
        "Ranges and structural levels hold up. <b>Directional signals do not.</b>",
        "Expiry 2&sigma; <b>96.4%</b> &middot; call wall <b>92.8%</b> &middot; " +
        "1&sigma; <b>73.2%</b> &middot; next-session <b>72.0%</b> &middot; " +
        "vol premium <b>62.5%</b> &middot; max pain <b>50.8%</b> &middot; " +
        "stance <b>48.2%</b>",
        "Model data"));

    return head + basics + oi + vol + prob + sell + score;
  }

  /* Sort state for the constituents table. Kept out of `state` because it
     is local to one view and should not survive an index switch. */
  var stockSort = { key: "weightPct", dir: -1 };

  function viewStocks(m) {
    /* normalise() exposes the index as cfg.key, not cfg.index. Reading the
       wrong one returned undefined and the view rendered its empty state
       with the data sitting right there in the snapshot. */
    var d = (STOCKS || {})[m.cfg.key] || (STOCKS || {})[state.idx];
    if (!d || !d.rows || !d.rows.length) {
      return '<section class="card"><div class="card-hd"><h2>NIFTY 50 stocks</h2></div>' +
        '<div class="caution"><p><b>Not exported yet.</b> Run ' +
        "<code>./run.sh</code> to build the constituent table.</p></div></section>";
    }

    var rows = d.rows.slice().sort(function (a, b) {
      var k = stockSort.key;
      var x = a[k], y = b[k];
      if (x === null || x === undefined) return 1;
      if (y === null || y === undefined) return -1;
      if (typeof x === "string") return stockSort.dir * x.localeCompare(y);
      return stockSort.dir * (x - y);
    });

    var up = d.advances, dn = d.declines;
    var totTurn = 0;
    rows.forEach(function (r) { totTurn += r.turnover || 0; });

    var cols = [
      ["symbol", "Stock", "lft"],
      ["close", "Close", ""],
      ["chgPct", "Chg %", ""],
      ["contribPts", "Index pts", ""],
      ["weightPct", "Weight %", ""],
      ["chg5Pct", "5-day %", ""],
      ["deliveryPct", "Delivery %", ""],
      ["vwap", "VWAP", ""],
      ["turnover", "Turnover", ""],
      ["dma50", "50-DMA", ""]
    ];

    var head = cols.map(function (c) {
      var on = stockSort.key === c[0];
      /* The arrow sorts; the header explains. Both are always present, so
         a column never looks like it does one thing and does another. */
      var arrow = '<span class="so' + (on ? " on" : "") + '" data-sort="' +
        c[0] + '" tabindex="0" role="button" title="Sort by ' + esc(c[1]) +
        '">' + (on && stockSort.dir < 0 ? "\u25be" : "\u25b4") + "</span>";
      return '<th class="' + c[2] + ' sortable' + (on ? " on" : "") + '">' +
        c[1] + arrow + "</th>";
    }).join("");

    var body = rows.map(function (r) {
      var turn = r.turnover ? (r.turnover / 1e7) : null;   // rupees -> crore
      return '<tr class="clickable" data-stock="' + esc(r.symbol) + '">' +
        '<td class="lft"><b>' + esc(r.symbol) + "</b></td>" +
        "<td>" + n2(r.close) + "</td>" +
        '<td class="' + cls(r.chgPct) + '">' + sgn(r.chgPct, 2) + "%</td>" +
        '<td class="' + cls(r.contribPts) + '"><b>' + sgn(r.contribPts, 1) + "</b></td>" +
        "<td>" + n2(r.weightPct) + "</td>" +
        '<td class="' + cls(r.chg5Pct) + '">' + (r.chg5Pct == null ? "\u2014" : sgn(r.chg5Pct, 2) + "%") + "</td>" +
        "<td>" + (r.deliveryPct == null ? "\u2014" : n1(r.deliveryPct) + "%") + "</td>" +
        "<td>" + n2(r.vwap) + "</td>" +
        "<td>" + (turn == null ? "\u2014" : n0(turn)) + "</td>" +
        '<td class="' + (r.aboveDma ? "pos" : "neg") + '"' + dmaCtx(r) +
          ' data-term="50-DMA">' + n0(r.dma50) + "</td>" +
      "</tr>";
    }).join("");

    return '<section class="card"><div class="card-hd"><h2>NIFTY 50 stocks</h2>' +
      '<span class="sub">' + esc(d.tradeDate) + " &middot; settled close</span>" +
      '<div class="right"><span class="kpi-m">click a column to sort</span></div></div>' +
      '<div class="probs">' +
        '<div class="prob"><div class="prob-k">Advancing</div><div class="prob-v pos">' + up + "</div>" +
          '<div class="kpi-m">of ' + d.count + "</div></div>" +
        '<div class="prob"><div class="prob-k">Declining</div><div class="prob-v neg">' + dn + "</div>" +
          '<div class="kpi-m">of ' + d.count + "</div></div>" +
        '<div class="prob"><div class="prob-k">Above 50-DMA</div><div class="prob-v">' + d.aboveDma + "</div>" +
          '<div class="kpi-m">participation</div></div>' +
        '<div class="prob"><div class="prob-k">Turnover</div><div class="prob-v">&#8377;' + n0(totTurn / 1e7) + "cr</div>" +
          '<div class="kpi-m">index constituents</div></div>' +
      "</div>" +
      '<div class="tablewrap tall"><table class="dt strat"><thead><tr>' + head +
      "</tr></thead><tbody>" + body + "</tbody></table></div>" +
      '<div class="caution"><p><b>Index pts</b> is the name\u2019s own contribution to the ' +
      "session\u2019s move, price change multiplied by its recovered coefficient. It is the " +
      "column that separates a real move from a loud one: a 2% move in a 0.3% name is noise, " +
      "the same move in HDFC Bank is a third of the day. Weights are recovered, not published " +
      "by NSE \u2014 see the report appendix for the method and its residual.</p></div>" +
      "</section>";
  }

  /* ==========================================================
     6k. METALS AND OIL
         Gold, silver and crude in rupees on their MCX contracts;
         WTI and Brent in dollars beside them. A range for each
         horizon from realised volatility, history's own band next
         to it, and a lean built from the evidence table -- every
         one recorded on the day it is made so it can be scored.
     ========================================================== */
  var METOIL = {};            /* metoil.json */
  var INTERNATIONAL = {};     /* international.json */
  var MO_MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                   "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var MO_NOT_BUILT = "The metals-and-oil page has not been built for this " +
    "snapshot. Run <em>python metoil.py</em> after the daily job and reload; " +
    "it needs the world histories (10 years each) and the MCX contract " +
    "chains that job stores.";

  function moFirst() {
    var L = (METOIL && METOIL.instruments) || [];
    return L[0] || null;
  }
  function moEv(inst, key) {
    var E = (inst && inst.evidence) || [];
    for (var i = 0; i < E.length; i++) if (E[i].key === key) return E[i];
    return null;
  }
  /* The instrument cards show their working through the same paragraph
     the page prints, so the panel and the page cannot disagree. */
  function moHowInst(key) {
    var i = moInst(key);
    return i ? moReadText(i) : MO_NOT_BUILT;
  }

  function moDate(iso) {
    if (!iso) return "\u2014";
    var p = String(iso).slice(0, 10).split("-");
    if (p.length < 3) return esc(iso);
    return p[2] + "-" + MO_MONTHS[+p[1] - 1] + "-" + p[0];
  }
  function moDay(iso) {
    if (!iso) return "\u2014";
    var p = String(iso).slice(0, 10).split("-");
    return p.length < 3 ? esc(iso) : p[2] + "-" + MO_MONTHS[+p[1] - 1];
  }
  function moInst(key) {
    var L = (METOIL && METOIL.instruments) || [];
    for (var i = 0; i < L.length; i++) if (L[i].key === key) return L[i];
    return null;
  }
  function moMoney(v, cur) {
    if (v == null || !isFinite(v)) return "\u2014";
    if (cur === "INR") return "\u20b9" + (Math.abs(v) >= 1000 ? n0(v) : n2(v));
    return "$" + n2(v);
  }
  function moRange(lo, hi, cur) {
    if (lo == null || hi == null) return "\u2014";
    return moMoney(lo, cur) + "\u2013" + moMoney(hi, cur);
  }
  function moLeanPill(lean) {
    var k = lean === "up" ? "go" : lean === "down" ? "risk" : "no";
    var t = lean === "up" ? "Lean up" : lean === "down" ? "Lean down" : "No lean";
    return '<span class="pill ' + k + '">' + t + "</span>";
  }
  function moRead(read) {
    if (read > 0) return '<b class="pos">supports up</b>';
    if (read < 0) return '<b class="neg">supports down</b>';
    return '<span style="color:var(--ink-3)">neutral</span>';
  }
  /* 41st, 52nd, 63rd, 77th. */
  function moOrd(p) {
    if (p == null || !isFinite(p)) return "\u2014";
    var n = Math.round(p), r = n % 100;
    var s = (r >= 11 && r <= 13) ? "th" : n % 10 === 1 ? "st" : n % 10 === 2 ? "nd" : n % 10 === 3 ? "rd" : "th";
    return n0(n) + s;
  }
  function moPct(p) { return moOrd(p); }
  function moUnitShort(inst) {
    return inst.currency === "INR" ? esc(inst.unit.replace("\u20b9", "")) : "USD" + esc(inst.unit.replace("USD", ""));
  }

  /* The cone. Sixty sessions of history and the projected band to the
     furthest horizon, with a tick at each horizon and at the contract's
     expiry. Every slot -- past and future -- carries a payload, so the
     hover and the click work across the whole width. */
  function moConeSvg(inst) {
    var hist = (inst.hist || []).slice().reverse().filter(function (b) { return b.c != null; });
    if (hist.length < 5) return needMore(hist.length, 5, "The projection chart");
    var hz = (inst.horizons || []).slice().sort(function (a, b) { return a.sessions - b.sessions; });
    if (!hz.length) return needMore(0, 1, "The projection chart");
    var cur = inst.currency;
    var spot = inst.price.last;
    var sd = (inst.vol.sigmaDailyPct || 0) / 100;
    var maxS = hz[hz.length - 1].sessions;
    var nH = hist.length, slots = nH + maxS;
    var W = 330, TOP = 18, BOT = 116;
    var x = function (i) { return (i / (slots - 1)) * W; };

    var vals = hist.map(function (b) { return b.c; });
    hz.forEach(function (h) { vals.push(h.lo2, h.hi2); });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), rng = hi - lo || 1;
    var y = function (v) { return BOT - (v - lo) / rng * (BOT - TOP); };

    var coords = hist.map(function (b, i) { return x(i).toFixed(1) + "," + y(b.c).toFixed(1); });
    var x0 = x(nH - 1);
    var band = function (loK, hiK) {
      var up = [x0.toFixed(1) + "," + y(spot).toFixed(1)];
      var dn = [];
      hz.forEach(function (h) {
        up.push(x(nH - 1 + h.sessions).toFixed(1) + "," + y(h[hiK]).toFixed(1));
        dn.unshift(x(nH - 1 + h.sessions).toFixed(1) + "," + y(h[loK]).toFixed(1));
      });
      return up.concat(dn).join(" ");
    };
    var ticks = hz.map(function (h) {
      var px = x(nH - 1 + h.sessions);
      var short = h.key === "w1" ? "1w" : h.key === "w2" ? "2w" : h.key === "m1" ? "1m" :
                  h.key === "m2" ? "2m" : "exp";
      return '<line x1="' + px.toFixed(1) + '" y1="' + TOP + '" x2="' + px.toFixed(1) +
        '" y2="' + BOT + '" stroke="var(--line)" stroke-dasharray="2 3"></line>' +
        '<text class="axis" x="' + px.toFixed(1) + '" y="12" text-anchor="middle">' + short + "</text>";
    }).join("");

    var pts = hist.map(function (b, i) {
      return {
        x: x(i), y: y(b.c), date: moDay(b.t), iso: null, big: moMoney(b.c, cur),
        chg: b.chgPct != null ? sgn(b.chgPct, 2) + "%" : null,
        chgUp: b.chgPct != null ? b.chgPct >= 0 : null,
        rows: [["Open", moMoney(b.o, cur)], ["High", moMoney(b.h, cur)],
               ["Low", moMoney(b.l, cur)], ["Close", moMoney(b.c, cur)]]
          .concat(b.contract ? [["Contract", moDay(b.contract)]] : []),
        vol: null
      };
    });
    for (var s = 1; s <= maxS; s++) {
      var k = sd * Math.sqrt(s);
      var lo1 = spot * Math.exp(-k), hi1 = spot * Math.exp(k);
      var lo2 = spot * Math.exp(-2 * k), hi2 = spot * Math.exp(2 * k);
      var hit = hz.filter(function (h) { return h.sessions === s; })[0];
      pts.push({
        x: x(nH - 1 + s), y: y(spot), iso: null,
        date: "+" + s + " session" + (s === 1 ? "" : "s") + (hit ? " \u00b7 " + hit.label : ""),
        big: moRange(lo1, hi1, cur), chg: "1\u03c3 band", chgUp: true,
        rows: [["2\u03c3 band", moRange(lo2, hi2, cur)], ["Centre", moMoney(spot, cur)],
               ["Sigma", n1(k * 100) + "% over " + s + " s"]]
          .concat(hit && hit.elo != null ? [["History 16\u201384%", moRange(hit.elo, hit.ehi, cur)]] : []),
        vol: null
      });
    }
    var last = pts[nH - 1];

    var svg = '<svg viewBox="0 0 330 128" role="img" aria-label="' + esc(inst.label) +
      ": " + nH + " sessions of history and the projected range to " + maxS + ' sessions ahead.">' +
      '<line class="gridline" x1="0" y1="' + TOP + '" x2="330" y2="' + TOP + '"></line>' +
      '<line class="gridline" x1="0" y1="' + ((TOP + BOT) / 2).toFixed(1) + '" x2="330" y2="' + ((TOP + BOT) / 2).toFixed(1) + '"></line>' +
      '<line class="gridline" x1="0" y1="' + BOT + '" x2="330" y2="' + BOT + '"></line>' +
      '<text class="axis" x="0" y="' + (TOP - 4) + '">' + moMoney(hi, cur) + "</text>" +
      '<text class="axis" x="0" y="' + (BOT + 10) + '">' + moMoney(lo, cur) + "</text>" +
      '<polygon fill="var(--calls-dim)" opacity="0.55" points="' + band("lo2", "hi2") + '"></polygon>' +
      '<polygon fill="var(--calls-dim)" points="' + band("lo1", "hi1") + '"></polygon>' +
      ticks +
      '<polyline fill="none" stroke="var(--calls)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="' +
        coords.join(" ") + '"></polyline>' +
      '<line x1="' + x0.toFixed(1) + '" y1="' + y(spot).toFixed(1) + '" x2="' + W + '" y2="' + y(spot).toFixed(1) +
        '" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3"></line>' +
      '<circle cx="' + last.x.toFixed(1) + '" cy="' + last.y.toFixed(1) +
        '" r="3.4" fill="var(--calls)" stroke="var(--surface)" stroke-width="2"></circle>' +
      "</svg>";
    return chartWrap(svg, { pts: pts, color: "var(--calls)", vbWidth: 330, vbTop: 0, vbHeight: 128 });
  }

  function moHorizonTable(inst) {
    var cur = inst.currency;
    var rows = (inst.horizons || []).map(function (h) {
      var b = h.base || {};
      var payload = {
        t: h.label + " \u00b7 " + inst.label, s: "to " + moDate(h.date) + " \u00b7 " + h.sessions + " sessions",
        big: moRange(h.lo1, h.hi1, cur),
        rows: [["2\u03c3 range", moRange(h.lo2, h.hi2, cur)],
               ["History 16\u201384%", moRange(h.elo, h.ehi, cur)],
               ["History 2.5\u201397.5%", moRange(h.e2lo, h.e2hi, cur)],
               ["History median", moMoney(h.emed, cur)],
               ["P(up), conditional", b.pUp != null ? n0(b.pUp) + "%" : null],
               ["P(up), unconditional", b.uncondPUp != null ? n0(b.uncondPUp) + "%" : null],
               ["Episodes", b.n != null ? b.n + " starts, ~" + b.neff + " independent" : null],
               ["Sigma used", n1(inst.vol.sigmaUsed) + "% annualised"]],
        note: "The volatility range assumes the next " + h.sessions + " sessions look like " +
              "the last 22 in size. The history band is what a " + h.sessions + "-session " +
              "move has actually spanned over ten years of the world price."
      };
      return "<tr data-pt='" + JSON.stringify(payload).replace(/'/g, "&#39;") + "'>" +
        '<td class="lft" style="color:var(--ink)">' + esc(h.label) + "</td>" +
        "<td>" + moDate(h.date) + "</td>" +
        "<td>" + moRange(h.lo1, h.hi1, cur) + "</td>" +
        "<td>" + moRange(h.lo2, h.hi2, cur) + "</td>" +
        "<td>" + moRange(h.elo, h.ehi, cur) + "</td>" +
        '<td class="' + (b.pUp == null ? "" : b.pUp >= 55 ? "pos" : b.pUp <= 45 ? "neg" : "") + '">' +
          (b.pUp != null ? n0(b.pUp) + "%" : "\u2014") +
          (b.neff != null ? ' <span style="color:var(--ink-3);font-size:10px">n\u2248' + b.neff + "</span>" : "") + "</td>" +
        "<td>" + moLeanPill(inst.lean.label) + "</td></tr>";
    }).join("");
    return '<div class="tablewrap"><table class="dt mo-hz"><thead><tr>' +
      '<th class="lft">Horizon</th><th>Date</th><th>1&sigma; range</th><th>2&sigma; range</th>' +
      "<th>History 16&ndash;84%</th><th>P(up)</th><th>Lean</th>" +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>";
  }

  function moEvidenceTable(inst) {
    var rows = (inst.evidence || []).map(function (e) {
      var d = e.detail || {};
      var pct = d.pct != null ? d.pct : (e.key === "vol" ? d.pct : null);
      var prows = [];
      Object.keys(d).forEach(function (k) {
        var v = d[k];
        if (v == null || typeof v === "object") return;
        prows.push([k, typeof v === "number" ? (Math.abs(v) >= 100 ? n0(v) : n2(v)) : String(v)]);
      });
      var payload = { t: e.label + " \u00b7 " + inst.label, s: "evidence row", big: esc(e.value),
                      rows: prows.slice(0, 12),
                      note: "Weight " + n1(e.weight) + " of " + n1(inst.lean.max) +
                            ". Reads " + (e.read > 0 ? "for" : e.read < 0 ? "against" : "neither way") + "." };
      return "<tr data-pt='" + JSON.stringify(payload).replace(/'/g, "&#39;") + "'>" +
        '<td class="lft" style="color:var(--ink)">' + esc(e.label) + "</td>" +
        '<td class="lft">' + esc(e.value) + "</td>" +
        "<td>" + moPct(pct) + "</td>" +
        '<td class="lft">' + moRead(e.read) + "</td>" +
        "<td>" + (e.weight ? n1(e.weight) : "\u2014") + "</td></tr>";
    }).join("");
    var L = inst.lean;
    return '<div class="tablewrap"><table class="dt mo-ev"><thead><tr>' +
      '<th class="lft">Factor</th><th class="lft">Value</th><th>Percentile</th>' +
      '<th class="lft">Reads</th><th>Vote weight</th>' +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>" +
      '<div class="mo-score">' + moLeanPill(L.label) +
      " <b>" + sgn(L.score, 1) + "</b> of &plusmn;" + n1(L.max) + " &middot; threshold &plusmn;" + n1(L.threshold) +
      (L["for"].length ? " &middot; for: " + esc(L["for"].join(", ")) : "") +
      (L.against.length ? " &middot; against: " + esc(L.against.join(", ")) : "") + "</div>";
  }

  /* The read, in prose, from the same numbers the tables show. */
  function moReadText(inst) {
    var p = inst.price, v = inst.vol, cur = inst.currency, w = p.world || {};
    var h1 = (inst.horizons || [])[0] || {}, hm = (inst.horizons || [])[2] || {};
    var b = hm.base || {};
    var s = "<b>" + esc(inst.label) + "</b> settled at <b>" + moMoney(p.last, cur) + "</b> " +
      esc(moUnitShort(inst)) + (p.chgPct != null ? " (" + sgn(p.chgPct, 2) + "%)" : "") +
      (p.contract ? " on the " + moDay(p.contract) + " contract" : "") + ". ";
    if (w.inr != null && w.premiumPct != null) {
      s += "The world price, " + moMoney(w.last, "USD") + " " + esc(w.unit) + " at " +
        n2(p.usdinr) + " rupees, works out to " + moMoney(w.inr, "INR") + ": MCX trades <b>" +
        sgn(w.premiumPct, 1) + "%</b> " + (w.premiumPct >= 0 ? "above" : "below") + " it. ";
    }
    s += "Realised volatility is <b>" + n0(v.c2c22 || v.yz22) + "%</b> annualised" +
      (v.pct1y != null ? ", the " + moOrd(v.pct1y) + " percentile of the year" : "") +
      "; the cone uses <b>" + n1(v.sigmaUsed) + "%</b> (" + esc(v.sigmaSource) + "). ";
    if (h1.lo1 != null) {
      s += "Next week's 1&sigma; range is <b>" + moRange(h1.lo1, h1.hi1, cur) + "</b>" +
        (h1.elo != null ? "; history's own band for a five-session move is " + moRange(h1.elo, h1.ehi, cur) : "") + ". ";
    }
    var L = inst.lean;
    s += "The lean is <b>" + (L.label === "none" ? "none" : L.label) + "</b> (" + sgn(L.score, 1) +
      " of &plusmn;" + n1(L.max) + (L["for"].length ? "; for: " + esc(L["for"].join(", ")) : "") +
      (L.against.length ? "; against: " + esc(L.against.join(", ")) : "") + ")";
    if (b.pUp != null) {
      s += ". When the trailing " + b.look + "-session move sat in this quintile, the next " +
        hm.sessions + " sessions were up <b>" + n0(b.pUp) + "%</b> of the time across ~" + b.neff +
        " independent episodes, against " + n0(b.uncondPUp) + "% unconditionally";
    }
    return s + ".";
  }

  function moHistTable(inst) {
    var cur = inst.currency;
    var rows = (inst.hist || []).slice(0, 30).map(function (b) {
      return '<tr><td class="lft">' + moDate(b.t) + "</td>" +
        "<td>" + moMoney(b.o, cur) + "</td><td>" + moMoney(b.h, cur) + "</td>" +
        "<td>" + moMoney(b.l, cur) + "</td>" +
        '<td style="color:var(--ink)">' + moMoney(b.c, cur) + "</td>" +
        '<td class="' + cls(b.chgPct) + '">' + (b.chgPct != null ? sgn(b.chgPct, 2) + "%" : "\u2014") + "</td>" +
        '<td class="lft" style="color:var(--ink-3)">' + (b.contract ? moDay(b.contract) : esc(inst.price.world.symbol || "")) + "</td></tr>";
    }).join("");
    return '<div class="tablewrap tall"><table class="dt"><thead><tr>' +
      '<th class="lft">Date</th><th>Open</th><th>High</th><th>Low</th><th>Close</th><th>Chg</th>' +
      '<th class="lft">Contract</th></tr></thead><tbody>' + rows + "</tbody></table></div>";
  }

  function moInstBlock(inst) {
    var p = inst.price, cur = inst.currency;
    var charted = !!(CHARTS && CHARTS[inst.strip]);
    var rolls = (inst.rolls || []).slice(-3).map(moDay).join(", ");
    return '<section class="card mo-inst"><div class="card-hd"><h2>' + esc(inst.label) + "</h2>" +
      '<span class="sub">' + (p.contract ? "MCX " + moDay(p.contract) + " contract" : esc(p.world.symbol) + " front month") +
        " &middot; settled " + moDate(p.asOf) + "</span>" +
      '<div class="right">' + moLeanPill(inst.lean.label) +
        (charted ? '<button class="tgl" type="button" data-chart="' + esc(inst.strip) + '">Candles</button>' : "") +
      "</div></div>" +
      '<div class="levels">' +
        '<div class="lvl"><div class="lvl-k">Last</div><div class="lvl-v">' + moMoney(p.last, cur) +
          ' <span class="kpi-m">' + esc(moUnitShort(inst)) + "</span></div></div>" +
        '<div class="lvl"><div class="lvl-k">Chg %</div><div class="lvl-v ' + cls(p.chgPct) + '">' + (p.chgPct != null ? sgn(p.chgPct, 2) + "%" : "\u2014") + "</div></div>" +
        (p.world && p.world.premiumPct != null
          ? '<div class="lvl"><div class="lvl-k">MCX premium</div><div class="lvl-v">' + sgn(p.world.premiumPct, 1) + "%</div></div>"
          : '<div class="lvl"><div class="lvl-k">Prev close</div><div class="lvl-v">' + moMoney(p.prevClose, cur) + "</div></div>") +
        '<div class="lvl"><div class="lvl-k">Sigma used</div><div class="lvl-v">' + n1(inst.vol.sigmaUsed) + "%</div></div>" +
        (p.oi != null
          ? '<div class="lvl"><div class="lvl-k">Open interest</div><div class="lvl-v">' + n0(p.oi) +
            ' <span class="kpi-m ' + cls(p.oi - (p.oiPrev || p.oi)) + '">' + (p.oiPrev ? sgn((p.oi - p.oiPrev) / p.oiPrev * 100, 1) + "%" : "") + "</span></div></div>"
          : "") +
        (inst.expiry ? '<div class="lvl"><div class="lvl-k">Expiry</div><div class="lvl-v">' + moDay(inst.expiry) + "</div></div>" : "") +
      "</div>" +
      '<div class="mo-read"><p>' + moReadText(inst) + "</p></div>" +
      '<div class="mo-cone">' + moConeSvg(inst) + "</div>" +
      '<div class="mo-sub">Where it can go</div>' + moHorizonTable(inst) +
      '<div class="mo-sub">The evidence</div>' + moEvidenceTable(inst) +
      '<details class="mo-hist"><summary>Session history &middot; last 30 of ' + (inst.vol.bars || 0) + " stored" +
        (rolls ? " &middot; rolled " + rolls : "") + "</summary>" + moHistTable(inst) + "</details>" +
      "</section>";
  }

  function moTiles(D) {
    var L = D.instruments || [];
    return '<section class="kpis mo-tiles">' + L.map(function (i) {
      var p = i.price, cur = i.currency;
      var charted = !!(CHARTS && CHARTS[i.strip]);
      return '<div class="card kpi' + (charted ? '" data-chart="' + esc(i.strip) : "") + '" title="' +
        (charted ? "Open the candlestick chart" : "") + '"><div class="kpi-k">' + esc(i.label) +
        (i.mcx ? ' <span class="tagx">MCX</span>' : ' <span class="tagx">USD</span>') + "</div>" +
        '<div class="kpi-v">' + moMoney(p.last, cur) + "</div>" +
        '<div class="kpi-m"><span class="' + cls(p.chgPct) + '">' + (p.chgPct != null ? sgn(p.chgPct, 2) + "%" : "\u2014") +
          "</span> &middot; " + esc(moUnitShort(i)) + (p.contract ? " &middot; " + moDay(p.contract) : "") + "</div></div>";
    }).join("") + "</section>";
  }

  function moContext(D) {
    var c = D.context || {};
    var cell = function (k, v, m2) {
      return '<div class="lvl"><div class="lvl-k">' + k + '</div><div class="lvl-v">' + v + '</div><div class="kpi-m">' + m2 + "</div></div>";
    };
    var fx = c.usdinr, dx = c.dxy, gs = c.goldSilver, bw = c.brentWti;
    return '<section class="card"><div class="card-hd"><h2>What sits behind the prices</h2>' +
      '<span class="sub">the dollar, the rupee, and the two spreads</span></div><div class="levels">' +
      (fx ? cell("USD/INR", n2(fx.last), '<span class="' + cls(fx.chgPct) + '">' + sgn(fx.chgPct, 2) + "%</span> in 20 sessions &middot; " + moPct(fx.pct) + " pct") : "") +
      (dx ? cell("Dollar index", n2(dx.last), '<span class="' + cls(dx.chgPct) + '">' + sgn(dx.chgPct, 2) + "%</span> in 20 sessions &middot; " + moPct(dx.pct) + " pct") : "") +
      (gs ? cell("Gold/silver ratio", n1(gs.now), moPct(gs.pct1y) + " pct of 1y &middot; " + moPct(gs.pct10y) + " of 10y") : "") +
      (bw ? cell("Brent&ndash;WTI spread", "$" + n2(bw.now), moPct(bw.pct1y) + " pct of 1y") : "") +
      "</div></section>";
  }

  function moRecord(D) {
    var R = D.record || {};
    var rate = function (v) { return v == null ? "\u2014" : n0(v) + "%"; };
    var recent = (R.recent || []).slice(0, 25).map(function (c) {
      var inst = moInst(c.key) || { currency: c.key === "WTI" || c.key === "BRENT" ? "USD" : "INR", label: c.key };
      var cur = inst.currency;
      var out = c.resolved_on == null ? '<span style="color:var(--ink-3)">open &middot; ' + moDate(c.horizon_date) + "</span>" :
        (c.in_1sd ? '<b class="pos">inside 1&sigma;</b>' : c.in_2sd ? '<b style="color:var(--warn)">inside 2&sigma;</b>' : '<b class="neg">outside 2&sigma;</b>') +
        " &middot; " + moMoney(c.actual, cur) +
        (c.lean_correct == null ? "" : c.lean_correct ? ' &middot; <b class="pos">lean right</b>' : ' &middot; <b class="neg">lean wrong</b>');
      return '<tr><td class="lft">' + moDate(c.made_on) + "</td>" +
        '<td class="lft">' + esc(inst.label || c.key) + "</td>" +
        '<td class="lft">' + esc(c.horizon === "w1" ? "Next week" : c.horizon === "w2" ? "Two weeks" : c.horizon === "m1" ? "One month" : c.horizon === "m2" ? "Two months" : "Expiry") + "</td>" +
        "<td>" + moMoney(c.spot, cur) + "</td>" +
        "<td>" + moRange(c.lo1, c.hi1, cur) + "</td>" +
        "<td>" + moRange(c.elo, c.ehi, cur) + "</td>" +
        "<td>" + moLeanPill(c.lean) + "</td>" +
        '<td class="lft">' + out + "</td></tr>";
    }).join("");
    return '<section class="card"><div class="card-hd"><h2>Projection record</h2>' +
      '<span class="sub">every range and lean, scored when its date arrives</span>' +
      '<div class="right"><span class="kpi-m">graded after ' + (R.gradedAfter || 20) + " resolved leans</span></div></div>" +
      '<div class="levels">' +
        '<div class="lvl"><div class="lvl-k">Calls made</div><div class="lvl-v">' + n0(R.calls || 0) + "</div></div>" +
        '<div class="lvl"><div class="lvl-k">Resolved</div><div class="lvl-v">' + n0(R.resolved || 0) + "</div></div>" +
        '<div class="lvl"><div class="lvl-k">Inside 1&sigma;</div><div class="lvl-v">' + rate(R.rate1) + '</div><div class="kpi-m">expect ' + n1(R.expected1 || 68.3) + "%</div></div>" +
        '<div class="lvl"><div class="lvl-k">Inside 2&sigma;</div><div class="lvl-v">' + rate(R.rate2) + '</div><div class="kpi-m">expect ' + n1(R.expected2 || 95.4) + "%</div></div>" +
        '<div class="lvl"><div class="lvl-k">Inside history band</div><div class="lvl-v">' + rate(R.rateEmp) + '</div><div class="kpi-m">expect 68%</div></div>' +
        '<div class="lvl"><div class="lvl-k">Lean hit rate</div><div class="lvl-v">' + (R.graded ? rate(R.leanRate) : "\u2014") +
          '</div><div class="kpi-m">' + n0(R.leanHits || 0) + " of " + n0(R.leanN || 0) + (R.graded ? "" : " \u00b7 ungraded") + "</div></div>" +
      "</div>" +
      (!R.resolved ? '<div class="caution"><p><b>Nothing has resolved yet.</b> The first next-week calls score on ' +
        ((R.recent || [])[0] ? moDate(R.recent.slice().sort(function (a, b) { return a.horizon_date < b.horizon_date ? -1 : 1; })[0].horizon_date) : "their date") +
        ". Until " + (R.gradedAfter || 20) + " leans have resolved the lean is published as a lean, not as a forecast with a hit rate.</p></div>" : "") +
      '<div class="tablewrap tall"><table class="dt"><thead><tr>' +
      '<th class="lft">Made on</th><th class="lft">Instrument</th><th class="lft">Horizon</th><th>Spot</th>' +
      "<th>1&sigma; range</th><th>History band</th><th>Lean</th>" +
      '<th class="lft">Outcome</th></tr></thead><tbody>' + recent + "</tbody></table></div></section>";
  }

  function moEvents(D) {
    var rows = (D.events || []).map(function (e) {
      var tone = e.severity === "high" ? "risk" : e.severity === "medium" ? "mid" : "no";
      return '<tr><td class="lft">' + moDate(e.date) + "</td>" +
        '<td class="lft" style="color:var(--ink)">' + esc(e.label) + "</td>" +
        '<td><span class="pill ' + tone + '">' + esc(e.severity) + "</span></td>" +
        '<td class="lft">' + esc(e.region || "") + "</td>" +
        "<td>" + (e.daysUntil != null ? e.daysUntil + "d" : "\u2014") + "</td>" +
        '<td class="lft mac-india">' + esc(e.note || "") + "</td></tr>";
    }).join("");
    return '<section class="card"><div class="card-hd"><h2>Events ahead</h2>' +
      '<span class="sub">what moves these five, next 45 days</span></div>' +
      '<div class="tablewrap tall"><table class="dt"><thead><tr>' +
      '<th class="lft">Date</th><th class="lft">Event</th><th>Severity</th><th class="lft">Region</th>' +
      '<th>In</th><th class="lft">Note</th></tr></thead><tbody>' +
      (rows || '<tr><td class="lft" colspan="6">Nothing on the calendar inside the window.</td></tr>') +
      "</tbody></table></div></section>";
  }

  function moRules(D) {
    var r = D.rules || {}, w = r.weights || {};
    return '<section class="card"><div class="card-hd"><h2>How this page decides</h2>' +
      '<span class="sub">the rules, so the numbers can be checked</span></div>' +
      '<div class="notecall"><p><b>The range.</b> One sigma over h sessions is &sigma;<sub>daily</sub>&thinsp;&times;&thinsp;&radic;h, ' +
      "with &sigma; the average of a HAR-RV forecast and 22-session Yang-Zhang on the roll-adjusted series. " +
      "The second band is what history actually did: the 16th and 84th percentile of every h-session move in ten years of the world price. " +
      "When the two disagree, the wider one is the honest one.</p>" +
      "<p><b>The lean.</b> Each factor votes +1, 0 or &minus;1 and carries a weight: trend " + n1(w.trend || 2) +
      ", momentum " + n1(w.momentum || 2) + ", dollar " + n1(w.dollar || 1) + ", rupee " + n1(w.rupee || 1) +
      ", build-up " + n1(w.buildup || 1) + ", term structure " + n1(w.term || 1) + ", seasonality " + n1(w.season || 1) +
      ". A total at or past &plusmn;" + n1(r.leanThreshold || 3) + " is a lean; anything inside is none. " +
      "Volatility regime never votes: it sizes the range, it does not pick a side.</p>" +
      "<p><b>The record.</b> Every range and lean is written on the day it is made and scored when its date has a close. " +
      "The lean's hit rate is quoted only after " + n0(r.gradedAfter || 20) + " have resolved. " +
      "Contracts roll " + n0(r.rollDays || 3) + " days before expiry, the same rule the strip uses. " +
      "Exchange holidays are not modelled: a horizon date can land a session late.</p></div></section>";
  }

  /* The briefing. Written for someone who has not seen the tables: where
     each instrument stands, what it did over the week and the month, what
     a normal day and week look like, how far it can go by expiry, and
     which way the desk leans. Every line is a button carrying the numbers
     and the feed it was built from, so a reader can check any sentence
     without leaving the page. Tone is colour: green, red, amber, grey. */
  function moLine(tone, html, payload) {
    return '<button type="button" class="br-line ' + tone + "\" data-pt='" +
      JSON.stringify(payload).replace(/'/g, "&#39;") + "'>" +
      '<span class="br-dot"></span><span class="br-txt">' + html + "</span></button>";
  }
  function moTone(v, dead) {
    if (v == null) return "info";
    if (Math.abs(v) < (dead || 0)) return "info";
    return v > 0 ? "up" : "down";
  }
  function moPctTxt(v) { return v == null ? "\u2014" : sgn(v, 1) + "%"; }
  function moSrcMcx(inst) {
    return inst.mcx
      ? "Source: MCX " + moDay(inst.price.contract) + " contract, exchange daily settlement republished by Moneycontrol; contracts chained and roll-adjusted by the desk."
      : "Source: " + inst.price.world.symbol + " front month daily bars, Yahoo Finance.";
  }
  function moEventsBefore(D, iso, n) {
    return (D.events || []).filter(function (e) { return !iso || e.date <= iso; }).slice(0, n || 4);
  }

  function moBriefInstrument(D, inst, full) {
    var p = inst.price, w = p.world || {}, cur = inst.currency, R = inst.recent || {}, rt = R.returns || {};
    var u = moUnitShort(inst), lines = [];
    var hz = inst.horizons || [], exp = hz.filter(function (h) { return h.key === "expiry"; })[0];
    var h1 = hz.filter(function (h) { return h.key === "w1"; })[0] || {};
    var hm = hz.filter(function (h) { return h.key === "m1"; })[0] || {};
    var sd = (inst.vol.sigmaDailyPct || 0);

    /* 1. Where it stands. */
    lines.push(moLine(moTone(p.chgPct, 0.05),
      "<b>" + esc(inst.label) + "</b> settled at <b>" + moMoney(p.last, cur) + "</b> " + esc(u) +
      " on " + moDate(p.asOf) + ", <b>" + moPctTxt(p.chgPct) + "</b> on the session" +
      (p.contract ? " (" + moDay(p.contract) + " contract" + (p.oi != null ? ", open interest " + n0(p.oi) + (p.oiPrev ? ", " + sgn((p.oi - p.oiPrev) / p.oiPrev * 100, 1) + "%" : "") : "") + ")" : "") +
      (w.inr != null ? ". The world price is " + moMoney(w.last, "USD") + " " + esc(w.unit) + ", which at " + n2(p.usdinr) +
        " rupees is " + moMoney(w.inr, "INR") + "; MCX trades <b>" + sgn(w.premiumPct, 1) + "%</b> " + (w.premiumPct >= 0 ? "above" : "below") + " that." : "."),
      { t: "Where " + inst.label + " stands", s: moDate(p.asOf) + " settlement", big: moMoney(p.last, cur),
        rows: [["Settlement", moMoney(p.last, cur)], ["Previous close", moMoney(p.prevClose, cur)],
               ["Change", moPctTxt(p.chgPct)], ["Open", moMoney(p.open, cur)], ["High", moMoney(p.high, cur)], ["Low", moMoney(p.low, cur)],
               ["Contract", p.contract ? moDate(p.contract) : "front month"],
               ["Open interest", p.oi != null ? n0(p.oi) + " (prev " + n0(p.oiPrev) + ")" : null],
               ["World price", w.last != null ? moMoney(w.last, "USD") + " " + w.unit + " (" + w.symbol + ", " + moDate(w.asOf) + ")" : null],
               ["USD/INR", p.usdinr != null ? n2(p.usdinr) : null],
               ["World price in rupees", w.inr != null ? moMoney(w.inr, "INR") : null],
               ["MCX premium", w.premiumPct != null ? sgn(w.premiumPct, 1) + "%" : null]],
        note: moSrcMcx(inst) + (w.symbol ? " World price: " + w.symbol + " daily bar, Yahoo Finance; USD/INR: INR=X." : "") }));

    /* 2. What happened: the week. */
    var wk = R.week, r5 = rt.w1;
    if (wk && r5) {
      lines.push(moLine(moTone(r5.pct, 0.3),
        "<b>Last week</b> (" + r5.sessions + " sessions since " + moDate(r5.from) + "): <b>" + moPctTxt(r5.pct) + "</b>, ranging " +
        moMoney(wk.lo, cur) + " (" + moDay(wk.loDate) + ") to " + moMoney(wk.hi, cur) + " (" + moDay(wk.hiDate) + ")" +
        (R.streak && R.streak.n >= 2 ? "; " + R.streak.n + " " + R.streak.dir + " sessions in a row" : "") +
        (R.biggest ? ". The biggest session of the month was <b>" + moPctTxt(R.biggest.pct) + "</b> on " + moDay(R.biggest.date) : "") + ".",
        { t: "Last week: " + inst.label, s: moDate(r5.from) + " to " + moDate(p.asOf), big: moPctTxt(r5.pct),
          rows: [["Close " + moDay(r5.from), moMoney(p.last / (1 + r5.pct / 100), cur)], ["Close " + moDay(p.asOf), moMoney(p.last, cur)],
                 ["Week high", moMoney(wk.hi, cur) + " on " + moDate(wk.hiDate)], ["Week low", moMoney(wk.lo, cur) + " on " + moDate(wk.loDate)],
                 ["Biggest session (22)", R.biggest ? moPctTxt(R.biggest.pct) + " on " + moDate(R.biggest.date) : null],
                 ["Up sessions (22)", R.upDays != null ? R.upDays + " of " + R.days : null],
                 ["Streak", R.streak ? R.streak.n + " " + R.streak.dir : null],
                 ["Levels", wk.rollAdjusted ? "roll-adjusted (a contract change sits inside the window)" : "as printed by the exchange"]],
          note: moSrcMcx(inst) + " Returns are computed on the roll-adjusted series so a contract change is never counted as a move." }));
    }

    /* 3. What happened: the month, the year, the trend. */
    var mo = R.month, r22 = rt.m1, r250 = rt.y1, tr = (moEv(inst, "trend") || {}).detail || {}, mm = (moEv(inst, "momentum") || {}).detail || {};
    if (mo && r22) {
      var above = tr.above || [];
      var have = [20, 50, 200].filter(function (n) { return tr["dma" + n] != null; });
      var trendTxt = have.length && above.length === have.length ? "above all " + have.length + " of its moving averages" : above.length === 0 ? "below all " + have.length + " of its moving averages" :
        "above the " + above.join("- and ") + "-day average" + (above.length > 1 ? "s" : "") + ", below the rest";
      lines.push(moLine(moTone(r22.pct, 0.5),
        "<b>Last month</b> (" + r22.sessions + " sessions): <b>" + moPctTxt(r22.pct) + "</b>, between " + moMoney(mo.lo, cur) + " and " + moMoney(mo.hi, cur) +
        (r250 ? "; over a year <b>" + moPctTxt(r250.pct) + "</b>" : "") +
        (mm.pos52 != null ? ", now at " + n0(mm.pos52) + "% of the 52-week range" : "") +
        ". Price is " + trendTxt + " (" + have.map(function (n) { return n + "-day " + moMoney(tr["dma" + n], cur); }).join(", ") + ").",
        { t: "Last month and the trend: " + inst.label, s: moDate(r22.from) + " to " + moDate(p.asOf), big: moPctTxt(r22.pct),
          rows: [["22-session return", moPctTxt(r22.pct)], ["66-session return", rt.q1 ? moPctTxt(rt.q1.pct) : null], ["250-session return", r250 ? moPctTxt(r250.pct) : null],
                 ["Month high", moMoney(mo.hi, cur) + " on " + moDate(mo.hiDate)], ["Month low", moMoney(mo.lo, cur) + " on " + moDate(mo.loDate)],
                 ["52-week high", moMoney(mm.hi52, cur)], ["52-week low", moMoney(mm.lo52, cur)], ["Position in 52-week range", mm.pos52 != null ? n0(mm.pos52) + "%" : null],
                 ["20-day average", moMoney(tr.dma20, cur)], ["50-day average", moMoney(tr.dma50, cur)], ["200-day average", moMoney(tr.dma200, cur)],
                 ["Momentum percentile", mm.pct != null ? moOrd(mm.pct) + " of ten years" : null]],
          note: moSrcMcx(inst) + " Averages and returns on the roll-adjusted series; the momentum percentile ranks the 20-session move against ten years of the world price." }));
    }

    /* 4. Today and this week. */
    var d1lo = p.last * Math.exp(-sd / 100), d1hi = p.last * Math.exp(sd / 100);
    var soon = moEventsBefore(D, h1.date, 2);
    lines.push(moLine("warn",
      "<b>Today</b>: a normal session moves about <b>&plusmn;" + n1(sd) + "%</b> (" + moMoney(p.last - d1lo, cur) + "), so " +
      moMoney(d1lo, cur) + " to " + moMoney(d1hi, cur) + " is one standard deviation and a day beyond &plusmn;" + n1(2 * sd) + "% is a two-sigma day. " +
      "<b>This week</b> (to " + moDate(h1.date) + "): " + moRange(h1.lo1, h1.hi1, cur) + " at one sigma" +
      (h1.elo != null ? "; over ten years a five-session move has stayed inside " + moRange(h1.elo, h1.ehi, cur) + " two times in three" : "") + "." +
      (soon.length ? " On the calendar: " + soon.map(function (e) { return esc(e.label) + " (" + moDay(e.date) + ")"; }).join(", ") + "." : ""),
      { t: "Today and this week: " + inst.label, s: "from realised volatility", big: "\u00b1" + n1(sd) + "% a session",
        rows: [["Sigma, annualised", n1(inst.vol.sigmaUsed) + "% (" + inst.vol.sigmaSource + ")"], ["Sigma, one session", n2(sd) + "%"],
               ["HAR-RV forecast", inst.vol.har != null ? n1(inst.vol.har) + "%" : null], ["Yang-Zhang 22d", inst.vol.yz22 != null ? n1(inst.vol.yz22) + "%" : null],
               ["Close-to-close 22d", inst.vol.c2c22 != null ? n1(inst.vol.c2c22) + "%" : null], ["Vol percentile, 1y", inst.vol.pct1y != null ? moOrd(inst.vol.pct1y) : null],
               ["One-session 1\u03c3", moRange(d1lo, d1hi, cur)], ["Next-week 1\u03c3", moRange(h1.lo1, h1.hi1, cur)], ["Next-week 2\u03c3", moRange(h1.lo2, h1.hi2, cur)],
               ["Next-week history 16\u201384%", moRange(h1.elo, h1.ehi, cur)], ["Bars behind the estimate", n0(inst.vol.bars)]],
        note: "Sigma is estimated on the roll-adjusted daily bars (" + moSrcMcx(inst) + "). One sigma over h sessions is the daily sigma times the square root of h; the history band is the 16th and 84th percentile of every 5-session move in ten years of " + (w.symbol || "the world price") + "." }));

    /* 5. To expiry (or two months where there is no contract). */
    var far = exp || hz.filter(function (h) { return h.key === "m2"; })[0];
    if (far) {
      var bb = far.base || {};
      var upPct = (far.hi1 / p.last - 1) * 100, dnPct = (1 - far.lo1 / p.last) * 100;
      lines.push(moLine(moTone(bb.pUp != null ? bb.pUp - 50 : null, 5),
        "<b>" + (exp ? "To expiry" : "Two months out") + "</b> (" + esc(far.label) + ", " + far.sessions + " sessions to " + moDate(far.date) + "): one sigma allows <b>" +
        moMoney(far.hi1 - p.last, cur) + " up (" + sgn(upPct, 1) + "%) or " + moMoney(p.last - far.lo1, cur) + " down (\u2212" + n1(dnPct) + "%)</b>, so " +
        moRange(far.lo1, far.hi1, cur) + "; two sigma stretches that to " + moRange(far.lo2, far.hi2, cur) + "." +
        (far.elo != null ? " History's own band for " + far.sessions + " sessions is " + moRange(far.elo, far.ehi, cur) + "." : "") +
        (bb.pUp != null ? " From starts that looked like this one, the price was higher " + far.sessions + " sessions later <b>" + n0(bb.pUp) + "%</b> of the time (about " + bb.neff + " independent episodes; " + n0(bb.uncondPUp) + "% from any start)." : ""),
        { t: (exp ? "To expiry: " : "Two months: ") + inst.label, s: far.sessions + " sessions to " + moDate(far.date), big: moRange(far.lo1, far.hi1, cur),
          rows: [["Up, one sigma", moMoney(far.hi1 - p.last, cur) + " (" + sgn(upPct, 1) + "%)"], ["Down, one sigma", moMoney(p.last - far.lo1, cur) + " (\u2212" + n1(dnPct) + "%)"],
                 ["1\u03c3 range", moRange(far.lo1, far.hi1, cur)], ["2\u03c3 range", moRange(far.lo2, far.hi2, cur)],
                 ["History 16\u201384%", moRange(far.elo, far.ehi, cur)], ["History 2.5\u201397.5%", moRange(far.e2lo, far.e2hi, cur)], ["History median", moMoney(far.emed, cur)],
                 ["P(up), starts like this", bb.pUp != null ? n0(bb.pUp) + "% (quintile " + bb.quintile + ", " + bb.n + " starts, ~" + bb.neff + " independent)" : null],
                 ["P(up), any start", bb.uncondPUp != null ? n0(bb.uncondPUp) + "%" : null],
                 ["Horizon date", moDate(far.date) + (exp ? " (last session before the roll; contract expires " + moDate(inst.expiry) + ")" : "")]],
          note: "Cone from the sigma above; history and base rates from ten years of " + (w.symbol || "the world price") + " daily closes (Yahoo Finance). Weekdays only: an exchange holiday inside the window lands the date a session later." }));
    }

    /* 6. The lean. */
    var L = inst.lean, Rr = D.record || {};
    var forTxt = (inst.evidence || []).filter(function (e) { return e.read !== 0; }).map(function (e) {
      return esc(e.label) + " " + esc(e.value) + " (" + (e.read > 0 ? "for" : "against") + ")";
    });
    lines.push(moLine(L.label === "up" ? "up" : L.label === "down" ? "down" : "info",
      "<b>The desk leans " + (L.label === "none" ? "neither way" : L.label) + "</b> (" + sgn(L.score, 1) + " of &plusmn;" + n1(L.max) + ", threshold &plusmn;" + n1(L.threshold) + ")" +
      (forTxt.length ? ": " + forTxt.join("; ") : ": no row votes") + ". " +
      (Rr.graded ? "Leans have been right " + n0(Rr.leanRate) + "% of the time (" + n0(Rr.leanHits) + " of " + n0(Rr.leanN) + ")."
                 : "This is ungraded: " + n0(Rr.leanN || 0) + " of the " + n0(Rr.gradedAfter || 20) + " leans needed have resolved, so treat it as a tilt, not a forecast."),
      { t: "The lean: " + inst.label, s: "weighted vote of the evidence table", big: "Lean " + (L.label === "none" ? "neither way" : L.label),
        rows: (inst.evidence || []).map(function (e) { return [e.label, e.value + " \u00b7 " + (e.read > 0 ? "+" : e.read < 0 ? "\u2212" : "0") + " \u00d7 " + n1(e.weight)]; })
          .concat([["Score", sgn(L.score, 1) + " of \u00b1" + n1(L.max)], ["Record", n0(Rr.leanHits || 0) + " right of " + n0(Rr.leanN || 0) + " resolved"]]),
        note: "Each row votes +1, 0 or \u22121 times its weight; the sum against the threshold is the lean. Rules on the card at the foot of the page." }));

    /* 7. Before expiry: the calendar. */
    if (full && exp) {
      var evs = moEventsBefore(D, inst.expiry, 6);
      if (evs.length) {
        lines.push(moLine(evs.some(function (e) { return e.severity === "high"; }) ? "warn" : "info",
          "<b>Before expiry</b>: " + evs.map(function (e) { return esc(e.label) + " on " + moDay(e.date); }).join(", ") + ".",
          { t: "Calendar to " + moDate(inst.expiry), s: evs.length + " item(s)", rows: evs.map(function (e) { return [moDate(e.date), e.label + " \u00b7 " + e.severity + (e.note ? " \u00b7 " + e.note : "")]; }),
            note: "Derived releases follow their monthly convention; MCX expiries from the contract; the EIA report is every Wednesday. FOMC, OPEC+ and RBI dates are announced, not derivable, and appear only when entered in data/calendar.csv." }));
      }
    }
    return '<div class="br-inst"><div class="br-hd">' + esc(inst.label) + " " + moLeanPill(L.label) + "</div>" + lines.join("") + "</div>";
  }

  function moBriefing(D) {
    var L = D.instruments || [], ctx = D.context || {};
    var by = function (k) { return moInst(k); };
    var g = by("GOLD"), s = by("SILVER"), c = by("CRUDE"), wti = by("WTI"), br = by("BRENT");
    var ups = L.filter(function (i) { return i.lean.label === "up"; }).map(function (i) { return i.label; });
    var dns = L.filter(function (i) { return i.lean.label === "down"; }).map(function (i) { return i.label; });

      { t: "The desk in one line", s: "as of " + moDate(D.asOf),
        rows: L.map(function (i) { return [i.label, moMoney(i.price.last, i.currency) + " \u00b7 " + moPctTxt(i.price.chgPct) + " \u00b7 lean " + i.lean.label + " (" + sgn(i.lean.score, 1) + ")"]; })
          .concat(dx ? [["Dollar index", n2(dx.last) + " \u00b7 " + sgn(dx.chgPct, 2) + "% / 20 sessions \u00b7 " + moOrd(dx.pct) + " pct"]] : [])
          .concat(fx ? [["USD/INR", n2(fx.last) + " \u00b7 " + sgn(fx.chgPct, 2) + "% / 20 sessions"]] : [])
          .concat(ctx.goldSilver ? [["Gold/silver ratio", n1(ctx.goldSilver.now) + " \u00b7 " + moOrd(ctx.goldSilver.pct1y) + " pct of 1y"]] : [])
          .concat(ctx.brentWti ? [["Brent\u2013WTI", "$" + n2(ctx.brentWti.now) + " \u00b7 " + moOrd(ctx.brentWti.pct1y) + " pct of 1y"]] : []),
        note: "Leans from each instrument's evidence table; dollar index DX-Y.NYB and USD/INR INR=X from Yahoo Finance; ratio and spread on the world prices." });

    return '<section class="card br"><div class="card-hd"><h2>Briefing</h2>' +
