                 cls(c.rom - romMin),
                 c.rom < romMin ? "below minimum" : "clears"]);
      rows.push(["Credit", "&mdash;", "&#8377;" + n0(c.creditRs),
                 "&mdash;", "", "against &#8377;" + n0(c.margin) + " margin"]);
      rule = "return on margin under " + n2(romMin) + "% &rarr; THIN PREMIUM";
      means = "The <b>" + leg + "</b> does not pay enough for the capital it " +
        "blocks and the tail it carries.";
      impact = "Selling this collects &#8377;" + n0(c.creditRs) + " while " +
        "tying up &#8377;" + n0(c.margin) + " and accepting the same gap " +
        "risk as a strike paying several times more. The premium is real; " +
        "the compensation is not.";
    } else if (c.t === "Marginal") {
      rows.push(["Probability of profit", "target", n1(c.pop * 100) + "%",
                 "&mdash;", "", "under target"]);
      rows.push(["Return on margin", "minimum " + n2(romMin) + "%",
                 n2(c.rom) + "%", sgn(c.rom - romMin, 2) + " pts",
                 cls(c.rom - romMin), "clears, barely"]);
      rule = "clears every rule, none of them by much &rarr; MARGINAL";
      means = "The <b>" + leg + "</b> passed every filter and none of them " +
        "with room to spare.";
      impact = "A trade that only just qualifies is one where a small error " +
        "in the volatility estimate flips the answer. The desk shows it and " +
        "does not propose it.";
    } else {
      return null;
    }

    return {
      title: c.t + " \u00b7 " + leg,
      means: means, impact: impact,
      proof: proofTable(rows) + proofRule(rule),
      caveat: "Every threshold here is a choice, not a law. They are set to " +
        "refuse trades that historically cost more than they paid, and a " +
        "strike failing one by a hair is not meaningfully different from " +
        "one passing by a hair."
    };
  };

  /* A wall is a claim that this strike matters more than its neighbours,
     so the proof is the neighbour it beat. */
  PROVE.wall = function (c, m) {
    var side = c.side, key = side === "CE" ? "ce" : "pe";
    var ranked = (m.rows || []).map(function (r) {
      return { k: r.strike, oi: (r[key] || {}).oi || 0 };
    }).sort(function (a, b) { return b.oi - a.oi; });
    if (!ranked.length) return null;

    var top = ranked[0], second = ranked[1] || { k: null, oi: 0 };
    var lead = second.oi ? (top.oi / second.oi - 1) * 100 : null;
    var total = ranked.reduce(function (s, r) { return s + r.oi; }, 0);

    return {
      title: (side === "CE" ? "Call wall" : "Put wall") + " \u00b7 " + n0(top.k),
      means: "Of every " + (side === "CE" ? "call" : "put") + " strike on " +
        "the board, <b>" + n0(top.k) + "</b> carries the most open interest " +
        "&mdash; " + n2(top.oi) + "L contracts, " +
        n0(Math.abs(top.k - m.cfg.spot)) + " points " +
        (top.k > m.cfg.spot ? "above" : "below") + " spot.",
      impact: "Writers there lose beyond it, so they have money committed to " +
        "defending it. That is what makes it act as " +
        (side === "CE" ? "resistance" : "support") + " rather than an " +
        "arbitrary round number. Across the desk's graded record this claim " +
        "holds on " + (side === "CE" ? "92.9%" : "80.0%") + " of sessions.",
      proof: proofTable([
        ["Heaviest strike", "&mdash;", n0(top.k) + " \u00b7 " + n2(top.oi) + "L",
         "&mdash;", "", "the wall"],
        ["Next heaviest", "&mdash;",
         second.k == null ? "&mdash;" : n0(second.k) + " \u00b7 " + n2(second.oi) + "L",
         lead == null ? "&mdash;" : "+" + n1(lead) + "%", "pos",
         lead == null ? "&mdash;" : "the wall leads by this"],
        ["Share of all " + (side === "CE" ? "call" : "put") + " OI", "&mdash;",
         total ? n1(top.oi / total * 100) + "%" : "&mdash;", "&mdash;", "",
         "concentrated here"]
      ]) + proofRule("most open interest on the " +
        (side === "CE" ? "call" : "put") + " side &rarr; " +
        (side === "CE" ? "CALL WALL" : "PUT WALL")),
      caveat: "A wall is only as meaningful as its lead over the next " +
        "strike. When the top two are within a few per cent of each other " +
        "the level is a zone rather than a line, and a wall that shrinks " +
        "through the week is being abandoned even while it stays the " +
        "heaviest."
    };
  };

  /* Above or below its own average, and by how far -- because "above" on
     its own is true of a stock one rupee over and one a fifth over. */
  PROVE.dma = function (c, m) {
    var gap = c.close - c.dma50, pct = c.dma50 ? gap / c.dma50 * 100 : null;
    return {
      title: (gap >= 0 ? "Above 50-DMA" : "Below 50-DMA") + " \u00b7 " + esc(c.sym),
      means: "<b>" + esc(c.sym) + "</b> closed at " + n2(c.close) +
        " against its own 50-session average of " + n2(c.dma50) + " &mdash; " +
        (gap >= 0 ? "above" : "below") + " it by " + n2(Math.abs(gap)) +
        (pct == null ? "" : " (" + n1(Math.abs(pct)) + "%)") + ".",
      impact: "On its own this is one name and it decides nothing. It " +
        "matters as a count: how many of the fifty sit above their own " +
        "average is the breadth reading, and in a calm market unusually " +
        "broad participation was followed by weaker sessions, not stronger.",
      proof: proofTable([
        ["Close", "50-DMA " + n2(c.dma50), n2(c.close),
         sgn(gap, 2) + (pct == null ? "" : " (" + sgn(pct, 1) + "%)"),
         cls(gap), gap >= 0 ? "above" : "below"],
        ["Index weight", "&mdash;", n2(c.weightPct) + "%", "&mdash;", "",
         c.weightPct >= 5 ? "heavy" : c.weightPct >= 2 ? "mid" : "light"],
        ["Contribution today", "&mdash;", sgn(c.contribPts, 2) + " pts",
         "&mdash;", cls(c.contribPts), "of the index move"]
      ]) + proofRule("close " + (gap >= 0 ? "above" : "below") +
        " the 50-session mean &rarr; " + (gap >= 0 ? "ABOVE" : "BELOW") +
        " 50-DMA"),
      caveat: "The average is a lagging line by construction: it is fifty " +
        "sessions of history, so it says where a stock has been rather than " +
        "where it is going. Crossing it is an event only because enough " +
        "money treats it as one."
    };
  };

  /* A regime label is a statistical test, so the proof is the statistic
     and the band it fell inside or outside. */
  PROVE.regime = function (c, m) {
    var vr = c.vr, z = c.z, rejects = c.rejects;
    return {
      title: (c.regime || "regime") + " \u00b7 " + c.window + "-session",
      means: "Over <b>" + c.window + " sessions</b>, moves add up to " +
        n2(vr) + " times what the same number of single sessions would. " +
        "At 1.00 exactly the market is behaving like a random walk.",
      /* The direction only means something once the test rejects. Reading
         a ratio of 0.94 as "reversing" while the z-statistic says it is
         inside noise is the card contradicting its own evidence. */
      impact: !rejects
        ? "The ratio leans " + (vr > 1 ? "toward extending" : "toward " +
          "reversing") + ", but the test <b>cannot reject a random walk</b> " +
          "at this sample size &mdash; so there is nothing here to act on. " +
          "The range assumption stands as the volatility number gives it."
        : vr > 1.05
        ? "Moves are <b>extending</b>. A range-selling position is fighting " +
          "the market's own tendency, so strikes want to be further out than " +
          "the volatility number alone suggests."
        : vr < 0.95
        ? "Moves are <b>reversing</b>. This is the condition a premium " +
          "seller wants: a range is more likely to hold than the raw " +
          "volatility implies."
        : "Neither extending nor reversing to a degree worth acting on. The " +
          "range assumption stands as the volatility number gives it.",
      proof: proofTable([
        ["Variance ratio", "random walk = 1.00", n2(vr),
         sgn(vr - 1, 2), cls(1 - vr),
         vr > 1 ? "extending" : vr < 1 ? "reversing" : "neither"],
        ["z-statistic", "significant beyond &plusmn;1.96", n2(z),
         "&mdash;", "", Math.abs(z) >= 1.96 ? "significant" : "within noise"],
        ["Verdict", "&mdash;", rejects ? "rejects random walk" : "cannot reject",
         "&mdash;", "", rejects ? "a real effect" : "no evidence"]
      ]) + proofRule("|z| " + (Math.abs(z) >= 1.96 ? "at or above" : "below") +
        " 1.96 &rarr; " + (rejects ? "REGIME" : "RANDOM WALK")),
      caveat: "The test is run over several windows and they can disagree. " +
        "Reading whichever window supports the position you already wanted " +
        "is the failure this figure exists to prevent, so treat a single " +
        "window's verdict as one reading rather than as the answer."
    };
  };

  function showTerm(label, value, m, ctx) {
    /* A decision the desk made about one row is justified from that row.
       A concept -- what a lot size is -- has no instance to justify, so it
       keeps the general card. */
    var pv = null;
    if (ctx && ctx.p && PROVE[ctx.p]) {
      try { pv = PROVE[ctx.p](ctx, m); } catch (e) { pv = null; }
    }
    if (pv) return showProof(label, pv, m);

    var key = termKey(label) || label;
    var t = TERMS[key];
    /* A label may resolve straight to a glossary entry with no arithmetic
       of its own -- a column heading rather than a computed figure. The
       pointer is resolved through the same fold as everything else,
       because some are written with entities and some with characters. */
    var d = deepEntry(t ? t.deep : key);
    if (!t && !d.length) return;
    var how = "";
    try { how = t.how ? t.how(m) : ""; } catch (e) { how = ""; }

    var plain = PLAIN[key] || [];
    var deepKey = t ? t.deep : key;
    var wantLevels = LEVEL_TERMS[key] || LEVEL_TERMS[deepKey];

    /* A trader's order: what it is, what it does to a position, why the
       desk says it, which levels decide it, and when it stops being true.
       The methodology follows, because it is what makes this checkable --
       but it is no longer the first thing on screen. */
    var rows = [];
    rows.push(["What it means", plain[0] || d[0] || ""]);
    if (plain[1] || d[1]) {
      rows.push(["Impact", '<span class="pt-arrow">&rarr;</span> ' +
                 (plain[1] || d[1])]);
    }
    if (how) rows.push(["Why?", how]);

    var levels = wantLevels ? ckLevelBlock(m) : "";
    if (levels) rows.push(["Key levels", levels]);
    var concl = wantLevels ? ckConclusion(m) : "";
    if (concl) rows.push(["Simple conclusion", concl]);

    var more = [];
    if (plain.length && d[0]) more.push(d[0]);
    if (d[1] && (plain.length || how)) more.push(d[1]);
    if (d[2]) more.push(d[2]);

    var el = document.getElementById("ptPanel");
    if (!el) return;
    el.innerHTML =
      '<div class="pt-hd"><div><div class="pt-t">' + label + "</div>" +
      '<div class="pt-s">on this desk, right now</div></div>' +
      '<button class="tgl" type="button" data-ptclose="1">Close</button></div>' +
      (value ? '<div class="pt-big">' + value + "</div>" : "") +
      rows.filter(function (kv) { return kv[1]; }).map(function (kv) {
        return '<div class="pt-sec"><span class="pt-sk">' + kv[0] +
               "</span>" + kv[1] + "</div>";
      }).join("") +
      (more.length
        ? '<details class="pt-more"><summary>The detail behind it</summary>' +
          more.map(function (p) { return "<p>" + p + "</p>"; }).join("") +
          "</details>"
        : "");
    el.hidden = false;
  }


  /* The proof card. Same five beats as every other card, but each one is
     about this row rather than about the rule in general. */
  function showProof(label, pv, m) {
    var el = document.getElementById("ptPanel");
    if (!el) return;
    var sec = function (k, v) {
      return v ? '<div class="pt-sec"><span class="pt-sk">' + k + "</span>" +
        v + "</div>" : "";
    };
    el.innerHTML =
      '<div class="pt-hd"><div><div class="pt-t">' + pv.title + "</div>" +
      '<div class="pt-s">' + (m.cfg.label || "") + " &middot; " +
      esc(m.cfg.expiry || "") + " &middot; spot " + n2(m.cfg.spot) + "</div></div>" +
      '<button class="tgl" type="button" data-ptclose="1">Close</button></div>' +
      sec("What it means &mdash; here", pv.means) +
      sec("Impact", '<span class="pt-arrow">&rarr;</span> ' + pv.impact) +
      sec("Why this one &mdash; the proof", pv.proof) +
      (pv.caveat
        ? '<details class="pt-more"><summary>What this rule cannot tell you' +
          "</summary><p>" + pv.caveat + "</p></details>"
        : "");
    decorateTerms(el);
    el.hidden = false;
  }

  function showPoint(payload) {
    var el = document.getElementById("ptPanel");
    if (!el) return;
    var rows = (payload.rows || []).map(function (kv) {
      /* Named so the decoration pass can find it: these rows are the same
         figures as the table the point came from. */
      return '<div class="pt-row"><span class="pt-rk">' + kv[0] + "</span><b>" +
             (kv[1] == null ? "\u2014" : kv[1]) + "</b></div>";
    }).join("");
    el.innerHTML =
      '<div class="pt-hd"><div><div class="pt-t">' + (payload.t || "") + "</div>" +
      '<div class="pt-s">' + (payload.s || "") + "</div></div>" +
      '<button class="tgl" type="button" data-ptclose="1">Close</button></div>' +
      (payload.big ? '<div class="pt-big">' + payload.big + "</div>" : "") +
      (rows ? '<div class="pt-rows">' + rows + "</div>" : "") +
      (payload.note ? '<div class="pt-note">' + payload.note + "</div>" : "");
    decorateTerms(el);
    el.hidden = false;
  }

  function hidePoint() {
    var el = document.getElementById("ptPanel");
    if (el) el.hidden = true;
  }

  /* A point on a time series is a session. Everything the desk holds about
     that session is worth more than the two numbers the tooltip showed. */
  function sessionPoint(iso, fallback) {
    var m = MODEL[state.idx];
    var h = (m.hist || []).filter(function (x) { return x.date === iso; })[0];
    if (!h) return fallback;
    var rows = [
      ["Open", n2(h.o)], ["High", n2(h.h)], ["Low", n2(h.l)], ["Close", n2(h.close)],
      ["Change", h.chgPct == null ? null : sgn(h.chgPct, 2) + "%"],
      ["PCR", n2(h.pcr)], ["Max pain", n0(h.maxPain)],
      ["ATM IV", h.atmIv == null ? null : n2(h.atmIv) + "%"],
      ["India VIX", n2(h.vix)],
      ["1 sigma", h.sd1 == null ? null : n0(h.sd1) + " pts"]
    ];
    var mh = (MHIST && MHIST[m.cfg.key]) || {};
    var day = (mh.entries || []).filter(function (e) { return e.date === iso; })[0];
    var note = "";
    if (day) {
      var got = (day.claims || []).filter(function (c) { return c.correct === 1; }).length;
      var graded = (day.claims || []).filter(function (c) { return c.correct != null; }).length;
      note = "The desk lodged " + (day.claims || []).length + " claim(s) that " +
             "session" + (graded ? " and scored <b>" + got + " of " + graded + "</b>" : "") +
             ". Full record on the Model data tab.";
    }
    return { t: DTS(iso), s: esc(m.cfg.label) + " session", big: n2(h.close),
             rows: rows, note: note };
  }


  /* One pass after every render marks every label the glossary knows.

     Tables are constructed in a dozen places; decorating them here rather
     than in each builder means a table added later is covered without
     anyone remembering to wire it. */
  /* Every element family that carries a name a reader might not know.
     The overview keeps its headline read in driver rows, which is why a
     list limited to headings and tiles left the first thing on the page
     unexplained. */
  var TERM_SELECTORS = [
    "th", ".lvl-k", ".kpi-k", ".ck", ".k", ".qk", ".tcell-k", ".stack-k",
    ".grp-c", ".grp-p", ".pill", ".tagx", ".sub-k", ".step-k", ".mh-k",
    ".pt-rk", ".si-k", ".lg-k", ".ohlc-k", ".bandrow-k",
    "h2", "td:first-child",
    ".dt.legend td:first-child"
  ].join(", ");

  /* Some figures are a value with no label of their own -- the confidence
     bar reads "61% confidence" and nothing else. Those are named here
     rather than resolved from their own text, which is a number. */
  var TERM_FIXED = [
    [".conf-val", "Confidence"],
    [".verdict-call", "The positioning read"],
    [".verdict-eyebrow", "The positioning read"]
  ];

  /* A band row writes its own description into a child element, and a
     pipeline step writes a status dot before its name, so textContent
     returns the label with all of that attached. The element's own text
     nodes are the label; its children are commentary on it. */
  function ownText(el) {
    var out = "", kids = el.childNodes || [];
    for (var i = 0; i < kids.length; i++) {
      if (kids[i].nodeType === 3) out += kids[i].nodeValue;
    }
    out = out.replace(/\s+/g, " ").trim();
    return out || (el.textContent || "").replace(/\s+/g, " ").trim();
  }

  function decorateTerms(root) {
    TERM_FIXED.forEach(function (f) {
      Array.prototype.forEach.call(root.querySelectorAll(f[0]),
        function (el) {
          if (el.hasAttribute("data-term")) return;
          el.setAttribute("data-term", f[1]);
          el.classList.add("has-term");
          el.setAttribute("tabindex", "0");
          el.setAttribute("role", "button");
          el.setAttribute("title", "What this means");
        });
    });

    Array.prototype.forEach.call(root.querySelectorAll(TERM_SELECTORS),
      function (el) {
        if (el.hasAttribute("data-term")) return;
        /* A chart handle or a row that opens a drawer already owns its
           click and opens something larger than a definition. A sortable
           header does not: its sort moved onto its own arrow so that the
           label could behave like every other label on the desk. */
        if (el.hasAttribute("data-chart") || el.hasAttribute("data-wl") ||
            el.hasAttribute("data-stock")) {
          return;
        }
        var label = ownText(el);
        if (!label || label.length > 40) return;
        var key = termKey(label);
        if (!key) return;
        el.setAttribute("data-term", label);
        el.classList.add("has-term");
        el.setAttribute("tabindex", "0");
        el.setAttribute("role", "button");
        el.setAttribute("title", "What this means");
      });
  }

  function attachChartHover(wrap) {
    var series;
    try { series = JSON.parse(wrap.getAttribute("data-series")); } catch (e) { return; }
    if (!series || !series.pts || series.pts.length < 2) return;

    var cross = wrap.querySelector(".ch-cross"),
        dot = wrap.querySelector(".ch-dot"),
        tip = wrap.querySelector(".ch-tip");
    if (!cross || !dot || !tip) return;
    dot.style.background = series.color;

    function move(ev) {
      var r = wrap.getBoundingClientRect();
      var x = Math.min(Math.max(ev.clientX - r.left, 0), r.width);
      var i = Math.round((x / r.width) * (series.pts.length - 1));
      i = Math.min(Math.max(i, 0), series.pts.length - 1);
      var pt = series.pts[i];

      var px = (i / (series.pts.length - 1)) * r.width;
      var py = ((pt.y - series.vbTop) / series.vbHeight) * r.height;

      cross.style.left = px + "px";
      dot.style.left = px + "px";
      dot.style.top = py + "px";

      /* Keep the panel inside the card rather than letting it clip. */
      var half = tip.offsetWidth / 2 || 80;
      tip.style.left = Math.min(Math.max(px, half + 2), r.width - half - 2) + "px";

      var html = '<div class="tip-date">' + pt.date + "</div>" +
                 '<div class="tip-big">' + pt.big + "</div>";
      if (pt.chg) {
        html += '<div class="tip-chg ' + (pt.chgUp ? "pos" : "neg") + '">' + pt.chg + "</div>";
      }
      if (pt.rows && pt.rows.length) {
        html += '<div class="tip-grid">' + pt.rows.map(function (kv) {
          return "<span>" + kv[0] + "</span><b>" + kv[1] + "</b>";
        }).join("") + "</div>";
      }
      if (pt.vol) {
        html += '<div class="tip-vol"><div class="tip-vol-k">Volume</div>' +
          '<div class="tip-vol-bar"><i style="width:' + pt.vol.pct.toFixed(1) + '%"></i></div>' +
          '<div class="tip-vol-v">' + pt.vol.label + "</div></div>";
      }
      tip.innerHTML = html;
      wrap.classList.add("live");
      wrap.__pt = pt;
    }

    wrap.addEventListener("mousemove", move);
    wrap.addEventListener("mouseleave", function () { wrap.classList.remove("live"); });

    wrap.classList.add("clickable-chart");
    wrap.setAttribute("tabindex", "0");
    wrap.addEventListener("click", function () {
      var pt = wrap.__pt || series.pts[series.pts.length - 1];
      if (!pt) return;
      showPoint(pt.iso ? sessionPoint(pt.iso, {
        t: pt.date, s: "session", big: pt.big, rows: pt.rows || []
      }) : { t: pt.date, s: "", big: pt.big, rows: pt.rows || [] });
    });
    wrap.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); wrap.click(); }
    });
  }

  function attachRungHover(el) {
    var tip = document.getElementById("rungTip");
    var d;
    try { d = JSON.parse(el.getAttribute("data-rung")); } catch (e) { return; }

    el.addEventListener("mousemove", function (ev) {
      tip.innerHTML =
        '<div class="rt-k">Strike</div><div class="rt-big">' + d.k +
          ' <span style="font-size:10px;color:var(--ink-3)">' + d.dist + " pts</span></div>" +
        '<div class="rt-row"><span style="color:var(--calls)">Call OI</span><b>' + d.ceOi + "L</b></div>" +
        '<div class="rt-row"><span class="' + (d.ceUp ? "pos" : "neg") + '">chg OI</span><b class="' +
          (d.ceUp ? "pos" : "neg") + '">' + d.ceChg + "L</b></div>" +
        '<div class="rt-row"><span style="color:var(--ink-3)">LTP &middot; IV</span><b>' + d.ceLtp + " &middot; " + d.ceIv + "</b></div>" +
        '<div class="rt-row" style="margin-top:6px;padding-top:5px;border-top:1px solid var(--line)">' +
          '<span style="color:var(--puts)">Put OI</span><b>' + d.peOi + "L</b></div>" +
        '<div class="rt-row"><span class="' + (d.peUp ? "pos" : "neg") + '">chg OI</span><b class="' +
          (d.peUp ? "pos" : "neg") + '">' + d.peChg + "L</b></div>" +
        '<div class="rt-row"><span style="color:var(--ink-3)">LTP &middot; IV</span><b>' + d.peLtp + " &middot; " + d.peIv + "</b></div>" +
        '<div class="rt-row" style="margin-top:6px;padding-top:5px;border-top:1px solid var(--line)">' +
          '<span style="color:var(--ink-3)">Strike PCR</span><b>' + d.pcr + "</b></div>";
      tip.style.left = ev.clientX + "px";
      tip.style.top = ev.clientY + "px";
      tip.classList.add("live");
    });
    el.addEventListener("mouseleave", function () { tip.classList.remove("live"); });
  }

  function attachHovers() {
    var root = document.getElementById("content");
    Array.prototype.forEach.call(root.querySelectorAll(".rb"), attachRangeHover);
    decorateTerms(root);
    Array.prototype.forEach.call(root.querySelectorAll(".ch-wrap"), attachChartHover);
    Array.prototype.forEach.call(root.querySelectorAll("[data-rung]"), attachRungHover);
  }

  /* Put the money in the middle of the viewport, not at whichever end the
     sort happened to leave it. Scroll position is set without animation so
     the view never appears to jump on load. */
  function centreOnAtm() {
    var root = document.getElementById("content");
    Array.prototype.forEach.call(
      root.querySelectorAll(".tablewrap.tall, .ladder-wrap.tall"),
      function (box) {
        var mark = box.querySelector("[data-atm], tr.atm, .rung.spot");
        if (!mark) return;
        var target = mark.offsetTop - box.clientHeight / 2 + mark.offsetHeight / 2;
        box.scrollTop = Math.max(0, target);
      }
    );
  }

  /* "09-Nov-2026" -> "06 Nov": the last weekday before expiry. Exchange
     holidays are not known here, so this is the weekday, not a calendar
     guarantee. Returns "" if the date cannot be read. */
  function sessionBeforeExpiry(expiry) {
    var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
               "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    var p = /^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/.exec(String(expiry || ""));
    if (!p) return "";
    var mi = MON.indexOf(p[2].charAt(0).toUpperCase() + p[2].slice(1).toLowerCase());
    if (mi < 0) return "";
    var d = new Date(Date.UTC(+p[3], mi, +p[1]));
    do { d.setUTCDate(d.getUTCDate() - 1); } while (d.getUTCDay() === 0 || d.getUTCDay() === 6);
    return (d.getUTCDate() < 10 ? "0" : "") + d.getUTCDate() + " " + MON[d.getUTCMonth()];
  }

  function render() {
    var m = MODEL[state.idx];
    if (!m) return;
    DTE = m.dte;
    TT = m.t;
    renderChrome();
    paintLiveStamp();
    /* Old Nifty sub-tab keys (saved links, in-page buttons) land on their new tab. */
    if (state.page === "india-index" && NFX_ALIAS[state.view]) state.view = NFX_ALIAS[state.view];
    if (state.page === "india-index" && !RENDER[state.view]) state.view = "today";
    navWriteHash();
    var renderer = state.page === "india-index" ? RENDER[state.view] : RENDER[state.page];
    document.getElementById("content").innerHTML = renderer(m);
    attachHovers();
    centreOnAtm();
  }

  /* Rendered once at boot and left alone. It must not depend on the active
     index or tab -- that is the whole point of it. */
  function renderStrip() {
    var el = document.getElementById("strip");
    var visible = STRIP.filter(function (s) { return s.name === "NIFTY 50"; });
    if (!visible.length) { el.parentNode.style.display = "none"; return; }

    /* Grouped, with a divider between families, so 25+ indices stay
       scannable instead of reading as one undifferentiated run. */
    var lastGroup = null;
    el.innerHTML = visible.map(function (s) {
      var sep = (s.group && s.group !== lastGroup && lastGroup !== null)
        ? '<div class="si-sep" aria-hidden="true"></div>' : "";
      if (s.group) lastGroup = s.group;
      return sep + siCell(s);
    }).join("");
    decorateTerms(el);
  }

  function siCellAll() { return null; }

  function siCell(s) {
    return (function (s) {
      var isVix = s.name === "INDIA VIX";
      /* GIFT and the USD index trade outside NSE hours, so their timestamp
         runs ahead of the rest. Flag them rather than let the mismatch look
         like a bug. */
      var offHours = s.source !== "allIndices";

      /* Gold and crude are shown in the unit India trades them in: a
         dollar-per-ounce number is one conversion away from every decision
         taken against it. The percentage then carries the rupee's move as
         well as the commodity's, which is why USD/INR sits on the same
         strip -- it shows how much of the move is which. */
      var inRupees = s.inr != null;
      var shownPct = inRupees ? s.inrChgPct : s.chgPct;
      var dirClass = isVix ? cls(-(shownPct || 0)) : cls(shownPct);
      var arrow = (shownPct || 0) >= 0 ? "&#9650;" : "&#9660;";
      var money = function (v) {
        return "\u20b9" + (Math.abs(v) >= 1000 ? n0(v) : n2(v));
      };

      /* Only rows with a stored series are clickable. The indices come
         from charts.json; gold, silver, crude, Brent and WTI arrive with
         metoil.json and are merged into the same store before the strip
         renders. Anything else on the strip has no series and says so. */
      var charted = !!(CHARTS && CHARTS[s.name]);

      var title = s.label + "  " +
        (inRupees ? money(s.inr) + " " + (s.inrUnit || "") + "\n" +
                    n2(s.last) + " " + (s.unit || "") + ", settlement basis"
                  : n2(s.last) + (s.unit ? " " + s.unit : "")) +
        (s.open != null ? "\nO " + n2(s.open) + "  H " + n2(s.high) +
                          "  L " + n2(s.low) + "  PC " + n2(s.prevClose) : "") +
        (s.ts ? "\nsettled " + s.ts : "") +
        (s.live != null ? "\nlast trade " + n2(s.live) +
                          (s.liveTs ? " at " + s.liveTs : "") : "") +
        (inRupees && s.group !== "MCX"
          ? "\nInternational price at the spot rate, not MCX."
          : inRupees ? "\nMCX front contract, exchange settlement." : "");

      return '<div class="si' + (offHours ? " si-alt" : "") +
        (charted ? '" data-chart="' + esc(s.name) : '" data-nochart="1') +
        '" title="' + esc(title) + (charted ? " &mdash; click for chart" : "") + "\">" +
        '<div class="si-k">' + (offHours ? '<span class="si-live"></span>' : "") +
          esc(s.label) +
          (inRupees ? '<i class="si-u">' + esc(s.inrUnit || "") + "</i>" : "") + "</div>" +
        '<div class="si-v">' + (inRupees ? money(s.inr) : n2(s.last)) + "</div>" +
        '<div class="si-c ' + dirClass + '">' + arrow + " " +
          (inRupees ? sgn(shownPct, 2) + "%"
                    : sgn(s.chg, 2) + "  " + sgn(s.chgPct, 2) + "%") +
        "</div>" +
      "</div>";
    })(s);
  }

  /* ==========================================================
     6g. CANDLESTICK OVERLAY
         TradingView's lightweight-charts, vendored locally so
         the page has no CDN dependency. Created on first open
         and reused -- building a chart per click leaks.
     ========================================================== */
  var CHARTS = {};
  var CKS = { chart: null, candles: null, vol: null, series: null,
             name: null, range: 120 };

  /* Bar counts, except year-to-date, which is a date. 1D is left out
     deliberately: on a daily series it is one row and one candle, which
     is a worse answer than the five-day step next to it. */
  var CK_RANGES = [
    { label: "5D", n: 5 }, { label: "1M", n: 22 }, { label: "3M", n: 66 },
    { label: "6M", n: 132 }, { label: "YTD", n: -1 }, { label: "1Y", n: 252 },
    { label: "All", n: 0 }
  ];

  /* The one place a range turns into bars. Both the candles and the table
     read it, so they cannot drift apart. */
  function barsForRange(bars) {
    if (!bars || !bars.length) return [];
    if (CKS.range === -1) {
      var year = String(bars[bars.length - 1].t).slice(0, 4);
      return bars.filter(function (b) { return String(b.t) >= year + "-01-01"; });
    }
    return CKS.range > 0 ? bars.slice(-CKS.range) : bars;
  }

  /* The strip uses NSE names ("NIFTY BANK"); tabs use our keys ("NIFTY").
     Both must resolve to the same series. */
  function resolveSeries(name) {
    if (CHARTS[name]) return name;
    var up = String(name).toUpperCase();
    var hit = Object.keys(CHARTS).filter(function (k) {
      return k.toUpperCase() === up;
    })[0];
    if (hit) return hit;
    var m = MODEL[name];
    if (m && CHARTS[m.cfg.label]) return m.cfg.label;
    return null;
  }

  function ckTheme() {
    var cs = getComputedStyle(document.documentElement);
    var g = function (v) { return cs.getPropertyValue(v).trim(); };
    return {
      layout: { background: { color: g("--surface") }, textColor: g("--ink-2"),
                fontFamily: g("--font-num") || "monospace", fontSize: 10 },
      grid: { vertLines: { color: g("--line-soft") },
              horzLines: { color: g("--line-soft") } },
      crosshair: { mode: 0,
                   vertLine: { color: g("--ink-3"), width: 1, style: 2, labelBackgroundColor: g("--surface-3") },
                   horzLine: { color: g("--ink-3"), width: 1, style: 2, labelBackgroundColor: g("--surface-3") } },
      rightPriceScale: { borderColor: g("--line") },
      timeScale: { borderColor: g("--line"), rightOffset: 4 },
      handleScroll: true, handleScale: true
    };
  }

  function openChart(name) {
    var key = resolveSeries(name);
    var panel = document.getElementById("ckPanel");
    var scrim = document.getElementById("ckScrim");
    var chartEl = document.getElementById("ckChart");
    var tip = document.getElementById("ckTip");

    panel.classList.add("open");
    scrim.classList.add("open");

    if (typeof LightweightCharts === "undefined") {
      chartEl.innerHTML = '<div class="ck-empty"><b>Chart library not loaded.</b><br>' +
        "web/vendor/lightweight-charts.js is missing.</div>";
      return;
    }
    if (!key || !CHARTS[key] || CHARTS[key].length < 2) {
      chartEl.innerHTML = '<div class="ck-empty"><b>No price history stored for ' +
        esc(name) + ".</b><br>Run <em>python backfill_indices.py</em>.</div>";
      return;
    }

    CKS.name = key;
    var bars = CHARTS[key];
    CKS.bars = bars;
    /* A new series opens on its chart. The table is a thing you ask
       for, and asking is one click. */
    ckMenuOpen = false;
    ckToggleTable(false);

    document.getElementById("ckName").textContent = key;
    var last = bars[bars.length - 1], prev = bars[bars.length - 2];
    var chg = last.c - prev.c, chgP = chg / prev.c * 100;
    document.getElementById("ckLast").textContent = n2(last.c);
    var chgEl = document.getElementById("ckChg");
    chgEl.className = "ck-chg " + cls(chg);
    chgEl.textContent = sgn(chg, 2) + "  " + sgn(chgP, 2) + "%";
    document.getElementById("ckMeta").textContent =
      bars.length + " sessions  &middot;  " + bars[0].t + " &rarr; " + last.t;

    document.getElementById("ckRanges").innerHTML = CK_RANGES.map(function (r) {
      return '<button class="ck-r" data-ckr="' + r.n + '" aria-selected="' +
        (r.n === CKS.range) + '">' + r.label + "</button>";
    }).join("");

    if (!CKS.chart) {
      chartEl.innerHTML = "";
      CKS.chart = LightweightCharts.createChart(chartEl, ckTheme());
      CKS.candles = CKS.chart.addCandlestickSeries({
        upColor: "#26a69a", downColor: "#ef5350",
        borderUpColor: "#26a69a", borderDownColor: "#ef5350",
        wickUpColor: "#26a69a", wickDownColor: "#ef5350"
      });
      CKS.vol = CKS.chart.addHistogramSeries({
        priceFormat: { type: "volume" }, priceScaleId: "vol",
        color: "rgba(120,140,160,.4)"
      });
      CKS.chart.priceScale("vol").applyOptions({
        scaleMargins: { top: 0.82, bottom: 0 }
      });

      CKS.chart.subscribeCrosshairMove(function (p) {
        if (!p || !p.time || !p.seriesData) { tip.hidden = true; return; }
        var d = p.seriesData.get(CKS.candles);
        if (!d) { tip.hidden = true; return; }
        var v = p.seriesData.get(CKS.vol);
        var up = d.close >= d.open;
        tip.hidden = false;
        tip.innerHTML =
          '<div class="ck-tip-date">' + esc(String(d.time)) + "</div>" +
          '<div class="ck-tip-big ' + (up ? "pos" : "neg") + '">' + n2(d.close) + "</div>" +
          '<div class="ck-tip-grid">' +
            "<span>Open</span><b>" + n2(d.open) + "</b>" +
            "<span>High</span><b>" + n2(d.high) + "</b>" +
            "<span>Low</span><b>" + n2(d.low) + "</b>" +
            "<span>Close</span><b>" + n2(d.close) + "</b>" +
          "</div>" +
          (v && v.value ? '<div class="ck-tip-vol">Volume ' +
            n1(v.value / 1e7) + " Cr shares</div>" : "");
      });

      window.addEventListener("resize", function () {
        if (CKS.chart) CKS.chart.applyOptions({
          width: chartEl.clientWidth, height: chartEl.clientHeight
        });
      });
    }

    applyRange(bars);
  }


  /* Fifty names at ~250 sessions is the largest payload the desk has, so
     it is fetched on first use rather than at boot. Everything else on the
     page is already usable while this is still in flight. */
  var SCHARTS = null;

  function loadStockCharts() {
    if (SCHARTS) return SCHARTS;
    SCHARTS = getJson("stockcharts.json").then(function (d) {
      var series = (d && d.series) || {};
      Object.keys(series).forEach(function (k) {
        /* Never shadow an index. If a constituent ever shares a name with
           a traded index, the index is the one the tabs resolve to. */
        if (!CHARTS[k]) CHARTS[k] = series[k];
      });
      return series;
    }).catch(function () { return {}; });
    return SCHARTS;
  }

  /* A constituent opens into the same panel an index does: same candles,
     same ranges, same tooltip. The only difference is that its history has
     to arrive first. */
  function openStock(sym) {
    var chartEl = document.getElementById("ckChart");
    document.getElementById("ckPanel").classList.add("open");
    document.getElementById("ckScrim").classList.add("open");
    document.getElementById("ckName").textContent = sym;
    document.getElementById("ckMeta").textContent = "loading daily history\u2026";
    if (chartEl && !CHARTS[sym]) chartEl.innerHTML = "";

    loadStockCharts().then(function () {
      if (!CHARTS[sym]) {
        document.getElementById("ckMeta").textContent =
          "no daily history stored";
        chartEl.innerHTML = '<div class="ck-empty"><b>No daily history for ' +
          esc(sym) + ".</b><br>Run <em>python stock_history.py</em> to " +
          "fetch it from the exchange archive.</div>";
        renderCkTable(null);
        return;
      }
      openChart(sym);
    });
  }

  /* Four columns are wanted by everyone and the fifth differs by person,
     so the rest are opt-in. A moving average is computed here rather than
     stored: it is a function of the closes already in hand, and storing it
     would mean storing one column per window anybody ever asks for. */
  var CK_COLS = [
    { k: "t",     label: "Date",      base: true,  lft: true },
    { k: "o",     label: "Open",      base: true },
    { k: "h",     label: "High",      base: true },
    { k: "l",     label: "Low",       base: true },
    { k: "c",     label: "Close",     base: true,  bold: true },
    { k: "chg",   label: "Chg",       tone: true },
    { k: "chgp",  label: "Chg %",     tone: true, pct: true },
    { k: "range", label: "Day range" },
    { k: "v",     label: "Volume" },
    { k: "to",    label: "Turnover" },
    { k: "ema20", label: "EMA 20" },
    { k: "ema40", label: "EMA 40" },
    { k: "sma50", label: "SMA 50" }
  ];

  var ckCols = { chg: true, chgp: true };   /* which optional ones are on */
  var ckMenuOpen = false;

  function ckActive() {
    return CK_COLS.filter(function (c) { return c.base || ckCols[c.k]; });
  }

  /* Averages need the bars before the window as well as the bars shown, so
     they are computed over the whole series and read by date. Computing
     them over the visible slice would make a 20-day average change every
     time the range button moved, which is the classic version of this bug. */
  function ckDerive(bars) {
    var by = {}, ema20 = null, ema40 = null;
    var k20 = 2 / 21, k40 = 2 / 41;
    for (var i = 0; i < bars.length; i++) {
      var b = bars[i], c = b.c;
      if (c == null) { by[b.t] = {}; continue; }
      ema20 = ema20 == null ? c : c * k20 + ema20 * (1 - k20);
      ema40 = ema40 == null ? c : c * k40 + ema40 * (1 - k40);
      var sma50 = null;
      if (i >= 49) {
        var s = 0, ok = true;
        for (var j = i - 49; j <= i; j++) {
          if (bars[j].c == null) { ok = false; break; }
          s += bars[j].c;
        }
        if (ok) sma50 = s / 50;
      }
      var prev = i > 0 ? bars[i - 1].c : null;
      by[b.t] = {
        ema20: ema20, ema40: ema40, sma50: sma50,
        chg: prev == null ? null : c - prev,
        chgp: prev ? (c - prev) / prev * 100 : null,
        range: b.h != null && b.l != null ? b.h - b.l : null
      };
    }
    return by;
  }

  function ckCell(b, d, col) {
    if (col.k === "t") return b.t;
    if (col.k === "v") return b.v ? n0(b.v / 1e5) + "L" : null;
    if (col.k === "to") return b.to ? n2(b.to / 1e7) : null;
    var v = col.k in d ? d[col.k] : b[col.k];
    if (v == null) return null;
    if (col.pct) return sgn(v, 2) + "%";
    if (col.tone) return sgn(v, 2);
    return n2(v);
  }

  /* The chart answers "what shape"; the table answers "what happened on
     the eleventh". Both are wanted, and a chart alone sends you looking
     for the numbers somewhere else. */
  function renderCkTable(bars) {
    var el = document.getElementById("ckTable");
    if (!el) return;
    if (!bars || !bars.length) { el.innerHTML = ""; return; }
    CKS.bars = bars;

    var derived = ckDerive(bars);
    var use = barsForRange(bars).slice().reverse();
    var cols = ckActive();

    var head = cols.map(function (c) {
      return "<th" + (c.lft ? ' class="lft"' : "") + ">" + c.label + "</th>";
    }).join("");

    var body = use.map(function (b) {
      var d = derived[b.t] || {};
      return "<tr>" + cols.map(function (c) {
        var txt = ckCell(b, d, c);
        var klass = c.lft ? "lft" : c.tone ? cls(d[c.k]) : "";
        return "<td" + (klass ? ' class="' + klass + '"' : "") + ">" +
          (txt == null ? "\u2014" : c.bold ? "<b>" + txt + "</b>" : txt) +
          "</td>";
      }).join("") + "</tr>";
    }).join("");

    el.innerHTML =
      '<div class="ck-tbl-bar">' +
        '<span class="ck-tbl-name">' + esc(CKS.name || "") + "</span>" +
        '<button class="ck-tbl-btn" type="button" data-ckcopy="1">Copy</button>' +
        '<button class="ck-tbl-btn" type="button" data-ckdl="1">Download</button>' +
        '<span class="ck-cols">' +
          '<button class="ck-tbl-btn" type="button" data-ckcols="1" ' +
            'aria-expanded="' + ckMenuOpen + '">+ Additional columns</button>' +
          '<span class="ck-colmenu"' + (ckMenuOpen ? "" : " hidden") + ">" +
            CK_COLS.filter(function (c) { return !c.base; }).map(function (c) {
              var on = !!ckCols[c.k];
              return '<button class="ck-col" type="button" data-ckcol="' + c.k +
                '" aria-pressed="' + on + '"><span class="tick">' +
                (on ? "\u2713" : "") + "</span>" + c.label + "</button>";
            }).join("") +
          "</span>" +
        "</span>" +
        '<span class="ck-tbl-n">' + use.length + " sessions \u00b7 newest first" +
          (ckCols.to ? " \u00b7 turnover in \u20b9 crore" : "") + "</span>" +
        '<button class="xbtn" type="button" data-cktbl="close" ' +
          'aria-label="Close data table">&times;</button>' +
      "</div>" +
      '<table class="dt"><thead><tr>' + head + "</tr></thead><tbody>" +
      body + "</tbody></table>";
    decorateTerms(el);
  }

  /* Tab-separated, so it lands in a spreadsheet as columns rather than as
     one long string in the first cell. */
  function ckTableText() {
    var bars = CKS.bars || [];
    if (!bars.length) return "";
    var derived = ckDerive(bars), cols = ckActive();
    var lines = [cols.map(function (c) { return c.label; }).join("\t")];
    barsForRange(bars).slice().reverse().forEach(function (b) {
      var d = derived[b.t] || {};
      lines.push(cols.map(function (c) {
        var raw = c.k === "t" ? b.t
          : c.k in d ? d[c.k]
          : b[c.k];
        return raw == null ? "" : typeof raw === "number" ? raw.toFixed(2) : raw;
      }).join("\t"));
    });
    return lines.join("\n");
  }

  function ckFlash(sel, word) {
    var b = document.querySelector(sel);
    if (!b) return;
    var was = b.textContent;
    b.textContent = word;
    b.classList.add("done");
    setTimeout(function () {
      b.textContent = was;
      b.classList.remove("done");
    }, 1400);
  }

  function ckCopy() {
    var text = ckTableText();
    if (!text) return;
    var done = function () { ckFlash("[data-ckcopy]", "Copied"); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, ckCopyFallback);
      return;
    }
    ckCopyFallback();

    /* file:// and plain http have no clipboard API, and the desk is opened
       both ways. The old selection trick still works in both. */
    function ckCopyFallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { /* nothing to offer */ }
      document.body.removeChild(ta);
    }
  }

  function ckDownload() {
    var text = ckTableText();
    if (!text) return;
    var csv = text.split("\n").map(function (line) {
      return line.split("\t").map(function (cell) {
        return /[",\n]/.test(cell) ? '"' + cell.replace(/"/g, '""') + '"' : cell;
      }).join(",");
    }).join("\n");
    var url = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    var a = document.createElement("a");
    a.href = url;
    a.download = (CKS.name || "series").replace(/[^\w.-]+/g, "_") + "-daily.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    ckFlash("[data-ckdl]", "Saved");
  }

  function ckToggleTable(force) {
    var el = document.getElementById("ckTable");
    var btn = document.getElementById("ckTblBtn");
    var show = force == null ? el.hidden : force;
    el.hidden = !show;
    if (btn) btn.setAttribute("aria-pressed", String(show));
    if (show && CKS.bars) renderCkTable(CKS.bars);
  }

  function applyRange(bars) {
    var use = barsForRange(bars);
    CKS.bars = bars;
    CKS.candles.setData(use.map(function (b) {
      return { time: b.t, open: b.o, high: b.h, low: b.l, close: b.c };
    }).filter(function (b) {
      return b.open != null && b.high != null && b.low != null && b.close != null;
    }));
    CKS.vol.setData(use.filter(function (b) { return b.v; }).map(function (b) {
      return { time: b.t, value: b.v,
               color: b.c >= b.o ? "rgba(38,166,154,.35)" : "rgba(239,83,80,.35)" };
    }));
    CKS.chart.timeScale().fitContent();
    var el = document.getElementById("ckChart");
    CKS.chart.applyOptions({ width: el.clientWidth, height: el.clientHeight });
    if (!document.getElementById("ckTable").hidden) renderCkTable(bars);
  }

  function closeChart() {
    var t = document.getElementById("ckTable");
    if (t) t.innerHTML = "";
    document.getElementById("ckPanel").classList.remove("open");
    document.getElementById("ckScrim").classList.remove("open");
    document.getElementById("ckTip").hidden = true;
  }

  /* ==========================================================
     6h. LIVE POLLING
         live.json is written by live.py during market hours and
         is entirely separate from the EOD snapshot. If it is
         absent or stale the page falls back to EOD and says so
         -- it never presents old numbers as current.
     ========================================================== */
  var LIVE = null;
  var LIVE_TIMER = null;
  var CLOCK_TIMER = null;
  /* live.json is a local file, so reading it costs nothing -- poll it fast
     so a new value appears the moment the poller writes one. The upstream
     limit is NSE's own ~60s cache, not this. */
  var LIVE_EVERY = 2000;
  var STALE_AFTER = 180000;   /* 3 min without a new tick = stale */
  var PREV_VALS = {};         /* for change flashing */

  function liveAgeMs() {
    if (!LIVE || !LIVE.ts) return Infinity;
    var t = Date.parse(LIVE.ts);
    return isFinite(t) ? (Date.now() - t) : Infinity;
  }

  function liveState() {
    if (!LIVE) return { cls: "closed", text: "EOD" };

    /* A live file left over from an earlier session is not "stale data from
       today" -- it is a session we never captured. Comparing its trade date
       against the settled one distinguishes the two, instead of reporting
       "stale 2880m" and implying the feed is merely lagging. */
    var m = MODEL[state.idx];
    if (m && LIVE.tradeDate && m.tradeDate && LIVE.tradeDate < m.tradeDate) {
      return { cls: "closed", text: "EOD" };
    }

    var age = liveAgeMs();
    var st = LIVE.state;
    if (st === "open" || st === "pre-open" || st === "closing") {
      return age > STALE_AFTER
        ? { cls: "stale", text: "stale " + Math.round(age / 60000) + "m" }
        : { cls: "", text: st === "open" ? "Live" : st };
    }
    return { cls: "closed", text: "Closed" };
  }

  function pollLive() {
    getJson("live.json").then(function (d) {
      if (!d || !d.ts) return;
      var isNew = !LIVE || LIVE.ts !== d.ts;
      LIVE = d;

      /* Only let the live feed drive the strip when it is at least as
         current as the settled data. A live file left over from an earlier
         session was overwriting today's closes with the previous day's
         intraday prints -- the strip read 24,154.90 while the Overview
         beneath it read 24,078.30, and both were "correct" for different
         days. Stale live data is worse than none. */
      var m0 = MODEL[state.idx];
      var liveIsCurrent = !m0 || !d.tradeDate || !m0.tradeDate
                          || d.tradeDate >= m0.tradeDate;

      if (liveIsCurrent && d.strip && d.strip.length) {
        STRIP = preferNewerOffHours(d.strip);
        renderStrip();
        if (isNew) flashChanges();
      }
      paintLiveStamp();
    }).catch(function () {
      /* live.py not running -- the EOD snapshot stays on screen. */
    });
  }

  /* GIFT Nifty and NIFTY50 USD trade outside NSE hours, so the settled
     snapshot and the live file each carry their own copy, and either can be
     the newer one. Taking the live strip wholesale meant a live file left
     over from the afternoon (GIFT 23,452 at 15:14) hid a snapshot refreshed
     overnight (GIFT 23,575 at 02:29). Index rows still follow the live feed;
     these rows follow whichever copy NSE stamped later. */
  var NSE_MONTHS = { JAN: 0, FEB: 1, MAR: 2, APR: 3, MAY: 4, JUN: 5,
                     JUL: 6, AUG: 7, SEP: 8, OCT: 9, NOV: 10, DEC: 11 };

  /* NSE writes "12-Sep-2026 02:29". Some engines parse that and some do
     not, so it is read by hand rather than trusted to Date.parse. */
  function parseNseStamp(s) {
    var m = /^(\d{1,2})-([A-Za-z]{3})-(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/.exec(String(s || ""));
    if (!m) return -Infinity;
    var mon = NSE_MONTHS[m[2].toUpperCase()];
    if (mon === undefined) return -Infinity;
    return Date.UTC(+m[3], mon, +m[1], +(m[4] || 0), +(m[5] || 0));
  }

  function preferNewerOffHours(strip) {
    if (!STRIP_EOD.length) return strip;

    /* Walk the exported strip, not the live one, so the order the export
       chose survives the merge. The live feed carries only NSE indices, so
       merging the other way appended the commodities to the end of the strip
       the moment the poller started. */
    var liveBy = {};
    strip.forEach(function (r) { liveBy[r.name] = r; });

    var out = [], used = {};
    STRIP_EOD.forEach(function (e) {
      used[e.name] = true;
      var l = liveBy[e.name];
      if (!l) { out.push(e); return; }
      if (l.source === "allIndices") { out.push(l); return; }
      /* GIFT Nifty and NIFTY50 USD exist in both files; each carries its own
         NSE timestamp, and either copy can be the newer one. */
      out.push(parseNseStamp(e.ts) > parseNseStamp(l.ts) ? e : l);
    });
    strip.forEach(function (r) { if (!used[r.name]) out.push(r); });
    return out;
  }

  /* A once-a-minute feed reads as dead unless the change is visible when it
     lands. Flash only the cells that actually moved. */
  function flashChanges() {
    STRIP.forEach(function (s) {
      var prev = PREV_VALS[s.name];
      PREV_VALS[s.name] = s.last;
      if (prev == null || s.last == null || prev === s.last) return;
      var cell = document.querySelector('.si[data-chart="' + cssEsc(s.name) + '"]');
      if (!cell) return;
      var dir = s.last > prev ? "flash-up" : "flash-down";
      cell.classList.remove("flash-up", "flash-down");
      void cell.offsetWidth;              /* restart the animation */
      cell.classList.add(dir);
      setTimeout(function () { cell.classList.remove(dir); }, 1400);
    });
  }

  function cssEsc(s) { return String(s).replace(/["\\]/g, "\\$&"); }

  function paintLiveStamp() {
    var m = MODEL[state.idx];
    if (!m) return;
    var st = liveState();
    var badge = '<span class="live-badge ' + st.cls + '">' +
      (st.cls === "" ? '<span class="si-pulse"></span>' : "") + esc(st.text) + "</span>";

    var extra = "";
    if (LIVE && LIVE.ts && st.cls !== "closed") {
      var secs = Math.max(0, Math.round(liveAgeMs() / 1000));
      extra = ' <span class="age">' + secs + "s ago</span>" +
              " &middot; " + esc(LIVE.ts.slice(11, 19)) + " IST";
      if (LIVE.nseTimestamp) {
        extra += ' <span class="age" title="NSE refreshes this roughly once a minute">' +
                 "NSE " + esc(LIVE.nseTimestamp.slice(-5)) + "</span>";
      }
      if (LIVE.chain && LIVE.chain[state.idx]) {
        var c = LIVE.chain[state.idx];
        extra += " &middot; spot " + n2(c.spot) +
                 (c.pcr != null ? " &middot; PCR " + n2(c.pcr) : "");
      }
    } else {
      extra = " EOD " + esc(m.tradeDate);
    }
    document.getElementById("stamp").innerHTML = badge + extra;
  }

  function startLive() {
    pollLive();
    if (LIVE_TIMER) clearInterval(LIVE_TIMER);
    LIVE_TIMER = setInterval(pollLive, LIVE_EVERY);

    /* Seconds-since-update ticks every second. It is the only way to tell a
       working feed from a dead one when the data itself moves once a
       minute -- without it, a frozen page and a calm market look identical. */
    if (CLOCK_TIMER) clearInterval(CLOCK_TIMER);
    CLOCK_TIMER = setInterval(paintLiveStamp, 1000);
  }

  function setFresh(tag, msg, state, age) {
    var bar = document.getElementById("freshness");
    bar.hidden = false;
    bar.className = "mock" + (state ? " " + state : "");
    document.getElementById("freshTag").textContent = tag;
    document.getElementById("freshMsg").textContent = msg;
    document.getElementById("freshAge").textContent = age || "";
  }

  /* The last session that should have settled by now.

     NSE publishes the day's closes well after the bell, so before the
     evening run the newest settled session is the PREVIOUS weekday.
     Holidays are not modelled -- which is why one session behind is
     reported as "check", not as stale. Two or more is unambiguous. */
  function expectedSession() {
    /* Shift the epoch by IST's offset and read it with UTC getters. Using
       local getters here double-counts the viewer's own offset -- on a
       UTC+4 machine it reported the previous session as the expected one,
       so a current desk would have shown "CHECK". */
    var ist = new Date(Date.now() + 330 * 60000);
    var d = new Date(Date.UTC(ist.getUTCFullYear(), ist.getUTCMonth(),
                              ist.getUTCDate()));
    if (ist.getUTCHours() < 18) d.setUTCDate(d.getUTCDate() - 1);
    while (d.getUTCDay() === 0 || d.getUTCDay() === 6) {
      d.setUTCDate(d.getUTCDate() - 1);
    }
    return d.toISOString().slice(0, 10);
  }

  function sessionsBetween(from, to) {
    var a = new Date(from + "T00:00:00"), b = new Date(to + "T00:00:00"), n = 0;
    while (a < b) {
      a.setDate(a.getDate() + 1);
      if (a.getDay() !== 0 && a.getDay() !== 6) n++;
    }
    return n;
  }

  function freshness(m, man) {
    var want = expectedSession();
    var have = m.tradeDate || "";
    var behind = have && have < want ? sessionsBetween(have, want) : 0;

    var gen = (man && man.generatedAt) || "";
    var age = "";
    if (gen) {
      var mins = Math.round((Date.now() - new Date(gen).getTime()) / 60000);
      age = mins < 0 ? "just now"
          : mins < 60 ? "updated " + mins + "m ago"
          : mins < 1440 ? "updated " + Math.round(mins / 60) + "h ago"
          : "updated " + Math.round(mins / 1440) + "d ago";
    }

    var tag, state, msg;
    if (!have) {
      tag = "NO DATA"; state = "stale"; msg = "The snapshot has no trade date.";
    } else if (behind === 0) {
      tag = "UP TO DATE"; state = "ok";
      msg = "Data through " + have + ", the latest settled session.";
    } else if (behind === 1) {
      tag = "CHECK"; state = "warn";
      msg = "Data through " + have + "; " + want + " is not in yet. Normal on a " +
            "holiday or before the evening run, otherwise run  ./desk.sh";
    } else {
      tag = "STALE"; state = "stale";
      msg = "Data through " + have + " \u2014 " + behind +
            " sessions behind " + want + ". Run  ./desk.sh";
    }
    msg += "  \u00b7  " + m.sessionsStored + " sessions stored";
    return { tag: tag, state: state, msg: msg, age: age };
  }

  function boot() {
    setFresh("Loading", "Reading snapshot&hellip;");
    getJson("manifest.json").then(function (man) {
      MANIFEST = man;
      var keys = man.indices || [];
      if (!keys.length) throw new Error("manifest lists no indices");
      return Promise.all(keys.map(function (k) {
        return getJson(k.toLowerCase() + ".json");
      }));
    }).then(function (arr) {
      arr.forEach(function (d) {
        MODEL[d.index] = normalise(d);
        INDICES.push({ key: d.index, label: d.label });
      });
      return Promise.all([
        getJson("accuracy.json").catch(function () { return {}; }),
        getJson("market.json").catch(function () { return { strip: [] }; }),
        getJson("watchlist.json").catch(function () { return { lists: [] }; }),
        getJson("charts.json").catch(function () { return { series: {} }; }),
        getJson("history.json").catch(function () { return {}; }),
        getJson("stocks.json").catch(function () { return {}; }),
        getJson("techfund.json").catch(function () { return {}; }),
        getJson("metoil.json").catch(function () { return {}; }),
        getJson("international.json").catch(function () { return { items: [] }; })
      ]);
    }).then(function (both) {
      var acc = both[0], mkt = both[1], wl = both[2], ch = both[3],
          mh = both[4], stk = both[5], tf = both[6];
      ACCURACY = acc || {};
      STRIP = (mkt && mkt.strip) || [];
      STRIP_EOD = STRIP.slice();
      WATCH = (wl && wl.lists) || [];
      CHARTS = (ch && ch.series) || {};
      MHIST = mh || {};
      STOCKS = stk || {};
      TECHFUND = tf || {};
      METOIL = both[7] || {};
      INTERNATIONAL = both[8] || {};
      /* The MCX and crude series ride into the same chart store as the
         indices, so the strip cells for GOLD, SILVER, CRUDE, BRENT and
         WTI open the candlestick viewer like any index. Merged before
         the strip renders, because the strip is rendered once. */
      Object.keys((METOIL && METOIL.charts) || {}).forEach(function (k) {
        if (!CHARTS[k]) CHARTS[k] = METOIL.charts[k];
      });
      if (WATCH.length) state.wl = WATCH[0].id;
      state.idx = INDICES[0].key;
      renderStrip();
      render();
      startLive();
      /* Analysis loads on its own so a missing file costs only its cards. */
      getJson("analysis.json").then(function (a) {
        ANALYSIS = a || {};
        if (["international", "energy-index", "metal-index"].indexOf(state.page) >= 0) render();
      }).catch(function () { ANALYSIS = {}; });
      getJson("brief.json").then(function (b) {
        BRIEF = b || {};
        if (state.page === "market-overview") render();
      }).catch(function () { BRIEF = {}; });
      var m = MODEL[state.idx];
      var fr = freshness(m, MANIFEST);
      setFresh(fr.tag, fr.msg, fr.state, fr.age);
    }).catch(function (err) {
      setFresh("NO DATA", "Could not read the snapshot (" + err.message +
        "). Run  ./desk.sh  then reload.", "stale", "");
    });
  }

  /* ==========================================================
     7. STRIKE DRAWER
     ========================================================== */
  function legBlock(name, leg, color, m) {
    var b = classify(leg.chgPct, leg.chgOi);
    /* The chain endpoint carries LTP, change and prev close -- not per-contract
       OHLC. Showing four copies of LTP under an OHLC heading would be inventing
       data, so the real four are shown instead. True per-leg OHLC needs the F&O
       bhavcopy, which is a separate source. */
    var hasOhlc = leg.o != null && leg.h != null && leg.l != null && leg.c != null;
    var cells = hasOhlc
      ? [["OPEN", n2(leg.o)], ["HIGH", n2(leg.h)], ["LOW", n2(leg.l)], ["CLOSE", n2(leg.c)]]
      : [["LTP", n2(leg.ltp)], ["PREV", n2(leg.prevClose)],
         ["CHG", sgn(leg.chg, 2)], ["CHG %", sgn(leg.chgPct, 2) + "%"]];

    return '<div class="leg-hd" style="color:' + color + '"><span class="bar" style="background:' + color + '"></span>' +
      name +
      (hasOhlc ? "" : '<span style="margin-left:auto;font-size:9px;letter-spacing:.08em;' +
        'color:var(--ink-3)">no per-contract OHLC in live feed</span>') +
      '</div>' +
      '<div class="ohlc-row">' +
      cells.map(function (c) {
        return '<div class="ohlc-cell"><div class="ohlc-k">' + c[0] +
          '</div><div class="ohlc-v">' + c[1] + "</div></div>";
      }).join("") + "</div>" +
      '<div class="leg-grid">' +
      lgc("LTP", n2(leg.ltp)) +
      lgc("Chg", '<span class="' + cls(leg.chgPct) + '">' + sgn(leg.chgPct, 2) + "%</span>") +
      lgc("Prev close", n2(leg.prevClose)) +
      lgc(leg.settle != null ? "Settlement" : "Bid / Ask",
          leg.settle != null ? n2(leg.settle) : n2(leg.bid) + " / " + n2(leg.ask)) +
      lgc("Open interest", n2(leg.oi) + " L") +
      lgc("Chg in OI", '<span class="' + cls(leg.chgOi) + '">' + sgn(leg.chgOi, 2) + " L</span>") +
      lgc("Volume", n1(leg.vol) + " L") +
      lgc("Implied vol", n2(leg.iv) + " %") +
      lgc("Turnover", "\u20b9" + n1(leg.turnover) + " Cr") +
      lgc("Action", '<span class="pill ' + b.c + '">' + b.t + "</span>") +
      "</div>";
  }
  function lgc(k, v) { return '<div class="lg"><div class="lg-k">' + k + '</div><div class="lg-v">' + v + "</div></div>"; }

  function openDrawer(strike) {
    var m = MODEL[state.idx];
    var r = m.rows.filter(function (x) { return x.strike === strike; })[0];
    if (!r) return;
    state.strike = strike;

    var moneyness = strike < m.cfg.spot ? "Call ITM \u00b7 Put OTM" :
                    strike > m.cfg.spot ? "Call OTM \u00b7 Put ITM" : "At the money";
    var tags = [];
    if (strike === m.callWall) tags.push("heaviest call wall");
    if (strike === m.putWall) tags.push("heaviest put wall");
    if (strike === m.maxPain) tags.push("max pain strike");
    if (strike === m.atm) tags.push("nearest to spot");

    document.getElementById("drawerTitle").innerHTML = n0(strike) + " " + esc(m.cfg.label);
    document.getElementById("drawerSub").innerHTML = esc(m.cfg.expiry) + " \u00b7 lot " + m.cfg.lot + " \u00b7 " + moneyness;

    document.getElementById("drawerBody").innerHTML =
      '<div class="readout"><p>Strike is <b>' + n0(Math.abs(strike - m.cfg.spot)) + " pts " +
        (strike > m.cfg.spot ? "above" : strike < m.cfg.spot ? "below" : "from") + "</b> spot " + n2(m.cfg.spot) + "." +
        (tags.length ? " Flagged as <b>" + tags.join("</b>, <b>") + "</b>." : "") + "</p>" +
        "<p>Call OI <b>" + n2(r.ce.oi) + "L</b> vs put OI <b>" + n2(r.pe.oi) + "L</b> \u2014 strike-level PCR <b>" +
        n2(r.pe.oi / r.ce.oi) + "</b>.</p></div>" +
      legBlock("Call \u00b7 CE", r.ce, "var(--calls)", m) +
      legBlock("Put \u00b7 PE", r.pe, "var(--puts)", m);

    /* The drawer is written into its own container, so the pass that runs
       after a view render never sees it. */
    decorateTerms(document.getElementById("drawerBody"));

    document.getElementById("drawer").classList.add("open");
    document.getElementById("scrim").classList.add("open");
    document.getElementById("drawerClose").focus();
  }

  function closeDrawer() {
    document.getElementById("drawer").classList.remove("open");
    document.getElementById("scrim").classList.remove("open");
    state.strike = null;
  }

  /* ==========================================================
     8. EVENTS
     ========================================================== */
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    if (!e.target.closest) return;

    /* Everything the mouse can open, the keyboard opens too. Forwarding to
       click keeps one implementation rather than two that drift apart. */
    var act = e.target.closest("[data-term], [data-pt], [data-chart]");
    if (act) { e.preventDefault(); act.click(); return; }

    var lrn = e.target.closest("[data-lrn]");
    if (!lrn) return;
    e.preventDefault();
    lrn.classList.toggle("open");
    lrn.setAttribute("aria-expanded",
      lrn.classList.contains("open") ? "true" : "false");
  });

  document.addEventListener("click", function (e) {
    /* Anything carrying data-chart opens the candlestick view. Checked
       first so an index tab can both switch the dashboard and, on its
       chart affordance, open the chart. */
    var ch = e.target.closest("[data-chart]");
    if (ch) { openChart(ch.getAttribute("data-chart")); return; }

    var ckr = e.target.closest("[data-ckr]");
    if (ckr) {
      CKS.range = Number(ckr.getAttribute("data-ckr"));
      Array.prototype.forEach.call(
        document.getElementById("ckRanges").querySelectorAll("[data-ckr]"),
        function (b) {
          b.setAttribute("aria-selected", Number(b.getAttribute("data-ckr")) === CKS.range);
        });
      if (CKS.chart && CKS.name) applyRange(CHARTS[CKS.name]);
      return;
    }

    var page = e.target.closest("[data-page]");
    if (page) {
      state.page = page.getAttribute("data-page");
      if (state.page === "india-index") state.view = "today";
      closeDrawer();
      render();
      return;
    }

    var idx = e.target.closest("[data-idx]");
    if (idx) {
      state.idx = idx.getAttribute("data-idx");
      state.page = "india-index";
      closeDrawer();
      render();
      return;
    }

    var view = e.target.closest("[data-view]");
    if (view) {
      state.view = view.getAttribute("data-view");
      state.page = "india-index";
      closeDrawer();
      render();
      return;
    }

    var mh = e.target.closest("[data-mh]");
    if (mh) {
      var card = mh.parentNode;
      card.classList.toggle("open");
      return;
    }

    var ana = e.target.closest("[data-ana]");
    if (ana) { state.anaSym = ana.getAttribute("data-ana"); render(); return; }

    var wl = e.target.closest("[data-wl]");
    if (wl) { state.wl = wl.getAttribute("data-wl"); state.wlExpiry = 0; render(); return; }

    var we = e.target.closest("[data-wlexp]");
    if (we) { state.wlExpiry = Number(we.getAttribute("data-wlexp")); render(); return; }

    if (e.target.closest("[data-ptclose]")) { hidePoint(); return; }

    /* Checked before the label: the sort arrow sits inside the header it
       sorts, so a label-first handler would swallow every sort click. */
    var so = e.target.closest("[data-sort]");
    if (so) {
      var sk = so.getAttribute("data-sort");
      stockSort.dir = stockSort.key === sk ? -stockSort.dir : -1;
      stockSort.key = sk;
      render();
      return;
    }

    /* Before the label handler: the whole row is the control, and the
       cells inside it carry labels of their own. */
    /* The data table and its buttons. Checked before the label handler:
       these are controls, not figures. */
    var tblBtn = e.target.closest("[data-cktbl]");
    if (tblBtn) {
      ckToggleTable(tblBtn.getAttribute("data-cktbl") === "close" ? false : null);
      return;
    }
    if (e.target.closest("[data-ckcopy]")) { ckCopy(); return; }
    if (e.target.closest("[data-ckdl]")) { ckDownload(); return; }
    if (e.target.closest("[data-ckcols]")) {
      ckMenuOpen = !ckMenuOpen;
      if (CKS.bars) renderCkTable(CKS.bars);
      return;
    }
    var col = e.target.closest("[data-ckcol]");
    if (col) {
      var k = col.getAttribute("data-ckcol");
      ckCols[k] = !ckCols[k];
      /* The menu stays open: choosing columns one dialog at a time is its
         own annoyance. */
      if (CKS.bars) renderCkTable(CKS.bars);
      return;
    }

    var stk = e.target.closest("[data-stock]");
    if (stk) { openStock(stk.getAttribute("data-stock")); return; }

    var term = e.target.closest("[data-term]");
    if (term) {
      var lbl = term.getAttribute("data-term");
      /* The row that produced this label, if it brought one. */
      var cx = null, holder = e.target.closest("[data-ctx]");
      if (holder) {
        try { cx = JSON.parse(holder.getAttribute("data-ctx")); }
        catch (err) { cx = null; }
      }
      var vEl = term.querySelector(".prob-v, .struct-v, .lvl-v");
      /* A tile wraps its own value; a level row keeps it in the next cell. */
      if (!vEl && term.nextElementSibling &&
          term.nextElementSibling.classList.contains("lvl-v")) {
        vEl = term.nextElementSibling;
      }
      showTerm(lbl, vEl ? vEl.innerHTML : "", MODEL[state.idx], cx);
      return;
    }

    /* Anything drawn can hand the panel a payload. One handler, many
       emitters -- a new chart becomes clickable by adding the attribute. */
    var pt = e.target.closest("[data-pt]");
    if (pt) {
      try { showPoint(JSON.parse(pt.getAttribute("data-pt"))); }
      catch (err) { /* a malformed payload must not break the page */ }
      return;
    }

    var lrn = e.target.closest("[data-lrn]");
    if (lrn) {
      var open = lrn.classList.toggle("open");
      lrn.setAttribute("aria-expanded", open ? "true" : "false");
      return;
    }

    var lall = e.target.closest("[data-lrnall]");
    if (lall) {
      var want = lall.getAttribute("data-lrnall") === "open";
      Array.prototype.forEach.call(
        document.querySelectorAll("[data-lrn]"), function (el) {
          el.classList.toggle("open", want);
          el.setAttribute("aria-expanded", want ? "true" : "false");
        });
      return;
    }


    var st = e.target.closest("[data-strike]");
    if (st) { openDrawer(Number(st.getAttribute("data-strike"))); return; }
  });

  document.getElementById("drawerClose").addEventListener("click", closeDrawer);
  document.getElementById("scrim").addEventListener("click", closeDrawer);
  document.getElementById("ckClose").addEventListener("click", closeChart);
  document.getElementById("ckScrim").addEventListener("click", closeChart);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeDrawer(); closeChart(); }
    if (e.key === "[" && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) {
      e.preventDefault();
      toggleRail();
    }
  });

  document.getElementById("railTog").addEventListener("click", toggleRail);

  document.getElementById("themeBtn").addEventListener("click", function () {
    var root = document.documentElement, cur = root.getAttribute("data-theme");
    if (!cur) cur = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    root.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
  });

  initRail();
  if (typeof sideRegisterTerms === "function") sideRegisterTerms();   /* Buy-or-sell glossary */
  if (typeof hzRegisterTerms === "function") hzRegisterTerms();       /* Every-expiry glossary */
  if (typeof mtlRegisterTerms === "function") mtlRegisterTerms();   /* Metal Index glossary, merged before first lookup */
  if (typeof nrgRegisterTerms === "function") nrgRegisterTerms();   /* Energy Index glossary (claude-17) */
  boot();
})();
</script>
<script src="vendor/lightweight-charts.js"></script>
