  function DTL(d) {
    return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" })
            .replace(/ /g, "-").toUpperCase();
  }

  function pipeline(m) {
    var logRows = (MANIFEST.pipeline || []).filter(function (r) {
      return !r.idx || r.idx === state.idx;
    }).slice(0, 3);

    var s = logRows.map(function (r) {
      var tone = r.status === "ok" ? "ok" : r.status === "skipped" ? "idle" : "warnd";
      return [tone, esc(r.source) + (r.attempt ? " \u00b7 try " + r.attempt : ""),
              r.status === "ok" ? "OK" : r.status.charAt(0).toUpperCase() + r.status.slice(1),
              esc((r.message || "").slice(0, 60))];
    });

    var stored = m.sessionsStored || 0;
    s.push(["ok", "Option chain", "OK", m.nStrikes + " strikes \u00b7 expiry " + esc(m.cfg.expiry)]);
    s.push([stored >= 100 ? "ok" : "warnd", "History depth", stored + " / 100",
            stored >= 100 ? "window full" : "building toward window"]);
    s.push(["ok", "Store", (((MANIFEST.dbBytes || 0) / 1048576).toFixed(1)) + " MB",
            "SQLite \u00b7 E:\\Options\\data"]);

    return '<section class="card"><div class="card-hd"><h2>Fetch pipeline</h2>' +
      '<span class="sub">daily &middot; retry ladder 18:00 &rarr; 18:30 &rarr; 19:30 IST</span>' +
      '<div class="right"><span class="kpi-m">model ' + esc(MANIFEST.modelVersion || "") + "</span></div></div>" +
      '<div class="pipe">' +
      s.map(function (x) {
        return '<div class="step"><div class="step-k"><span class="dot ' + (x[0] === "ok" ? "" : x[0]) + '"></span> ' +
          x[1] + '</div><div class="step-v">' + x[2] + '</div><div class="step-m">' + x[3] + "</div></div>";
      }).join("") + "</div></section>";
  }

  /* ==========================================================
     6b. OPTION MATH &mdash; Black-Scholes probabilities, expected move,
         payoff modelling. Used by the seller's strategy view.
     ========================================================== */
  var RFR = 0.065;          /* India risk-free, approx */
  var DTE = 0, TT = 0;      /* set per render from the active index */
  var MARGIN_PCT = 0.12;    /* naked index short, SPAN+exposure approx */

  /* Normal CDF &mdash; Abramowitz & Stegun 26.2.17 */
  function normCdf(x) {
    var t = 1 / (1 + 0.2316419 * Math.abs(x));
    var d = 0.3989422804014327 * Math.exp(-x * x / 2);
    var p = d * t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 +
            t * (-1.821255978 + t * 1.330274429))));
    return x >= 0 ? 1 - p : p;
  }

  function bs(S, K, sig, t) {
    var v = sig * Math.sqrt(t);
    var d1 = (Math.log(S / K) + (RFR + sig * sig / 2) * t) / v;
    var d2 = d1 - v;
    return {
      callDelta: normCdf(d1),
      putDelta:  normCdf(d1) - 1,
      pCallItm:  normCdf(d2),
      pPutItm:   normCdf(-d2)
    };
  }

  /* One standard-deviation move implied by ATM IV over the holding period. */
  function expMove(S, ivPct, t) { return S * (ivPct / 100) * Math.sqrt(t); }

  /* The candidate scan runs in compute.py; the page only reads its verdicts.
     Recomputing here would let the dashboard and the prediction ledger
     disagree about what was recommended on a given day. */
  function candidates(m) { return m.cands || []; }

  function payoff(legs, S, lot) {
    var pl = 0;
    legs.forEach(function (l) {
      var intrinsic = l.side === "CE" ? Math.max(0, S - l.strike) : Math.max(0, l.strike - S);
      pl += l.qty * (intrinsic - l.credit);
    });
    return pl * lot;
  }

  function viewStrategy(m) {
    var c = m.cfg;
    var atmIv = m.atmIv;
    if (!atmIv || !m.sd1) {
      return '<section class="card"><div class="card-hd"><h2>Direction &amp; strategy</h2></div>' +
        '<div class="caution"><p><b>No ATM implied volatility in the last snapshot.</b> ' +
        "Every probability on this tab derives from IV, so nothing is shown rather than " +
        "something derived from a placeholder.</p></div></section>";
    }
    var sd1 = m.sd1, sd2 = sd1 * 2;
    var lo1 = m.range1[0], hi1 = m.range1[1];
    var lo2 = m.range2[0], hi2 = m.range2[1];

    var cands = candidates(m);
    var ok = cands.filter(function (x) { return x.verdict.c === "go"; });
    var bestCE = ok.filter(function (x) { return x.side === "CE"; })
                   .sort(function (a, b) { return b.rom - a.rom; })[0];
    var bestPE = ok.filter(function (x) { return x.side === "PE"; })
                   .sort(function (a, b) { return b.rom - a.rom; })[0];

    /* Regime gate: low IV means thin compensation for tail risk. */
    var lowVol = c.vix < 12.5;
    var haveBoth = bestCE && bestPE;

    /* ---- directional probabilities (at expiry, lognormal) ---- */
    var gHi = bs(c.spot, hi1, atmIv / 100, TT), gLo = bs(c.spot, lo1, atmIv / 100, TT);
    var pAbove = gHi.pCallItm, pBelow = gLo.pPutItm, pInside = 1 - pAbove - pBelow;

    /* ---- range visual domain ---- */
    var dLo = Math.min(lo2, m.putWall) * 0.998, dHi = Math.max(hi2, m.callWall) * 1.002;
    var pct = function (v) { return ((v - dLo) / (dHi - dLo) * 100).toFixed(2); };

    /* One reusable bar. `t` and `sigma` ride along as data attributes so the
       crosshair can price the probability at the cursor without re-deriving
       anything the view already knows. */
    function rangeBar(o) {
      var span = o.hi - o.lo;
      var p = function (v) { return ((v - o.lo) / span * 100).toFixed(2); };
      var marks = (o.marks || []).filter(function (k) {
        return k.v != null && k.v >= o.lo && k.v <= o.hi;
      });
      return '<div class="rb" data-lo="' + o.lo + '" data-hi="' + o.hi +
          '" data-spot="' + o.spot + '" data-sigma="' + o.sigma +
          '" data-t="' + o.t + '">' +
        '<div class="rb-band rb-2sd" style="left:' + p(o.b2[0]) + "%;width:" +
          (p(o.b2[1]) - p(o.b2[0])).toFixed(2) + '%"></div>' +
        '<div class="rb-band rb-1sd" style="left:' + p(o.b1[0]) + "%;width:" +
          (p(o.b1[1]) - p(o.b1[0])).toFixed(2) + '%"></div>' +
        marks.map(function (k) {
          return '<div class="rb-tick" style="left:' + p(k.v) + "%;background:" + k.color + '"></div>' +
            (k.label ? '<div class="rb-lab top" style="left:' + p(k.v) + '%">' + k.label + "</div>" : "");
        }).join("") +
        '<div class="rb-lab bot" style="left:' + p(o.b1[0]) + '%">' + n0(o.b1[0]) + "</div>" +
        '<div class="rb-lab bot" style="left:' + p(o.b1[1]) + '%">' + n0(o.b1[1]) + "</div>" +
        '<div class="rb-cross"></div><div class="rb-tip"></div>' +
      "</div>";
    }

    var marks = [
      { v: c.spot, color: "var(--ink)", label: "Spot " + n0(c.spot) },
      { v: m.callWall, color: "var(--calls)", label: "Call wall" },
      { v: m.putWall, color: "var(--puts)", label: "Put wall" },
      { v: m.maxPain, color: "var(--maxpain)", label: null }
    ];

    /* ---- next session ---- */
    var sdN = m.sdNext, nextBlock = "";
    if (sdN) {
      var nLo1 = c.spot - sdN, nHi1 = c.spot + sdN;
      var nLo2 = c.spot - 2 * sdN, nHi2 = c.spot + 2 * sdN;
      var nDomLo = nLo2 - sdN * 0.35, nDomHi = nHi2 + sdN * 0.35;
      var cal = m.rangeNextCalibrated;

      nextBlock =
        '<div class="bar-cap" style="padding-top:18px">Next trading session' +
          '<b>' + n0(nLo1) + " &ndash; " + n0(nHi1) + "</b>" +
          '<span class="tagx">1&sigma; &middot; 68%</span>' +
          '<span class="tagx">&plusmn;' + n0(sdN) + " pts</span>" +
          '<span class="tagx">trading-day basis</span>' +
          (cal ? '<span class="tagx" style="color:var(--maxpain);border-color:var(--maxpain)">' +
                 "calibrated " + n0(cal[0]) + "&ndash;" + n0(cal[1]) + "</span>" : "") +
        "</div>" +
        '<div class="rangebar" style="padding-top:8px">' +
        rangeBar({
          lo: nDomLo, hi: nDomHi, spot: c.spot, sigma: atmIv / 100,
          t: 1 / 252, b1: [nLo1, nHi1], b2: [nLo2, nHi2],
          marks: [{ v: c.spot, color: "var(--ink)", label: "Spot " + n0(c.spot) }]
            .concat(cal ? [{ v: cal[0], color: "var(--maxpain)", label: null },
                           { v: cal[1], color: "var(--maxpain)", label: null }] : [])
        }) + "</div>";
    }

    var rangeCard =
      '<section class="card"><div class="card-hd"><h2>Expected range</h2>' +
      '<span class="sub">ATM IV ' + n1(atmIv) + "%</span>" +
      '<div class="right"><span class="kpi-m">hover the bar for any level</span></div></div>' +
      '<div class="bar-cap" style="padding-top:16px">To expiry' +
        '<b>' + n0(lo1) + " &ndash; " + n0(hi1) + "</b>" +
        '<span class="tagx">1&sigma; &middot; 68%</span>' +
        '<span class="tagx">&plusmn;' + n0(sd1) + " pts</span>" +
        '<span class="tagx">' + DTE + " days</span>" +
      "</div>" +
      '<div class="rangebar" style="padding-top:8px">' +
      rangeBar({
        lo: dLo, hi: dHi, spot: c.spot, sigma: atmIv / 100, t: TT,
        b1: [lo1, hi1], b2: [lo2, hi2], marks: marks
      }) +
      '<div class="rb-legend">' +
        '<span><span class="swatch rb-1sd" style="width:14px"></span> 1&sigma; &middot; 68%</span>' +
        '<span><span class="swatch" style="background:var(--surface-3);width:14px"></span> 2&sigma; &middot; 95% &middot; ' + n0(lo2) + "&ndash;" + n0(hi2) + "</span>" +
        '<span><span class="swatch" style="background:var(--calls)"></span> Call wall ' + n0(m.callWall) + "</span>" +
        '<span><span class="swatch" style="background:var(--puts)"></span> Put wall ' + n0(m.putWall) + "</span>" +
        '<span><span class="swatch" style="background:var(--maxpain)"></span> Max pain ' + n0(m.maxPain) + "</span>" +
      "</div></div>" + nextBlock + "</section>";

    var probCard =
      '<section class="card"><div class="card-hd"><h2>Directional probability</h2>' +
      '<span class="sub">at expiry &middot; lognormal</span>' +
      '<div class="right"><span class="kpi-m">not a forecast &mdash; a distribution</span></div></div>' +
      '<div class="probs">' +
        '<div class="prob"><div class="prob-k">Closes above ' + n0(hi1) + '</div><div class="prob-v neg">' + n1(pAbove * 100) + "%</div>" +
          '<div class="kpi-m">breaches 1&sigma; upside</div></div>' +
        '<div class="prob"><div class="prob-k">Stays inside 1&sigma;</div><div class="prob-v pos">' + n1(pInside * 100) + "%</div>" +
          '<div class="kpi-m">the seller&rsquo;s outcome</div></div>' +
        '<div class="prob"><div class="prob-k">Closes below ' + n0(lo1) + '</div><div class="prob-v neg">' + n1(pBelow * 100) + "%</div>" +
          '<div class="kpi-m">breaches 1&sigma; downside</div></div>' +
        '<div class="prob"><div class="prob-k">Max pain drift</div><div class="prob-v">' + sgn(m.maxPain - c.spot, 0) + "</div>" +
          '<div class="kpi-m">weak signal &mdash; context only</div></div>' +
      "</div></section>";

    /* ---- strike table ---- */
    var sorted = cands.slice().sort(function (a, b) { return b.strike - a.strike; });
    var nearest = sorted.reduce(function (best, x) {
      return Math.abs(x.strike - c.spot) < Math.abs(best.strike - c.spot) ? x : best;
    }, sorted[0]);

    var stRows = sorted.map(function (x) {
      var isAtm = nearest && x.strike === nearest.strike && x.side === nearest.side;
      return '<tr class="clickable" data-strike="' + x.strike + '"' +
        (isAtm ? ' data-atm="1"' : "") + ">" +
        '<td class="lft" style="color:' + (x.side === "CE" ? "var(--calls)" : "var(--puts)") + '">' + x.side + "</td>" +
        "<td>" + n0(x.strike) + "</td>" +
        "<td>" + n2(x.delta) + "</td>" +
        "<td><b style=\"color:var(--ink)\">" + n1(x.pop * 100) + "%</b></td>" +
        "<td>" + n2(x.credit) + "</td>" +
        "<td>&#8377;" + n0(x.creditRs) + "</td>" +
        "<td>" + n2(x.rom) + "%</td>" +
        "<td>" + n1(x.leg.oi) + "L</td>" +
        '<td class="verdict-cell"><span class="pill ' + x.verdict.c + '">' + x.verdict.t + "</span></td></tr>";
    }).join("");

    var strikeCard =
      '<section class="card"><div class="card-hd"><h2>Strike probability &amp; premium</h2>' +
      '<span class="sub">short-premium candidates &middot; OTM only</span>' +
      '<div class="right"><span class="kpi-m">POP = P(expires worthless) &middot; ROM = credit / margin</span></div></div>' +
      '<div class="tablewrap tall"><table class="dt strat"><thead><tr>' +
      '<th class="lft">Side</th><th>Strike</th><th>Delta</th><th>POP</th><th>Premium</th>' +
      '<th>Credit</th><th>ROM</th><th>OI</th><th class="lft">Verdict</th>' +
      "</tr></thead><tbody>" + stRows + "</tbody></table></div></section>";

    /* ---- recommended structure ---- */
    var structCard, exitCard, gapCard;

    if (!haveBoth) {
      structCard = '<section class="card"><div class="card-hd"><h2>Recommended structure</h2>' +
        '<span class="sub">none</span></div><div class="caution"><p><b>No strike clears the filters.</b> ' +
        "Every OTM strike is either illiquid, too close to spot, or paying less than 0.80% return on margin. " +
        "For a seller that is a valid answer &mdash; <b>sit out this cycle</b>. Forcing a trade when premium " +
        "does not compensate for gap risk is how sellers give back months of gains.</p></div></section>";
      exitCard = ""; gapCard = "";
    } else {
      var legs = [
        { side: "CE", strike: bestCE.strike, credit: bestCE.credit, qty: -1 },
        { side: "PE", strike: bestPE.strike, credit: bestPE.credit, qty: -1 }
      ];
      var defined = lowVol;
      var wingCE = null, wingPE = null;
      if (defined) {
        wingCE = m.rows.filter(function (r) { return r.strike === bestCE.strike + c.step * 2; })[0];
        wingPE = m.rows.filter(function (r) { return r.strike === bestPE.strike - c.step * 2; })[0];
        if (wingCE) legs.push({ side: "CE", strike: wingCE.strike, credit: wingCE.ce.ltp, qty: 1 });
        if (wingPE) legs.push({ side: "PE", strike: wingPE.strike, credit: wingPE.pe.ltp, qty: 1 });
      }

      var netCredit = legs.reduce(function (s, l) { return s - l.qty * l.credit; }, 0);
      var creditRs = netCredit * c.lot;
      var beLo = bestPE.strike - netCredit, beHi = bestCE.strike + netCredit;
      var gL = bs(c.spot, bestCE.strike, bestCE.leg.iv / 100, TT);
      var gP = bs(c.spot, bestPE.strike, bestPE.leg.iv / 100, TT);
      var combPop = 1 - gL.pCallItm - gP.pPutItm;

      var maxLoss, marginReq;
      if (defined && wingCE && wingPE) {
        maxLoss = (c.step * 2 - netCredit) * c.lot;
        marginReq = maxLoss;
      } else {
        maxLoss = null;
        marginReq = bestCE.margin * 1.35;
      }
      var romTotal = creditRs / marginReq * 100;

      var name = defined ? "Iron condor &middot; defined risk" : "Short strangle &middot; naked";

      structCard =
        '<section class="card"><div class="card-hd"><h2>Recommended structure</h2>' +
        '<span class="sub">' + name + "</span>" +
        '<div class="right"><span class="kpi-m">' + esc(c.label) + " &middot; " + esc(c.expiry) + "</span></div></div>" +
        (lowVol ? '<div class="caution"><p><b>India VIX ' + n2(c.vix) + " is low.</b> Naked premium here is thin " +
          "relative to gap risk, so this is proposed as <b>defined risk</b> with protective wings, and at reduced size. " +
          "Selling naked into low IV is the single most common way option sellers blow up.</p></div>" : "") +
        '<div class="legs">' + legs.map(function (l) {
          return '<div class="leg-row"><span class="leg-act ' + (l.qty < 0 ? "sell" : "buy") + '">' +
            (l.qty < 0 ? "Sell" : "Buy") + "</span>" +
            '<span class="leg-desc">' + n0(l.strike) + " " + l.side + "</span>" +
            '<span class="leg-prem">' + (l.qty < 0 ? "+" : "&minus;") + n2(l.credit) + "</span></div>";
        }).join("") + "</div>" +
        '<div class="struct">' +
          sc("Net credit", "&#8377;" + n0(creditRs), n2(netCredit) + " &times; " + c.lot) +
          sc("Combined POP", n1(combPop * 100) + "%", "both legs expire worthless") +
          sc("Breakevens", n0(beLo) + " &ndash; " + n0(beHi), "at expiry") +
          sc("Margin (est.)", "&#8377;" + n0(marginReq), defined ? "= max loss" : "naked, SPAN+exposure approx") +
          sc("Return on margin", n2(romTotal) + "%", "for " + DTE + " days") +
          sc("Max loss", maxLoss ? "&#8377;" + n0(maxLoss) : "Unlimited", maxLoss ? "capped by wings" : "naked &mdash; no cap") +
        "</div></section>";

      /* ---- exit plan ---- */
      var tp = netCredit * 0.5, sl = netCredit * 2;
      exitCard =
        '<section class="card"><div class="card-hd"><h2>Exit plan</h2>' +
        '<span class="sub">decide now, not in the drawdown</span></div><div class="checks">' +
        ck("1", "Profit target", "Buy back when combined premium falls to <b>" + n2(tp) +
          "</b> (50% of credit &mdash; &#8377;" + n0(creditRs * 0.5) + " captured). Most of the theta is earned early; " +
          "holding to expiry for the last 50% adds days of gap exposure for little gain.") +
        ck("2", "Stop loss", "Exit if combined premium reaches <b>" + n2(sl) +
          "</b> (2&times; credit &mdash; loss &asymp; &#8377;" + n0(creditRs) + "). Non-negotiable and set on entry.") +
        ck("3", "Delta breach", "Exit or roll the tested leg if its delta exceeds <b>0.30</b>. " +
          "Delta rising is the market telling you the strike is no longer far away.") +
        ck("4", "Time exit", "Close by <b>19 Aug</b>, the session before expiry, regardless of P&amp;L. " +
          "Expiry-day gamma is the worst risk-per-rupee a seller can hold.") +
        ck("5", "Volatility shock", "If India VIX jumps <b>&gt;15%</b> in a session, cut size immediately. " +
          "IV expansion hurts a short-premium book before direction does.") +
        ck("6", "Margin buffer", "Keep <b>&ge;40%</b> of capital unutilised as cash. " +
          "This is your own rule &mdash; it is what lets you survive a gap instead of being force-closed into it.") +
        "</div></section>";

      /* ---- gap scenarios ---- */
      var scen = [-3, -2, -1, -0.5, 0, 0.5, 1, 2, 3];
      var pls = scen.map(function (g) { return payoff(legs, c.spot * (1 + g / 100), c.lot); });
      var worst = Math.max.apply(null, pls.map(Math.abs));
      var gRows = scen.map(function (g, i) {
        var pl = pls[i], w = Math.abs(pl) / worst * 100;
        return '<tr class="clickable" data-pt="' + esc(JSON.stringify({
            t: (g > 0 ? "+" : "") + n1(g) + "% move in spot",
            s: "profit and loss at expiry",
            big: (pl >= 0 ? "+" : "\u2212") + "\u20b9" + n0(Math.abs(pl)),
            rows: [["Spot", n0(c.spot * (1 + g / 100))],
                   ["Move", (g > 0 ? "+" : "") + n1(g) + "%"],
                   ["P&L at expiry", (pl >= 0 ? "+" : "\u2212") + "\u20b9" + n0(Math.abs(pl))],
                   ["Credit received", "\u20b9" + n0(creditRs)]],
            note: "An <b>immediate</b> gap is worse than this. The position " +
                  "still carries time value and IV expands on the move, so " +
                  "mark-to-market loss can exceed the expiry figure before it " +
                  "converges back."
          })) + '"><td class="lft">' + (g > 0 ? "+" : "") + n1(g) + "%</td>" +
          "<td>" + n0(c.spot * (1 + g / 100)) + "</td>" +
          '<td class="' + cls(pl) + '">' + (pl >= 0 ? "+" : "&minus;") + "&#8377;" + n0(Math.abs(pl)) + "</td>" +
          '<td class="lft"><span class="bar-pl" style="width:' + w.toFixed(1) + "%;background:" +
            (pl >= 0 ? "var(--up)" : "var(--down)") + '"></span></td></tr>';
      }).join("");

      gapCard =
        '<section class="card"><div class="card-hd"><h2>Gap scenarios</h2>' +
        '<span class="sub">P&amp;L at expiry by move in spot</span>' +
        '<div class="right"><span class="kpi-m">the number that matters for a seller</span></div></div>' +
        '<div class="caution"><p>These are <b>expiry</b> payoffs. An <b>immediate</b> gap is worse than shown &mdash; ' +
        "the position still carries time value and IV expands on the move, so mark-to-market loss can exceed " +
        "the expiry figure before it converges back.</p></div>" +
        '<div class="tablewrap"><table class="dt gap"><thead><tr>' +
        '<th class="lft">Gap</th><th>Spot</th><th>P&amp;L</th><th class="lft">&nbsp;</th>' +
        "</tr></thead><tbody>" + gRows + "</tbody></table></div></section>";
    }

    var honesty =
      '<section class="card"><div class="card-hd"><h2>What this section can and cannot do</h2></div>' +
      '<div class="caution"><p><b>It does not predict direction.</b> Nothing does, reliably. Every number here is ' +
      "a probability from current option pricing &mdash; if IV is wrong, the probabilities are wrong with it.</p>" +
      "<p><b>POP understates tail risk.</b> The lognormal model behind N(d&#8322;) assumes moves are well-behaved. " +
      "Real gaps &mdash; budget days, global shocks, results &mdash; are fatter than the model. An 85% POP trade " +
      "does not lose 15% of the time in a tidy way; it loses rarely and <b>large</b>. That asymmetry is the whole " +
      "risk of selling options.</p>" +
      "<p><b>PCR and max pain are weak signals.</b> They are shown for context, not conviction. " +
      "No entry here is justified by max pain alone.</p>" +
      "<p><b>Backtest before trusting it.</b> Once you have 100+ sessions stored, replay these rules against them. " +
      "Until then treat every suggestion as a hypothesis.</p></div></section>";

    return rangeCard + quantCards(m) + probCard + strikeCard +
           structCard + exitCard + gapCard + honesty;
  }

  /* ==========================================================
     6e. QUANTITATIVE LAYER
         Everything here was computed by the pipeline. The page
         renders it and never recalculates -- if it did, the
         dashboard and the scored ledger could disagree.
     ========================================================== */
  function quantCards(m) {
    var a = m.an;
    if (!a) {
      return '<section class="card"><div class="card-hd"><h2>Quantitative layer</h2></div>' +
        '<div class="caution"><p><b>Not computed for this session.</b> ' +
        "Run the daily job to populate volatility, skew and the risk-neutral density.</p></div></section>";
    }

    var out = "";

    /* ---------- realised vs implied ---------- */
    if (a.realisedVol) {
      var wins = Object.keys(a.realisedVol).sort(function (x, y) { return +x - +y; });
      var rvRows = wins.map(function (w) {
        var e = a.realisedVol[w];
        return "<tr><td class=\"lft\">" + w + "d</td>" +
          '<td style="color:var(--ink);font-weight:600">' + n2(e.yang_zhang) + "%</td>" +
          "<td>" + n2(e.close_to_close) + "%</td>" +
          "<td>" + n2(e.parkinson) + "%</td>" +
          "<td>" + n2(e.garman_klass) + "%</td>" +
          "<td>" + n2(e.rogers_satchell) + "%</td></tr>";
      }).join("");

      out += '<section class="card"><div class="card-hd"><h2>Realised volatility</h2>' +
        '<span class="sub">five estimators &middot; annualised</span>' +
        '<div class="right"><span class="kpi-m">Yang-Zhang is the reference &mdash; gap-aware and drift-free</span></div></div>' +
        '<div class="tablewrap"><table class="dt"><thead><tr>' +
        '<th class="lft">Window</th><th>Yang-Zhang</th><th>Close-close</th>' +
        "<th>Parkinson</th><th>Garman-Klass</th><th>Rogers-Satchell</th>" +
        "</tr></thead><tbody>" + rvRows + "</tbody></table></div>" +
        '<div class="caution"><p>Where these disagree, the disagreement is the information. ' +
        "Parkinson cannot see overnight gaps; close-to-close is the noisiest and swings hardest " +
        "on a single one. A short-window verdict built on close-to-close alone is not evidence " +
        "about the market.</p></div></section>";
    }

    /* ---------- the seller's core question ---------- */
    var v = a.vrp;
    if (v) {
      var rich = v.ratio > 1.10, poor = v.ratio < 0.95;
      out += '<section class="card"><div class="card-hd"><h2>Is the seller being paid?</h2>' +
        '<span class="sub">implied vs forecast realised</span>' +
        '<div class="right"><span class="kpi-m">the one number that decides whether to sell at all</span></div></div>' +
        '<div class="probs">' +
        pr("ATM implied", n2(v.iv) + "%", "neu", "what the market charges") +
        pr("Forecast realised", n2(v.rv) + "%", "neu",
           a.harRv ? "HAR-RV, R&sup2; " + n2(a.harRv.r2) : "trailing Yang-Zhang") +
        pr("IV / RV", n2(v.ratio), rich ? "pos" : poor ? "neg" : "neu",
           rich ? "premium is rich" : poor ? "premium is thin" : "roughly fair") +
        pr("Spread", sgn(v.spread_vol_pts, 2), v.spread_vol_pts > 0 ? "pos" : "neg",
           "vol points") +
        "</div>" +
        '<div class="caution"><p>' +
        (poor
          ? "<b>Implied is running below forecast realised.</b> Selling premium here is not " +
            "being compensated for the risk carried. That is a reason to stand aside, not to " +
            "size down."
          : rich
          ? "<b>Implied exceeds forecast realised.</b> This is the variance risk premium and it " +
            "is the reason selling pays &mdash; but it is compensation for the tail, not free " +
            "money, and it inverts precisely when the tail arrives."
          : "<b>Implied and realised are close.</b> No meaningful edge either way at this level.") +
        "</p></div></section>";
    }

    /* ---------- where the market thinks it lands ---------- */
    if (a.bands) {
      var order = [
        ["implied", "IV-implied", "Black-Scholes on ATM vol"],
        ["riskNeutral", "Risk-neutral density", "Breeden-Litzenberger, no distribution assumed"],
        ["cornishFisher", "Cornish-Fisher", "adjusted for skew and fat tails"],
        ["bootstrap", "Bootstrap", "resampled from real history, blocks of 5"],
        ["realisedForecast", "Realised forecast", "HAR-RV projection"]
      ];
      var lo = Infinity, hi = -Infinity;
      order.forEach(function (o) {
        var b = a.bands[o[0]];
        if (b) { lo = Math.min(lo, b[0]); hi = Math.max(hi, b[1]); }
      });
      var span = hi - lo || 1;

      var rows = order.map(function (o) {
        var b = a.bands[o[0]];
        if (!b) return "";
        var left = (b[0] - lo) / span * 100, w = (b[1] - b[0]) / span * 100;
        return '<div class="bandrow"><div class="bandrow-k">' + o[1] +
          '<i>' + o[2] + "</i></div>" +
          '<div class="bandrow-bar"><span style="left:' + left.toFixed(1) +
            "%;width:" + w.toFixed(1) + '%"></span></div>' +
          '<div class="bandrow-v">' + n0(b[0]) + " &ndash; " + n0(b[1]) +
          '<i>' + n0(b[1] - b[0]) + " pts</i></div></div>";
      }).join("");

      out += '<section class="card"><div class="card-hd"><h2>One-sigma range, five ways</h2>' +
        '<span class="sub">' + a.sessionsToExpiry + " session(s) to expiry</span>" +
        '<div class="right"><span class="kpi-m">agreement is the signal</span></div></div>' +
        '<div class="bandlist">' + rows + "</div>" +
        '<div class="caution"><p>These are independent methods, not one calculation shown five ' +
        "times. Where they cluster, the range is trustworthy. Where they diverge, the widest one " +
        "deserves the weight &mdash; for a short-premium book the expensive error is always the " +
        "band that was too narrow.</p></div></section>";
    }

    /* ---------- risk-neutral density ---------- */
    if (a.rnd && a.rnd.grid && a.rnd.grid.length > 4) {
      var g = a.rnd.grid, dn = a.rnd.density;
      var mx = Math.max.apply(null, dn) || 1;
      var gLo = g[0], gHi = g[g.length - 1], gSpan = (gHi - gLo) || 1;
      var pts = g.map(function (k, i) {
        return ((k - gLo) / gSpan * 330).toFixed(1) + "," + (86 - dn[i] / mx * 74).toFixed(1);
      });
      var spotX = ((m.cfg.spot - gLo) / gSpan * 330).toFixed(1);

      out += '<section class="card"><div class="card-hd"><h2>Risk-neutral density</h2>' +
        '<span class="sub">the market&rsquo;s own distribution</span>' +
        '<div class="right"><span class="kpi-m">from ' + a.rnd.nStrikes + " strikes</span></div></div>" +
        '<div class="chart-body"><svg viewBox="0 0 330 100" role="img" ' +
        'aria-label="Risk-neutral probability density for the settle, recovered from option prices.">' +
        /* The filled area is the hit target: clicking anywhere on the
           curve surrenders the moments and the levels behind it. */
        '<polygon fill="var(--calls-dim)" data-pt="' + esc(JSON.stringify({
            t: "Risk-neutral density",
            s: "the market's own distribution, from " + a.rnd.nStrikes + " strikes",
            big: n0(a.rnd.median),
            rows: [["Median", n0(a.rnd.median)], ["Mean", n0(a.rnd.mean)],
                   ["Std deviation", n0(a.rnd.sd)],
                   ["Skew", sgn(a.rnd.skew, 3)],
                   ["Excess kurtosis", sgn(a.rnd.excessKurtosis, 2)],
                   ["5th percentile", n0(a.rnd.q05)],
                   ["95th percentile", n0(a.rnd.q95)],
                   ["Strikes used", a.rnd.nStrikes]],
            note: "Recovered by Breeden-Litzenberger: the second derivative of " +
                  "call price with respect to strike. The chain is smoothed with " +
                  "a spline first, because differentiating noise twice amplifies " +
                  "every wobble. The desk rejects this density outright when its " +
                  "mean is not the forward."
          })) + '" points="' + pts.join(" ") +
          " " + (330).toFixed(1) + ",86 0,86\"></polygon>" +
        '<polyline fill="none" stroke="var(--calls)" stroke-width="2" points="' +
          pts.join(" ") + '"></polyline>' +
        '<line x1="' + spotX + '" y1="6" x2="' + spotX +
          '" y2="86" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="3 3"></line>' +
        '<text class="axis" x="2" y="97">' + n0(gLo) + "</text>" +
        '<text class="axis" x="300" y="97">' + n0(gHi) + "</text>" +
        "</svg></div>" +
        '<div class="probs">' +
        pr("Skew", sgn(a.rnd.skew, 3), a.rnd.skew < 0 ? "neg" : "pos",
           a.rnd.skew < 0 ? "left tail bid" : "right tail bid") +
        pr("Excess kurtosis", sgn(a.rnd.excessKurtosis, 2), "neu", "0 = normal tails") +
        pr("Density sd", n0(a.rnd.sd), "neu", "points") +
        pr("Median", n0(a.rnd.median), "neu", "vs spot " + n0(m.cfg.spot)) +
        "</div>" +
        '<div class="caution"><p>Recovered by differentiating the call-price curve twice: ' +
        "<b>p(K) = e<sup>rT</sup> &part;&sup2;C/&part;K&sup2;</b>. Skew and fat tails appear here " +
        "because they are in the prices, not because a parameter put them there &mdash; a " +
        "lognormal model has zero skew by construction and cannot represent this at all.</p></div></section>";
    }

    /* ---------- market structure ---------- */
    var f = a.forward, st = a.straddle, sk = a.skew;
    if (f || st || sk) {
      var cells = "";
      if (f) {
        cells += sc("Implied forward", n0(f.forward),
                    "put-call parity, " + f.n_strikes + " strikes");
        cells += sc("Basis", sgn(f.basis, 1) + " pts", sgn(f.basis_pct, 3) + "%");
        cells += sc("Annualised carry",
                    f.carry_annual_pct == null ? "&mdash;" : n2(f.carry_annual_pct) + "%",
                    f.carry_suppressed
                      ? "withheld &mdash; " + f.days_calendar + "d is too short to annualise"
                      : "over " + f.days_calendar + " days");
      }
      if (st) {
        cells += sc("ATM straddle", n2(st.straddle), "traded breakeven");
        cells += sc("Straddle move", "&plusmn;" + n0(st.move_pts), n2(st.move_pct) + "% &mdash; mean absolute");
      }
      if (sk) {
        cells += sc("25&Delta; risk reversal", sgn(sk.risk_reversal, 2),
                    sk.tilt + " &mdash; call " + n1(sk.call_iv) + "% vs put " + n1(sk.put_iv) + "%");
        cells += sc("25&Delta; butterfly", sgn(sk.butterfly, 2), "smile curvature vs ATM");
      }
      if (a.ivRank != null) {
        cells += sc("IV rank", n1(a.ivRank), "between window low and high");
        cells += sc("IV percentile", n1(a.ivPercentile), "share of sessions below today");
      }

      out += '<section class="card"><div class="card-hd"><h2>Market structure</h2>' +
        '<span class="sub">forward, straddle, skew</span></div>' +
        '<div class="struct">' + cells + "</div>" +
        (sk ? '<div class="caution"><p>Skew is measured at a fixed <b>delta</b>, not a fixed ' +
          "point distance. &ldquo;350 points out&rdquo; means something different at 8% vol than " +
          "at 15%, so point-based skew cannot be compared across sessions.</p></div>" : "") +
        "</section>";
    }

    /* ---------- regime ---------- */
    if (a.varianceRatio) {
      var vq = Object.keys(a.varianceRatio).sort(function (x, y) { return +x - +y; });
      var vrows = vq.map(function (q) {
        var r = a.varianceRatio[q];
        return "<tr><td class=\"lft\">" + q + "d</td>" +
          "<td>" + n3(r.vr) + "</td>" +
          "<td>" + sgn(r.z, 2) + "</td>" +
          '<td class="lft"><span class="pill ' +
            (r.regime === "random-walk" ? "nx" : r.regime === "trending" ? "go" : "lu") +
            '">' + r.regime + "</span></td>" +
          '<td class="lft" style="color:var(--ink-3)">' +
            (r.rejects_random_walk ? "rejects random walk" : "consistent with random walk") +
          "</td></tr>";
      }).join("");

      out += '<section class="card"><div class="card-hd"><h2>Price regime</h2>' +
        '<span class="sub">Lo-MacKinlay variance ratio</span>' +
        '<div class="right"><span class="kpi-m">|Z| &gt; 1.96 rejects at 95%</span></div></div>' +
        '<div class="tablewrap"><table class="dt"><thead><tr>' +
        '<th class="lft">Horizon</th><th>VR</th><th>Z</th>' +
        '<th class="lft">Regime</th><th class="lft">Verdict</th>' +
        "</tr></thead><tbody>" + vrows + "</tbody></table></div>" +
        '<div class="caution"><p>Option bands scale daily volatility by the square root of time, ' +
        "which assumes VR = 1. Below 1 the index mean-reverts and the band is too wide; above 1 " +
        "moves compound and it is too narrow.</p></div></section>";
    }

    /* ---------- tail risk ---------- */
    var cf = a.cornishFisher, srk = a.structureRisk;
    if (cf || srk) {
      var tcells = "";
      if (cf) {
        tcells += sc("2&sigma; adjusted", n0(cf.lower2sd) + " &ndash; " + n0(cf.upper2sd),
                     "skew and kurtosis corrected");
        tcells += sc("2&sigma; gaussian", n0(cf.gaussian2sdLower) + " &ndash; " + n0(cf.gaussian2sdUpper),
                     "what the normal model says");
        tcells += sc("Downside difference",
                     n0(cf.gaussian2sdLower - cf.lower2sd) + " pts",
                     "how much further the real left tail reaches");
      }
      if (srk) {
        tcells += sc("Expected P&amp;L", "&#8377;" + n0(srk.expectedPnl),
                     "across 20,000 bootstrapped paths");
        tcells += sc("P(profit)", n1(srk.probProfit * 100) + "%", "on the proposed structure");
        tcells += sc("VaR 95%", "&#8377;" + n0(srk.var95), "loss at the 5th percentile");
        tcells += sc("Expected shortfall", "&#8377;" + n0(srk.expectedShortfall95),
                     "mean loss <em>inside</em> the worst 5%");
        tcells += sc("Worst path", "&#8377;" + n0(srk.worst), "of 20,000");
      }

      out += '<section class="card"><div class="card-hd"><h2>Tail risk</h2>' +
        '<span class="sub">where a seller actually loses</span></div>' +
        '<div class="struct">' + tcells + "</div>" +
        '<div class="caution"><p><b>Expected shortfall, not max loss.</b> Max loss tells you what ' +
        "the wing caps you at. Expected shortfall tells you what the bad outcomes cost " +
        "<em>on average</em> &mdash; a number you can size against. For defined-risk structures " +
        "the two converge; for anything naked they do not, and that gap is the whole risk.</p></div></section>";
    }

    return out;
  }

  function n3(v) { return nf(v, 3); }

  function sc(k, v, m2) {
    /* Same treatment as pr(): the structure card carries the figures a
       seller acts on, so they are the ones most worth being able to open. */
    var known = !!termKey(k);
    return '<div class="struct-c' + (known ? " has-term" : "") + '"' +
      (known ? ' data-term="' + esc(k) + '" tabindex="0" role="button"' : "") +
      '><div class="struct-k">' + k +
      (known ? '<span class="term-mark" aria-hidden="true">?</span>' : "") +
      '</div><div class="struct-v">' + v +
      '</div><div class="struct-m">' + m2 + "</div></div>";
  }
  function ck(n, k, v) {
    return '<div class="check"><div class="mk">' + n + '</div><div class="ck">' + k + '</div><div class="cv">' + v + "</div></div>";
  }

  /* ==========================================================
     6c. FORECAST VERIFICATION
         Every session the model states (a) a 1&sigma; range and
         (b) a POP for the strikes it proposed. Later the realised
         outcome is joined back. These are the standard scoring
         rules used to grade probabilistic forecasts.
     ========================================================== */
  /* Accuracy and history were two tabs answering one question: is this
     model any good, and what exactly did it say. Neither duplicates the
     other -- the reliability diagram plots stated against observed
     probability, the claims table grades each assertion separately -- so
     the merge is a join with nothing dropped.

     Order runs from verdict to evidence: how well it scores, then the
     claim-by-claim record, then every session it was built on. */
  function viewModelData(m) {
    return viewAccuracy(m) + viewModelHistory(m);
  }

  function viewAccuracy(m) {
    var A = ACCURACY[state.idx] || {};
    var stored = m.sessionsStored || 0;

    /* Nothing is scoreable until a forecast horizon has actually passed.
       Showing a placeholder scorecard here would be the exact dishonesty
       this tab exists to prevent. */
    if (!A.ready) {
      var pending =
        '<section class="card"><div class="card-hd"><h2>Scoring not started</h2>' +
        '<span class="sub">' + stored + " session" + (stored === 1 ? "" : "s") + " stored</span></div>" +
        '<div class="caution"><p><b>' + esc(A.note || "No resolved predictions yet.") + "</b></p>" +
        "<p>A prediction made today is scored when its expiry arrives and the close is known. " +
        "Until the first horizon passes there is nothing to grade, so nothing is shown. " +
        "The ledger is already recording &mdash; every daily run writes what the model claimed, " +
        "and those rows become the scorecard as outcomes land.</p></div></section>";
      return pending + stackCard() + formulasCard();
    }

    var bins = A.bins || [];
    var c1 = A.cov_1sd, c2 = A.cov_2sd;

    var scorecard =
      '<section class="card"><div class="card-hd"><h2>Scorecard</h2>' +
      '<span class="sub">' + A.n + " predictions &middot; " + (A.n_legs || 0) + " legs scored</span>" +
      '<div class="right"><span class="kpi-m">lower Brier better &middot; BSS &gt; 0 beats base rate</span></div></div>' +
      '<div class="probs">' +
        pr("Brier score", A.brier != null ? n2(A.brier) : "&mdash;",
           A.brier != null && A.brier < 0.18 ? "pos" : "neg", "mean squared error of stated POP") +
        pr("Brier skill", A.brier_skill != null ? (A.brier_skill >= 0 ? "+" : "") + n2(A.brier_skill) : "&mdash;",
           A.brier_skill > 0 ? "pos" : "neg", "vs always-predict-base-rate") +
        pr("Calib. error", A.ece != null ? n1(A.ece * 100) + "%" : "&mdash;",
           A.ece != null && A.ece < 0.03 ? "pos" : "neg", "ECE &mdash; gap between said and seen") +
        pr("Base rate", A.base_rate != null ? n1(A.base_rate * 100) + "%" : "&mdash;",
           "neu", "how often the short strike survived") +
      "</div></section>";

    var X = function (p) { return ((p - 0.6) / 0.4 * 290 + 20).toFixed(1); };
    var Y = function (p) { return (170 - (p - 0.6) / 0.4 * 150).toFixed(1); };
    var dots = bins.map(function (b) {
      var gap = (b.obs - b.conf) * 100;
      return '<circle cx="' + X(b.conf) + '" cy="' + Y(b.obs) + '" r="' +
        (3.5 + Math.sqrt(b.n)).toFixed(1) + '" fill="var(--calls)" fill-opacity=".8" ' +
        'stroke="var(--surface)" stroke-width="2" data-pt="' +
        esc(JSON.stringify({
          t: "Confidence bucket " + n1(b.conf * 100) + "%",
          s: "stated against observed",
          big: n1(b.obs * 100) + "%",
          rows: [["Stated", n1(b.conf * 100) + "%"],
                 ["Happened", n1(b.obs * 100) + "%"],
                 ["Gap", sgn(gap, 1) + "pp"],
                 ["Forecasts in bucket", b.n]],
          note: gap < -2 ? "Below the line: the desk was <b>overconfident</b> here."
              : gap > 2 ? "Above the line: the desk was <b>underconfident</b> here."
              : "On the line: honest at this confidence level."
        })) + '"><title>said ' + n1(b.conf * 100) +
        "%, happened " + n1(b.obs * 100) + "% (n=" + b.n + ")</title></circle>";
    }).join("");

    var reliability =
      '<section class="card"><div class="card-hd"><h2>Reliability</h2>' +
      '<span class="sub">said vs happened</span>' +
      '<div class="right"><span class="kpi-m">on the line = honest &middot; below = overconfident</span></div></div>' +
      '<div class="chart-body"><svg viewBox="0 0 330 195" role="img" ' +
      'aria-label="Reliability diagram comparing stated probability against observed frequency.">' +
        '<line class="gridline" x1="20" y1="20" x2="20" y2="170"></line>' +
        '<line class="gridline" x1="20" y1="170" x2="310" y2="170"></line>' +
        '<line x1="' + X(0.6) + '" y1="' + Y(0.6) + '" x2="' + X(1) + '" y2="' + Y(1) +
          '" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="4 4"></line>' + dots +
        '<text class="axis" x="20" y="186">60%</text>' +
        '<text class="axis" x="290" y="186">100%</text>' +
        '<text class="axis" x="0" y="16">100%</text>' +
        '<text class="axis" x="0" y="174">60%</text>' +
        '<text class="axis" x="150" y="192" text-anchor="middle">Stated probability</text>' +
      "</svg></div></section>";

    function covCell(label, c, nominal) {
      if (!c) return pr(label, "&mdash;", "neu", "no resolved rows yet");
      return pr(label, n1(c.coverage * 100) + "%", c.rejected ? "neg" : "pos",
        "expected " + n1(nominal * 100) + "% &middot; " +
        (c.lr == null ? "LR n/a" : "LR " + n2(c.lr) + (c.rejected ? " &mdash; rejected" : " &mdash; passes")));
    }

    var coverage =
      '<section class="card"><div class="card-hd"><h2>Range coverage</h2>' +
      '<span class="sub">Kupiec proportion-of-failures test</span>' +
      '<div class="right"><span class="kpi-m">LR &gt; 3.84 rejects the band at 95%</span></div></div>' +
      '<div class="probs">' +
        covCell("1&sigma; coverage", c1, 0.6827) +
        covCell("2&sigma; coverage", c2, 0.9545) +
        pr("Band factor", A.band_factor != null ? n2(A.band_factor) + "&times;" : "&mdash;",
           "neu", "empirical 68th pct of realised move") +
        pr("Tail sessions", A.tail_sessions != null ? n0(A.tail_sessions) : "&mdash;",
           "neu", "moves beyond 2&sigma;") +
      "</div></section>";

    var diag = [];
    if (A.band_factor != null && c1) {
      diag.push(["Band width", "Realised moves reached <b>" + n2(A.band_factor) +
        "&times;</b> the implied 1&sigma; band at the 68th percentile, and coverage came in at <b>" +
        n1(c1.coverage * 100) + "%</b> against 68.2% expected. " +
        (A.band_factor < 0.95
          ? "Implied is running rich versus realised &mdash; that gap <b>is</b> the variance risk premium, "
            + "and it is why selling premium pays. Scale the stated band by <b>" + n2(A.band_factor) +
            "</b> so the number means what it says, but keep sizing off the unscaled band."
          : "Implied is not compensating for realised movement. Widen the band before trusting it.")]);
    }
    var hi = bins.filter(function (b) { return b.lo >= 0.85; });
    if (hi.length) {
      var hn = hi.reduce(function (s, b) { return s + b.n; }, 0);
      var hc = hi.reduce(function (s, b) { return s + b.conf * b.n; }, 0) / hn;
      var ho = hi.reduce(function (s, b) { return s + b.obs * b.n; }, 0) / hn;
      if (hc - ho > 0.01) {
        diag.push(["Overconfident above 85%", "In the 85%+ buckets the model said <b>" +
          n1(hc * 100) + "%</b> and delivered <b>" + n1(ho * 100) + "%</b> &mdash; an overstatement of <b>" +
          n1((hc - ho) * 100) + " points</b> exactly where you size largest. " +
          "Apply a haircut above 0.85 until the dots sit back on the diagonal."]);
      }
    }
    if (!diag.length) {
      diag.push(["Nothing to correct yet", "No systematic bias has cleared the noise floor at this sample size. " +
        "Keep collecting &mdash; calibration findings are unreliable below roughly 30 resolved forecasts."]);
    }

    var diagnosis =
      '<section class="card"><div class="card-hd"><h2>What the data says to change</h2>' +
      '<span class="sub">derived, not asserted</span></div><div class="checks">' +
      diag.map(function (d, i) { return ck(String(i + 1), d[0], d[1]); }).join("") + "</div></section>";

    /* ---------- prediction vs outcome ----------
       Three column groups: what was claimed, what the market did, and
       whether the claim survived. Read left to right and each row is one
       complete, auditable forecast. */
    function markCell(v) {
      if (v == null) return '<td class="mark pend">&middot;</td>';
      return '<td class="mark ' + (v ? "hit" : "miss") + '">' +
        (v ? "&#10003;" : "&#10007;") + "</td>";
    }

    function ledgerRow(r, pending) {
      var lo = r.range_lo_1sd, hi = r.range_hi_1sd;
      var close = r.realised_close;
      var move = r.realised_move;
      var movePct = (move != null && r.spot_at_pred) ? move / r.spot_at_pred * 100 : null;

      /* A session where the filters recommended nothing is not a loss --
         it is the model declining to trade, and its range forecast still
         stands on its own. Treating both_held=NULL as "breached" marked
         every stand-aside day as a failure and inflated the breach count. */
      var noTrade = (r.ce_strike == null && r.pe_strike == null);
      var verdict, vcls;
      if (pending) {
        verdict = "awaiting " + esc(r.expiry); vcls = "pend";
      } else if (noTrade) {
        verdict = r.in_1sd ? "no trade &middot; range ok" : "no trade &middot; range wide";
        vcls = r.in_1sd ? "nx" : "part";
      } else if (r.both_held && r.in_1sd) {
        verdict = "clean"; vcls = "hit";
      } else if (r.both_held) {
        verdict = "held, outside 1&sigma;"; vcls = "part";
      } else {
        verdict = "breached"; vcls = "miss";
      }

      return '<tr' + (pending ? ' class="pending-row"' : "") + ">" +
        /* ---- claimed ---- */
        '<td class="lft">' + esc(r.made_on) + "</td>" +
        '<td class="lft" style="color:var(--ink-3)">' + esc(r.expiry) + "</td>" +
        "<td>" + (r.dte_days != null ? r.dte_days + "d" : "&mdash;") + "</td>" +
        "<td>" + n2(r.spot_at_pred) + "</td>" +
        "<td>" + (r.atm_iv != null ? n2(r.atm_iv) + "%" : "&mdash;") + "</td>" +
        '<td class="grp-edge">' + (lo != null ? n0(lo) + " &ndash; " + n0(hi) : "&mdash;") + "</td>" +
        "<td>" + (r.ce_strike != null
                   ? n0(r.ce_strike) + '<i class="sub-n">' + n1(r.ce_pop * 100) + "%</i>"
                   : '<span style="color:var(--ink-3)">none</span>') + "</td>" +
        '<td class="grp-edge">' + (r.pe_strike != null
                   ? n0(r.pe_strike) + '<i class="sub-n">' + n1(r.pe_pop * 100) + "%</i>"
                   : '<span style="color:var(--ink-3)">none</span>') + "</td>" +
        /* ---- next session: resolves the following day ---- */
        "<td>" + (r.nx_close != null ? n2(r.nx_close) : "&mdash;") + "</td>" +
        '<td class="' + cls(r.nx_move) + '">' +
          (r.nx_move != null ? sgn(r.nx_move, 0) : "&mdash;") + "</td>" +
        (r.nx_in == null ? '<td class="mark pend grp-edge">&middot;</td>'
          : '<td class="mark grp-edge ' + (r.nx_in ? "hit" : "miss") + '">' +
            (r.nx_in ? "&#10003;" : "&#10007;") + "</td>") +
        /* ---- at expiry ---- */
        "<td>" + (close != null ? n2(close) : "&mdash;") + "</td>" +
        '<td class="' + cls(move) + '">' + (move != null ? sgn(move, 0) : "&mdash;") + "</td>" +
        '<td class="' + cls(movePct) + '">' + (movePct != null ? sgn(movePct, 2) + "%" : "&mdash;") + "</td>" +
        '<td class="grp-edge">' + (r.realised_sd != null ? n2(r.realised_sd) + "&sigma;" : "&mdash;") + "</td>" +
        /* ---- verdict ---- */
        markCell(pending ? null : r.in_1sd) +
        markCell(pending ? null : r.in_2sd) +
        markCell(pending ? null : (r.ce_strike == null ? null : r.ce_held)) +
        markCell(pending ? null : (r.pe_strike == null ? null : r.pe_held)) +
        '<td class="lft"><span class="pill ' +
          (vcls === "hit" ? "go" : vcls === "part" ? "mid" : vcls === "miss" ? "risk" : "nx") +
          '">' + verdict + "</span></td>" +
        '<td class="lft" style="color:var(--ink-3)">' + esc(r.stance || "") + "</td></tr>";
    }

    var pend = (A.pending || []).slice(0, 12);
    var done = (A.ledger || []).slice(0, 40);
    var rows = pend.map(function (r) { return ledgerRow(r, true); }).join("") +
               done.map(function (r) { return ledgerRow(r, false); }).join("");

    /* Summary computed from the rows on screen, so the header cannot drift
       from the table beneath it. */
    var traded = done.filter(function (r) {
      return r.ce_strike != null || r.pe_strike != null;
    });
    var nStood = done.length - traded.length;
    var nClean = traded.filter(function (r) { return r.both_held && r.in_1sd; }).length;
    var nHeld = traded.filter(function (r) { return r.both_held; }).length;
    var nBreach = traded.length - nHeld;

    var ledgerCard =
      '<section class="card"><div class="card-hd"><h2>Prediction ledger</h2>' +
      '<span class="sub">claimed vs happened</span>' +
      '<div class="right"><span class="kpi-m">written on the day &middot; scored after the fact &middot; never rewritten</span></div></div>' +
      '<div class="probs">' +
        pr("Scored", done.length + "", "neu", pend.length + " awaiting &middot; " +
           traded.length + " with a trade") +
        pr("Clean", nClean + "", nClean ? "pos" : "neu", "held and inside 1&sigma;") +
        pr("Held, wide", (nHeld - nClean) + "", "neu", "strike survived, range missed") +
        pr("Breached", nBreach + "", nBreach ? "neg" : "pos",
           "of " + traded.length + " traded &mdash; stand-aside days excluded") +
        pr("Stood aside", nStood + "", "neu", "no strike cleared the filters") +
      "</div>" +
      '<div class="tablewrap tall"><table class="dt ledger"><thead>' +
      '<tr class="grp-row">' +
        '<th class="lft grp-claim" colspan="8">What the model claimed, on the day</th>' +
        '<th class="grp-next" colspan="3">Next session</th>' +
        '<th class="grp-real" colspan="4">At expiry</th>' +
        '<th class="grp-vd" colspan="6">Verdict</th>' +
      "</tr><tr>" +
      '<th class="lft">Made on</th><th class="lft">Expiry</th><th>DTE</th>' +
      "<th>Spot</th><th>ATM IV</th><th class=\"grp-edge\">1&sigma; range</th>" +
      '<th>Short CE</th><th class="grp-edge">Short PE</th>' +
      "<th>Close</th><th>Move</th><th class=\"grp-edge\">In band</th>" +
      "<th>Settle</th><th>Move</th><th>Move %</th><th class=\"grp-edge\">Realised</th>" +
      "<th>1&sigma;</th><th>2&sigma;</th><th>CE</th><th>PE</th>" +
      '<th class="lft">Result</th><th class="lft">Stance</th>' +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>" +
      '<div class="caution"><p>Every row was written before its outcome existed and has ' +
      "never been edited. <b>Realised</b> is the actual move divided by the 1&sigma; band that " +
      "was claimed &mdash; above 1.00 means the market moved further than the model allowed for. " +
      "Rows in the shaded band at the top are live forecasts whose expiry has not arrived.</p></div>" +
      "</section>";

    return scorecard + reliability + coverage + diagnosis + ledgerCard +
           stackCard() + formulasCard();
  }

  function stackCard() {
    var stack = [
      ["Per-strike implied vol", "Each strike priced off its own IV, not one ATM number &mdash; the smile carries the market's own skew.", "live"],
      ["Black-Scholes N(d&#8322;)", "Risk-neutral probability the strike expires worthless. The POP column.", "live"],
      ["Kupiec / Brier / ECE", "Scoring rules that grade every forecast after the fact. This tab.", "live"],
      ["Breeden-Litzenberger", "Risk-neutral density straight from the chain: p(K) = e^{rT}&middot;&part;&sup2;C/&part;K&sup2;. Drops the lognormal assumption entirely &mdash; the single biggest accuracy upgrade available.", "next"],
      ["GARCH(1,1)", "Volatility forecast from realised returns, to set against implied and measure the variance risk premium directly.", "wait"],
      ["Cornish-Fisher expansion", "Skew and kurtosis correction to the tails, so 2&sigma; stops being a lie.", "wait"],
      ["Calibration haircut", "Feed this tab's own reliability curve back into stated POP, so the model self-corrects on live data.", "wait"]
    ];
    return '<section class="card"><div class="card-hd"><h2>Model stack</h2>' +
      '<span class="sub">what computes the numbers</span>' +
      '<div class="right"><span class="kpi-m">live &middot; next &middot; needs history</span></div></div><div>' +
      stack.map(function (s, i) {
        return '<div class="stack-row"><div class="stack-n">' + (i + 1) + '</div>' +
          '<div class="stack-k">' + s[0] + '</div><div class="stack-d">' + s[1] + "</div>" +
          '<div><span class="pill ' + s[2] + '">' +
          (s[2] === "live" ? "Live" : s[2] === "next" ? "Next" : "Needs history") + "</span></div></div>";
      }).join("") + "</div></section>";
  }

  function formulasCard() {
    return '<section class="card"><div class="card-hd"><h2>Scoring rules in use</h2></div>' +
      '<div class="readout">' +
      "<p><b>Brier score</b> &mdash; mean squared error of a probability forecast. 0 is perfect, 0.25 is a coin flip.</p>" +
      '<div class="formula">BS = (1/N) &Sigma; (p&#7522; &minus; o&#7522;)&sup2;</div>' +
      "<p><b>Expected calibration error</b> &mdash; weighted gap between stated confidence and observed frequency.</p>" +
      '<div class="formula">ECE = &Sigma; (n&#7495;/N) &middot; |acc(b) &minus; conf(b)|</div>' +
      "<p><b>Kupiec POF</b> &mdash; likelihood-ratio test that band breaches occur at the promised rate.</p>" +
      '<div class="formula">LR = &minus;2 ln[ (1&minus;p)^(N&minus;x) p^x / ((1&minus;x/N)^(N&minus;x) (x/N)^x ) ] ~ &chi;&sup2;(1)</div>' +
      "</div></section>";
  }

  function pr(k, v, klass, m2) {
    /* One helper renders every labelled figure on the desk, so teaching it
       to carry a term handle makes them all clickable at once. A label the
       registry does not know renders exactly as before. */
    var known = !!termKey(k);
    return '<div class="prob' + (known ? " has-term" : "") + '"' +
      (known ? ' data-term="' + esc(k) + '" tabindex="0" role="button"' : "") +
      '><div class="prob-k">' + k +
      (known ? '<span class="term-mark" aria-hidden="true">?</span>' : "") +
      '</div><div class="prob-v ' + klass + '">' + v +
      '</div><div class="kpi-m">' + m2 + "</div></div>";
  }

  /* ==========================================================
     6f. WATCHLIST
         Several lists behind one tab. Each is a different kind
         of instrument with a different source, so each renders
         its own way rather than being forced into one table.
     ========================================================== */
  function viewWatchlist(m) {
    if (!WATCH.length) {
      return '<section class="card"><div class="card-hd"><h2>Watchlist</h2></div>' +
        '<div class="caution"><p><b>No watchlist data.</b> ' +
        "Run  <em>python run_daily.py</em>  to populate expiries, futures and commodities.</p></div></section>";
    }

    var active = WATCH.filter(function (l) { return l.id === state.wl; })[0] || WATCH[0];
    state.wl = active.id;

    var tabs = '<div class="wl-tabs">' + WATCH.map(function (l) {
      return '<button class="wl-tab" data-wl="' + esc(l.id) + '" aria-selected="' +
        (l.id === active.id) + '">' + esc(l.title) + "</button>";
    }).join("") + "</div>";

    var body = active.kind === "options" ? wlOptions(active)
             : active.kind === "futures" ? wlFutures(active)
             : active.kind === "commodities" ? wlCommodities(active)
             : "";

    return '<section class="card"><div class="card-hd"><h2>Watchlist</h2>' +
      '<span class="sub">' + WATCH.length + " list(s)</span>" +
      '<div class="right"><span class="kpi-m">' + esc(active.tradeDate || "") + "</span></div></div>" +
      tabs + "</section>" + body;
  }

  function wlOptions(L) {
    var exps = L.expiries || [];
    if (!exps.length) return "";
    var ei = Math.min(state.wlExpiry, exps.length - 1);
    var e = exps[ei];

    var etabs = '<div class="wl-exp">' + exps.map(function (x, i) {
      return '<button class="wl-e" data-wlexp="' + i + '" aria-selected="' + (i === ei) + '">' +
        esc(x.label) + '<i>' + esc(x.expiry) + " &middot; " + x.days + "d" +
        (x.is_monthly ? " &middot; monthly" : "") + "</i></button>";
    }).join("") + "</div>";

    var atm = L.atm;
    var rows = e.strikes.slice().reverse().map(function (s) {
      var ce = s.ce || {}, pe = s.pe || {};
      var itmC = s.strike < L.spot, itmP = s.strike > L.spot;
      return '<tr class="clickable' + (s.strike === atm ? " atm" : "") + '"' +
        (s.strike === atm ? ' data-atm="1"' : "") + ' data-strike="' + s.strike + '">' +
        '<td class="' + (itmC ? "itm-c" : "") + '">' + n2(ce.oi != null ? ce.oi / 1e5 : null) + "</td>" +
        '<td class="' + (itmC ? "itm-c " : "") + cls(ce.chgOi) + '">' + sgn(ce.chgOi != null ? ce.chgOi / 1e5 : null, 2) + "</td>" +
        '<td class="' + (itmC ? "itm-c" : "") + '">' + n1(ce.iv) + "</td>" +
        '<td class="' + (itmC ? "itm-c" : "") + '">' + n2(ce.ltp) + "</td>" +
        '<td class="' + (itmC ? "itm-c " : "") + cls(ce.chgPct) + '">' + sgn(ce.chgPct, 1) + "%</td>" +
        '<td class="strike-cell">' + n0(s.strike) + "</td>" +
        '<td class="' + (itmP ? "itm-p " : "") + cls(pe.chgPct) + '">' + sgn(pe.chgPct, 1) + "%</td>" +
        '<td class="' + (itmP ? "itm-p" : "") + '">' + n2(pe.ltp) + "</td>" +
        '<td class="' + (itmP ? "itm-p" : "") + '">' + n1(pe.iv) + "</td>" +
        '<td class="' + (itmP ? "itm-p " : "") + cls(pe.chgOi) + '">' + sgn(pe.chgOi != null ? pe.chgOi / 1e5 : null, 2) + "</td>" +
        '<td class="' + (itmP ? "itm-p" : "") + '">' + n2(pe.oi != null ? pe.oi / 1e5 : null) + "</td></tr>";
    }).join("");

    return '<section class="card"><div class="card-hd"><h2>' + esc(L.title) + " options</h2>" +
      '<span class="sub">spot ' + n2(L.spot) + " &middot; &plusmn;" + n0(L.span) + " pts</span>" +
      '<div class="right"><span class="kpi-m">' + e.nStrikes +
        " strikes &middot; opens at the money</span></div></div>" +
      etabs +
      '<div class="tablewrap tall"><table class="dt chain"><thead><tr>' +
      '<th class="grp-c">Call OI</th><th class="grp-c">Chg OI</th><th class="grp-c">IV</th>' +
      '<th class="grp-c">LTP</th><th class="grp-c">Chg</th>' +
      '<th style="text-align:center">Strike</th>' +
      '<th class="grp-p">Chg</th><th class="grp-p">LTP</th><th class="grp-p">IV</th>' +
      '<th class="grp-p">Chg OI</th><th class="grp-p">Put OI</th>' +
      "</tr></thead><tbody>" + rows + "</tbody></table></div></section>";
  }

  function wlFutures(L) {
    return (L.groups || []).map(function (g) {
      var rows = (g.term || []).map(function (t) {
        return "<tr><td class=\"lft\">" + esc(t.expiry) + "</td>" +
          "<td>" + t.days + "</td>" +
          '<td style="color:var(--ink)">' + n2(t.price) + "</td>" +
          '<td class="' + cls(t.basis) + '">' + sgn(t.basis, 1) + "</td>" +
          '<td class="' + cls(t.basis_pct) + '">' + sgn(t.basis_pct, 3) + "%</td>" +
          "<td>" + (t.carry_annual_pct == null
                     ? '<span style="color:var(--ink-3)">&mdash;</span>'
                     : n2(t.carry_annual_pct) + "%") + "</td>" +
          "<td>" + n0(t.oi) + "</td>" +
          "<td>" + n0(t.vol) + "</td>" +
          '<td class="lft">' + (t.untraded
              ? '<span class="pill no">untraded</span>'
              : '<span class="pill go">liquid</span>') + "</td></tr>";
      }).join("");

      return '<section class="card"><div class="card-hd"><h2>' + esc(g.symbol) + " futures</h2>" +
        '<span class="sub">underlying ' + n2(g.spot) + "</span>" +
        '<div class="right"><span class="kpi-m">basis and annualised carry</span></div></div>' +
        '<div class="tablewrap"><table class="dt"><thead><tr>' +
        '<th class="lft">Expiry</th><th>Days</th><th>Price</th><th>Basis</th>' +
        "<th>Basis %</th><th>Carry</th><th>OI</th><th>Volume</th>" +
        '<th class="lft">State</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
        "</section>";
    }).join("") +
    '<section class="card"><div class="card-hd"><h2>Reading the carry</h2></div>' +
    '<div class="caution"><p>Carry is withheld on contracts with no open interest. ' +
    "Their quoted close is a carried-forward stub, not a traded price, and annualising it " +
    "produces a confident-looking number from nothing.</p>" +
    "<p>A rising basis across expiries is normal cost of carry. A <b>negative</b> basis means " +
    "the future trades below spot &mdash; the market is pricing something the index level does not " +
    "yet reflect.</p></div></section>";
  }

  function wlCommodities(L) {
    var rows = (L.items || []).map(function (it) {
      return "<tr><td class=\"lft\" style=\"color:var(--ink)\">" + esc(it.label) + "</td>" +
        '<td class="lft" style="color:var(--ink-3)">' + esc(it.symbol) + "</td>" +
        "<td>" + n2(it.last) + "</td>" +
        '<td class="' + cls(it.chg) + '">' + sgn(it.chg, 2) + "</td>" +
        '<td class="' + cls(it.chgPct) + '">' + sgn(it.chgPct, 2) + "%</td>" +
        "<td>" + n2(it.open) + "</td><td>" + n2(it.high) + "</td><td>" + n2(it.low) + "</td>" +
        '<td class="lft" style="color:var(--ink-3)">' + esc(it.unit || "") + "</td></tr>";
    }).join("");

    return '<section class="card"><div class="card-hd"><h2>Commodities &amp; FX</h2>' +
      '<span class="sub">international benchmarks</span></div>' +
      '<div class="caution"><p><b>Not MCX, and not rupees.</b> ' + esc(L.note || "") + "</p></div>" +
      '<div class="tablewrap"><table class="dt"><thead><tr>' +
      '<th class="lft">Instrument</th><th class="lft">Symbol</th><th>Last</th>' +
      "<th>Chg</th><th>Chg %</th><th>Open</th><th>High</th><th>Low</th>" +
      '<th class="lft">Unit</th></tr></thead><tbody>' + rows + "</tbody></table></div></section>";
  }

  /* ==========================================================
     6i. MODEL HISTORY
         One expandable card per session: everything the model
         computed that day, every claim it made, and how each
         one turned out. Model accuracy answers "how calibrated
         am I"; this answers "what did I say on the 17th, and
         which parts of it held".
     ========================================================== */
  var CLAIM_LABEL = {
    range_next:    "Next-session range",
    range_expiry:  "Expiry range 1&sigma;",
    range_2sd:     "Expiry range 2&sigma;",
    max_pain_pull: "Max pain pull",
    call_wall:     "Call wall holds",
    put_wall:      "Put wall holds",
    stance:        "Directional stance",
    vrp:           "Vol premium call",
    ce_survival:   "Short call holds",
    pe_survival:   "Short put holds"
  };

  function viewModelHistory(m) {
    var H = MHIST[state.idx];
    if (!H || !(H.entries || []).length) {
      return '<section class="card"><div class="card-hd"><h2>Model history</h2></div>' +
        '<div class="caution"><p><b>No archived sessions yet.</b> ' +
        "Run <em>python backfill.py</em> to populate the per-day record.</p></div></section>";
    }

    var rel = (H.reliability || []).slice().sort(function (a, b) {
      return (b.rate || 0) - (a.rate || 0);
    });
    var relRows = rel.map(function (r) {
      var pct = (r.rate || 0) * 100;
      var tone = pct >= 70 ? "var(--up)" : pct >= 55 ? "var(--warn)" : "var(--down)";
      return '<tr><td class="lft">' + (CLAIM_LABEL[r.claim] || esc(r.claim)) + "</td>" +
        "<td>" + r.n + "</td><td>" + r.hits + "</td>" +
        '<td style="color:' + tone + ';font-weight:600">' + n1(pct) + "%</td>" +
        '<td class="lft"><div class="relbar"><i style="width:' +
          Math.max(0, Math.min(100, pct)).toFixed(1) + "%;background:" + tone +
          '"></i></div></td></tr>';
    }).join("");

    var relCard =
      '<section class="card"><div class="card-hd"><h2>Which claims hold up</h2>' +
      '<span class="sub">every assertion, graded separately</span>' +
      '<div class="right"><span class="kpi-m">this is what tells you which part of the model to trust</span></div></div>' +
      '<div class="tablewrap"><table class="dt"><thead><tr>' +
      '<th class="lft">Claim</th><th>Graded</th><th>Correct</th><th>Hit rate</th>' +
      '<th class="lft">&nbsp;</th></tr></thead><tbody>' + relRows + "</tbody></table></div>" +
      '<div class="caution"><p>A single verdict per day hides which part of the model works. ' +
      "A session can call the range perfectly and still have a short strike taken out, or pin " +
      "max pain while the stance was backwards. Graded apart, these say <b>what to fix</b> " +
      "rather than only that something was wrong.</p></div></section>";

    var intro =
      '<section class="card"><div class="card-hd"><h2>Model history</h2>' +
      '<span class="sub">' + H.entries.length + " archived session(s)</span>" +
      '<div class="right"><span class="kpi-m">what was computed, what was claimed, what happened</span></div></div>' +
      '<div class="mh-intro">' +
        '<div><b>What this is</b><p>One card per trading session, frozen as the ' +
          "model saw it that morning. The quantitative block is the <em>archived</em> " +
          "calculation, not recomputed today, so a card from months ago still shows " +
          "the numbers that were actually in front of it.</p></div>" +
        '<div><b>What to read</b><p>Start with the score in the header &mdash; ' +
          "<em>4 / 6 claims</em> means six were gradable and four came true. Then the " +
          "claim table shows exactly which held and which did not. One session is " +
          "noise; the table above shows the pattern across all of them.</p></div>" +
        '<div><b>Why some rows are blank</b><p>A session forecasting a distant expiry ' +
          "has nothing to grade until that expiry arrives. Rows marked " +
          '<span class="mark pend">n/a</span> are not pending &mdash; they are claims ' +
          "that cannot be measured at all, such as volatility over a window too short " +
          "to estimate it.</p></div>" +
      "</div></section>";

    var entries = H.entries.slice(0, 40);
    var cards = entries.map(function (e, i) {
      var open = i === 0;
      var pct = e.nGraded ? (e.nCorrect / e.nGraded * 100) : null;
      var tone = pct == null ? "neu" : pct >= 70 ? "pos" : pct >= 50 ? "neu" : "neg";

      var claimRows = (e.claims || []).map(function (c) {
        /* Resolved with no verdict means the claim was never measurable --
           distinct from waiting for a horizon, and it should not read as a
           failure or as pending. */
        var mark;
        if (c.correct == null && c.resolvedOn) {
          mark = '<span class="mark pend" title="not measurable for this session">n/a</span>';
        } else if (c.correct == null) {
          mark = '<span class="mark pend" title="horizon has not arrived">&middot;</span>';
        } else {
          mark = '<span class="mark ' + (c.correct ? "hit" : "miss") + '">' +
                 (c.correct ? "&#10003;" : "&#10007;") + "</span>";
        }
        return '<tr><td class="lft">' + (CLAIM_LABEL[c.claim] || esc(c.claim)) + "</td>" +
          '<td class="lft" style="color:var(--ink-3)">' + esc(c.horizon) + "</td>" +
          '<td class="lft">' + esc(c.stated || "") + "</td>" +
          "<td>" + (c.actual != null ? n2(c.actual) : "&mdash;") + "</td>" +
          '<td class="lft" style="color:var(--ink-3)">' + esc(c.resolvedOn || "pending") + "</td>" +
          "<td>" + mark + "</td></tr>";
      }).join("");

      var q = e.quant || {};
      function qc(k, v, note) {
        if (v == null || v === "") return "";
        return '<div class="qcell"><div class="qk">' + k + "</div>" +
               '<div class="qv">' + v + "</div>" +
               (note ? '<div class="qn">' + note + "</div>" : "") + "</div>";
      }

      var quantGrid =
        qc("ATM IV", e.atmIv != null ? n2(e.atmIv) + "%" : null) +
        qc("Yang-Zhang 10d", q.yangZhang10 != null ? n2(q.yangZhang10) + "%" : null,
           q.closeClose10 != null ? "close-close " + n2(q.closeClose10) + "%" : "") +
        qc("HAR-RV forecast", q.harForecast != null ? n2(q.harForecast) + "%" : null) +
        qc("IV / RV", q.vrpRatio != null ? n2(q.vrpRatio) : null,
           q.vrpSpread != null ? sgn(q.vrpSpread, 2) + " vol pts" : "") +
        qc("IV rank", q.ivRank != null ? n1(q.ivRank) : null,
           q.ivPercentile != null ? "pctile " + n1(q.ivPercentile) : "") +
        qc("PCR", e.pcr != null ? n2(e.pcr) : null) +
        qc("Max pain", e.maxPain != null ? n0(e.maxPain) : null) +
        qc("OI walls", (e.putWall != null && e.callWall != null)
             ? n0(e.putWall) + " / " + n0(e.callWall) : null, "put / call") +
        qc("Forward", q.forward != null ? n0(q.forward) : null,
           q.basis != null ? "basis " + sgn(q.basis, 1) : "") +
        qc("Straddle", q.straddle != null ? n2(q.straddle) : null,
           q.straddleMove != null ? "&plusmn;" + n0(q.straddleMove) + " pts" : "") +
        qc("25&Delta; skew", q.riskReversal != null ? sgn(q.riskReversal, 2) : null,
           q.tilt || "") +
        qc("RND shape", q.rndSkew != null ? "skew " + sgn(q.rndSkew, 2) : null,
           q.rndKurtosis != null ? "kurt " + sgn(q.rndKurtosis, 2) : "") +
        qc("Regime", q.regime ? esc(q.regime) : null,
           q.sessionsToExpiry != null ? q.sessionsToExpiry + " sessions left" : "");

      return '<section class="card mh-card' + (open ? " open" : "") + '">' +
        '<button class="mh-hd" data-mh="' + esc(e.date) + '">' +
          '<span class="mh-date">' + esc(e.date) + "</span>" +
          '<span class="mh-meta">spot ' + n2(e.spot) +
            (e.expiry ? " &middot; exp " + esc(e.expiry) : "") +
            (e.stance ? " &middot; " + esc(e.stance.replace(/_/g, " ")) : "") + "</span>" +
          '<span class="mh-score ' + tone + '">' +
            (pct == null
               ? (e.claims || []).length + " claims &middot; awaiting"
               : e.nCorrect + " / " + e.nGraded + " claims") +
          "</span>" +
          '<span class="mh-chev">&#9662;</span>' +
        "</button>" +
        '<div class="mh-body">' +
          '<div class="mh-outcome">' +
            '<div><span class="qk">Next session</span><b>' +
              (e.nxClose != null ? n2(e.nxClose) + " (" + sgn(e.nxMove, 0) + ")" : "awaiting") +
              "</b><i>" + esc(e.nxDate || "next trading day") + "</i></div>" +
            '<div><span class="qk">At expiry</span><b>' +
              (e.settle != null ? n2(e.settle) + " (" + sgn(e.move, 0) + ")" : "awaiting") +
              "</b><i>" + (e.realisedSd != null
                 ? n2(e.realisedSd) + "&sigma; of the band"
                 : "settles " + esc(e.expiry || "-")) + "</i></div>" +
          "</div>" +
          '<div class="qgrid">' + quantGrid + "</div>" +
          '<div class="tablewrap"><table class="dt"><thead><tr>' +
            '<th class="lft">Claim</th><th class="lft">Horizon</th>' +
            '<th class="lft">Stated on the day</th><th>Actual</th>' +
            '<th class="lft">Resolved</th><th>&nbsp;</th>' +
          "</tr></thead><tbody>" + claimRows + "</tbody></table></div>" +
        "</div></section>";
    }).join("");

    return intro + relCard + cards;
  }

  /* ==========================================================
     6j. LEARNING
         Every technical term the desk uses, in plain language,
         worked through with the live numbers so each definition
         can be checked against the screen beside it.
     ========================================================== */
  function viewLearning(m) {
    var a = (m && m.an) || {};
    var rv = (a.realisedVol || {})["10"] || {};
    var vrp = a.vrp || {};
    var sk = a.skew || {};
    var st = a.straddle || {};
    var fwd = a.forward || {};
    var vr5 = (a.varianceRatio || {})["5"] || {};
    var cands = (m.cands || []).filter(function (c) { return c.verdict.c === "go"; });
    var ex = cands[0];

    /* Every term expands. The three blocks always answer the same three
       questions, in the same order: what it really is, what it changes
       about a decision, and when it is decisive against when it is noise.
       The third is the one most glossaries omit and the one that keeps a
       number from being used where it does not belong. */

    function T(term, plain, example, where) {
      var d = DEEP[term];
      return '<div class="lrn' + (d ? " has-deep" : "") + '"' +
          (d ? ' data-lrn="1" tabindex="0" role="button" aria-expanded="false"' : "") + ">" +
        '<div class="lrn-t">' + term +
          (d ? '<span class="lrn-chev" aria-hidden="true">&#9662;</span>' : "") + "</div>" +
        '<div class="lrn-p">' + plain + "</div>" +
        (example ? '<div class="lrn-e"><b>Today</b> ' + example + "</div>" : "") +
        (where ? '<div class="lrn-w">' + where + "</div>" : "") +
        (d ? '<div class="lrn-deep">' +
              '<div class="lrn-d"><span class="lrn-dk">What it really is</span>' + d[0] + "</div>" +
              '<div class="lrn-d"><span class="lrn-dk">What it changes</span>' + d[1] + "</div>" +
              '<div class="lrn-d"><span class="lrn-dk">When it matters, and when it is noise</span>' + d[2] + "</div>" +
             "</div>" : "") +
      "</div>";
    }

    function S(title, blurb, body) {
      return '<section class="card"><div class="card-hd"><h2>' + title + "</h2>" +
        (blurb ? '<span class="sub">' + blurb + "</span>" : "") + "</div>" +
        '<div class="lrn-grid">' + body + "</div></section>";
    }

    var head =
      '<section class="card"><div class="card-hd"><h2>Learning</h2>' +
      '<span class="sub">every term on this desk</span>' +
      '<div class="right">' +
        '<button class="tgl" type="button" data-lrnall="open">Expand all</button>' +
        '<button class="tgl" type="button" data-lrnall="shut">Collapse all</button>' +
      "</div></div>" +
      '<div class="mh-intro">' +
        '<div><b>How to use this</b><p>Each entry gives the plain meaning, a worked ' +
          "example from <em>today&rsquo;s actual data</em>, and where it appears on the " +
          "desk. Nothing here is invented &mdash; you can check every number against " +
          "the tab it names. <b>Click any term</b> to open it: what it really " +
          "is, what it changes about a decision, and when it is decisive " +
          "against when it is noise.</p></div>" +
        '<div><b>If you read one thing</b><p>The single most important number for a ' +
          "premium seller is <em>IV / RV</em>. It says whether the market is charging " +
          "more for risk than the risk has been costing. Everything else is context " +
          "around that.</p></div>" +
        '<div><b>What this desk cannot do</b><p>It does not predict direction, and its ' +
          "own scoring says so &mdash; the directional stance grades below a coin flip. " +
          "It measures <em>ranges and volatility</em>, which is a different and more " +
          "answerable question.</p></div>" +
      "</div></section>";

    /* ---------------------------------------------------- 1. the basics */
    var basics = S("1. The basics", "the vocabulary everything else is built on",
      T("Spot", "The index level right now. Not a tradeable instrument &mdash; you " +
        "trade futures or options on it.",
        "NIFTY spot is <b>" + n2(m.cfg.spot) + "</b>.", "Market strip, Overview") +
      T("Strike", "The price at which an option can be exercised. Chains are listed " +
        "in fixed steps &mdash; 50 points for NIFTY.",
        "The strike nearest spot is <b>" + n0(m.atm) + "</b>. That one is called ATM.",
        "Option chain &amp; OI") +
      T("CE and PE", "CE is a <b>call</b> &mdash; it gains when the index rises. " +
        "PE is a <b>put</b> &mdash; it gains when the index falls.",
        null, "Option chain &amp; OI") +
      T("ATM, ITM, OTM", "At / in / out of the money. A call is ITM when spot is " +
        "<em>above</em> its strike; a put is ITM when spot is <em>below</em>. " +
        "OTM options have no intrinsic value &mdash; only time value.",

      T("Expiry", "The date the contract settles. NIFTY has a weekly expiry every " +

    /* ------------------------------------------- 2. open interest */
    var oi = S("2. Open interest and positioning",
      "who is committed where, and what that implies",
      T("Open interest (OI)", "The number of contracts currently open at a strike. " +

        null, "Option chain &amp; OI") +
      T("Build-up (the four quadrants)",

        "becomes a barrier.<br>" +

      T("OI walls", "The strikes with the most open interest. Writers defend them, so " +

      T("Max pain", "The strike where option writers as a group lose least if the " +

    /* ------------------------------------------- 3. volatility */
    var vol = S("3. Volatility &mdash; the core of this desk",
      "what the market charges for risk, versus what risk has cost",
      T("Sigma (&sigma;)", "One standard deviation &mdash; the statistical unit of " +

        (vrp.ratio > 1.1 ? "&mdash; implied is rich, the seller is being paid."

          : "&mdash; roughly fair."),
        "Direction &amp; strategy") +
      T("Variance risk premium", "The name for that gap. It is real and persistent " +
        "&mdash; index IV exceeds later RV most of the time. But it is <em>payment for " +

    /* ------------------------------------------- 4. probability */
    var prob = S("4. Probability and pricing",
      "how the odds on each strike are worked out",
      T("Delta", "How much the option price moves for a 1-point move in the index. " +

        null, "Direction &amp; strategy") +
      T("Risk-neutral density", "The market's own probability distribution for where " +
