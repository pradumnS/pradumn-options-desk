        '<span class="rail-mono">' + p.mark + "</span></button>";
    }).join("");

    var rl = document.getElementById("railLearn");
    if (rl) rl.setAttribute("aria-current", state.view === "learning");

    var railIndices = document.getElementById("railIndices");
    if (railIndices) {
      railIndices.innerHTML = INDICES.map(function (c) {
        var m = MODEL[c.key], chg = (c.spot - c.prevClose) / c.prevClose * 100;
        return '<button class="rail-item" data-idx="' + c.key + '" aria-current="' +
          (c.key === state.idx) + '" title="' + esc(c.label) + '">' +
          '<span class="rail-txt">' + esc(c.label) + "</span>" +
          '<span class="rail-mono">' + railMark(c.key, c.label) + "</span>" +
          '<span class="spark ' + cls(chg) + '" data-chart="' + esc(c.label) +
            '" title="chart">' + sgn(chg, 2) + "%</span></button>";
      }).join("");
    }
  }

  /* ==========================================================
     6. RENDER &mdash; views
     ========================================================== */
  function ladder(m) {
    var rows = m.rows.slice().reverse();
    return rows.map(function (r) {
      var k = [];
      if (r.strike === m.callWall) k.push("wall-c");
      if (r.strike === m.putWall) k.push("wall-p");
      if (r.strike === m.atm) k.push("spot");
      if (r.strike === m.maxPain) k.push("mp");
      var flag = "";
      if (r.strike === m.atm) flag = '<span class="flag spot">Spot ' + n0(m.cfg.spot) + "</span>";
      else if (r.strike === m.maxPain) flag = '<span class="flag mp">Max pain</span>';
      else if (r.strike === m.callWall) flag = '<span class="flag cw">Call wall</span>';
      else if (r.strike === m.putWall) flag = '<span class="flag mp" style="color:var(--puts);border-color:var(--puts)">Put wall</span>';

      return '<button class="rung ' + k.join(" ") + '" data-strike="' + r.strike +
        '" data-rung=\'' + JSON.stringify({
          k: n0(r.strike),
          ceOi: n2(r.ce.oi), peOi: n2(r.pe.oi),
          ceChg: sgn(r.ce.chgOi, 2), peChg: sgn(r.pe.chgOi, 2),
          ceUp: r.ce.chgOi >= 0, peUp: r.pe.chgOi >= 0,
          ceLtp: n2(r.ce.ltp), peLtp: n2(r.pe.ltp),
          ceIv: r.ce.iv != null ? n2(r.ce.iv) + "%" : "\u2014",
          peIv: r.pe.iv != null ? n2(r.pe.iv) + "%" : "\u2014",
          pcr: r.ce.oi ? n2(r.pe.oi / r.ce.oi) : "\u2014",
          dist: sgn(r.strike - m.cfg.spot, 0)
        }).replace(/'/g, "&#39;") + "'>" +
        '<span class="side l"><span class="barval">' + n1(r.ce.oi) + '</span><span class="bartrack">' +
          '<span class="barfill" style="width:' + (r.ce.oi / m.maxOi * 100).toFixed(1) + '%"></span></span></span>' +
        '<span class="strike">' + n0(r.strike) + "</span>" +
        '<span class="side r"><span class="bartrack">' +
          '<span class="barfill" style="width:' + (r.pe.oi / m.maxOi * 100).toFixed(1) + '%"></span></span>' +
          '<span class="barval">' + n1(r.pe.oi) + "</span></span>" + flag + "</button>";
    }).join("");
  }
  function n1(v) { return nf(v, 1); }

  function verdict(m) {
    var c = m.cfg;
    var mpGap = c.spot - m.maxPain;
    var pcr = m.pcr;
    var call, conf;
    if (pcr > 1.15 && mpGap > 0) { call = "Bullish,<br>supported"; conf = 72; }
    else if (pcr < 0.85) { call = "Bearish<br>pressure"; conf = 68; }
    else { call = "Range-bound,<br>" + (mpGap > 0 ? "upward tilt" : "downward tilt"); conf = 61; }

    var d = [
      ["=", "neu", "PCR " + n2(pcr), pcr > 1.1 ? "Put writers dominant \u2014 <b>supportive</b> tone." :
        pcr < 0.9 ? "Call writers dominant \u2014 <b>capped</b> upside." :
        "Neutral. Put and call writing near balance \u2014 <b>no directional conviction</b> from the ratio alone."],
      [mpGap > 0 ? "\u2193" : "\u2191", mpGap > 0 ? "neg" : "pos", "Max pain",
        "Spot sits <b>" + n0(Math.abs(mpGap)) + " pts " + (mpGap > 0 ? "above" : "below") +
        "</b> max pain " + n0(m.maxPain) + " \u2014 mild pull " + (mpGap > 0 ? "lower" : "higher") + " into expiry."],
      ["\u2191", "pos", "OI walls",
        "Put base at <b>" + n0(m.putWall) + "</b>; heaviest call wall at <b>" + n0(m.callWall) + "</b>. Expected range between them."],
      [c.vixChg < 0 ? "\u2191" : "\u2193", c.vixChg < 0 ? "pos" : "neg", "Volatility",
        "India VIX <b>" + n2(c.vix) + "</b>, " + sgn(c.vixChg, 2) + "% \u2014 " +
        (c.vixChg < 0 ? "no stress bid. Supports range persistence." : "creeping higher. Watch for expansion.")]
    ];

    return '<section class="card verdict"><div class="verdict-main">' +
      '<div class="verdict-eyebrow">Positioning read</div>' +
      '<div class="verdict-call">' + call + "</div>" +
      '<div class="conf"><div class="conf-track"><div class="conf-fill" style="width:' + conf + '%"></div></div>' +
      '<div class="conf-val">' + conf + "% confidence</div></div>" +
      '<div class="kpi-m">Expiry ' + esc(c.expiry) +
        (m.dte != null ? " \u00b7 " + m.dte + (m.dte === 1 ? " day" : " days") + " left" : "") +
        "</div></div>" +
      '<div class="drivers">' + d.map(function (x) {
        return '<div class="driver"><div class="ico ' + x[1] + '">' + x[0] + '</div>' +
          '<div class="k">' + x[2] + '</div><div class="v">' + x[3] + "</div></div>";
      }).join("") + "</div></section>";
  }

  function kpis(m) {
    var c = m.cfg, chg = c.spot - c.prevClose, chgP = chg / c.prevClose * 100;
    var mpGap = c.spot - m.maxPain;
    var t = [
      ["Spot close", n0(Math.floor(c.spot)) + '<span style="font-size:14px;color:var(--ink-3)">.' +
        c.spot.toFixed(2).split(".")[1] + "</span>",
        '<span class="' + cls(chg) + '">' + sgn(chg, 2) + " &nbsp;" + sgn(chgP, 2) + "%</span>"],
      ["Day range", '<span style="font-size:15px">' + n0(c.low) + " &ndash; " + n0(c.high) + "</span>",
        "O " + n0(c.open) + " \u00b7 PC " + n2(c.prevClose)],
      ["Put / call ratio", n2(m.pcr), "5d avg " + n2(m.pcr * 0.96) + " \u00b7 neutral 0.9\u20131.1"],
      ['<span class="swatch" style="background:var(--maxpain)"></span> Max pain', n0(m.maxPain),
        "spot " + sgn(mpGap, 0) + " pts from strike"],
      ["India VIX", n2(c.vix), '<span class="' + cls(-c.vixChg) + '">' + sgn(c.vixChg, 2) + "%</span> \u00b7 20d band"],
      ["Total OI", n1(m.totC + m.totP) + '<span style="font-size:13px;color:var(--ink-3)">L</span>',
        "C " + n1(m.totC) + "L \u00b7 P " + n1(m.totP) + "L"]
    ];
    return '<section class="kpis">' + t.map(function (x) {
      return '<div class="card kpi"><div class="kpi-k">' + x[0] + '</div><div class="kpi-v">' + x[1] +
        '</div><div class="kpi-m">' + x[2] + "</div></div>";
    }).join("") + "</section>";
  }

  /* A line needs two points. With one stored session the honest output is a
     note about how many more are needed, not a chart of a single dot. */
  function needMore(have, need, what) {
    return '<div class="caution"><p><b>' + have + " of " + need + " sessions stored.</b> " +
      esc(what) + " appears once the daily job has run " + (need - have) +
      " more time" + (need - have === 1 ? "" : "s") + ".</p></div>";
  }

  function DTS(d) { return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" }); }

  function chartWrap(svg, series) {
    return '<div class="ch-wrap" data-series=\'' +
      JSON.stringify(series).replace(/'/g, "&#39;") + "'>" + svg +
      '<div class="ch-cross"></div><div class="ch-dot"></div><div class="ch-tip"></div></div>';
  }

  function sparkSvg(m) {
    var h = m.hist.slice().reverse().filter(function (x) { return x.close != null; });
    if (h.length < 2) return needMore(h.length, 2, "The price history chart");

    var vals = h.map(function (x) { return x.close; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), rng = hi - lo || 1;
    var maxVol = h.reduce(function (mx, x) { return Math.max(mx, x.volume || 0); }, 0);
    var pts = [], coords = [];
    h.forEach(function (x, i) {
      var px = i / (h.length - 1) * 320, py = 82 - (x.close - lo) / rng * 70;
      coords.push(px.toFixed(1) + "," + py.toFixed(1));
      pts.push({
        x: px, y: py, date: DTS(x.date), iso: x.date, big: n2(x.close),
        chg: x.chgPct != null ? sgn(x.chgPct, 2) + "%" : null,
        chgUp: x.chgPct != null ? x.chgPct >= 0 : null,
        rows: [["Open", n2(x.o)], ["High", n2(x.h)], ["Low", n2(x.l)], ["Close", n2(x.c)]],
        vol: x.volume ? {
          pct: maxVol ? (x.volume / maxVol * 100) : 0,
          label: n1(x.volume / 1e7) + " Cr sh" +
                 (x.turnover ? "  &middot;  &#8377;" + n0(x.turnover) + " Cr" : "")
        } : null
      });
    });
    var last = pts[pts.length - 1];

    var svg = '<svg viewBox="0 0 330 104" role="img" aria-label="' + esc(m.cfg.label) +
      " close over the last " + h.length + ' sessions.">' +
      '<line class="gridline" x1="0" y1="12" x2="330" y2="12"></line>' +
      '<line class="gridline" x1="0" y1="47" x2="330" y2="47"></line>' +
      '<line class="gridline" x1="0" y1="82" x2="330" y2="82"></line>' +
      '<text class="axis" x="0" y="9">' + n0(hi) + "</text>" +
      '<text class="axis" x="0" y="93">' + n0(lo) + "</text>" +
      '<polygon fill="var(--calls-dim)" points="' + coords.join(" ") + ' 320,82 0,82"></polygon>' +
      '<polyline fill="none" stroke="var(--calls)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="' +
        coords.join(" ") + '"></polyline>' +
      '<circle cx="' + last.x.toFixed(1) + '" cy="' + last.y.toFixed(1) +
        '" r="3.4" fill="var(--calls)" stroke="var(--surface)" stroke-width="2"></circle>' +
      "</svg>";

    return chartWrap(svg, { pts: pts, color: "var(--calls)",
                            vbWidth: 330, vbTop: 0, vbHeight: 104 });
  }

  function pcrSvg(m) {
    var h = m.hist.slice().reverse().filter(function (x) { return x.pcr != null; });
    if (h.length < 2) return needMore(h.length, 2, "The PCR trend");

    var pts = [], coords = [];
    h.forEach(function (x, i) {
      var px = i / (h.length - 1) * 330;
      var py = 82 - Math.min(1, Math.max(0, (x.pcr - 0.8) / 0.5)) * 70;
      coords.push(px.toFixed(1) + "," + py.toFixed(1));
      pts.push({
        x: px, y: py, date: DTS(x.date), iso: x.date, big: n2(x.pcr),
        chg: x.pcr > 1.1 ? "put-heavy" : x.pcr < 0.9 ? "call-heavy" : "neutral",
        chgUp: x.pcr >= 1,
        rows: [["Close", n2(x.close)], ["Max pain", n0(x.mp)],
               ["ATM IV", x.atmIv != null ? n2(x.atmIv) + "%" : "&mdash;"],
               ["India VIX", n2(x.vix)]],
        vol: null
      });
    });
    var last = pts[pts.length - 1];

    var svg = '<svg viewBox="0 0 330 104" role="img" aria-label="Put-call ratio over ' +
      h.length + ' sessions.">' +
      '<rect x="0" y="33" width="330" height="28" fill="var(--surface-2)"></rect>' +
      '<line class="gridline" x1="0" y1="54" x2="330" y2="54" stroke-dasharray="3 3"></line>' +
      '<text class="axis" x="0" y="30">1.10</text><text class="axis" x="0" y="74">0.90</text>' +
      '<polyline fill="none" stroke="var(--puts)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="' +
        coords.join(" ") + '"></polyline>' +
      '<circle cx="' + last.x.toFixed(1) + '" cy="' + last.y.toFixed(1) +
        '" r="3.4" fill="var(--puts)" stroke="var(--surface)" stroke-width="2"></circle>' +
      "</svg>";

    return chartWrap(svg, { pts: pts, color: "var(--puts)",
                            vbWidth: 330, vbTop: 0, vbHeight: 104 });
  }

  function viewOverview(m) {
    return verdict(m) + kpis(m) +
      '<section class="card"><div class="card-hd"><h2>Open interest by strike</h2>' +
      '<span class="sub">' + esc(m.cfg.expiry) + " \u00b7 lakh contracts</span>" +
      '<div class="right"><span class="sub">Click a strike for detail</span></div></div>' +
      '<div class="ladder-wrap tall"><div class="ladder"><div class="ladder-head">' +
      '<div class="l">&larr; Call OI (resistance)</div><div class="c">Strike</div>' +
      '<div class="r">Put OI (support) &rarr;</div></div>' + ladder(m) +
      '<div class="legend">' +
      '<span><span class="swatch" style="background:var(--calls)"></span> Call OI</span>' +
      '<span><span class="swatch" style="background:var(--puts)"></span> Put OI</span>' +
      '<span><span class="swatch" style="background:var(--maxpain)"></span> Max pain strike</span>' +
      "<span>Ringed bar = heaviest wall on that side</span></div></div></div></section>" +
      '<div class="two">' +
      '<section class="card"><div class="card-hd"><h2>' + esc(m.cfg.label) + " &mdash; 15 sessions</h2>" +
      '<span class="sub">daily close</span></div><div class="chart-body">' + sparkSvg(m) + "</div></section>" +
      '<section class="card"><div class="card-hd"><h2>PCR trend</h2><span class="sub">15 sessions</span>' +
      '<div class="right"><span class="kpi-m">neutral band 0.9 &ndash; 1.1</span></div></div>' +
      '<div class="chart-body">' + pcrSvg(m) + "</div></section></div>" + pipeline(m);
  }

  function pageIntro(title, description, meta) {
    return '<header class="page-intro"><div><h1>' + title + '</h1><p>' + description +
      '</p></div><div class="page-meta">' + (meta || "") + "</div></header>";
  }

  function marketAsset(label, value, detail, missing) {
    return '<div class="market-asset' + (missing ? " market-asset-missing" : "") + '">' +
      '<div class="market-asset-k">' + label + "</div>" +
      '<div class="market-asset-v">' + value + "</div>" +
      '<div class="market-asset-m">' + detail + "</div></div>";
  }

  function marketGroup(title, tag, page, assets, footer) {
    return '<section class="card market-card"><div class="market-card-hd"><h2>' + title +
      '</h2><span>' + tag + "</span></div>" +
      '<div class="market-card-body" data-count="' + assets.length + '">' + assets.join("") + "</div>" +
      '<div class="market-card-ft"><small>' + footer + '</small><button class="page-link" type="button" data-page="' +
      page + '">Open section &rarr;</button></div></section>';
  }

  function assetFromInst(key, label) {
    var inst = moInst(key);
    if (!inst || !inst.price || inst.price.last == null) {
      return marketAsset(label, "Quote not connected", '<span class="source-unavailable">No value in the stored feed</span>', true);
    }
    var p = inst.price, cur = inst.currency;
    return marketAsset(esc(label), moMoney(p.last, cur),
      '<span class="' + cls(p.chgPct) + '">' + moPctTxt(p.chgPct) + "</span> &middot; " +
      esc(inst.unit || moUnitShort(inst)) + " &middot; " + moDate(p.asOf) +
      (p.contract ? " &middot; MCX settlement via Moneycontrol" : " &middot; Yahoo Finance front month"), false);
  }

  function intlItem(symbol) {
    var items = (INTERNATIONAL && INTERNATIONAL.items) || [];
    var found = null;
    for (var i = 0; i < items.length; i++) {
      if (items[i].symbol === symbol) {
        found = items[i];
        break;
      }
    }
    var quote = watchItem(symbol);
    if (!found && !quote) return null;
    var kind = symbol === "^IRX" || symbol === "^TNX" || symbol === "^TYX"
      ? "rate" : symbol === "BTC-USD" || symbol === "ETH-USD"
      ? "crypto" : symbol === "GC=F" || symbol === "SI=F" || symbol === "HG=F" ||
        symbol === "ALI=F" || symbol === "CL=F" || symbol === "BZ=F"
      ? "commodity" : "fx";
    found = found || { symbol: symbol, kind: kind, moves: {}, history: [] };
    if (found.kind == null) found.kind = kind;
    if (found.last == null && quote) found.last = quote.last;
    if (!found.asOf && quote) found.asOf = quote.tradeDate;
    if (!found.unit && quote) found.unit = quote.unit;
    found.moves = found.moves || {};
    if (!found.moves["1D"] && quote) {
      var delta = quote.chg;
      found.moves["1D"] = {
        delta: delta,
        percent: quote.chgPct,
        basisPoints: found.kind === "rate" && delta != null ? delta * 100 : null
      };
    }
    return found;
  }

  function watchItem(symbol) {
    for (var i = 0; i < WATCH.length; i++) {
      var items = WATCH[i].items || [];
      for (var j = 0; j < items.length; j++) {
        if (items[j].symbol === symbol) return items[j];
      }
    }
    return null;
  }

  function intlPrice(item, value) {
    if (value == null || !isFinite(value)) return "\u2014";
    if (item.kind === "rate") return n3(value) + "%";
    if (item.kind === "crypto") return item.symbol === "BTC-USD" ? "$" + n0(value) : "$" + n2(value);
    if (item.symbol === "EURUSD=X") return nf(value, 4);
    return n2(value);
  }

  function intlMove(item, horizon) {
    var move = (item.moves || {})[horizon];
    if (!move) return "\u2014";
    if (item.kind === "rate") {
      return move.basisPoints == null ? "\u2014" :
        '<span class="' + cls(move.basisPoints) + '">' + sgn(move.basisPoints, 1) + " bp</span>";
    }
    return move.percent == null ? "\u2014" :
      '<span class="' + cls(move.percent) + '">' + sgn(move.percent, 2) + "%</span>";
  }

  function internationalAsset(symbol, label) {
    var item = intlItem(symbol), quote = watchItem(symbol);
    var last = item && item.last != null ? item.last : quote && quote.last;
    if (last == null) {
      return marketAsset(esc(label), "Quote not connected",
        "No value in the saved feed; no estimate substituted", true);
    }
    item = item || { symbol: symbol, kind: "fx", unit: quote.unit, moves: {} };
    var asOf = item.asOf || (quote && (quote.liveTs || quote.tradeDate)) || "date unavailable";
    var daily = intlMove(item, "1D");
    if (daily === "\u2014" && quote && quote.chgPct != null && item.kind !== "rate") {
      daily = '<span class="' + cls(quote.chgPct) + '">' + sgn(quote.chgPct, 2) + "%</span>";
    }
    if (item.kind === "rate" && daily === "\u2014" && quote && quote.chg != null) {
      daily = '<span class="' + cls(quote.chg) + '">' + sgn(quote.chg * 100, 1) + " bp</span>";
    }
    return marketAsset(esc(label), intlPrice(item, last),
      (daily === "\u2014" ? "Daily move unavailable" : daily) + " &middot; " +
      esc(item.unit || quote && quote.unit || "") + " &middot; " + esc(asOf) +
      " &middot; Yahoo Finance daily observation", false);
  }

  function internationalMovesTable(symbols) {
    var rows = symbols.map(function (entry) {
      var item = intlItem(entry[0]) || { symbol: entry[0], kind: "fx", moves: {} };
      var quote = watchItem(entry[0]);
      var last = item.last != null ? item.last : quote && quote.last;
      var source = item.asOf || quote && quote.tradeDate || "\u2014";
      return '<tr><td class="lft">' + esc(entry[1]) + "</td>" +
        "<td>" + (last == null ? "\u2014" : intlPrice(item, last)) + "</td>" +
        "<td>" + intlMove(item, "1D") + "</td><td>" + intlMove(item, "1W") + "</td>" +
        "<td>" + intlMove(item, "1M") + "</td><td>" + intlMove(item, "6M") + "</td>" +
        "<td>" + intlMove(item, "1Y") + "</td>" +
        '<td class="lft">' + esc(source) + "</td></tr>";
    }).join("");
    return '<div class="tablewrap"><table class="dt"><thead><tr>' +
      '<th class="lft">Instrument</th><th>Last</th><th>1D</th><th>1W</th><th>1M</th>' +
      "<th>6M</th><th>1Y</th><th class=\"lft\">As of</th></tr></thead><tbody>" +
      rows + "</tbody></table></div>";
  }

  function internationalRate(market, tenor) {
    var rates = (INTERNATIONAL && INTERNATIONAL.rates) || [];
    for (var i = 0; i < rates.length; i++) {
      if (rates[i].market === market && rates[i].tenor === tenor) return rates[i];
    }
    return null;
  }

  function internationalYieldMovesTable() {
    var tenors = ["2M", "6M", "1Y", "2Y", "10Y", "30Y"];
    var rows = tenors.map(function (tenor) {
      var item = internationalRate("United States", tenor);
      return "<tr><td class=\"lft\">" + tenor + "</td>" +
        "<td>" + (item ? n3(item.yieldPct) + "%" : "\u2014") + "</td>" +
        '<td class="lft">' + esc(item && item.asOf || "\u2014") + "</td>" +
        ["1D", "1W", "1M", "6M", "1Y"].map(function (horizon) {
          var change = item && item.changesBp && item.changesBp[horizon];
          return "<td>" + (change == null ? "\u2014" :
            '<span class="' + cls(change) + '">' + sgn(change, 1) + " bp</span>") + "</td>";
        }).join("") + "</tr>";
    }).join("");
    return '<div class="tablewrap"><table class="dt"><thead><tr>' +
      '<th class="lft">US tenor</th><th>Yield</th><th class="lft">As of</th>' +
      "<th>1D</th><th>1W</th><th>1M</th><th>6M</th><th>1Y</th>" +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>";
  }

  function internationalPositionsTable(matchTerms) {
    var positions = (INTERNATIONAL && INTERNATIONAL.positions) || [];
    if (matchTerms && matchTerms.length) {
      positions = positions.filter(function (p) {
        return matchTerms.some(function (term) {
          return String(p.market || "").toLowerCase().indexOf(term.toLowerCase()) >= 0;
        });
      });
    }
    if (!positions.length) {
      return '<div class="tablewrap"><table class="dt"><tbody>' +
        '<tr><td class="lft">No matching selected CFTC futures positions are present in the saved snapshot.</td></tr>' +
        "</tbody></table></div>";
    }
    var rows = positions.map(function (p) {
      var net = p.net == null ? "\u2014" : (p.net > 0 ? "+" : "") + n0(p.net);
      var change = p.netChange == null ? "\u2014" :
        '<span class="' + cls(p.netChange) + '">' +
        (p.netChange > 0 ? "+" : "") + n0(p.netChange) + "</span>";
      var netOi = p.netPercentOfOi == null ? "\u2014" :
        sgn(p.netPercentOfOi, 1) + "%";
      return '<tr><td class="lft">' + esc(p.market) + "</td>" +
        '<td class="lft">' + esc(p.category) + " \u00b7 " + esc(p.reportType) + "</td>" +
        "<td>" + net + "</td><td>" + change + "</td>" +
        "<td>" + n0(p.openInterest) + "</td><td>" + netOi + "</td>" +
        '<td class="lft">' + esc(p.asOf) + "</td></tr>";
    }).join("");
    return '<div class="tablewrap tall"><table class="dt"><thead><tr>' +
      '<th class="lft">Futures market</th><th class="lft">CFTC category</th>' +
      "<th>Net</th><th>Weekly \u0394 net</th><th>Open interest</th>" +
      "<th>Net / OI</th><th class=\"lft\">Position date</th>" +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>";
  }

  function marketPositionEvidence(keys) {
    var rows = keys.map(function (key) {
      var inst = moInst(key);
      if (!inst) return null;
      var oi = inst.price && inst.price.oi;
      var evidence = moEv(inst, "buildup");
      var signal = oi == null ? "Unavailable \u2014 no open-interest feed" :
        evidence ? evidence.value : "OI present; signal not classified";
      return '<tr><td class="lft">' + esc(inst.label) + "</td>" +
        "<td>" + (oi == null ? "\u2014" : n0(oi)) + "</td>" +
        '<td class="lft">' + esc(signal) + "</td>" +
        '<td class="lft">' + (oi == null ? "No build-up/covering label assigned" :
          "Price/OI convention only; not evidence of trader intent") + "</td></tr>";
    }).filter(Boolean).join("");
    if (!rows) {
      rows = '<tr><td colspan="4" class="lft">No verified open-interest or trader-position feed is connected for these instruments.</td></tr>';
    }
    return '<section class="card"><div class="card-hd"><h2>Positioning evidence</h2>' +
      '<span class="sub">observed OI only; intent is not observable here</span></div>' +
      '<div class="tablewrap"><table class="dt"><thead><tr><th class="lft">Instrument</th>' +
      "<th>Open interest</th><th class=\"lft\">Signal</th><th class=\"lft\">Interpretation</th>" +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>" +
      '<div class="caution"><p><b>Evidence rule.</b> Price rising with OI rising is commonly called long build-up; falling price with rising OI, short build-up; rising price with falling OI, short covering; falling price with falling OI, long liquidation. These are mechanical price/OI labels, not proof of who traded or why. CFTC reports are weekly and delayed; they cannot establish an individual trader\u2019s hedging intent.</p></div></section>';
  }

  function marketInstrumentDetails(keys) {
    var blocks = keys.map(function (key) {
      var inst = moInst(key);
      if (!inst) return "";
      return '<details class="mo-hist"><summary>Open full evidence &middot; ' +
        esc(inst.label) + "</summary>" + moInstBlock(inst) + "</details>";
    }).join("");
    return blocks ? '<section class="card"><div class="card-hd"><h2>Instrument detail</h2>' +
      '<span class="sub">expand for horizons, model evidence and session history</span></div>' +
      blocks + "</section>" : "";
  }

  /* ---------- morning brief (brief.json) ----------
     Read top to bottom: glance at the heat strip, read why each market
     moved, act from the decision table, learn from yesterday's graded call.
     Every sentence arrives assembled upstream from stored figures; each
     reason carries its source. Text fields may hold entities (&#8377;),
     so they are inserted as built, never from user input. */
  function brfChg(v) {
    if (v == null || !isFinite(v)) return "\u2014";
    return (v > 0 ? "+" : "") + n2(v) + "%";
  }
  function brfHeat(v) {
    if (v == null) return "brf-h0";
    return v >= 1 ? "brf-hu2" : v >= 0.25 ? "brf-hu1" : v <= -1 ? "brf-hd2" : v <= -0.25 ? "brf-hd1" : "brf-h0";
  }
  function briefSection() {
    var b = BRIEF || {};
    if (!b.stories || !b.stories.length) {
      return '<section class="card brf"><div class="card-hd"><h2>Morning brief</h2>' +
        '<span class="sub">why markets moved and what to do today</span></div>' +
        '<div class="brf-pad">The brief is built by <b>export_snapshot.py</b> after the evening feeds. It is not in this snapshot yet.</div></section>';
    }
    var flow = '<div class="brf-flow">' + [
      ["1 \u00b7 Glance", "What moved", "10 seconds"], ["2 \u00b7 Read", "Why it happened", "3 minutes, before the open"],
      ["3 \u00b7 Act", "Decision table", "during the session"], ["4 \u00b7 Learn", "Yesterday's lesson", "after the close"]
    ].map(function (f) {
      return '<div><span class="brf-step">' + f[0] + '</span><b>' + f[1] + '</b><span class="brf-dim">' + f[2] + "</span></div>";
    }).join("") + "</div>";

    var one = '<div class="brf-one"><span class="brf-tag">Today</span><span><b>' + b.oneLine + '</b></span>' +
      '<span class="brf-dim">Built ' + esc(b.generatedAt || "") + " from the " + esc(b.session || "") +
      " session. Re-check at the open.</span></div>";

    var heat = '<div class="brf-heat">' + (b.heat || []).map(function (h) {
      return '<div class="' + brfHeat(h.chg) + '"><span>' + esc(h.label) + '</span><span class="brf-num">' + brfChg(h.chg) + "</span></div>";
    }).join("") + "</div>";

    var stories = '<div class="brf-stories">' + b.stories.map(function (s) {
      var why = (s.why || []).map(function (r) {
        var src = r.link
          ? '<a class="brf-src brf-' + esc(r.kind) + '" href="' + esc(r.link) + '" target="_blank" rel="noopener">' + esc(r.source) + "</a>"
          : '<span class="brf-src brf-' + esc(r.kind) + '">' + esc(r.source) + "</span>";
        return "<li><span>" + r.text + "</span>" + src + "</li>";
      }).join("");
      return '<article class="card brf-story"><div class="brf-title"><b>' + s.title + '</b><span class="brf-dim">' + s.sub + "</span></div>" +
        '<div class="brf-body"><div><div class="brf-h">What happened</div><p>' + (s.what || []).join(" ") + "</p></div>" +
        '<div><div class="brf-h">Why</div><ul class="brf-why">' + why + "</ul></div>" +
        '<div class="brf-so"><b>So today:</b> ' + s.so + "</div></div>" +
        '<div class="brf-foot"><span class="brf-learn" data-term="' + esc(s.learn) + '" tabindex="0">Learn: ' + esc(s.learnLabel) + "</span>" +
        '<span class="brf-open" data-page="' + esc(s.page) + '" tabindex="0">Open section &rarr;</span></div></article>';
    }).join("") + "</div>";

    var groups = [];
    var rows = (b.table || []).map(function (r) {
      var g = "";
      if (groups.indexOf(r.group) < 0) {
        groups.push(r.group);
        g = '<tr class="brf-grp"><td colspan="7" data-term="Morning brief">' + esc(r.group) + "</td></tr>";
      }
      var chg = r.chgText || brfChg(r.chg);
      return g + '<tr' + (r.focus ? ' class="brf-focus"' : "") + '><td class="lft" data-term="Morning brief"><b>' + esc(r.market) + "</b></td>" +
        '<td class="brf-num">' + r.last + '<br><span class="' + cls(r.chg) + '">' + chg + "</span></td>" +
        '<td class="brf-num">' + r.range + '<br><span class="brf-dim">' + esc(r.rangeNote || "") + "</span></td>" +
        '<td><span class="brf-chip brf-' + esc(r.chip) + '">' + esc(r.call) + "</span>" +
          (r.detail ? '<br><span class="brf-dim">' + esc(r.detail) + "</span>" : "") + "</td>" +
        '<td class="lft">' + (r.act ? esc(r.act) : '<span class="brf-dim">\u2014</span>') + "</td>" +
        '<td class="lft">' + (r.cancel ? esc(r.cancel) : '<span class="brf-dim">\u2014</span>') + "</td>" +
        '<td class="brf-num">' + (r.record ? esc(r.record) : '<span class="brf-dim">\u2014</span>') + "</td></tr>";
    }).join("");
    var table = '<section class="card brf"><div class="card-hd"><h2>Decision table</h2>' +
      '<span class="sub">the same calls as the stories, for use during the session</span></div>' +
      '<div class="tablewrap"><table class="dt brf-table"><thead><tr><th class="lft">Market</th><th>Last</th>' +
      "<th>Range ahead</th><th>Call</th><th class=\"lft\">Act if</th><th class=\"lft\">Cancel if</th><th>Record</th></tr></thead><tbody>" +
      rows + "</tbody></table></div></section>";

    var l = b.lesson;
    var lesson = l ? '<section class="card brf"><div class="card-hd"><h2>Yesterday\u2019s lesson</h2>' +
      '<span class="sub">graded ' + esc(l.resolvedOn) + " &middot; " + esc(l.verdict) + "</span></div>" +
      '<div class="brf-lesson"><div><div class="brf-h">The call</div><p>' + esc(l.call) + "</p></div>" +
      '<div><div class="brf-h">What happened</div><p>' + esc(l.what) + (l.why ? " " + l.why : "") + "</p></div>" +
      '<div><div class="brf-h">What to watch</div><p>' + esc(l.watch) + "</p></div></div></section>" : "";

    return '<section class="card brf"><div class="card-hd"><h2>Morning brief</h2>' +
      '<span class="sub">what happened, why, and what to do today</span></div>' +
      '<div class="brf-pad">' + flow + one + heat + "</div></section>" + stories + table + lesson;
  }

  /* ==========================================================
     METAL INDEX \u00b7 managed-money positioning study
     Data: snapshot/metals.json, written by metals_cot.py.
     Everything in this block is mtl-prefixed and owned by the
     Metal Index tab. It reads shared helpers but changes none.
     ========================================================== */
  var MTL = {};
  var mtlState = { metal: "gold" };
  if (NAV_HASH.page === "metal-index" && NAV_HASH.sub) mtlState.metal = NAV_HASH.sub;

  function mtlOk(v) { return v !== null && v !== undefined && isFinite(Number(v)); }
  function mtlN(v) { return mtlOk(v) ? Math.round(v).toLocaleString("en-US") : "\u2014"; }
  function mtlS(v) {
    if (!mtlOk(v)) return "\u2014";
    return (v > 0 ? "+" : v < 0 ? "\u2212" : "") + Math.abs(Math.round(v)).toLocaleString("en-US");
  }
  function mtlP(v, d) {
    if (!mtlOk(v)) return "\u2014";
    d = d == null ? 1 : d;
    return (v > 0 ? "+" : v < 0 ? "\u2212" : "") + Math.abs(v).toFixed(d) + "%";
  }
  function mtlBp(v) { return mtlOk(v) ? (v > 0 ? "+" : v < 0 ? "\u2212" : "") + Math.abs(v).toFixed(0) + " bp" : "\u2014"; }
  function mtlCol(v, txt) { return '<span class="' + (mtlOk(v) ? (v > 0 ? "pos" : v < 0 ? "neg" : "neu") : "neu") + '">' + txt + "</span>"; }
  function mtlDate(d, short) {
    if (!d) return "\u2014";
    var o = short ? { day: "numeric", month: "short", year: "2-digit", timeZone: "UTC" }
                  : { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" };
    return new Date(d + "T00:00:00Z").toLocaleDateString("en-GB", o);
  }
  function mtlUsd(v) {
    if (!mtlOk(v)) return "\u2014";
    var a = Math.abs(v);
    return (v < 0 ? "\u2212" : "") + "$" + (a >= 1e9 ? (a / 1e9).toFixed(1) + "bn" : a >= 1e6 ? (a / 1e6).toFixed(0) + "m" : Math.round(a).toLocaleString("en-US"));
  }
  function mtlPx(m, v) {
    if (!mtlOk(v)) return "\u2014";
    return "$" + Number(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: v < 20 ? 3 : 2 });
  }
  function mtlCur() {
    var ms = MTL.metals || [];
    for (var i = 0; i < ms.length; i++) if (ms[i].key === mtlState.metal) return ms[i];
    return ms[0] || null;
  }
  function mtlStudy(m, key) {
    for (var i = 0; i < (m.study || []).length; i++) if (m.study[i].key === key) return m.study[i];
    return {};
  }
  function mtlCrowdLabel(c) {
    if (!mtlOk(c)) return { t: "Not enough history", k: "neu" };
    if (c >= 85) return { t: "Crowded long", k: "hot" };
    if (c >= 65) return { t: "Leaning long", k: "warm" };
    if (c > 35) return { t: "Middle of range", k: "mid" };
    if (c > 15) return { t: "Leaning short", k: "cool" };
    return { t: "Washed out", k: "cold" };
  }
  function mtlSide(n) { return n > 0 ? "net long" : n < 0 ? "net short" : "flat"; }
  function mtlStrength(r) {
    var a = Math.abs(r || 0);
    return a >= 0.4 ? "Strong" : a >= 0.2 ? "Moderate" : a >= 0.1 ? "Weak" : "No real link";
  }
  function mtlEn(n) { return n === 1 ? "1st" : n === 2 ? "2nd" : n === 3 ? "3rd" : n + "th"; }

  /* ---- the whole positioning desk ------------------------------------ */
  function mtlDesk() {
    var ms = MTL.metals || [];
    if (!ms.length) {
      return '<section class="card"><div class="card-hd"><h2>Managed money positioning</h2></div>' +
        '<div class="coverage-note"><b>Positioning study not loaded.</b> snapshot/metals.json is missing or empty. Run <em>python metals_cot.py</em> (or the daily export) and reload.</div></section>';
    }
    var m = mtlCur();
    return '<section class="card mtl-intro"><div class="card-hd"><h2>Managed money: who is positioned, and why it changes</h2>' +
        '<span class="sub">CFTC Disaggregated COT \u00b7 positions as of ' + esc(mtlDate(MTL.asOf)) +
        ' \u00b7 next report ' + esc(mtlDate(MTL.nextRelease)) + "</span></div>" +
        '<div class="mtl-lede"><p><b>Managed money</b> is the CFTC\u2019s label for hedge funds and commodity trading advisers (CTAs). They are the speculators: they trade metals to profit from the price, not to hedge a mine, a refinery or a jewellery business. Their positions swing the most, so their changes explain a large share of medium-term moves. This section shows what they hold, what they changed this week, and what has actually driven their changes over ' +
        (m ? Math.round(m.weeksStored / 52) : 6) + " years of weekly data, so you can learn to read them yourself.</p></div>" +
        mtlSummary(ms) + "</section>" +
      mtlDecodeCard(m) +
      mtlChartsCard(m) +
      mtlDriversCard(m) +
      mtlEpisodesCard(m) +
      mtlWeeklyCard(m) +
      mtlCrowdCard(m) +
      mtlOtherSideCard(m) +
      mtlPrimerCard();
  }

  function mtlSummary(ms) {
    var rows = ms.map(function (m) {
      var L = m.latest, c = mtlCrowdLabel(L.cot), on = m.key === mtlState.metal;
      return '<tr class="mtl-row' + (on ? " on" : "") + '" data-mtl="' + m.key + '">' +
        '<td class="lft"><b>' + esc(m.label) + "</b><span class=\"mtl-ex\">" + esc(m.exchange) + "</span></td>" +
        "<td>" + mtlPx(m, L.px) + '<div class="kpi-m">' + mtlCol(L.pxW, mtlP(L.pxW, 1)) + " wk</div></td>" +
        "<td>" + mtlS(L.net) + '<div class="kpi-m">' + mtlUsd(L.notionalUsd) + "</div></td>" +
        "<td>" + mtlCol(L.dN, mtlS(L.dN)) + "</td>" +
        '<td class="lft">' + esc(L.action || "\u2014") + "</td>" +
        '<td><span class="mtl-cot mtl-' + c.k + '">' + (mtlOk(L.cot) ? Math.round(L.cot) : "\u2014") + "</span></td>" +
        '<td class="lft">' + c.t + "</td></tr>";
    }).join("");
    var alu = MTL.aluminium;
    return '<div class="mtl-pick">' + ms.map(function (m) {
        return '<button type="button" class="mtl-btn' + (m.key === mtlState.metal ? " on" : "") +
          '" data-mtl="' + m.key + '">' + esc(m.label) + "</button>";
      }).join("") + "</div>" +
      '<div class="tablewrap"><table class="dt mtl-sum"><thead><tr><th class="lft">Metal</th><th>Price</th>' +
      "<th>MM net (contracts)</th><th>Week \u0394 net</th><th class=\"lft\">What they did</th>" +
      '<th>COT index</th><th class="lft">Positioning</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
      '<div class="mtl-note">Click a metal to open its full study below. <b>COT index</b> = where today\u2019s net position sits in its own 3-year range (0 = most bearish, 100 = most bullish). ' +
      (alu ? "Aluminium is not listed: COMEX aluminium is thin (open interest " + mtlN(alu.oi) + " contracts, managed money " + mtlN(alu.mmL) + " long / " + mtlN(alu.mmS) + " short at " + esc(mtlDate(alu.date)) + "). Real aluminium positioning sits on the LME, whose report is not connected." : "") +
      "</div>";
  }

  /* ---- 1. this week, decoded ----------------------------------------- */
  function mtlDecodeCard(m) {
    if (!m) return "";
    var L = m.latest, nm = m.label, c = mtlCrowdLabel(L.cot);
    var prevNet = L.net - (L.dN || 0);
    var flipped = prevNet !== 0 && L.net !== 0 && (prevNet > 0) !== (L.net > 0);
    var buyer = (L.dN || 0) > 0;
    var z = Math.abs(L.z || 0);
    var size = z >= 2 ? "a big week, about " + z.toFixed(1) + "\u00d7 a typical week\u2019s change" :
      z >= 1 ? "an above-average week (" + z.toFixed(1) + "\u00d7 typical)" :
      "a routine week (" + z.toFixed(1) + "\u00d7 typical)";
    var usdMove = mtlOk(L.dN) && mtlOk(L.px) ? Math.abs(L.dN) * m.contractSize * L.px : null;

    var p1 = "In the week to <b>" + esc(mtlDate(L.date)) + "</b>, managed money " +
      (flipped ? "<b>flipped</b> from " + mtlSide(prevNet) + " to " + mtlSide(L.net) + " in " + nm :
        (buyer ? "<b>increased</b>" : "<b>reduced</b>") + " its net position in " + nm) +
      " by <b>" + mtlN(Math.abs(L.dN)) + " contracts</b>, leaving it <b>" + mtlS(L.net) + "</b> (" + mtlSide(L.net) + ")." +
      " Under the hood, longs " + (L.dL >= 0 ? "rose " : "fell ") + mtlN(Math.abs(L.dL)) +
      " and shorts " + (L.dS >= 0 ? "rose " : "fell ") + mtlN(Math.abs(L.dS)) + ": <b>" + esc(L.action) + "</b>, meaning " + esc(L.actionLong) + "." +
      " One contract is " + mtlN(m.contractSize) + " " + esc(m.sizeUnit) + ", so the change is roughly <b>" + mtlUsd(usdMove) +
      "</b> of " + nm + ". That was " + size + "." +
      (L.streak >= 2 ? " This is the <b>" + mtlEn(L.streak) + " straight week</b> they have been net " + (buyer ? "buyers" : "sellers") + "." : "");

    var st = mtlStudy(m, "pxW");
    var withPx = mtlOk(L.pxW) && mtlOk(L.dN) && L.dN !== 0 && (L.pxW > 0) === (L.dN > 0);
    var p2 = "Over the same Tuesday-to-Tuesday week, " + nm + " " + (L.pxW >= 0 ? "rose " : "fell ") + mtlCol(L.pxW, mtlP(Math.abs(L.pxW), 1).replace("+", "")) +
      ", the dollar index moved " + mtlCol(L.dxyW, mtlP(L.dxyW, 1)) + " and the US 10-year yield moved " + mtlCol(L.tnxW, mtlBp(L.tnxW)) + ". " +
      (withPx ? "They traded <b>with</b> the price. That is their normal behaviour: over " + mtlN(st.n) + " weeks, their net change pointed the same way as price " + mtlN(st.sameSign) + "% of the time. Funds largely <em>follow</em> price."
              : "They traded <b>against</b> the price, which happens in only about " + mtlN(100 - (st.sameSign || 0)) + "% of weeks. A week like this is worth a closer look: it can mean profit-taking into strength, bargain-hunting into weakness, or positions being rolled or hedged rather than a trend being chased.");

    var dTL = L.dTL, dTS = L.dTS;
    var breadth = "";
    if (mtlOk(L.tL) && mtlOk(L.tS)) {
      breadth = "<b>" + mtlN(L.tL) + "</b> funds hold longs (" + mtlS(dTL) + " on the week) and <b>" + mtlN(L.tS) + "</b> hold shorts (" + mtlS(dTS) + "). " +
        "The average long fund holds " + mtlN(L.avgLongSize) + " contracts (" + mtlN(L.avgLongSizePrev) + " a week earlier). ";
      if (buyer && dTL > 0) breadth += "More funds joined the long side, so the buying was <b>broad</b>, not just a few large players.";
      else if (buyer && dTL <= 0) breadth += "The buying came from <b>existing</b> holders adding size, not from new funds joining. That is narrower participation.";
      else if (!buyer && dTL < 0) breadth += "Funds <b>left</b> the long side entirely, not just trimmed. That is a stronger exit signal than a size cut.";
      else breadth += "Long holders trimmed size but did not leave. It reads as <b>de-risking</b>, not abandonment.";
    }

    var cr = m.crowding || {}, hi = cr.high || {}, lo = cr.low || {}, all = cr.all || {};
    var p4 = "Today\u2019s COT index is <b>" + (mtlOk(L.cot) ? Math.round(L.cot) : "\u2014") + "/100: " + c.t.toLowerCase() + "</b>. " +
      "The 3-year range of the net position is " + mtlS(L.min3y) + " to " + mtlS(L.max3y) + ", and the current net is " + mtlP(L.netPctOi, 1).replace("+", "") + " of all open interest. ";
    if (L.cot >= 85) {
      p4 += "History check: after past weeks this stretched (" + hi.weeks + " weeks), " + nm + " moved " + mtlP(hi.avg12, 1) + " over the next 12 weeks on average (up " + mtlN(hi.up12) +
        "% of the time), versus " + mtlP(all.avg12, 1) + " for all weeks. Funds then <b>cut</b> net by an average " + mtlN(Math.abs(hi.netChg8)) + " contracts within 8 weeks. Crowded positions have to unwind eventually, and the unwinding is selling.";
    } else if (L.cot <= 15) {
      p4 += "History check: after past weeks this washed-out (" + lo.weeks + " weeks), " + nm + " moved " + mtlP(lo.avg12, 1) + " over the next 12 weeks on average (up " + mtlN(lo.up12) +
        "% of the time), versus " + mtlP(all.avg12, 1) + " for all weeks. Funds then <b>added</b> an average " + mtlN(Math.abs(lo.netChg8)) + " contracts within 8 weeks. When nobody is left to sell, short covering can fuel a sharp bounce.";
    } else {
      p4 += "That is not an extreme, so positioning on its own is not a contrarian signal right now. There is room for funds to add or cut in either direction.";
    }

    var os = m.otherSide || {};
    var p5 = "Somebody always takes the other side. This week swap dealers changed by " + mtlCol(L.dSwN, mtlS(L.dSwN)) + " and producers/merchants by " + mtlCol(L.dPmN, mtlS(L.dPmN)) +
      ". Over the full history their net positions move <b>opposite</b> to managed money (correlation " + (os.sw != null ? os.sw.toFixed(2) : "\u2014") + " for swap dealers, " +
      (os.pm != null ? os.pm.toFixed(2) : "\u2014") + " for producers). When funds buy, it is mostly bank swap desks and miners or refiners hedging future output who sell to them.";

    return '<section class="card"><div class="card-hd"><h2>This week, decoded</h2>' +
      '<span class="sub">' + esc(m.label) + " \u00b7 " + esc(m.exchange) + " futures \u00b7 positions as of Tuesday " + esc(mtlDate(L.date)) + "</span></div>" +
      '<div class="kpis mtl-kpis">' +
      mtlKpi("Managed money net", mtlS(L.net), mtlSide(L.net) + " \u00b7 \u2248 " + mtlUsd(L.notionalUsd)) +
      mtlKpi("Change this week", mtlCol(L.dN, mtlS(L.dN)), esc(L.action || "")) +
      mtlKpi("Longs / shorts", mtlN(L.long) + " / " + mtlN(L.short), "\u0394 " + mtlS(L.dL) + " / " + mtlS(L.dS)) +
      mtlKpi("COT index (3y)", (mtlOk(L.cot) ? Math.round(L.cot) : "\u2014") + "<small>/100</small>", c.t) +
      mtlKpi("Funds long / short", mtlN(L.tL) + " / " + mtlN(L.tS), "\u0394 " + mtlS(dTL) + " / " + mtlS(dTS)) +
      "</div>" +
      '<div class="mtl-story">' +
      mtlPara("What they did", p1) + mtlPara("What the market did", p2) +
      (breadth ? mtlPara("How many funds were involved", breadth) : "") +
      mtlPara("Where that leaves them", p4) + mtlPara("Who was on the other side", p5) +
      "</div>" +
      '<div class="caution"><p><b>Reading rule.</b> The CFTC records positions, not reasons. Everything under \u201cwhy\u201d on this page is measured co-movement with price, the dollar and yields, not a confession from the funds. Positions are as of Tuesday and published on Friday, so by the time you read them the market has had three more sessions.</p></div></section>';
  }
  function mtlKpi(k, v, m) {
    return '<div class="kpi"><div class="kpi-k">' + k + '</div><div class="kpi-v">' + v + '</div><div class="kpi-m">' + m + "</div></div>";
  }
  function mtlPara(h, body) { return '<div class="mtl-para"><h3>' + h + "</h3><p>" + body + "</p></div>"; }

  /* ---- 2. charts (inline SVG, theme-aware via CSS classes) ----------- */
  function mtlChartsCard(m) {
    if (!m) return "";
    var W = (m.weeks || []).slice(-156);
    if (W.length < 10) return "";
    return '<section class="card"><div class="card-hd"><h2>Price vs managed-money position</h2>' +
      '<span class="sub">' + esc(m.label) + " \u00b7 last " + W.length + " weeks \u00b7 bars = net contracts (left) \u00b7 line = price (right)</span></div>" +
      mtlNetChart(m, W) +
      '<div class="mtl-legend"><span><i class="mtl-sw mtl-sw-up"></i>Net long</span><span><i class="mtl-sw mtl-sw-dn"></i>Net short</span><span><i class="mtl-sw mtl-sw-px"></i>Price</span>' +
      '<span><i class="mtl-sw mtl-sw-ep"></i>Swing turning point</span></div>' +
      '<div class="mtl-sub">Long and short legs separately: is the net moving because funds buy, or because shorts cover?</div>' +
      mtlLegChart(m, W) +
      '<div class="mtl-legend"><span><i class="mtl-sw mtl-sw-l"></i>Gross longs</span><span><i class="mtl-sw mtl-sw-s"></i>Gross shorts</span></div>' +
      '<div class="mtl-note">What to look for: bars and line usually rise and fall <b>together</b>. Funds build longs as price climbs and unwind as it falls. Where they <b>diverge</b> (price making new highs while the bars shrink), the trend is losing its speculative fuel.</div></section>';
  }

  function mtlScale(lo, hi, a, b) { return function (v) { return hi === lo ? (a + b) / 2 : a + (v - lo) / (hi - lo) * (b - a); }; }

  function mtlNetChart(m, W) {
    var w = 900, h = 260, pl = 58, pr = 62, pt = 12, pb = 26;
    var nets = W.map(function (x) { return x.net; });
    var pxs = W.map(function (x) { return x.px; }).filter(mtlOk);
    var nHi = Math.max(0, Math.max.apply(null, nets)), nLo = Math.min(0, Math.min.apply(null, nets));
    var pHi = Math.max.apply(null, pxs), pLo = Math.min.apply(null, pxs);
    var pad = (pHi - pLo) * 0.06; pHi += pad; pLo -= pad;
    var x = mtlScale(0, W.length - 1, pl + 4, w - pr - 4);
    var yN = mtlScale(nLo, nHi, h - pb, pt);
    var yP = mtlScale(pLo, pHi, h - pb, pt);
    var bw = Math.max(1.5, (w - pl - pr) / W.length - 1.2);
    var out = '<svg class="mtl-chart" viewBox="0 0 ' + w + " " + h + '" role="img" aria-label="' + esc(m.label) + ' price against managed money net position">';
    [nLo, nLo / 2, 0, nHi / 2, nHi].forEach(function (v) {
      if (v === nLo / 2 && nLo === 0) return;
      if (v === nHi / 2 && nHi === 0) return;
      out += '<line class="mtl-grid" x1="' + pl + '" x2="' + (w - pr) + '" y1="' + yN(v).toFixed(1) + '" y2="' + yN(v).toFixed(1) + '"/>' +
        '<text class="mtl-ax" x="' + (pl - 6) + '" y="' + (yN(v) + 3).toFixed(1) + '" text-anchor="end">' + mtlK(v) + "</text>";
    });
    [pLo + pad, (pLo + pHi) / 2, pHi - pad].forEach(function (v) {
      out += '<text class="mtl-ax mtl-ax-px" x="' + (w - pr + 6) + '" y="' + (yP(v) + 3).toFixed(1) + '">' + mtlPxShort(v) + "</text>";
    });
    var ep = {};
    (m.episodes || []).forEach(function (e) { ep[e.from] = 1; ep[e.to] = 1; });
    W.forEach(function (d, i) {
      var y0 = yN(0), y1 = yN(d.net);
      out += '<rect class="' + (d.net >= 0 ? "mtl-bar-up" : "mtl-bar-dn") + '" x="' + (x(i) - bw / 2).toFixed(1) + '" y="' + Math.min(y0, y1).toFixed(1) +
        '" width="' + bw.toFixed(1) + '" height="' + Math.max(0.5, Math.abs(y1 - y0)).toFixed(1) + '"><title>' + esc(mtlDate(d.d)) + ": net " + mtlS(d.net) +
        " (\u0394 " + mtlS(d.dN) + ") \u00b7 price " + mtlPx(m, d.px) + "</title></rect>";
    });
    var path = "";
    W.forEach(function (d, i) { if (mtlOk(d.px)) path += (path ? "L" : "M") + x(i).toFixed(1) + "," + yP(d.px).toFixed(1); });
    out += '<path class="mtl-line-px" d="' + path + '"/>';
    W.forEach(function (d, i) {
      if (ep[d.d] && mtlOk(d.px)) out += '<circle class="mtl-ep-dot" cx="' + x(i).toFixed(1) + '" cy="' + yP(d.px).toFixed(1) + '" r="3.5"><title>Turning point ' + esc(mtlDate(d.d)) + "</title></circle>";
    });
    out += '<line class="mtl-zero" x1="' + pl + '" x2="' + (w - pr) + '" y1="' + yN(0).toFixed(1) + '" y2="' + yN(0).toFixed(1) + '"/>';
    out += mtlXTicks(W, x, h);
    return out + "</svg>";
  }

  function mtlLegChart(m, W) {
    var w = 900, h = 170, pl = 58, pr = 62, pt = 10, pb = 26;
    var vals = [];
    W.forEach(function (d) { vals.push(d.L, d.S); });
    var hi = Math.max.apply(null, vals) * 1.05, lo = 0;
    var x = mtlScale(0, W.length - 1, pl + 4, w - pr - 4), y = mtlScale(lo, hi, h - pb, pt);
    var out = '<svg class="mtl-chart" viewBox="0 0 ' + w + " " + h + '" role="img" aria-label="Gross long and short contracts">';
    [0, hi / 2, hi].forEach(function (v) {
      out += '<line class="mtl-grid" x1="' + pl + '" x2="' + (w - pr) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/>' +
        '<text class="mtl-ax" x="' + (pl - 6) + '" y="' + (y(v) + 3).toFixed(1) + '" text-anchor="end">' + mtlK(v) + "</text>";
    });
    function line(k, c) {
      var p = "";
      W.forEach(function (d, i) { p += (p ? "L" : "M") + x(i).toFixed(1) + "," + y(d[k]).toFixed(1); });
      return '<path class="' + c + '" d="' + p + '"/>';
    }
    out += line("L", "mtl-line-l") + line("S", "mtl-line-s") + mtlXTicks(W, x, h);
    return out + "</svg>";
  }

  function mtlXTicks(W, x, h) {
    var out = "", lastY = null;
    W.forEach(function (d, i) {
      var yr = d.d.slice(0, 4), mo = d.d.slice(5, 7);
      if (yr !== lastY && (mo === "01" || i === 0)) {
        if (i > 3 || i === 0) out += '<text class="mtl-ax" x="' + x(i).toFixed(1) + '" y="' + (h - 8) + '" text-anchor="middle">' + (i === 0 ? mtlDate(d.d, true) : yr) + "</text>";
        lastY = yr;
      }
    });
    return out;
  }
  function mtlK(v) { var a = Math.abs(v); return (v < 0 ? "\u2212" : "") + (a >= 1000 ? Math.round(a / 1000) + "k" : Math.round(a)); }
  function mtlPxShort(v) { return v >= 1000 ? Math.round(v).toLocaleString("en-US") : v >= 20 ? v.toFixed(1) : v.toFixed(2); }

  /* ---- 3. what actually drives their changes ------------------------- */
  function mtlDriversCard(m) {
    if (!m) return "";
    var nm = m.label;
    var verdict = {
      pxW: function (r, s) {
        return r >= 0.2 ? "They buy as " + nm + " rises and sell as it falls, in the same week. This is <b>trend following</b>, the core of how CTAs trade." :
          "Only a loose link with the same week\u2019s price.";
      },
      pxM4: function (r) {
        return Math.abs(r) < 0.1 ? "Almost no link once the week\u2019s own move is known. Funds react <b>within the week</b>; they do not wait a month to confirm a trend." :
          r > 0 ? "They keep adding after a rising month, so momentum carries over." : "They tend to fade the prior month\u2019s move, taking profits on rallies and buying dips.";
      },
      dxyW: function (r) {
        return Math.abs(r) < 0.1 ? "The dollar barely matters to their weekly decisions in " + nm + "." :
          r < 0 ? "A rising dollar goes with selling and a falling dollar with buying. " + nm + " is priced in dollars, so a stronger dollar makes it dearer for everyone else." :
          "Unusually, they tend to buy when the dollar rises.";
      },
      tnxW: function (r) {
        return Math.abs(r) < 0.1 ? "Little direct link with US yields week to week." :
          r < 0 ? "Rising yields go with selling. " + nm + " pays no interest, so higher yields raise the cost of holding it." :
          "They tend to buy as yields rise, which is consistent with a growth or inflation story rather than a rates story.";
      },
      pxNext: function (r) {
        return Math.abs(r) < 0.1 ? "<b>No predictive power.</b> What funds did this week says almost nothing about next week\u2019s price. They follow; they do not forecast." :
          r < 0 ? "Slightly negative: heavy buying tends to precede a <b>weaker</b> next week, an early sign of crowding." :
          "A small positive carry-over into the next week.";
      }
    };
    var rows = (m.study || []).map(function (s) {
      var r = s.corr;
      var wpx = mtlOk(r) ? Math.min(50, Math.abs(r) * 50) : 0;
      var bar = '<div class="mtl-corr"><span class="mtl-corr-mid"></span><span class="mtl-corr-bar ' + (r >= 0 ? "pos" : "neg") + '" style="' +
        (r >= 0 ? "left:50%" : "right:50%") + ";width:" + wpx.toFixed(1) + '%"></span></div>';
      return '<tr><td class="lft"><b>' + esc(s.name) + '</b><div class="kpi-m">' + esc(s.question) + "</div></td>" +
        "<td>" + (mtlOk(r) ? (r >= 0 ? "+" : "\u2212") + Math.abs(r).toFixed(2) : "\u2014") + bar + "</td>" +
        "<td>" + mtlN(s.sameSign) + "%</td>" +
        '<td class="lft">' + mtlStrength(r) + "</td>" +
        '<td class="lft mtl-why">' + (verdict[s.key] ? verdict[s.key](r || 0) : "") + "</td></tr>";
    }).join("");
    var reg = m.regression || {}, b = reg.betas || {};
    var top = Object.keys(b).sort(function (p, q) { return Math.abs(b[q]) - Math.abs(b[p]); });
    var regTxt = reg.r2 != null ?
      "Put the four observable factors together in one model and they explain <b>" + Math.round(reg.r2 * 100) + "%</b> of the week-to-week changes in " + nm +
      " positioning (" + mtlN(reg.n) + " weeks). The biggest single weight is <b>" + esc(top[0]) + "</b> (standardised beta " + b[top[0]].toFixed(2) + "), next " +
      esc(top[1]) + " (" + b[top[1]].toFixed(2) + "). The other <b>" + Math.round((1 - reg.r2) * 100) + "%</b> is what this data cannot see: news and Fed communication, inflows to and outflows from funds, risk limits forcing cuts after losses, options hedging, contract rolls" +
      (m.style === "industrial" ? ", and the physical demand story (China, autos, construction, the energy transition)" : m.style === "precious" ? ", and central-bank or ETF buying of physical metal" : ", and the industrial-versus-investment demand mix") + "." : "";
    return '<section class="card"><div class="card-hd"><h2>What makes them change? Tested on the data</h2>' +
      '<span class="sub">' + esc(nm) + " \u00b7 weekly change in managed-money net vs each factor \u00b7 " + mtlN(m.weeksStored) + " weeks since " + esc(mtlDate(m.firstWeek)) + "</span></div>" +
      '<div class="tablewrap"><table class="dt mtl-drv"><thead><tr><th class="lft">Factor</th><th>Correlation</th><th>Same direction</th><th class="lft">Link</th><th class="lft">What it teaches</th></tr></thead><tbody>' +
      rows + "</tbody></table></div>" +
      '<div class="mtl-story">' + mtlPara("Putting it together", regTxt) + "</div>" +
      '<div class="mtl-note"><b>How to read this table.</b> Correlation runs from \u22121 to +1. Positive means funds add when the factor rises; negative means they cut. Around \u00b10.1 is noise; 0.4 and above is a real habit. \u201cSame direction\u201d counts how often the fund change and the factor moved the same way in a given week (50% = coin flip).</div></section>';
  }

  /* ---- 4. build-ups and unwinds -------------------------------------- */
  function mtlEpisodesCard(m) {
    if (!m || !(m.episodes || []).length) return "";
    var nm = m.label, eps = m.episodes.slice().reverse();
    var rows = eps.map(function (e) {
      var built = e.dNet > 0;
      var reading = mtlEpisodeReading(m, e);
      return "<tr" + (e.ongoing ? ' class="mtl-live"' : "") + '><td class="lft"><span>' + esc(mtlDate(e.from, true)) + " \u2192 " + esc(mtlDate(e.to, true)) + "</span>" +
        '<div class="kpi-m">' + e.weeks + " wk" + (e.ongoing ? " \u00b7 still running" : "") + "</div></td>" +
        '<td><b class="' + (built ? "pos" : "neg") + '">' + (built ? "Built " : "Cut ") + mtlS(e.dNet) + "</b>" +
        '<div class="kpi-m">' + esc(e.act) + "<br>L " + mtlS(e.dL) + " \u00b7 S " + mtlS(e.dS) + "</div></td>" +
        "<td>" + mtlS(e.netFrom) + " \u2192 " + mtlS(e.netTo) + '<div class="kpi-m">COT ' + (mtlOk(e.cotFrom) ? Math.round(e.cotFrom) : "\u2014") + " \u2192 " + (mtlOk(e.cotTo) ? Math.round(e.cotTo) : "\u2014") + "</div></td>" +
        "<td>" + mtlCol(e.pxPct, mtlP(e.pxPct, 1)) + '<div class="kpi-m">prior 4 wk ' + mtlP(e.pxBefore, 1) + "</div></td>" +
        "<td>" + mtlCol(e.dxyPct, mtlP(e.dxyPct, 1)) + "</td><td>" + mtlCol(e.tnxBp, mtlBp(e.tnxBp)) + "</td>" +
        "<td>" + (e.ongoing ? "\u2014" : mtlCol(e.pxAfter4, mtlP(e.pxAfter4, 1))) + "</td>" +
        '<td class="lft mtl-why">' + reading + "</td></tr>";
    }).join("");
    var withCount = m.episodes.filter(function (e) { return mtlOk(e.pxPct) && (e.pxPct > 0) === (e.dNet > 0); }).length;
    return '<section class="card"><div class="card-hd"><h2>When they changed their minds: build-ups and unwinds</h2>' +
      '<span class="sub">' + esc(nm) + " \u00b7 each swing in managed-money net, newest first \u00b7 market context over the same weeks</span></div>" +
      '<div class="mtl-story">' + mtlPara("The pattern", "Of the last " + m.episodes.length + " swings in " + nm + " positioning, <b>" + withCount + "</b> moved in the same direction as price. A swing ends when funds reverse by more than about " +
        mtlN(0.6 * m.sdNet) + " contracts (0.6 standard deviations of the net). Each row is one decision cycle: what they did, what the market did around them, and what happened next.") + "</div>" +
      '<div class="tablewrap tall"><table class="dt mtl-ep"><thead><tr><th class="lft">Period</th><th>What funds did</th><th>Net (COT)</th><th>Price</th>' +
      '<th>Dollar</th><th>10y yield</th><th>Price 4 wk after</th><th class="lft">Reading</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
      '<div class="caution"><p><b>Attribution limit.</b> \u201cReading\u201d lines up the swing with price, the dollar and yields over the same weeks. Look up the Fed meetings, CPI prints, China data or geopolitical events in those dates to complete the story. That is the habit this table is meant to build.</p></div></section>';
  }

  function mtlEpisodeReading(m, e) {
    var built = e.dNet > 0, parts = [];
    if (mtlOk(e.pxPct)) {
      var withPx = (e.pxPct > 0) === built;
      parts.push(withPx ? (built ? "Chased a " + mtlP(e.pxPct, 1) + " rally" : "Sold into a " + mtlP(e.pxPct, 1) + " decline") :
        (built ? "Bought while price fell " + mtlP(e.pxPct, 1) + ": bottom-fishing or early accumulation" : "Sold while price rose " + mtlP(e.pxPct, 1) + ": profit-taking into strength"));
    }
    if (mtlOk(e.pxBefore) && Math.abs(e.pxBefore) >= 3) {
      parts.push(((e.pxBefore > 0) === built ? "followed a " : "reversed a ") + mtlP(e.pxBefore, 1) + " prior month");
    }
    if (mtlOk(e.dxyPct) && Math.abs(e.dxyPct) >= 1) {
      var dHelp = (e.dxyPct < 0) === built;
      parts.push((dHelp ? "dollar " + (e.dxyPct < 0 ? "fell" : "rose") + " " + mtlP(Math.abs(e.dxyPct), 1).replace("+", "") + " in support" :
        "despite the dollar " + (e.dxyPct < 0 ? "falling" : "rising") + " " + mtlP(Math.abs(e.dxyPct), 1).replace("+", "")));
    }
    if (m.style !== "industrial" && mtlOk(e.tnxBp) && Math.abs(e.tnxBp) >= 15) {
      var yHelp = (e.tnxBp < 0) === built;
      parts.push((yHelp ? "yields " + (e.tnxBp < 0 ? "fell " : "rose ") + Math.abs(Math.round(e.tnxBp)) + " bp in support" :
        "yields " + (e.tnxBp < 0 ? "fell " : "rose ") + Math.abs(Math.round(e.tnxBp)) + " bp but did not stop them"));
    }
    if (mtlOk(e.cotTo) && e.cotTo >= 85) parts.push("ended <b>crowded long</b>");
    if (mtlOk(e.cotTo) && e.cotTo <= 15) parts.push("ended <b>washed out</b>");
    if (!e.ongoing && mtlOk(e.pxAfter4)) {
      var cont = (e.pxAfter4 > 0) === built;
      parts.push("next 4 wk price " + mtlP(e.pxAfter4, 1) + (cont ? " (trend continued)" : " (turned against them)"));
    }
    var s = parts.join("; ");
    return s ? s.charAt(0).toUpperCase() + s.slice(1) + "." : "\u2014";
  }

  /* ---- 5. weekly log ------------------------------------------------- */
  function mtlWeeklyCard(m) {
    if (!m) return "";
    var W = (m.weeks || []).slice(-16).reverse();
    var rows = W.map(function (d) {
      var c = mtlCrowdLabel(d.cot);
      return '<tr><td class="lft"><span>' + esc(mtlDate(d.d, true)) + "</span></td>" +
        "<td>" + mtlPx(m, d.px) + '<div class="kpi-m">' + mtlCol(d.pxW, mtlP(d.pxW, 1)) + "</div></td>" +
        "<td>" + mtlCol(d.dL, mtlS(d.dL)) + "</td><td>" + mtlCol(-(d.dS || 0), mtlS(d.dS)) + "</td>" +
        "<td><b>" + mtlCol(d.dN, mtlS(d.dN)) + "</b></td><td>" + mtlS(d.net) + "</td>" +
        '<td class="lft">' + esc(d.act || "\u2014") + "</td>" +
        '<td><span class="mtl-cot mtl-' + c.k + '">' + (mtlOk(d.cot) ? Math.round(d.cot) : "\u2014") + "</span></td>" +
        "<td>" + mtlN(d.tL) + " / " + mtlN(d.tS) + "</td>" +
        "<td>" + mtlCol(d.dxyW, mtlP(d.dxyW, 1)) + "</td><td>" + mtlCol(d.tnxW, mtlBp(d.tnxW)) + "</td></tr>";
    }).join("");
    return '<section class="card"><div class="card-hd"><h2>Week by week: the last 16 reports</h2>' +
      '<span class="sub">' + esc(m.label) + " \u00b7 newest first \u00b7 contracts</span></div>" +
      '<div class="tablewrap"><table class="dt mtl-wk"><thead><tr><th class="lft">Tuesday</th><th>Price \u00b7 wk</th><th>\u0394 longs</th><th>\u0394 shorts</th><th>\u0394 net</th><th>Net</th>' +
      '<th class="lft">Action</th><th>COT</th><th>Funds L / S</th><th>Dollar</th><th>10y</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
      '<div class="mtl-note"><b>The four actions.</b> <em>New longs</em> and <em>new shorts</em> are fresh conviction: money committing to a view. <em>Short covering</em> and <em>long liquidation</em> are exits, often forced by stop-losses or risk limits, and tend to be sharp but short-lived. A rally driven by short covering is weaker evidence than one driven by new longs. A rise in shorts is coloured red because it is bearish positioning.</div></section>';
  }

  /* ---- 6. crowding: what happened after extremes --------------------- */
  function mtlCrowdCard(m) {
    if (!m) return "";
    var cr = m.crowding || {}, nm = m.label;
    function row(lbl, b, k) {
      return '<tr><td class="lft"><b>' + lbl + "</b></td><td>" + mtlN(b.weeks) + "</td><td>" + mtlCol(b.avg4, mtlP(b.avg4, 1)) + "</td><td>" + mtlN(b.up4) + "%</td>" +
        "<td>" + mtlCol(b.avg12, mtlP(b.avg12, 1)) + "</td><td>" + mtlN(b.up12) + "%</td><td>" + mtlCol(b.netChg8, mtlS(b.netChg8)) + "</td></tr>";
    }
    var hi = cr.high || {}, all = cr.all || {}, lo = cr.low || {};
    var lesson;
    if (mtlOk(hi.avg12) && mtlOk(all.avg12)) {
      lesson = hi.avg12 < all.avg12 - 1 ?
        "In " + nm + ", crowded-long weeks were followed by <b>weaker</b> returns than average. Crowding has worked as a warning sign here." :
        hi.avg12 > all.avg12 + 1 ?
        "In " + nm + ", crowded-long weeks were still followed by <b>above-average</b> returns. In strong trends, crowded can stay crowded, so \u201ctoo many longs\u201d alone has not been a reason to sell." :
        "In " + nm + ", crowded-long weeks were followed by roughly average returns. Crowding alone has not been a timing signal.";
      lesson += " In either case funds usually <b>reduced</b> the position afterwards (average 8-week change " + mtlS(hi.netChg8) + " contracts), so an extreme tells you which way the next big position change is likely to go, if not when.";
    }
    return '<section class="card"><div class="card-hd"><h2>When positioning gets extreme: what happened next</h2>' +
      '<span class="sub">' + esc(nm) + " \u00b7 COT index buckets vs forward price and position change</span></div>" +
      '<div class="tablewrap"><table class="dt"><thead><tr><th class="lft">Weeks where COT index was\u2026</th><th>Weeks</th><th>Price next 4 wk</th><th>% up</th><th>Price next 12 wk</th><th>% up</th><th>Fund net change next 8 wk</th></tr></thead><tbody>' +
      row("\u2265 85 (crowded long)", hi) + row("\u2264 15 (washed out)", lo) + row("All weeks (baseline)", all) + "</tbody></table></div>" +
      (lesson ? '<div class="mtl-story">' + mtlPara("What this teaches", lesson) + "</div>" : "") +
      '<div class="mtl-note">Small samples (fewer than about 20 weeks) are anecdotes, not evidence. Overlapping windows also mean neighbouring weeks are not independent.</div></section>';
  }

  /* ---- 7. the other side --------------------------------------------- */
  function mtlOtherSideCard(m) {
    if (!m) return "";
    var L = m.latest, os = m.otherSide || {};
    var g = [
      ["Managed money", L.net, L.dN, null, "Hedge funds and CTAs. Speculative, trend-following; the group this page studies."],
      ["Producer / merchant / processor / user", L.pmN, L.dPmN, os.pm, "Miners, refiners, fabricators and jewellers hedging real metal. Usually net short: they lock in prices for future output, and sell more into rallies."],
      ["Swap dealers", L.swN, L.dSwN, os.sw, "Banks that sell OTC swaps to clients (e.g. pension funds wanting metal exposure) and hedge that book in futures. Often the mirror image of the funds."],
      ["Other reportables", L.orN, L.dOrN, os.or, "Large traders who fit none of the above: family offices, some proprietary firms, ETF-related accounts."],
      ["Non-reportable (small traders)", L.nrN, L.dNrN, os.nr, "Everyone below the CFTC reporting threshold, mostly retail and small funds."]
    ];
    var rows = g.map(function (r) {
      return '<tr><td class="lft"><b>' + r[0] + "</b></td><td>" + mtlS(r[1]) + "</td><td>" + mtlCol(r[2], mtlS(r[2])) + "</td><td>" +
        (r[3] == null ? "\u2014" : (r[3] >= 0 ? "+" : "\u2212") + Math.abs(r[3]).toFixed(2)) + '</td><td class="lft mtl-why">' + r[4] + "</td></tr>";
    }).join("");
    return '<section class="card"><div class="card-hd"><h2>Who is on the other side</h2>' +
      '<span class="sub">' + esc(m.label) + " \u00b7 all CFTC trader groups \u00b7 nets sum to zero across groups</span></div>" +
      '<div class="tablewrap"><table class="dt mtl-os"><thead><tr><th class="lft">Group</th><th>Net</th><th>Week \u0394</th><th>Correlation with fund net</th><th class="lft">Who they are and why they trade</th></tr></thead><tbody>' +
      rows + "</tbody></table></div>" +
      '<div class="mtl-note">Every futures contract has a buyer and a seller, so one group\u2019s buying is another\u2019s selling. A strongly negative correlation means that group is the funds\u2019 usual counterparty. Spreading positions are excluded, so totals may not net exactly to zero.</div></section>';
  }

  /* ---- 8. primer ----------------------------------------------------- */
  function mtlPrimerCard() {
    var items = [
      ["Who they are", "Two kinds of money sit under \u201cmanaged money\u201d. <b>CTAs and systematic funds</b> run rules: buy when price breaks above moving averages or recent highs, sell when it breaks below, and size each position by volatility. <b>Discretionary macro funds</b> take views on the Fed, inflation, the dollar, China and geopolitics. CTAs explain why positioning follows price so closely; macro funds explain the swings that start <em>before</em> price moves."],
      ["What makes them buy", "Rising price (the trend signal itself), a falling dollar, falling real yields (for gold and silver), easing Fed expectations, inflation scares, geopolitical stress, and for copper and palladium, stronger growth or supply disruptions. Volatility dropping also lets volatility-targeting funds carry <em>bigger</em> positions for the same risk."],
      ["What makes them sell", "Price breaking down through trend levels (stop-losses and systematic exits), a rising dollar or real yields, hawkish Fed surprises, a volatility spike (risk models force smaller positions), exchange margin increases, and losses elsewhere in the portfolio that force de-risking across everything."],
      ["Why changes are often sudden", "Many funds watch similar signals, so they tend to move together. When a crowded trade breaks, everyone heads for the same exit, and long liquidation can push price down further, triggering more stops. That feedback loop is why unwinds from a high COT index are usually faster than the build-ups."],
      ["How to read each Friday report", "1. Net change: who bought, who sold. 2. Decompose it: new longs, short covering, liquidation or new shorts? 3. Breadth: did the number of funds change? 4. Context: did price, the dollar and yields agree? 5. Stretch: where is the COT index? 6. Write down your read before the next report, then check it a week later."],
      ["Limits of this data", "Futures only, no options, OTC or physical holdings. Weekly snapshots (Tuesday) published with a 3-day lag. Categories are self-reported and broad. It shows <b>what</b> funds hold, never <b>why</b>; every \u201cwhy\u201d here is inferred from co-movement. LME positioning (where base metals mainly trade) and MCX are separate markets."]
    ];
    return '<section class="card"><div class="card-hd"><h2>How managed money makes decisions: a primer</h2><span class="sub">read once, then use the sections above every Friday</span></div>' +
      '<div class="mtl-primer">' + items.map(function (it) {
        return '<div class="mtl-pc"><h3>' + it[0] + "</h3><p>" + it[1] + "</p></div>";
      }).join("") + "</div></section>";
  }

  /* ---- glossary: every label above opens a plain-language panel ------

    "Weekly market context": {

        "Placed beside the position change, they show what the market was doing while funds traded."],
      deep: ["Price is the front-month futures close (COMEX gold, silver and copper; NYMEX platinum and palladium) from Yahoo Finance daily history.",
        "Dollar = ICE US Dollar Index (DXY) percentage change. 10y = the CBOE 10-year yield index (^TNX) change in basis points.",

      how: mtlHowMetal(function (m, L) {

    },
    "CFTC trader groups": {

      deep: ["Producers/merchants hedge physical metal (mines, refiners, fabricators). Swap dealers hedge OTC swaps sold to clients. Managed money is speculative funds. Other reportables are large traders that fit none of these.",
