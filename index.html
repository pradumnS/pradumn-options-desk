<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nifty Options Desk</title>

<style>
/* ============================================================
   TOKENS &mdash; dark-first. :root carries the complete dark palette.
   Light is the deviation, defined for both the media-query
   (unstamped) case and the explicit [data-theme="light"] stamp.
   ============================================================ */
:root {
  /* Freshness state. Defined here as well as on the state classes, because
     a token that exists only inside .mock.ok resolves to nothing before the
     verdict is known -- the bar would render with no colour at all. */
  --fresh:     #66798B;
  --fresh-dim: rgba(102,121,139,.10);

  --bg:        #0B0F14;
  --surface:   #121821;
  --surface-2: #18202B;
  --surface-3: #1E2833;
  --line:      #232E3B;
  --line-soft: #1A2029;

  --ink:   #E6EDF3;
  --ink-2: #9DB0C2;
  --ink-3: #66798B;

  /* Data identity &mdash; Okabe&ndash;Ito derived. Calls cool (ceiling), puts warm (floor). */
  --calls:      #56B4E9;
  --calls-dim:  rgba(86,180,233,.16);
  --puts:       #E69F00;
  --puts-dim:   rgba(230,159,0,.16);
  --maxpain:    #CC79A7;

  /* Direction &mdash; reserved. Never used for call/put identity. */
  --up:   #3FB950;
  --down: #F85149;

  --warn: #D29922;
  --ok:   #3FB950;

  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lg: -18px 0 48px -18px rgba(0,0,0,.75);

  --font-uWi: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-ui:  "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-num: "Cascadia Mono", "Consolas", ui-monospace, "SF Mono", Menlo, monospace;

  --r: 6px;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:        #F4F6F9;
    --surface:   #FFFFFF;
    --surface-2: #EEF2F7;
    --surface-3: #E4EAF2;
    --line:      #D5DEE8;
    --line-soft: #E6ECF3;

    --ink:   #0E161F;
    --ink-2: #4B5C6D;
    --ink-3: #7C8C9C;

    --calls:     #0072B2;
    --calls-dim: rgba(0,114,178,.13);
    --puts:      #A96800;
    --puts-dim:  rgba(169,104,0,.15);
    --maxpain:   #A1457F;

    --up:   #1A7F37;
    --down: #C0392B;

    --warn: #8A6100;
    --ok:   #1A7F37;

    --shadow: 0 1px 2px rgba(16,32,48,.06), 0 8px 24px -14px rgba(16,32,48,.24);
    --shadow-lg: -18px 0 48px -20px rgba(16,32,48,.3);
  }
}

:root[data-theme="light"] {
  --bg:        #F4F6F9;
  --surface:   #FFFFFF;
  --surface-2: #EEF2F7;
  --surface-3: #E4EAF2;
  --line:      #D5DEE8;
  --line-soft: #E6ECF3;

  --ink:   #0E161F;
  --ink-2: #4B5C6D;
  --ink-3: #7C8C9C;

  --calls:     #0072B2;
  --calls-dim: rgba(0,114,178,.13);
  --puts:      #A96800;
  --puts-dim:  rgba(169,104,0,.15);
  --maxpain:   #A1457F;

  --up:   #1A7F37;
  --down: #C0392B;

  --warn: #8A6100;
  --ok:   #1A7F37;

  --shadow: 0 1px 2px rgba(16,32,48,.06), 0 8px 24px -14px rgba(16,32,48,.24);
  --shadow-lg: -18px 0 48px -20px rgba(16,32,48,.3);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.pos { color: var(--up); } .neg { color: var(--down); } .neu { color: var(--ink-2); }

:where(a, button, [tabindex]):focus-visible {
  outline: 2px solid var(--calls);
  outline-offset: 2px;
  border-radius: 3px;
}

/* ---------- mockup banner ---------- */
.mock {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 7px 16px;
  background: var(--fresh-dim, var(--puts-dim));
  border-bottom: 1px solid var(--line);
  border-left: 3px solid var(--fresh, var(--puts));
  font-size: 11.5px; color: var(--ink-2);
}
.mock strong {
  font-family: var(--font-num); font-size: 10.5px; letter-spacing: .09em;
  color: var(--fresh, var(--puts));
  border: 1px solid var(--fresh, var(--puts)); border-radius: 3px;
  padding: 2px 7px; text-transform: uppercase;
}
/* The one thing a glance must answer: is what I am looking at current? */
.mock.ok    { --fresh: var(--up);   --fresh-dim: rgba(63,185,80,.10); }
.mock.warn  { --fresh: var(--maxpain); --fresh-dim: rgba(230,159,0,.12); }
.mock.stale { --fresh: var(--down); --fresh-dim: rgba(248,81,73,.12); }
.mock .age { margin-left: auto; font-family: var(--font-num); font-size: 10.5px;
             color: var(--ink-3); }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 208px minmax(0,1fr); min-height: 100vh; }

.rail {
  border-right: 1px solid var(--line);
  background: var(--surface);
  display: flex; flex-direction: column; gap: 22px;
  padding: 18px 0 20px;
}
.brand { display: flex; flex-direction: column; gap: 3px; padding: 0 18px; }
.brand b { font-family: var(--font-uWi); font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.brand span {
  font-family: var(--font-num); font-size: 9.5px; letter-spacing: .16em;
  color: var(--ink-3); text-transform: uppercase;
}

.rail-group { display: flex; flex-direction: column; gap: 2px; }
.rail-label {
  font-family: var(--font-num); font-size: 9.5px; letter-spacing: .14em;
  color: var(--ink-3); text-transform: uppercase; padding: 0 18px 6px;
}
.rail-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 18px; color: var(--ink-2); cursor: pointer;
  border: 0; border-left: 2px solid transparent; background: none;
  width: 100%; text-align: left; font: inherit;
}
.rail-item:hover { background: var(--surface-2); color: var(--ink); }
.rail-item[aria-current="true"] {
  color: var(--ink); background: var(--surface-2);
  border-left-color: var(--calls); font-weight: 600;
}
.rail-item .tag {
  font-family: var(--font-num); font-size: 9px; letter-spacing: .06em;
  color: var(--ink-3); border: 1px solid var(--line); padding: 1px 5px; border-radius: 3px;
}
.rail-item .spark { font-family: var(--font-num); font-size: 10px; }

.rail-foot {
  margin-top: auto; padding: 0 18px;
  font-family: var(--font-num); font-size: 9.5px; color: var(--ink-3); letter-spacing: .06em;
}

/* ---------- topbar ---------- */
.main { min-width: 0; display: flex; flex-direction: column; }

.topbar {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 0 20px; border-bottom: 1px solid var(--line);
  background: var(--surface); min-height: 46px;
}
.idx-tabs { display: flex; gap: 2px; align-self: stretch; }
.idx-tab {
  border: 0; background: none; font: inherit; cursor: pointer;
  padding: 0 13px; color: var(--ink-3); border-bottom: 2px solid transparent;
  font-family: var(--font-num); font-size: 11.5px; letter-spacing: .04em;
}
.idx-tab:hover { color: var(--ink-2); }
.idx-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--calls); font-weight: 700; }

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.stamp {
  font-family: var(--font-num); font-size: 10.5px; color: var(--ink-3);
  letter-spacing: .04em; display: flex; align-items: center; gap: 7px;
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.warnd { background: var(--warn); } .dot.idle { background: var(--ink-3); }
.tgl {
  background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2);
  border-radius: var(--r); padding: 4px 10px; cursor: pointer;
  font-family: var(--font-num); font-size: 10.5px;
}
.tgl:hover { color: var(--ink); border-color: var(--ink-3); }

/* ---------- persistent market strip ----------
   Sits above the tab row and sticks to the top, so the market level stays
   on screen on every tab and at any scroll position. */
.strip-wrap {
  position: sticky; top: 0; z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.strip {
  display: flex; align-items: stretch; overflow-x: auto;
  scrollbar-width: thin;
}
.strip::-webkit-scrollbar { height: 4px; }
.strip::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

.si {
  flex: 0 0 auto; display: flex; flex-direction: column; gap: 1px;
  padding: 7px 16px; border-right: 1px solid var(--line-soft);
  cursor: default; position: relative; min-width: 132px;
}
.si:hover { background: var(--surface-2); }
.si-k {
  font-family: var(--font-num); font-size: 9px; letter-spacing: .13em;
  color: var(--ink-3); text-transform: uppercase; white-space: nowrap;
  display: flex; align-items: center; gap: 5px;
}
.si-v {
  font-family: var(--font-num); font-size: 14px; font-weight: 600;
  font-variant-numeric: tabular-nums; letter-spacing: -.015em; line-height: 1.15;
}
.si-c {
  font-family: var(--font-num); font-size: 10px;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.si-live {
  width: 5px; height: 5px; border-radius: 50%; background: var(--maxpain);
  flex: none;
}
.si.si-alt { background: var(--surface-2); }
.si.si-alt .si-k { color: var(--maxpain); }

/* live badge */
.si-sep {
  flex: 0 0 auto; width: 1px; margin: 6px 0;
  background: var(--line); align-self: stretch;
}

/* Flash only what moved. A once-a-minute feed is indistinguishable from a
   dead one unless the change announces itself. */
@keyframes flashUp   { 0% { background: rgba(63,185,80,.30); } 100% { background: transparent; } }
@keyframes flashDown { 0% { background: rgba(248,81,73,.30); } 100% { background: transparent; } }
.si.flash-up   { animation: flashUp 1.4s ease-out; }
.si.flash-down { animation: flashDown 1.4s ease-out; }
@media (prefers-reduced-motion: reduce) {
  .si.flash-up, .si.flash-down { animation: none; }
}

.age {
  font-family: var(--font-num); font-size: 9.5px; color: var(--ink-3);
  border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px;
  margin-left: 4px;
}
.si-pulse {
  width: 5px; height: 5px; border-radius: 50%; background: var(--up);
  flex: none; animation: pulse 2.2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .si-pulse { animation: none; } }

.live-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-num); font-size: 10px; letter-spacing: .1em;
  text-transform: uppercase; padding: 2px 8px; border-radius: 3px;
  border: 1px solid var(--up); color: var(--up);
}
.live-badge.stale { border-color: var(--ink-3); color: var(--ink-3); }
.live-badge.closed { border-color: var(--line); color: var(--ink-3); }

@media (max-width: 860px) {
  .strip-wrap { position: static; }
  .si { min-width: 118px; padding: 6px 12px; }
}

/* ---------- analysis tabs ---------- */
.atabs {
  display: flex; gap: 3px; padding: 0 20px; flex-wrap: wrap;
  border-bottom: 1px solid var(--line); background: var(--bg);
}
.atab {
  border: 0; border-bottom: 2px solid transparent; background: none; font: inherit;
  cursor: pointer; padding: 9px 12px; color: var(--ink-3); font-size: 12.5px;
}
.atab:hover { color: var(--ink-2); }
.atab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--calls); font-weight: 600; }

/* ---------- content ---------- */
.content { padding: 16px 20px 48px; display: flex; flex-direction: column; gap: 14px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.card-hd {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 14px; border-bottom: 1px solid var(--line-soft);
}
.card-hd h2 { margin: 0; font-family: var(--font-uWi); font-size: 12.5px; font-weight: 650; }
.card-hd .sub {
  font-family: var(--font-num); font-size: 10px; color: var(--ink-3);
  letter-spacing: .05em; text-transform: uppercase;
}
.card-hd .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

/* ---------- verdict ---------- */
.verdict { display: grid; grid-template-columns: minmax(230px,300px) minmax(0,1fr); overflow: hidden; }
.verdict-main { padding: 16px 18px; border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 9px; }
.verdict-eyebrow {
  font-family: var(--font-num); font-size: 9.5px; letter-spacing: .16em;
  color: var(--ink-3); text-transform: uppercase;
}
.verdict-call {
  font-family: var(--font-uWi); font-size: 27px; font-weight: 680;
  letter-spacing: -.022em; line-height: 1.05; text-wrap: balance;
}
.conf { display: flex; align-items: center; gap: 9px; }
.conf-track { flex: 1; height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.conf-fill { height: 100%; background: var(--calls); border-radius: 3px; }
.conf-val { font-family: var(--font-num); font-size: 11px; color: var(--ink-2); }

.drivers { padding: 14px 18px; display: flex; flex-direction: column; gap: 9px; }
.driver { display: grid; grid-template-columns: 15px minmax(96px,132px) minmax(0,1fr); gap: 10px; align-items: baseline; }
.driver .ico { font-family: var(--font-num); font-size: 12px; text-align: center; }
.driver .k {
  font-family: var(--font-num); font-size: 10px; letter-spacing: .07em;
  color: var(--ink-3); text-transform: uppercase;
}
.driver .v { color: var(--ink-2); font-size: 12.5px; }
.driver .v b { color: var(--ink); font-weight: 600; }

/* ---------- KPI ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px,1fr)); gap: 10px; }
.kpi { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.kpi-k {
  font-family: var(--font-num); font-size: 9.5px; letter-spacing: .13em;
  color: var(--ink-3); text-transform: uppercase; display: flex; align-items: center; gap: 6px;
}
.kpi-v {
  font-family: var(--font-num); font-size: 21px; font-weight: 600;
  letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1;
}
.kpi-m { font-family: var(--font-num); font-size: 10.5px; color: var(--ink-3); }
.swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }

/* ---------- ladder ---------- */
.ladder-wrap { padding: 4px 14px 16px; overflow-x: auto; }
.ladder { min-width: 580px; display: flex; flex-direction: column; }
.ladder-head {
  display: grid; grid-template-columns: 1fr 92px 1fr; gap: 10px;
  padding: 8px 0 7px; border-bottom: 1px solid var(--line-soft);
  font-family: var(--font-num); font-size: 9.5px; letter-spacing: .13em;
  color: var(--ink-3); text-transform: uppercase;
}
.ladder-head .c { text-align: center; }
.ladder-head .r { text-align: right; }

.rung {
  display: grid; grid-template-columns: 1fr 92px 1fr; gap: 10px;
  align-items: center; padding: 1.5px 0; position: relative;
  border: 0; background: none; font: inherit; width: 100%; cursor: pointer;
  border-radius: 3px;
}
.rung:hover { background: var(--surface-2); }
.rung:hover .barfill { filter: brightness(1.22); }
.rung:hover .strike { color: var(--ink); }
.rung[aria-pressed="true"] { background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--line); }

.side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.side.l { flex-direction: row-reverse; }
.bartrack { flex: 1; height: 15px; display: flex; min-width: 0; }
.side.l .bartrack { justify-content: flex-end; }
.barfill { height: 100%; border-radius: 2px; }
.side.l .barfill { background: var(--calls); border-radius: 2px 0 0 2px; }
.side.r .barfill { background: var(--puts); border-radius: 0 2px 2px 0; }
.barval {
  font-family: var(--font-num); font-size: 10.5px; color: var(--ink-2);
  font-variant-numeric: tabular-nums; flex: none; width: 44px;
}
.side.l .barval { text-align: right; }
.side.r .barval { text-align: left; }

.strike {
  font-family: var(--font-num); font-size: 11.5px; text-align: center;
  color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.rung.wall-c .barfill { box-shadow: 0 0 0 1px var(--surface), 0 0 0 2px var(--calls); }
.rung.wall-p .barfill { box-shadow: 0 0 0 1px var(--surface), 0 0 0 2px var(--puts); }
.rung.spot { background: var(--surface-2); }
.rung.spot .strike { color: var(--ink); font-weight: 700; }
.rung.mp .strike { color: var(--maxpain); font-weight: 700; }

.rung .flag {
  position: absolute; right: 0; top: 50%; transform: translateY(-50%);
  font-family: var(--font-num); font-size: 8.5px; letter-spacing: .1em;
  padding: 1px 5px; border-radius: 3px; text-transform: uppercase; pointer-events: none;
}
.flag.spot { color: var(--ink); border: 1px solid var(--ink-3); background: var(--surface); }
.flag.mp   { color: var(--maxpain); border: 1px solid var(--maxpain); background: var(--surface); }
.flag.cw   { color: var(--calls); border: 1px solid var(--calls); background: var(--surface); }

.legend {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 0 2px; margin-top: 6px; border-top: 1px solid var(--line-soft);
  font-family: var(--font-num); font-size: 10px; color: var(--ink-3); letter-spacing: .05em;
}
.legend span { display: flex; align-items: center; gap: 6px; }

/* ---------- charts ---------- */
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px,1fr)); gap: 14px; }
.chart-body { padding: 12px 14px 14px; }
.chart-body svg { width: 100%; height: auto; display: block; }
.axis { font-family: var(--font-num); font-size: 9px; fill: var(--ink-3); }
.gridline { stroke: var(--line-soft); stroke-width: 1; }

/* ---------- tables ---------- */
.tablewrap { overflow-x: auto; }

/* Strike-indexed views open centred on the money and scroll both ways, so
   the market's actual level is never buried at the bottom of a long list. */
.tablewrap.tall { max-height: 480px; overflow-y: auto; }
.ladder-wrap.tall { max-height: 520px; overflow-y: auto; }
tr[data-atm] td { box-shadow: inset 0 1px 0 var(--calls), inset 0 -1px 0 var(--calls); }
table.dt { width: 100%; border-collapse: collapse; }
table.dt th, table.dt td { padding: 6px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line-soft); }
table.dt thead th {
  font-family: var(--font-num); font-size: 9.5px; letter-spacing: .1em;
  color: var(--ink-3); text-transform: uppercase; font-weight: 500;
  border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1;
}
table.dt thead th.grp-c { color: var(--calls); }
table.dt thead th.grp-p { color: var(--puts); }
table.dt td { font-family: var(--font-num); font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
table.dt td.lft, table.dt th.lft { text-align: left; }
table.dt tbody tr.clickable { cursor: pointer; }
table.dt tbody tr.clickable:hover td { background: var(--surface-2); }
table.dt td.strike-cell {
  text-align: center; color: var(--ink); font-weight: 600; background: var(--surface-2);
  border-left: 1px solid var(--line-soft); border-right: 1px solid var(--line-soft);
}
table.dt tbody tr.atm td { background: var(--calls-dim); }
table.dt tbody tr.atm td.strike-cell { background: var(--calls-dim); }
.itm-c { background: var(--calls-dim); }
.itm-p { background: var(--puts-dim); }
table.chain { min-width: 760px; }
table.bu { min-width: 700px; }
table.hist { min-width: 620px; }

/* ---------- buildup pills ---------- */
.pill {
  font-family: var(--font-num); font-size: 9.5px; letter-spacing: .06em;
  padding: 2px 7px; border-radius: 3px; border: 1px solid; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: 5px;
}
.pill.lb { color: var(--up);      border-color: var(--up); }
.pill.sb { color: var(--down);    border-color: var(--down); }
.pill.sc { color: var(--calls);   border-color: var(--calls); }
.pill.lu { color: var(--puts);    border-color: var(--puts); }
.pill.nx { color: var(--ink-3);   border-color: var(--line); }

/* ---------- technicals ---------- */
.tech { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px,1fr)); gap: 0; }
.tcell { padding: 12px 14px; border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 5px; }
.tcell-k { font-family: var(--font-num); font-size: 9.5px; letter-spacing: .11em; color: var(--ink-3); text-transform: uppercase; }
.tcell-v { font-family: var(--font-num); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tcell-m { font-family: var(--font-num); font-size: 10px; color: var(--ink-3); }
.meter { height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; margin-top: 2px; }
.meter i { display: block; height: 100%; border-radius: 2px; }

.levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap: 0; }
.lvl { padding: 10px 14px; border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 3px; }
.lvl-k { font-family: var(--font-num); font-size: 9.5px; letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase; }
.lvl-v { font-family: var(--font-num); font-size: 14px; font-variant-numeric: tabular-nums; }

/* ---------- pipeline ---------- */
.pipe { display: flex; flex-wrap: wrap; }
.step { flex: 1 1 150px; padding: 11px 14px; border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 4px; }
.step:last-child { border-right: 0; }
.step-k { font-family: var(--font-num); font-size: 9.5px; letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
.step-v { font-family: var(--font-num); font-size: 12.5px; color: var(--ink); }
.step-m { font-family: var(--font-num); font-size: 10px; color: var(--ink-3); }

/* ---------- drawer ---------- */
.scrim {
  position: fixed; inset: 0; background: rgba(4,8,12,.55);
  opacity: 0; pointer-events: none; transition: opacity .18s ease; z-index: 40;
}
.scrim.open { opacity: 1; pointer-events: auto; }

.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100vw);
  background: var(--surface); border-left: 1px solid var(--line);
  box-shadow: var(--shadow-lg); transform: translateX(100%);
  transition: transform .2s ease; z-index: 41;
  display: flex; flex-direction: column; overflow: hidden;
}
.drawer.open { transform: translateX(0); }
.drawer-hd {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px; border-bottom: 1px solid var(--line);
}
.drawer-hd h3 { margin: 0; font-family: var(--font-uWi); font-size: 18px; font-weight: 660; letter-spacing: -.015em; }
.drawer-hd .sub { font-family: var(--font-num); font-size: 10px; color: var(--ink-3); letter-spacing: .07em; text-transform: uppercase; }
.xbtn {
  margin-left: auto; background: var(--surface-2); border: 1px solid var(--line);
  color: var(--ink-2); border-radius: var(--r); cursor: pointer;
  font-family: var(--font-num); font-size: 13px; line-height: 1; padding: 6px 9px;
}
.xbtn:hover { color: var(--ink); border-color: var(--ink-3); }
.drawer-body { overflow-y: auto; padding: 0 0 24px; }

.leg-hd {
  display: flex; align-items: center; gap: 8px; padding: 11px 16px 8px;
  font-family: var(--font-num); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
}
.leg-hd .bar { width: 3px; height: 13px; border-radius: 2px; }
.leg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 1px solid var(--line-soft); }
.lg { padding: 9px 16px; border-bottom: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 2px; }
.lg:nth-child(odd) { border-right: 1px solid var(--line-soft); }
.lg-k { font-family: var(--font-num); font-size: 9.5px; letter-spacing: .09em; color: var(--ink-3); text-transform: uppercase; }
.lg-v { font-family: var(--font-num); font-size: 14px; font-variant-numeric: tabular-nums; color: var(--ink); }
.ohlc-row { display: flex; gap: 0; border-bottom: 1px solid var(--line-soft); }
.ohlc-cell { flex: 1; padding: 9px 10px; border-right: 1px solid var(--line-soft); text-align: center; }
.ohlc-cell:last-child { border-right: 0; }
.ohlc-k { font-family: var(--font-num); font-size: 9px; letter-spacing: .12em; color: var(--ink-3); }
.ohlc-v { font-family: var(--font-num); font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink); }

.readout { padding: 12px 16px; display: flex; flex-direction: column; gap: 7px; border-bottom: 1px solid var(--line-soft); }
.readout p { margin: 0; color: var(--ink-2); font-size: 12.5px; }
.readout p b { color: var(--ink); }

/* A pill already carries a coloured border and the headline is set large;
   a dotted underline on either reads as damage rather than as an
   affordance, so each keeps its own shape and only the cursor changes. */
/* The pill keeps the border it already had; only the cursor says it is
   now a control, because a restyled border reads as a state change. */
.pill.has-term { text-decoration: none; cursor: pointer; }
.pill.has-term:hover { color: inherit; filter: brightness(1.25); }
h2.has-term { text-decoration: none; cursor: pointer; }

/* Dim until it is the active sort, so a sortable column reads as sortable
   without competing with the label beside it. */
.so {
  margin-left: 5px; font-size: 9px; cursor: pointer;
  color: var(--ink-3); opacity: .45;
}
.so:hover, .so.on { opacity: 1; color: var(--calls); }
.so:focus-visible { outline: 2px solid var(--calls); outline-offset: 2px; }
h2.has-term:hover { color: var(--calls); }

.verdict-call.has-term, .verdict-eyebrow.has-term, .conf-val.has-term {
  text-decoration: none; cursor: pointer;
}
.verdict-call.has-term:hover, .verdict-eyebrow.has-term:hover,
.conf-val.has-term:hover { color: var(--calls); }

.pt-rk.has-term, .si-k.has-term, .lg-k.has-term, .ohlc-k.has-term,
td.has-term, h2.has-term, .bandrow-k.has-term,
th.has-term, .k.has-term, .qk.has-term, .tcell-k.has-term,
.stack-k.has-term, .grp-c.has-term, .grp-p.has-term, .pill.has-term,
.tagx.has-term, .sub-k.has-term, .conf-val.has-term,
.verdict-call.has-term, .verdict-eyebrow.has-term, .lvl-k.has-term, .kpi-k.has-term, .ck.has-term,
.dt.legend td.has-term {
  cursor: pointer; text-decoration: underline dotted var(--ink-3) 1px;
  text-underline-offset: 3px;
}
.k.has-term:hover, .qk.has-term:hover, .tcell-k.has-term:hover,
.stack-k.has-term:hover, .pill.has-term:hover, .tagx.has-term:hover,
.conf-val.has-term:hover, .verdict-call.has-term:hover,
th.has-term:hover, .lvl-k.has-term:hover, .kpi-k.has-term:hover,
.ck.has-term:hover, .dt.legend td.has-term:hover {
  color: var(--calls); text-decoration-color: var(--calls);
}
th.has-term:focus-visible, .lvl-k.has-term:focus-visible {
  outline: 2px solid var(--calls); outline-offset: 2px;
}

.prob.has-term { cursor: pointer; border-radius: 5px; transition: background .12s ease; }
.prob.has-term:hover { background: var(--surface-2); }
.prob.has-term:focus-visible { outline: 2px solid var(--calls); outline-offset: 2px; }
.term-mark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 12px; height: 12px; margin-left: 5px; border-radius: 50%;
  border: 1px solid var(--ink-3); color: var(--ink-3);
  font-size: 8px; line-height: 1; vertical-align: middle;
}
.prob.has-term:hover .term-mark { border-color: var(--calls); color: var(--calls); }
.pt-sec { margin-top: 9px; font-size: 12px; line-height: 1.55; color: var(--ink-2); }
.pt-sec b { color: var(--ink); }
.pt-sk {
  display: block; font-family: var(--font-num); font-size: 9px;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--calls); margin-bottom: 2px;
}

/* ---------- clickable chart points ---------- */
.clickable-chart { cursor: pointer; }
.clickable-chart:focus-visible { outline: 2px solid var(--calls); outline-offset: 3px; }
[data-pt] { cursor: pointer; }
[data-pt]:hover { filter: brightness(1.25); }

.pt-panel {
  position: fixed; right: 18px; bottom: 18px; z-index: 60;
  width: min(400px, calc(100vw - 36px));
  max-height: 70vh; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line);
  border-left: 3px solid var(--calls); border-radius: 8px;
  box-shadow: var(--shadow-lg); padding: 14px 16px;
}
.pt-hd { display: flex; align-items: flex-start; gap: 10px; }
.pt-hd > div { flex: 1; }
.pt-t { font-family: var(--font-uWi); font-size: 14px; font-weight: 650; }
.pt-s { font-size: 11px; color: var(--ink-3); }
.pt-big { font-family: var(--font-num); font-size: 26px; font-weight: 650;
          letter-spacing: -.02em; margin: 6px 0 8px; }
.pt-rows { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px;
           font-size: 12px; }
.pt-row { display: contents; }
.pt-row span { color: var(--ink-3); }
.pt-row b { font-family: var(--font-num); color: var(--ink); font-weight: 600; }
.pt-note { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line);
           font-size: 11.5px; color: var(--ink-2); line-height: 1.5; }

/* ---------- learning: click to expand ---------- */
.lrn.has-deep { cursor: pointer; transition: border-color .12s ease; }
.lrn.has-deep:hover { border-color: var(--calls); }
.lrn.has-deep:focus-visible { outline: 2px solid var(--calls); outline-offset: 2px; }
.lrn-chev { float: right; color: var(--ink-3); font-size: 11px;
            transition: transform .15s ease; }
.lrn.open .lrn-chev { transform: rotate(180deg); color: var(--calls); }
.lrn-deep { display: none; margin-top: 10px; padding-top: 10px;
            border-top: 1px solid var(--line); }
.lrn.open .lrn-deep { display: block; }
.lrn-d { margin-bottom: 9px; font-size: 12.5px; line-height: 1.6;
         color: var(--ink-2); }
.lrn-d:last-child { margin-bottom: 0; }
.lrn-dk { display: block; font-family: var(--font-num); font-size: 9.5px;
          letter-spacing: .12em; text-transform: uppercase;
          color: var(--calls); margin-bottom: 2px; }
.lrn-d b { color: var(--ink); }

.dt.legend td { vertical-align: top; padding: 8px 12px; line-height: 1.5; }
.dt.legend td:first-child { width: 130px; white-space: nowrap; color: var(--ink); }
.dt.legend td:last-child { color: var(--ink-2); font-size: 12.5px; }

.dt .grp-hd th { font-size: 9px; letter-spacing: .18em; padding-bottom: 2px;
                 border-bottom: 1px solid var(--line); }
.dt .grp-hd .grp-c { color: var(--calls); }
.dt .grp-hd .grp-p { color: var(--puts); }

.killrow { padding: 9px 14px; margin-bottom: 6px; border-radius: 0 6px 6px 0;
           background: var(--puts-dim); border-left: 3px solid var(--down);
           font-size: 13px; line-height: 1.55; color: var(--ink-2); }
.killrow b { color: var(--ink); }

/* ---------- tech-fund ---------- */
.pbar { position: relative; height: 6px; border-radius: 3px;
        background: var(--surface-3); min-width: 110px; }
.pbar i { position: absolute; top: -2px; width: 3px; height: 10px;
          border-radius: 2px; transform: translateX(-50%); }
.notecall { padding: 12px 16px; margin: 2px 0 12px; border-radius: 6px;
            background: var(--calls-dim); border-left: 3px solid var(--calls);
            font-size: 13.5px; line-height: 1.55; }
.legs-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
            padding: 10px 0 4px; }
.leg-chip { font-family: var(--font-num); font-size: 11px; padding: 3px 9px;
            border-radius: 4px; border: 1px solid; }
.leg-chip.sell { color: var(--puts); border-color: var(--puts); }
.leg-chip.buy  { color: var(--calls); border-color: var(--calls); }

/* ---------- sortable table headers ---------- */
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--ink); }
th.sortable.on { color: var(--calls); }

/* ---------- strategy / seller desk ---------- */
.caution {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 11px 14px; border-left: 3px solid var(--warn);
  background: var(--surface-2); border-radius: 0 var(--r) var(--r) 0;
}
.caution b { color: var(--ink); }
.caution p { margin: 0; color: var(--ink-2); font-size: 12px; }
.caution p + p { margin-top: 5px; }

.rangebar { padding: 20px 18px 12px; }
.rb { position: relative; height: 46px; }
.rb-band { position: absolute; top: 12px; height: 22px; border-radius: 3px; }
.rb-2sd { background: var(--surface-3); }
.rb-1sd { background: var(--calls-dim); box-shadow: inset 0 0 0 1px var(--calls); }
.rb-tick { position: absolute; top: 4px; width: 2px; height: 38px; border-radius: 1px; }
.rb-lab {
  position: absolute; font-family: var(--font-num); font-size: 9.5px;
  color: var(--ink-3); letter-spacing: .05em; white-space: nowrap; transform: translateX(-50%);
}
.rb-lab.top { top: -14px; } .rb-lab.bot { top: 46px; }
.rb-legend {
  display: flex; gap: 18px; flex-wrap: wrap; padding-top: 26px;
  font-family: var(--font-num); font-size: 10px; color: var(--ink-3); letter-spacing: .05em;
}
.rb-legend span { display: flex; align-items: center; gap: 6px; }

/* ---------- crosshair readouts ---------- */
.rb { cursor: crosshair; }
.rb-cross {
  position: absolute; top: 2px; bottom: 2px; width: 1px;
  background: var(--ink); opacity: .9; pointer-events: none; display: none;
}
.rb-cross::after {
  content: ""; position: absolute; left: -3px; top: 50%; width: 7px; height: 7px;
  border-radius: 50%; background: var(--ink); transform: translateY(-50%);
}
.rb-tip {
  position: absolute; bottom: 44px; transform: translateX(-50%);
  background: var(--surface-3); border: 1px solid var(--line);
  border-radius: 4px; padding: 5px 9px; white-space: nowrap;
  font-family: var(--font-num); font-size: 11px; color: var(--ink);
  pointer-events: none; display: none; z-index: 6; box-shadow: var(--shadow);
}
.rb-tip b { color: var(--ink); font-size: 12.5px; }
.rb-tip i { font-style: normal; color: var(--ink-3); }
.rb.live .rb-cross, .rb.live .rb-tip { display: block; }

.ch-wrap { position: relative; cursor: crosshair; }
.ch-cross {
  position: absolute; top: 0; bottom: 18px; width: 1px;
  background: var(--ink-3); pointer-events: none; display: none;
}
.ch-dot {
  position: absolute; width: 8px; height: 8px; border-radius: 50%;
  transform: translate(-50%, -50%); pointer-events: none; display: none;
  box-shadow: 0 0 0 2px var(--surface);
}
.ch-tip {
  position: absolute; top: 2px; transform: translateX(-50%);
  background: var(--surface-3); border: 1px solid var(--line);
  border-radius: 5px; padding: 8px 10px; white-space: nowrap;
  font-family: var(--font-num); color: var(--ink);
  pointer-events: none; display: none; z-index: 6; box-shadow: var(--shadow);
  min-width: 148px;
}
.ch-tip i { font-style: normal; color: var(--ink-3); }
.ch-wrap.live .ch-cross, .ch-wrap.live .ch-dot, .ch-wrap.live .ch-tip { display: block; }

.tip-date { font-size: 9.5px; letter-spacing: .12em; color: var(--ink-3); text-transform: uppercase; }
.tip-big {
  font-size: 18px; font-weight: 650; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums; margin-top: 1px;
}
.tip-chg { font-size: 10.5px; margin-top: 1px; }
.tip-grid {
  display: grid; grid-template-columns: auto auto; gap: 1px 12px;
  margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--line);
}
.tip-grid span { font-size: 9.5px; letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase; }
.tip-grid b { font-size: 11px; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.tip-vol { margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--line); }
.tip-vol-k { font-size: 9.5px; letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase; }
.tip-vol-bar { height: 5px; border-radius: 3px; background: var(--surface); margin: 3px 0 2px; overflow: hidden; }
.tip-vol-bar i { display: block; height: 100%; background: var(--calls); border-radius: 3px; }
.tip-vol-v { font-size: 11px; font-variant-numeric: tabular-nums; }

/* ladder hover readout */
.rung-tip {
  position: fixed; transform: translate(-50%, -120%);
  background: var(--surface-3); border: 1px solid var(--line);
  border-radius: 5px; padding: 7px 10px; white-space: nowrap;
  font-family: var(--font-num); font-size: 11px; color: var(--ink);
  pointer-events: none; z-index: 50; box-shadow: var(--shadow); display: none;
}
.rung-tip.live { display: block; }
.rung-tip .rt-k { font-size: 9.5px; letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase; }
.rung-tip .rt-big { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
.rung-tip .rt-row { display: flex; justify-content: space-between; gap: 16px; margin-top: 2px; }

.bar-dual { display: flex; flex-direction: column; gap: 4px; }
.bar-cap {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  font-family: var(--font-num); font-size: 10px; letter-spacing: .11em;
  color: var(--ink-3); text-transform: uppercase; padding: 0 18px;
}
.bar-cap b { color: var(--ink); font-size: 12.5px; letter-spacing: 0; text-transform: none; }
.bar-cap .tagx {
  border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px;
  font-size: 9px; letter-spacing: .07em; color: var(--ink-3);
}

.probs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); }
.prob { padding: 12px 14px; border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 5px; }
.prob:last-child { border-right: 0; }
.prob-k { font-family: var(--font-num); font-size: 9.5px; letter-spacing: .11em; color: var(--ink-3); text-transform: uppercase; }
.prob-v { font-family: var(--font-num); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }

table.strat { min-width: 780px; }
table.strat td.verdict-cell { text-align: left; }
.pill.go   { color: var(--up);    border-color: var(--up); }
.pill.mid  { color: var(--warn);  border-color: var(--warn); }
.pill.no   { color: var(--ink-3); border-color: var(--line); }
.pill.risk { color: var(--down);  border-color: var(--down); }

.struct { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); }
.struct-c { padding: 12px 14px; border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 4px; }
.struct-k { font-family: var(--font-num); font-size: 9.5px; letter-spacing: .11em; color: var(--ink-3); text-transform: uppercase; }
.struct-v { font-family: var(--font-num); font-size: 15px; font-variant-numeric: tabular-nums; color: var(--ink); }
.struct-m { font-family: var(--font-num); font-size: 10px; color: var(--ink-3); }

.legs { display: flex; flex-direction: column; }
.leg-row {
  display: grid; grid-template-columns: 74px 1fr auto; gap: 12px; align-items: center;
  padding: 9px 14px; border-bottom: 1px solid var(--line-soft);
}
.leg-act {
  font-family: var(--font-num); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 3px; border: 1px solid; text-align: center;
}
.leg-act.sell { color: var(--down); border-color: var(--down); }
.leg-act.buy  { color: var(--up);   border-color: var(--up); }
.leg-desc { font-family: var(--font-num); font-size: 12.5px; color: var(--ink); }
.leg-prem { font-family: var(--font-num); font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

.checks { display: flex; flex-direction: column; }
.check {
  display: grid; grid-template-columns: 18px minmax(120px,170px) minmax(0,1fr);
  gap: 12px; align-items: baseline; padding: 10px 14px; border-bottom: 1px solid var(--line-soft);
}
.check:last-child { border-bottom: 0; }
.check .mk { font-family: var(--font-num); font-size: 12px; color: var(--calls); text-align: center; }
.check .ck { font-family: var(--font-num); font-size: 10px; letter-spacing: .09em; color: var(--ink-3); text-transform: uppercase; }
.check .cv { color: var(--ink-2); font-size: 12.5px; }
.check .cv b { color: var(--ink); font-family: var(--font-num); font-variant-numeric: tabular-nums; }

table.gap { min-width: 560px; }
.bar-pl { display: inline-block; height: 9px; border-radius: 2px; vertical-align: middle; }

/* ---------- candlestick overlay ---------- */
.ck-scrim {
  position: fixed; inset: 0; background: rgba(4,8,12,.72);
  opacity: 0; pointer-events: none; transition: opacity .16s ease; z-index: 60;
}
.ck-scrim.open { opacity: 1; pointer-events: auto; }

.ck-panel {
  position: fixed; inset: 3vh 3vw; z-index: 61;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: var(--shadow-lg);
  display: none; flex-direction: column; overflow: hidden;
}
.ck-panel.open { display: flex; }

.ck-hd {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 11px 16px; border-bottom: 1px solid var(--line);
}
.ck-name { font-family: var(--font-uWi); font-size: 16px; font-weight: 660; letter-spacing: -.01em; }
.ck-last {
  font-family: var(--font-num); font-size: 20px; font-weight: 650;
  font-variant-numeric: tabular-nums; letter-spacing: -.02em;
}
.ck-chg { font-family: var(--font-num); font-size: 12px; }
.ck-meta { font-family: var(--font-num); font-size: 10px; color: var(--ink-3); letter-spacing: .05em; }
.ck-ranges { margin-left: auto; display: flex; gap: 3px; }
.ck-r {
  border: 1px solid var(--line); background: none; color: var(--ink-2);
  border-radius: var(--r); padding: 4px 10px; cursor: pointer;
  font-family: var(--font-num); font-size: 10.5px;
}
.ck-r:hover { color: var(--ink); border-color: var(--ink-3); }
.ck-r[aria-selected="true"] { background: var(--calls-dim); border-color: var(--calls); color: var(--ink); }

.ck-body { flex: 1; position: relative; min-height: 0; }
.ck-chart { position: absolute; inset: 0; }

/* OHLC readout that tracks the crosshair, as in a broker terminal */
.ck-tip {
  position: absolute; top: 12px; left: 12px; z-index: 4;
  background: var(--surface-3); border: 1px solid var(--line);
  border-radius: 5px; padding: 9px 12px; pointer-events: none;
  font-family: var(--font-num); min-width: 210px; box-shadow: var(--shadow);
}
.ck-tip-date { font-size: 9.5px; letter-spacing: .12em; color: var(--ink-3); text-transform: uppercase; }
.ck-tip-big { font-size: 20px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 1px 0 2px; }
.ck-tip-grid { display: grid; grid-template-columns: auto auto; gap: 1px 14px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
.ck-tip-grid span { font-size: 9.5px; letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase; }
.ck-tip-grid b { font-size: 11.5px; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.ck-tip-vol { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); font-size: 10.5px; color: var(--ink-2); }

.ck-empty { padding: 40px 24px; text-align: center; color: var(--ink-2); }

.clickable-idx { cursor: pointer; }
.si { cursor: pointer; }
.si:hover .si-v { text-decoration: underline; text-underline-offset: 3px; }

/* ---------- watchlist ---------- */
.wl-tabs {
  display: flex; gap: 3px; padding: 8px 12px; flex-wrap: wrap;
  border-top: 1px solid var(--line-soft);
}
.wl-tab {
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2);
  border-radius: var(--r); padding: 6px 13px; cursor: pointer; font: inherit;
  font-size: 12px;
}
.wl-tab:hover { color: var(--ink); border-color: var(--ink-3); }
.wl-tab[aria-selected="true"] {
  background: var(--calls-dim); border-color: var(--calls);
  color: var(--ink); font-weight: 600;
}

.wl-exp {
  display: flex; gap: 3px; padding: 10px 14px; flex-wrap: wrap;
  border-bottom: 1px solid var(--line-soft);
}
.wl-e {
  border: 1px solid var(--line); background: none; color: var(--ink-2);
  border-radius: var(--r); padding: 5px 11px; cursor: pointer; font: inherit;
  font-size: 11.5px; text-align: left; line-height: 1.3;
}
.wl-e i {
  display: block; font-style: normal; font-family: var(--font-num);
  font-size: 9px; color: var(--ink-3); letter-spacing: .04em; margin-top: 1px;
}
.wl-e:hover { border-color: var(--ink-3); color: var(--ink); }
.wl-e[aria-selected="true"] {
  border-color: var(--calls); background: var(--calls-dim); color: var(--ink);
  font-weight: 600;
}

/* ---------- band comparison ---------- */
.bandlist { padding: 14px 16px 6px; display: flex; flex-direction: column; gap: 9px; }
.bandrow {
  display: grid; grid-template-columns: minmax(140px,190px) minmax(0,1fr) minmax(120px,150px);
  gap: 14px; align-items: center;
}
.bandrow-k { font-family: var(--font-num); font-size: 11.5px; color: var(--ink); }
.bandrow-k i {
  display: block; font-style: normal; font-size: 9.5px;
  color: var(--ink-3); letter-spacing: .04em; margin-top: 1px;
}
.bandrow-bar { position: relative; height: 13px; background: var(--surface-2); border-radius: 3px; }
.bandrow-bar span {
  position: absolute; top: 0; bottom: 0; border-radius: 3px;
  background: var(--calls); opacity: .78;
}
.bandrow-v {
  font-family: var(--font-num); font-size: 11.5px; text-align: right;
  color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.bandrow-v i {
  display: block; font-style: normal; font-size: 9.5px; color: var(--ink-3); margin-top: 1px;
}
.caution em { font-style: normal; color: var(--ink); }

@media (max-width: 720px) {
  .bandrow { grid-template-columns: 1fr; gap: 4px; }
  .bandrow-v { text-align: left; }
}

.mh-intro {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr));
  border-top: 1px solid var(--line-soft);
}
.mh-intro > div { padding: 12px 16px; border-right: 1px solid var(--line-soft); }
.mh-intro b {
  display: block; font-family: var(--font-num); font-size: 9.5px;
  letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3);
}
.mh-intro p { margin: 5px 0 0; color: var(--ink-2); font-size: 12.5px; }
.mh-intro em { font-style: normal; color: var(--ink); }
.mark.pend { color: var(--ink-3); font-size: 10px; }

/* ---------- learning ---------- */
.lrn-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(330px,1fr));
}
.lrn {
  padding: 13px 16px; border-right: 1px solid var(--line-soft);
  border-bottom: 1px solid var(--line-soft);
}
.lrn-t {
  font-family: var(--font-uWi); font-size: 13px; font-weight: 650;
  color: var(--ink); letter-spacing: -.005em;
}
.lrn-p { color: var(--ink-2); font-size: 12.5px; margin-top: 4px; line-height: 1.5; }
.lrn-p b { color: var(--ink); }
.lrn-p em { font-style: normal; color: var(--ink); }
.lrn-e {
  margin-top: 8px; padding: 7px 10px; border-radius: 4px;
  background: var(--calls-dim); border-left: 2px solid var(--calls);
  font-size: 12px; color: var(--ink-2); font-family: var(--font-num);
  line-height: 1.5;
}
.lrn-e b { color: var(--ink); }
.lrn-w {
  margin-top: 6px; font-family: var(--font-num); font-size: 9.5px;
  letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3);
}

/* ---------- model history ---------- */
.mh-card { overflow: hidden; }
.mh-hd {
  display: grid; grid-template-columns: 108px minmax(0,1fr) auto 18px;
  gap: 14px; align-items: center; width: 100%; text-align: left;
  background: none; border: 0; font: inherit; cursor: pointer;
  padding: 11px 14px; color: var(--ink);
}
.mh-hd:hover { background: var(--surface-2); }
.mh-date { font-family: var(--font-num); font-size: 12.5px; font-weight: 600; }
.mh-meta { font-family: var(--font-num); font-size: 10.5px; color: var(--ink-3); }
.mh-score {
  font-family: var(--font-num); font-size: 11px; padding: 2px 9px;
  border-radius: 3px; border: 1px solid var(--line); white-space: nowrap;
}
.mh-score.pos { color: var(--up);   border-color: var(--up); }
.mh-score.neg { color: var(--down); border-color: var(--down); }
.mh-chev { color: var(--ink-3); font-size: 11px; transition: transform .15s ease; }
.mh-card.open .mh-chev { transform: rotate(180deg); }
.mh-body { display: none; border-top: 1px solid var(--line-soft); }
.mh-card.open .mh-body { display: block; }

.mh-outcome {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  border-bottom: 1px solid var(--line-soft);
}
.mh-outcome > div { padding: 10px 14px; border-right: 1px solid var(--line-soft); }
.mh-outcome b {
  display: block; font-family: var(--font-num); font-size: 15px;
  font-variant-numeric: tabular-nums; margin-top: 2px;
}
.mh-outcome i {
  display: block; font-style: normal; font-family: var(--font-num);
  font-size: 9.5px; color: var(--ink-3); margin-top: 1px;
}

.qgrid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
  border-bottom: 1px solid var(--line-soft);
}
.qcell { padding: 9px 14px; border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); }
.qk {
  font-family: var(--font-num); font-size: 9px; letter-spacing: .12em;
  color: var(--ink-3); text-transform: uppercase;
}
.qv {
  font-family: var(--font-num); font-size: 14px; color: var(--ink);
  font-variant-numeric: tabular-nums; margin-top: 2px;
}
.qn { font-family: var(--font-num); font-size: 9.5px; color: var(--ink-3); margin-top: 1px; }

.relbar { height: 8px; border-radius: 3px; background: var(--surface-2); min-width: 120px; }
.relbar i { display: block; height: 100%; border-radius: 3px; }

/* ---------- accuracy / calibration ---------- */
table.ledger { min-width: 1720px; }

/* Column-group header: three bands so a wide row reads as claim -> outcome
   -> verdict rather than eighteen undifferentiated columns. */
.grp-row th {
  font-family: var(--font-num); font-size: 9px; letter-spacing: .16em;
  text-transform: uppercase; padding: 5px 10px; font-weight: 600;
  border-bottom: 1px solid var(--line);
}
.grp-claim { color: var(--calls);   background: var(--calls-dim); }
.grp-real  { color: var(--puts);    background: var(--puts-dim); }
.grp-next  { color: var(--up);      background: rgba(63,185,80,.10); }
.grp-vd    { color: var(--maxpain); background: var(--surface-2); }
table.ledger th.grp-edge, table.ledger td.grp-edge { border-right: 1px solid var(--line); }

.sub-n {
  display: block; font-style: normal; font-size: 9.5px;
  color: var(--ink-3); margin-top: 1px;
}
.mark.pend { color: var(--ink-3); }

/* Live forecasts sit above the scored ones, visibly separated -- they are
   not results and must never be counted as if they were. */
tr.pending-row td {
  background: var(--surface-2);
  border-top: 1px dashed var(--line);
  border-bottom: 1px dashed var(--line);
}
tr.pending-row td.lft { color: var(--ink-2); }
.pill.part { color: var(--warn); border-color: var(--warn); }

table.ledger { min-width: 800px; }
.mark { font-family: var(--font-num); font-weight: 700; font-size: 13px; }
.mark.hit  { color: var(--up); }
.mark.miss { color: var(--down); }
.formula {
  font-family: var(--font-num); font-size: 11px; color: var(--ink-2);
  background: var(--surface-2); border: 1px solid var(--line-soft);
  border-radius: 4px; padding: 7px 10px; overflow-x: auto; white-space: nowrap;
}
.stack-row {
  display: grid; grid-template-columns: 26px minmax(150px,220px) minmax(0,1fr) auto;
  gap: 12px; align-items: baseline; padding: 10px 14px; border-bottom: 1px solid var(--line-soft);
}
.stack-row:last-child { border-bottom: 0; }
.stack-n { font-family: var(--font-num); font-size: 10px; color: var(--ink-3); text-align: center; }
.stack-k { font-family: var(--font-num); font-size: 11.5px; color: var(--ink); }
.stack-d { color: var(--ink-2); font-size: 12.5px; }
.pill.live { color: var(--up);   border-color: var(--up); }
.pill.next { color: var(--calls);border-color: var(--calls); }
.pill.wait { color: var(--ink-3);border-color: var(--line); }

@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .rail { flex-direction: row; align-items: center; gap: 16px; overflow-x: auto; padding: 10px 14px; }
  .rail-group, .rail-foot { display: none; }
  .verdict { grid-template-columns: 1fr; }
  .verdict-main { border-right: 0; border-bottom: 1px solid var(--line-soft); }
  .leg-grid { grid-template-columns: 1fr; }
  .lg:nth-child(odd) { border-right: 0; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<body>

<div class="pt-panel" id="ptPanel" hidden role="dialog"
     aria-label="Chart point detail"></div>

<div class="mock" id="freshness" hidden>
  <strong id="freshTag">Loading</strong>
  <span id="freshMsg">Reading snapshot&hellip;</span>

<div class="shell">
  <nav class="rail">

  <div class="main">

      <div class="topbar-right">

    </div>

    <div class="content" id="content"></div>
  </div>
</div>

<div class="rung-tip" id="rungTip"></div>

<div class="ck-scrim" id="ckScrim"></div>
<aside class="ck-panel" id="ckPanel" role="dialog" aria-modal="true" aria-labelledby="ckName">
  <div class="ck-hd">
    <div>
      <div class="ck-name" id="ckName">&mdash;</div>
      <div class="ck-meta" id="ckMeta">&mdash;</div>
    </div>
    <div>
      <div class="ck-last" id="ckLast">&mdash;</div>

    </div>

  </div>
