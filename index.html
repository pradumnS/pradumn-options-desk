        '<td class="' + cls(it.chg) + '">' + sgn(it.chg, 2) + "</td>" +
        '<td class="' + cls(it.chgPct) + '">' + sgn(it.chgPct, 2) + "%</td>" +
        "<td>" + n2(it.open) + "</td><td>" + n2(it.high) + "</td><td>" + n2(it.low) + "</td>" +
        '<td class="lft" style="color:var(--ink-3)">' + esc(it.unit || "") + "</td></tr>";
    }).join("");

    return '<section class="card"><div class="card-hd"><h2>Commodities &amp; FX</h2>' +
      '<span class="sub">international benchmarks</span></div>' +
      '<div class="caution"><p><b>Not MCX, and not rupees.</b> ' + esc(L.note || "") + "</p></div>" +
      '<div class="tablewrap"><table class="dt"><thead><tr>' +
      '<th class="lft">Instrument</th><th class="lft">Symbol</th><th>Last</th>' +
      "<th>Chg</th><th>Chg %</th><th>Open</th><th>High</th><th>Low</th>" +
      '<th class="lft">Unit</th></tr></thead><tbody>' + rows + "</tbody></table></div></section>";
  }

  /* ==========================================================
     6i. MODEL HISTORY
         One expandable card per session: everything the model
         computed that day, every claim it made, and how each
         one turned out. Model accuracy answers "how calibrated
         am I"; this answers "what did I say on the 17th, and
         which parts of it held".
     ========================================================== */
  var CLAIM_LABEL = {
    range_next:    "Next-session range",
    range_expiry:  "Expiry range 1&sigma;",
    range_2sd:     "Expiry range 2&sigma;",
    max_pain_pull: "Max pain pull",
    call_wall:     "Call wall holds",
    put_wall:      "Put wall holds",
    stance:        "Directional stance",
    vrp:           "Vol premium call",
    ce_survival:   "Short call holds",
    pe_survival:   "Short put holds"
  };

  function viewModelHistory(m) {
    var H = MHIST[state.idx];
    if (!H || !(H.entries || []).length) {
      return '<section class="card"><div class="card-hd"><h2>Model history</h2></div>' +
        '<div class="caution"><p><b>No archived sessions yet.</b> ' +
        "Run <em>python backfill.py</em> to populate the per-day record.</p></div></section>";
    }

    var rel = (H.reliability || []).slice().sort(function (a, b) {
      return (b.rate || 0) - (a.rate || 0);
    });
    var relRows = rel.map(function (r) {
      var pct = (r.rate || 0) * 100;
      var tone = pct >= 70 ? "var(--up)" : pct >= 55 ? "var(--warn)" : "var(--down)";
      return '<tr><td class="lft">' + (CLAIM_LABEL[r.claim] || esc(r.claim)) + "</td>" +
        "<td>" + r.n + "</td><td>" + r.hits + "</td>" +
        '<td style="color:' + tone + ';font-weight:600">' + n1(pct) + "%</td>" +
        '<td class="lft"><div class="relbar"><i style="width:' +
          Math.max(0, Math.min(100, pct)).toFixed(1) + "%;background:" + tone +
          '"></i></div></td></tr>';
    }).join("");

    var relCard =
      '<section class="card"><div class="card-hd"><h2>Which claims hold up</h2>' +
      '<span class="sub">every assertion, graded separately</span>' +
      '<div class="right"><span class="kpi-m">this is what tells you which part of the model to trust</span></div></div>' +
      '<div class="tablewrap"><table class="dt"><thead><tr>' +
      '<th class="lft">Claim</th><th>Graded</th><th>Correct</th><th>Hit rate</th>' +
      '<th class="lft">&nbsp;</th></tr></thead><tbody>' + relRows + "</tbody></table></div>" +
      '<div class="caution"><p>A single verdict per day hides which part of the model works. ' +
      "A session can call the range perfectly and still have a short strike taken out, or pin " +
      "max pain while the stance was backwards. Graded apart, these say <b>what to fix</b> " +
      "rather than only that something was wrong.</p></div></section>";

    var intro =
      '<section class="card"><div class="card-hd"><h2>Model history</h2>' +
      '<span class="sub">' + H.entries.length + " archived session(s)</span>" +
      '<div class="right"><span class="kpi-m">what was computed, what was claimed, what happened</span></div></div>' +
      '<div class="mh-intro">' +
        '<div><b>What this is</b><p>One card per trading session, frozen as the ' +
          "model saw it that morning. The quantitative block is the <em>archived</em> " +
          "calculation, not recomputed today, so a card from months ago still shows " +
          "the numbers that were actually in front of it.</p></div>" +
        '<div><b>What to read</b><p>Start with the score in the header &mdash; ' +
          "<em>4 / 6 claims</em> means six were gradable and four came true. Then the " +
          "claim table shows exactly which held and which did not. One session is " +
          "noise; the table above shows the pattern across all of them.</p></div>" +
        '<div><b>Why some rows are blank</b><p>A session forecasting a distant expiry ' +
          "has nothing to grade until that expiry arrives. Rows marked " +
          '<span class="mark pend">n/a</span> are not pending &mdash; they are claims ' +
          "that cannot be measured at all, such as volatility over a window too short " +
          "to estimate it.</p></div>" +
      "</div></section>";

    var entries = H.entries.slice(0, 40);
    var cards = entries.map(function (e, i) {
      var open = i === 0;
      var pct = e.nGraded ? (e.nCorrect / e.nGraded * 100) : null;
      var tone = pct == null ? "neu" : pct >= 70 ? "pos" : pct >= 50 ? "neu" : "neg";

      var claimRows = (e.claims || []).map(function (c) {
        /* Resolved with no verdict means the claim was never measurable --
           distinct from waiting for a horizon, and it should not read as a
           failure or as pending. */
        var mark;
        if (c.correct == null && c.resolvedOn) {
          mark = '<span class="mark pend" title="not measurable for this session">n/a</span>';
        } else if (c.correct == null) {
          mark = '<span class="mark pend" title="horizon has not arrived">&middot;</span>';
        } else {
          mark = '<span class="mark ' + (c.correct ? "hit" : "miss") + '">' +
                 (c.correct ? "&#10003;" : "&#10007;") + "</span>";
        }
        return '<tr><td class="lft">' + (CLAIM_LABEL[c.claim] || esc(c.claim)) + "</td>" +
          '<td class="lft" style="color:var(--ink-3)">' + esc(c.horizon) + "</td>" +
          '<td class="lft">' + esc(c.stated || "") + "</td>" +
          "<td>" + (c.actual != null ? n2(c.actual) : "&mdash;") + "</td>" +
          '<td class="lft" style="color:var(--ink-3)">' + esc(c.resolvedOn || "pending") + "</td>" +
          "<td>" + mark + "</td></tr>";
      }).join("");

      var q = e.quant || {};
      function qc(k, v, note) {
        if (v == null || v === "") return "";
        return '<div class="qcell"><div class="qk">' + k + "</div>" +
               '<div class="qv">' + v + "</div>" +
               (note ? '<div class="qn">' + note + "</div>" : "") + "</div>";
      }

      var quantGrid =
        qc("ATM IV", e.atmIv != null ? n2(e.atmIv) + "%" : null) +
        qc("Yang-Zhang 10d", q.yangZhang10 != null ? n2(q.yangZhang10) + "%" : null,
           q.closeClose10 != null ? "close-close " + n2(q.closeClose10) + "%" : "") +
        qc("HAR-RV forecast", q.harForecast != null ? n2(q.harForecast) + "%" : null) +
        qc("IV / RV", q.vrpRatio != null ? n2(q.vrpRatio) : null,
           q.vrpSpread != null ? sgn(q.vrpSpread, 2) + " vol pts" : "") +
        qc("IV rank", q.ivRank != null ? n1(q.ivRank) : null,
           q.ivPercentile != null ? "pctile " + n1(q.ivPercentile) : "") +
        qc("PCR", e.pcr != null ? n2(e.pcr) : null) +
        qc("Max pain", e.maxPain != null ? n0(e.maxPain) : null) +
        qc("OI walls", (e.putWall != null && e.callWall != null)
             ? n0(e.putWall) + " / " + n0(e.callWall) : null, "put / call") +
        qc("Forward", q.forward != null ? n0(q.forward) : null,
           q.basis != null ? "basis " + sgn(q.basis, 1) : "") +
        qc("Straddle", q.straddle != null ? n2(q.straddle) : null,
           q.straddleMove != null ? "&plusmn;" + n0(q.straddleMove) + " pts" : "") +
        qc("25&Delta; skew", q.riskReversal != null ? sgn(q.riskReversal, 2) : null,
           q.tilt || "") +
        qc("RND shape", q.rndSkew != null ? "skew " + sgn(q.rndSkew, 2) : null,
           q.rndKurtosis != null ? "kurt " + sgn(q.rndKurtosis, 2) : "") +
        qc("Regime", q.regime ? esc(q.regime) : null,
           q.sessionsToExpiry != null ? q.sessionsToExpiry + " sessions left" : "");

      return '<section class="card mh-card' + (open ? " open" : "") + '">' +
        '<button class="mh-hd" data-mh="' + esc(e.date) + '">' +
          '<span class="mh-date">' + esc(e.date) + "</span>" +
          '<span class="mh-meta">spot ' + n2(e.spot) +
            (e.expiry ? " &middot; exp " + esc(e.expiry) : "") +
            (e.stance ? " &middot; " + esc(e.stance.replace(/_/g, " ")) : "") + "</span>" +
          '<span class="mh-score ' + tone + '">' +
            (pct == null
               ? (e.claims || []).length + " claims &middot; awaiting"
               : e.nCorrect + " / " + e.nGraded + " claims") +
          "</span>" +
          '<span class="mh-chev">&#9662;</span>' +
        "</button>" +
        '<div class="mh-body">' +
          '<div class="mh-outcome">' +
            '<div><span class="qk">Next session</span><b>' +
              (e.nxClose != null ? n2(e.nxClose) + " (" + sgn(e.nxMove, 0) + ")" : "awaiting") +
              "</b><i>" + esc(e.nxDate || "next trading day") + "</i></div>" +
            '<div><span class="qk">At expiry</span><b>' +
              (e.settle != null ? n2(e.settle) + " (" + sgn(e.move, 0) + ")" : "awaiting") +
              "</b><i>" + (e.realisedSd != null
                 ? n2(e.realisedSd) + "&sigma; of the band"
                 : "settles " + esc(e.expiry || "-")) + "</i></div>" +
          "</div>" +
          '<div class="qgrid">' + quantGrid + "</div>" +
          '<div class="tablewrap"><table class="dt"><thead><tr>' +
            '<th class="lft">Claim</th><th class="lft">Horizon</th>' +
            '<th class="lft">Stated on the day</th><th>Actual</th>' +
            '<th class="lft">Resolved</th><th>&nbsp;</th>' +
          "</tr></thead><tbody>" + claimRows + "</tbody></table></div>" +
        "</div></section>";
    }).join("");

    return intro + relCard + cards;
  }

  /* ==========================================================
     6j. LEARNING
         Every technical term the desk uses, in plain language,
         worked through with the live numbers so each definition
         can be checked against the screen beside it.
     ========================================================== */
  function viewLearning(m) {
    var a = (m && m.an) || {};
    var rv = (a.realisedVol || {})["10"] || {};
    var vrp = a.vrp || {};
    var sk = a.skew || {};
    var st = a.straddle || {};
    var fwd = a.forward || {};
    var vr5 = (a.varianceRatio || {})["5"] || {};
    var cands = (m.cands || []).filter(function (c) { return c.verdict.c === "go"; });
    var ex = cands[0];

    function T(term, plain, example, where) {
      return '<div class="lrn">' +
        '<div class="lrn-t">' + term + "</div>" +
        '<div class="lrn-p">' + plain + "</div>" +
        (example ? '<div class="lrn-e"><b>Today</b> ' + example + "</div>" : "") +
        (where ? '<div class="lrn-w">' + where + "</div>" : "") +
      "</div>";
    }

    function S(title, blurb, body) {
      return '<section class="card"><div class="card-hd"><h2>' + title + "</h2>" +
        (blurb ? '<span class="sub">' + blurb + "</span>" : "") + "</div>" +
        '<div class="lrn-grid">' + body + "</div></section>";
    }

    var head =
      '<section class="card"><div class="card-hd"><h2>Learning</h2>' +
      '<span class="sub">every term on this desk</span>' +
      '<div class="right"><span class="kpi-m">examples use today&rsquo;s live numbers</span></div></div>' +
      '<div class="mh-intro">' +
        '<div><b>How to use this</b><p>Each entry gives the plain meaning, a worked ' +
          "example from <em>today&rsquo;s actual data</em>, and where it appears on the " +
          "desk. Nothing here is invented &mdash; you can check every number against " +
          "the tab it names.</p></div>" +
        '<div><b>If you read one thing</b><p>The single most important number for a ' +
          "premium seller is <em>IV / RV</em>. It says whether the market is charging " +
          "more for risk than the risk has been costing. Everything else is context " +
          "around that.</p></div>" +
        '<div><b>What this desk cannot do</b><p>It does not predict direction, and its ' +
          "own scoring says so &mdash; the directional stance grades below a coin flip. " +
          "It measures <em>ranges and volatility</em>, which is a different and more " +
          "answerable question.</p></div>" +
      "</div></section>";

    /* ---------------------------------------------------- 1. the basics */
    var basics = S("1. The basics", "the vocabulary everything else is built on",
      T("Spot", "The index level right now. Not a tradeable instrument &mdash; you " +
        "trade futures or options on it.",
        "NIFTY spot is <b>" + n2(m.cfg.spot) + "</b>.", "Market strip, Overview") +
      T("Strike", "The price at which an option can be exercised. Chains are listed " +
        "in fixed steps &mdash; 50 points for NIFTY.",
        "The strike nearest spot is <b>" + n0(m.atm) + "</b>. That one is called ATM.",
        "Option chain") +
      T("CE and PE", "CE is a <b>call</b> &mdash; it gains when the index rises. " +
        "PE is a <b>put</b> &mdash; it gains when the index falls.",
        null, "Option chain, OI ladder") +
      T("ATM, ITM, OTM", "At / in / out of the money. A call is ITM when spot is " +
        "<em>above</em> its strike; a put is ITM when spot is <em>below</em>. " +
        "OTM options have no intrinsic value &mdash; only time value.",
        "With spot " + n0(m.cfg.spot) + ", the " + n0(m.atm + 500) +
        " call is OTM and the " + n0(m.atm - 500) + " put is OTM.",
        "Option chain &mdash; shaded cells are ITM") +
      T("Expiry", "The date the contract settles. NIFTY has a weekly expiry every " +
        "Tuesday, plus a monthly. After it, the contract ceases to exist.",
        "Current expiry <b>" + esc(m.cfg.expiry) + "</b>, " + m.dte + " sessions away.",
        "Watchlist &mdash; each expiry is a separate tab") +
      T("Lot size", "Options trade in fixed bundles, not single units. Every premium " +
        "you see is <em>per unit</em>; multiply by the lot for actual rupees.",
        "NIFTY lot is <b>" + m.cfg.lot + "</b>. A premium of 20.00 means " +
        "20 &times; " + m.cfg.lot + " = <b>&#8377;" + n0(20 * m.cfg.lot) + "</b> received.",
        "Strike drawer") +
      T("LTP and premium", "Last traded price of the option. For a seller this is the " +
        "<em>credit</em> received; for a buyer, the cost.",
        null, "Option chain, Watchlist"));

    /* ------------------------------------------- 2. open interest */
    var oi = S("2. Open interest and positioning",
      "who is committed where, and what that implies",
      T("Open interest (OI)", "The number of contracts currently open at a strike. " +
        "Not volume &mdash; volume counts trades today, OI counts positions still " +
        "held. Rising OI means new money committing.",
        "Heaviest put OI sits at <b>" + n0(m.putWall) + "</b>, heaviest call OI at " +
        "<b>" + n0(m.callWall) + "</b>.", "OI ladder, Option chain") +
      T("Change in OI", "The day's move in open interest. Read alongside the price " +
        "change &mdash; the pair tells you what kind of money moved.",
        null, "OI &amp; build-up") +
      T("Build-up (the four quadrants)",
        "<b>Long build-up</b>: OI up, price up &mdash; fresh buyers, conviction.<br>" +
        "<b>Short build-up</b>: OI up, price down &mdash; fresh writers; the strike " +
        "becomes a barrier.<br>" +
        "<b>Short covering</b>: OI down, price up &mdash; writers buying back; the " +
        "barrier is breaking.<br>" +
        "<b>Long unwinding</b>: OI down, price down &mdash; buyers leaving.",
        null, "OI &amp; build-up") +
      T("OI walls", "The strikes with the most open interest. Writers defend them, so " +
        "they often act as support (put wall) and resistance (call wall).",
        "Expected range between <b>" + n0(m.putWall) + "</b> and <b>" +
        n0(m.callWall) + "</b>.<br>This desk grades that claim: the call wall has held " +
        "<b>92.8%</b> of the time, the put wall <b>80.0%</b>.",
        "OI ladder, Model history") +
      T("PCR (put-call ratio)", "Total put OI divided by total call OI. Above 1 means " +
        "more puts are written than calls, usually read as supportive; below 1, the " +
        "reverse. It is <em>context, not a signal</em> &mdash; weak on its own.",
        "PCR is <b>" + n2(m.pcr) + "</b>" +
        (m.pcr < 0.9 ? " &mdash; call-heavy, upside capped."
          : m.pcr > 1.1 ? " &mdash; put-heavy, supportive." : " &mdash; neutral."),
        "Overview") +
      T("Max pain", "The strike where option writers as a group lose least if the " +
        "index settles there. Theory says price drifts toward it.<br>" +
        "<b>On this desk&rsquo;s own record it is a coin flip &mdash; 50.8% over 250 " +
        "sessions.</b> Shown for context, never acted on.",
        "Max pain <b>" + n0(m.maxPain) + "</b>, spot " + n0(m.cfg.spot) + ".",
        "Overview, Model history"));

    /* ------------------------------------------- 3. volatility */
    var vol = S("3. Volatility &mdash; the core of this desk",
      "what the market charges for risk, versus what risk has cost",
      T("Sigma (&sigma;)", "One standard deviation &mdash; the statistical unit of " +
        "'a normal-sized move'. Roughly <b>68%</b> of outcomes fall within &plusmn;1&sigma;, " +
        "<b>95%</b> within &plusmn;2&sigma;.",
        "1&sigma; to expiry is <b>&plusmn;" + n0(m.sd1) + " points</b>, so the 68% range " +
        "is <b>" + n0(m.range1[0]) + " &ndash; " + n0(m.range1[1]) + "</b>.",
        "Direction &amp; strategy") +
      T("Implied volatility (IV)", "The volatility the market is <em>pricing in</em>, " +
        "backed out of option prices. Quoted annualised. High IV means expensive " +
        "options; low IV means cheap.",
        "ATM IV is <b>" + n2(m.atmIv) + "%</b>.", "Overview, Option chain") +
      T("How a range is built", "spot &times; IV &times; &radic;(time). Time is measured " +
        "in <em>trading</em> days, not calendar days &mdash; volatility only accrues " +
        "while the market is open, so counting the weekend inflates the band by ~15%.",
        n0(m.cfg.spot) + " &times; " + n2(m.atmIv) + "% &times; &radic;(" +
        m.dte + "/252) = <b>&plusmn;" + n0(m.sd1) + "</b>.",
        "Direction &amp; strategy") +
      T("Realised volatility (RV)", "What volatility <em>actually was</em>, measured " +
        "from price history. Implied is a forecast; realised is the outcome.",
        "10-day Yang-Zhang RV is <b>" + n2(rv.yang_zhang) + "%</b>.",
        "Direction &amp; strategy") +
      T("Why five RV estimators", "They disagree, and the disagreement is the " +
        "information. <b>Close-to-close</b> sees only closes and is noisiest. " +
        "<b>Parkinson</b> uses the high-low range but is blind to overnight gaps. " +
        "<b>Yang-Zhang</b> is both gap-aware and drift-independent, and ~14&times; more " +
        "efficient than close-to-close &mdash; it is the one to trust.",
        "Today: Yang-Zhang <b>" + n2(rv.yang_zhang) + "%</b> vs close-to-close <b>" +
        n2(rv.close_to_close) + "%</b> on identical data. A verdict built on the " +
        "second number would be badly wrong.",
        "Direction &amp; strategy") +
      T("IV / RV &mdash; the seller&rsquo;s edge",
        "Implied divided by realised. Above 1 the market charges more than volatility " +
        "has been costing, and selling premium is compensated. Below 1 it is not.",
        "Today <b>" + n2(vrp.ratio) + "</b> " +
        (vrp.ratio > 1.1 ? "&mdash; implied is rich, the seller is being paid."
          : vrp.ratio < 0.95 ? "&mdash; implied is thin; selling is not compensated."
          : "&mdash; roughly fair."),
        "Direction &amp; strategy") +
      T("Variance risk premium", "The name for that gap. It is real and persistent " +
        "&mdash; index IV exceeds later RV most of the time. But it is <em>payment for " +
        "the tail</em>, not free money, and it inverts exactly when the tail arrives.",
        null, "Direction &amp; strategy") +
      T("HAR-RV forecast", "A model that predicts tomorrow's realised volatility from " +
        "its daily, weekly and monthly averages. Better than assuming today repeats.",
        "Forecast <b>" + n2(a.harRv ? a.harRv.forecast : null) + "%</b>" +
        (a.harRv ? " (R&sup2; " + n2(a.harRv.r2) + ")" : ""),
        "Direction &amp; strategy") +
      T("IV rank vs IV percentile", "<b>Rank</b>: where IV sits between its window low " +
        "and high. <b>Percentile</b>: the share of days it was lower than today. Rank " +
        "is pinned by two extremes; percentile uses the whole distribution. When they " +
        "diverge, trust percentile.",
        "Rank <b>" + n1(a.ivRank) + "</b>, percentile <b>" + n1(a.ivPercentile) + "</b>.",
        "Direction &amp; strategy") +
      T("India VIX", "The market's own 30-day volatility index. Low VIX means calm and " +
        "thin premium; a spike hurts a short-premium book before direction does.",
        "VIX <b>" + n2(m.cfg.vix) + "</b>.", "Market strip") +
      T("Variance ratio", "Tests whether moves compound (trending) or fade " +
        "(mean-reverting). At 1.0 the index is a random walk, which is what " +
        "&radic;time scaling assumes.",
        "5-day VR <b>" + n3(vr5.vr) + "</b> &mdash; " + esc(vr5.regime || "-") + ".",
        "Direction &amp; strategy"));

    /* ------------------------------------------- 4. probability */
    var prob = S("4. Probability and pricing",
      "how the odds on each strike are worked out",
      T("Delta", "How much the option price moves for a 1-point move in the index. " +
        "Also a rough proxy for the chance of finishing in the money &mdash; a " +
        "0.15 delta option has roughly a 15% chance.",
        ex ? "The " + n0(ex.strike) + " " + ex.side + " has delta <b>" +
          n2(ex.delta) + "</b>." : null,
        "Direction &amp; strategy") +
      T("POP (probability of profit)", "For a seller, the chance the option expires " +
        "worthless. Computed from Black-Scholes as 1 &minus; N(d&#8322;).",
        ex ? "The " + n0(ex.strike) + " " + ex.side + " has POP <b>" +
          n1(ex.pop * 100) + "%</b>." : null,
        "Direction &amp; strategy") +
      T("Why POP understates risk", "It assumes returns are lognormal. Real markets gap " +
        "further than that. An 85% POP trade does not lose 15% of the time in a tidy " +
        "way &mdash; it loses <em>rarely and large</em>. That asymmetry is the whole " +
        "risk of selling options.",
        null, "Direction &amp; strategy") +
      T("Risk-neutral density", "The market's own probability distribution for where " +
        "the index settles, read straight out of option prices by differentiating the " +
        "call curve twice. No lognormal assumption &mdash; skew and fat tails appear " +
        "because they are in the prices.",
        null, "Direction &amp; strategy") +
      T("Cornish-Fisher", "Adjusts a normal range for real-world skew and fat tails. " +
        "It widens the downside more than the upside, which is the direction that " +
        "matters for a seller.",
        null, "Direction &amp; strategy") +
      T("25&Delta; risk reversal and butterfly",
        "<b>Risk reversal</b> = call IV &minus; put IV at 25 delta. Negative is normal " +
        "for equity indices: puts cost more because indices fall faster than they rise. " +
        "<b>Butterfly</b> measures how curved the smile is.",
        "RR <b>" + sgn(sk.risk_reversal, 2) + "</b> (" + esc(sk.tilt || "-") + "), " +
        "BF <b>" + sgn(sk.butterfly, 2) + "</b>.",
        "Direction &amp; strategy") +
      T("Forward and basis", "The forward is where the market prices the index for a " +
        "future date, recovered from put-call parity. <b>Basis</b> is forward minus " +
        "spot &mdash; normally a small positive cost of carry.",
        fwd.forward ? "Forward <b>" + n0(fwd.forward) + "</b>, basis <b>" +
          sgn(fwd.basis, 1) + "</b>." : null,
        "Direction &amp; strategy, Watchlist") +
      T("Straddle expected move", "The ATM call plus put. It is the market's traded " +
        "breakeven &mdash; the move a straddle buyer needs just to break even. Not the " +
        "same as 1&sigma;: it prices the <em>average</em> move, about 0.8&sigma;.",
        st.straddle ? "Straddle <b>" + n2(st.straddle) + "</b> = &plusmn;<b>" +
          n0(st.move_pts) + "</b> points." : null,
        "Direction &amp; strategy"));

    /* ------------------------------------------- 5. selling */
    var sell = S("5. Selling premium",
      "the numbers that decide whether a trade is worth taking",
      T("Credit and margin", "Credit is what you receive. Margin is what the broker " +
        "blocks. The trade is only as good as the ratio between them.",
        ex ? "Selling the " + n0(ex.strike) + " " + ex.side + " at " + n2(ex.credit) +
          " gives <b>&#8377;" + n0(ex.creditRs) + "</b> credit." : null,
        "Direction &amp; strategy") +
      T("ROM (return on margin)", "Credit as a percentage of margin blocked, for the " +
        "holding period. This desk rejects anything under 0.80% &mdash; below that the " +
        "premium does not pay for the tail risk.",
        ex ? "ROM <b>" + n2(ex.rom) + "%</b>." : null,
        "Direction &amp; strategy") +
      T("Breakeven", "Short strike plus (or minus) the credit received. Beyond it the " +
        "position starts losing.", null, "Direction &amp; strategy") +
      T("Why a wing (defined risk)", "Buying a further-out option caps the loss. A " +
        "naked short has no cap &mdash; a gap can cost many multiples of the credit. " +
        "In low IV, where premium is thin, the wing is not optional.",
        null, "Direction &amp; strategy") +
      T("VaR and expected shortfall", "<b>VaR 95%</b> is the loss at the 5th worst " +
        "percentile. <b>Expected shortfall</b> is the <em>average</em> loss once you are " +
        "in that worst 5%. ES is the honest number &mdash; max loss tells you the cap, " +
        "ES tells you what bad days actually cost.",
        null, "Direction &amp; strategy") +
      T("Iron condor / short strangle", "Sell an OTM call and an OTM put. A " +
        "<b>strangle</b> is naked on both sides; an <b>iron condor</b> adds protective " +
        "wings. Both profit if the index stays between the strikes.",
        null, "Direction &amp; strategy"));

    /* ------------------------------------------- 6. scoring */
    var score = S("6. How this desk grades itself",
      "the part that makes the rest trustworthy",
      T("Claims", "Each session the model makes about nine separate assertions &mdash; " +
        "ranges, walls, max pain, stance, the volatility call, each strike. Every one " +
        "is scored on its own, so you learn <em>which part</em> works rather than only " +
        "that something was wrong.",
        null, "Model history") +
      T("Brier score", "Mean squared error of a probability forecast. 0 is perfect, " +
        "0.25 is a coin flip. <b>Brier skill</b> compares it to always guessing the " +
        "base rate &mdash; above zero means the model adds something.",
        null, "Model accuracy") +
      T("Calibration (ECE)", "When the model says 85%, does it happen 85% of the time? " +
        "The reliability chart plots said against happened; on the diagonal is honest, " +
        "below it is overconfident.",
        null, "Model accuracy") +
      T("Coverage and the Kupiec test", "A 1&sigma; band should contain the outcome " +
        "68.3% of the time. Kupiec is the statistical test of whether it does. " +
        "LR above 3.84 rejects the band.",
        null, "Model accuracy") +
      T("Band factor", "The measured multiple of the stated 1&sigma; band that actually " +
        "contained 68% of outcomes. At 1.00 the band is honest; below, it is too wide.",
        null, "Model accuracy") +
      T("What the record says so far",
        "Ranges and structural levels hold up. <b>Directional signals do not.</b>",
        "Expiry 2&sigma; <b>96.4%</b> &middot; call wall <b>92.8%</b> &middot; " +
        "1&sigma; <b>73.2%</b> &middot; next-session <b>72.0%</b> &middot; " +
        "vol premium <b>62.5%</b> &middot; max pain <b>50.8%</b> &middot; " +
        "stance <b>48.2%</b>",
        "Model history"));

    return head + basics + oi + vol + prob + sell + score;
  }

  /* Sort state for the constituents table. Kept out of `state` because it
     is local to one view and should not survive an index switch. */
  var stockSort = { key: "weightPct", dir: -1 };

  function viewStocks(m) {
    /* normalise() exposes the index as cfg.key, not cfg.index. Reading the
       wrong one returned undefined and the view rendered its empty state
       with the data sitting right there in the snapshot. */
    var d = (STOCKS || {})[m.cfg.key] || (STOCKS || {})[state.idx];
    if (!d || !d.rows || !d.rows.length) {
      return '<section class="card"><div class="card-hd"><h2>NIFTY 50 stocks</h2></div>' +
        '<div class="caution"><p><b>Not exported yet.</b> Run ' +
        "<code>./run.sh</code> to build the constituent table.</p></div></section>";
    }

    var rows = d.rows.slice().sort(function (a, b) {
      var k = stockSort.key;
      var x = a[k], y = b[k];
      if (x === null || x === undefined) return 1;
      if (y === null || y === undefined) return -1;
      if (typeof x === "string") return stockSort.dir * x.localeCompare(y);
      return stockSort.dir * (x - y);
    });

    var up = d.advances, dn = d.declines;
    var totTurn = 0;
    rows.forEach(function (r) { totTurn += r.turnover || 0; });

    var cols = [
      ["symbol", "Stock", "lft"],
      ["close", "Close", ""],
      ["chgPct", "Chg %", ""],
      ["contribPts", "Index pts", ""],
      ["weightPct", "Weight %", ""],
      ["chg5Pct", "5-day %", ""],
      ["deliveryPct", "Delivery %", ""],
      ["vwap", "VWAP", ""],
      ["turnover", "Turnover", ""],
      ["dma50", "50-DMA", ""]
    ];

    var head = cols.map(function (c) {
      var on = stockSort.key === c[0];
      return '<th class="' + c[2] + ' sortable' + (on ? " on" : "") +
        '" data-sort="' + c[0] + '">' + c[1] +
        (on ? (stockSort.dir < 0 ? " \u25be" : " \u25b4") : "") + "</th>";
    }).join("");

    var body = rows.map(function (r) {
      var turn = r.turnover ? (r.turnover / 1e7) : null;   // rupees -> crore
      return '<tr class="clickable" data-stock="' + esc(r.symbol) + '">' +
        '<td class="lft"><b>' + esc(r.symbol) + "</b></td>" +
        "<td>" + n2(r.close) + "</td>" +
        '<td class="' + cls(r.chgPct) + '">' + sgn(r.chgPct, 2) + "%</td>" +
        '<td class="' + cls(r.contribPts) + '"><b>' + sgn(r.contribPts, 1) + "</b></td>" +
        "<td>" + n2(r.weightPct) + "</td>" +
        '<td class="' + cls(r.chg5Pct) + '">' + (r.chg5Pct == null ? "\u2014" : sgn(r.chg5Pct, 2) + "%") + "</td>" +
        "<td>" + (r.deliveryPct == null ? "\u2014" : n1(r.deliveryPct) + "%") + "</td>" +
        "<td>" + n2(r.vwap) + "</td>" +
        "<td>" + (turn == null ? "\u2014" : n0(turn)) + "</td>" +
        '<td class="' + (r.aboveDma ? "pos" : "neg") + '">' + n0(r.dma50) + "</td>" +
      "</tr>";
    }).join("");

    return '<section class="card"><div class="card-hd"><h2>NIFTY 50 stocks</h2>' +
      '<span class="sub">' + esc(d.tradeDate) + " &middot; settled close</span>" +
      '<div class="right"><span class="kpi-m">click a column to sort</span></div></div>' +
      '<div class="probs">' +
        '<div class="prob"><div class="prob-k">Advancing</div><div class="prob-v pos">' + up + "</div>" +
          '<div class="kpi-m">of ' + d.count + "</div></div>" +
        '<div class="prob"><div class="prob-k">Declining</div><div class="prob-v neg">' + dn + "</div>" +
          '<div class="kpi-m">of ' + d.count + "</div></div>" +
        '<div class="prob"><div class="prob-k">Above 50-DMA</div><div class="prob-v">' + d.aboveDma + "</div>" +
          '<div class="kpi-m">participation</div></div>' +
        '<div class="prob"><div class="prob-k">Turnover</div><div class="prob-v">&#8377;' + n0(totTurn / 1e7) + "cr</div>" +
          '<div class="kpi-m">index constituents</div></div>' +
      "</div>" +
      '<div class="tablewrap tall"><table class="dt strat"><thead><tr>' + head +
      "</tr></thead><tbody>" + body + "</tbody></table></div>" +
      '<div class="caution"><p><b>Index pts</b> is the name\u2019s own contribution to the ' +
      "session\u2019s move, price change multiplied by its recovered coefficient. It is the " +
      "column that separates a real move from a loud one: a 2% move in a 0.3% name is noise, " +
      "the same move in HDFC Bank is a third of the day. Weights are recovered, not published " +
      "by NSE \u2014 see the report appendix for the method and its residual.</p></div>" +
      "</section>";
  }

  var RENDER = {
    overview: viewOverview, strategy: viewStrategy, accuracy: viewAccuracy,
    buildup: viewBuildup, chain: viewChain, technicals: viewTechnicals,
    history: viewHistory, watchlist: viewWatchlist,
    modelhist: viewModelHistory, learning: viewLearning,
    stocks: viewStocks
  };

  /* ==========================================================
     6d. CROSSHAIR READOUTS
         Every band and every line reports the value under the
         cursor. innerHTML is replaced on each render, so the
         listeners are re-attached rather than delegated.
     ========================================================== */
  function attachRangeHover(el) {
    var lo = +el.getAttribute("data-lo"), hi = +el.getAttribute("data-hi");
    var spot = +el.getAttribute("data-spot");
    var sigma = +el.getAttribute("data-sigma"), t = +el.getAttribute("data-t");
    var cross = el.querySelector(".rb-cross"), tip = el.querySelector(".rb-tip");
    if (!cross || !tip) return;

    function move(ev) {
      var r = el.getBoundingClientRect();
      var x = Math.min(Math.max(ev.clientX - r.left, 0), r.width);
      var price = lo + (x / r.width) * (hi - lo);

      var txt = "<b>" + n0(price) + "</b>";
      var away = price - spot;
      txt += ' <i>' + (away >= 0 ? "+" : "&minus;") + n0(Math.abs(away)) + " pts</i>";

      if (sigma > 0 && t > 0 && price > 0) {
        var g = bs(spot, price, sigma, t);
        var above = g.pCallItm * 100;
        txt += '<br><i>' + n1(above) + "% above &middot; " + n1(100 - above) + "% below</i>";
      }
      cross.style.left = x + "px";
      tip.style.left = x + "px";
      tip.innerHTML = txt;
      el.classList.add("live");
    }

    el.addEventListener("mousemove", move);
    el.addEventListener("mouseleave", function () { el.classList.remove("live"); });
  }

  function attachChartHover(wrap) {
    var series;
    try { series = JSON.parse(wrap.getAttribute("data-series")); } catch (e) { return; }
    if (!series || !series.pts || series.pts.length < 2) return;

    var cross = wrap.querySelector(".ch-cross"),
        dot = wrap.querySelector(".ch-dot"),
        tip = wrap.querySelector(".ch-tip");
    if (!cross || !dot || !tip) return;
    dot.style.background = series.color;

    function move(ev) {
      var r = wrap.getBoundingClientRect();
      var x = Math.min(Math.max(ev.clientX - r.left, 0), r.width);
      var i = Math.round((x / r.width) * (series.pts.length - 1));
      i = Math.min(Math.max(i, 0), series.pts.length - 1);
      var pt = series.pts[i];

      var px = (i / (series.pts.length - 1)) * r.width;
      var py = ((pt.y - series.vbTop) / series.vbHeight) * r.height;

      cross.style.left = px + "px";
      dot.style.left = px + "px";
      dot.style.top = py + "px";

      /* Keep the panel inside the card rather than letting it clip. */
      var half = tip.offsetWidth / 2 || 80;
      tip.style.left = Math.min(Math.max(px, half + 2), r.width - half - 2) + "px";

      var html = '<div class="tip-date">' + pt.date + "</div>" +
                 '<div class="tip-big">' + pt.big + "</div>";
      if (pt.chg) {
        html += '<div class="tip-chg ' + (pt.chgUp ? "pos" : "neg") + '">' + pt.chg + "</div>";
      }
      if (pt.rows && pt.rows.length) {
        html += '<div class="tip-grid">' + pt.rows.map(function (kv) {
          return "<span>" + kv[0] + "</span><b>" + kv[1] + "</b>";
        }).join("") + "</div>";
      }
      if (pt.vol) {
        html += '<div class="tip-vol"><div class="tip-vol-k">Volume</div>' +
          '<div class="tip-vol-bar"><i style="width:' + pt.vol.pct.toFixed(1) + '%"></i></div>' +
          '<div class="tip-vol-v">' + pt.vol.label + "</div></div>";
      }
      tip.innerHTML = html;
      wrap.classList.add("live");
    }

    wrap.addEventListener("mousemove", move);
    wrap.addEventListener("mouseleave", function () { wrap.classList.remove("live"); });
  }

  function attachRungHover(el) {
    var tip = document.getElementById("rungTip");
    var d;
    try { d = JSON.parse(el.getAttribute("data-rung")); } catch (e) { return; }

    el.addEventListener("mousemove", function (ev) {
      tip.innerHTML =
        '<div class="rt-k">Strike</div><div class="rt-big">' + d.k +
          ' <span style="font-size:10px;color:var(--ink-3)">' + d.dist + " pts</span></div>" +
        '<div class="rt-row"><span style="color:var(--calls)">Call OI</span><b>' + d.ceOi + "L</b></div>" +
        '<div class="rt-row"><span class="' + (d.ceUp ? "pos" : "neg") + '">chg OI</span><b class="' +
          (d.ceUp ? "pos" : "neg") + '">' + d.ceChg + "L</b></div>" +
        '<div class="rt-row"><span style="color:var(--ink-3)">LTP &middot; IV</span><b>' + d.ceLtp + " &middot; " + d.ceIv + "</b></div>" +
        '<div class="rt-row" style="margin-top:6px;padding-top:5px;border-top:1px solid var(--line)">' +
          '<span style="color:var(--puts)">Put OI</span><b>' + d.peOi + "L</b></div>" +
        '<div class="rt-row"><span class="' + (d.peUp ? "pos" : "neg") + '">chg OI</span><b class="' +
          (d.peUp ? "pos" : "neg") + '">' + d.peChg + "L</b></div>" +
        '<div class="rt-row"><span style="color:var(--ink-3)">LTP &middot; IV</span><b>' + d.peLtp + " &middot; " + d.peIv + "</b></div>" +
        '<div class="rt-row" style="margin-top:6px;padding-top:5px;border-top:1px solid var(--line)">' +
          '<span style="color:var(--ink-3)">Strike PCR</span><b>' + d.pcr + "</b></div>";
      tip.style.left = ev.clientX + "px";
      tip.style.top = ev.clientY + "px";
      tip.classList.add("live");
    });
    el.addEventListener("mouseleave", function () { tip.classList.remove("live"); });
  }

  function attachHovers() {
    var root = document.getElementById("content");
    Array.prototype.forEach.call(root.querySelectorAll(".rb"), attachRangeHover);
    Array.prototype.forEach.call(root.querySelectorAll(".ch-wrap"), attachChartHover);
    Array.prototype.forEach.call(root.querySelectorAll("[data-rung]"), attachRungHover);
  }

  /* Put the money in the middle of the viewport, not at whichever end the
     sort happened to leave it. Scroll position is set without animation so
     the view never appears to jump on load. */
  function centreOnAtm() {
    var root = document.getElementById("content");
    Array.prototype.forEach.call(
      root.querySelectorAll(".tablewrap.tall, .ladder-wrap.tall"),
      function (box) {
        var mark = box.querySelector("[data-atm], tr.atm, .rung.spot");
        if (!mark) return;
        var target = mark.offsetTop - box.clientHeight / 2 + mark.offsetHeight / 2;
        box.scrollTop = Math.max(0, target);
      }
    );
  }

  function render() {
    var m = MODEL[state.idx];
    if (!m) return;
    DTE = m.dte;
    TT = m.t;
    renderChrome();
    paintLiveStamp();
    document.getElementById("content").innerHTML = RENDER[state.view](m);
    attachHovers();
    centreOnAtm();
  }

  /* Rendered once at boot and left alone. It must not depend on the active
     index or tab -- that is the whole point of it. */
  function renderStrip() {
    var el = document.getElementById("strip");
    if (!STRIP.length) { el.parentNode.style.display = "none"; return; }

    /* Grouped, with a divider between families, so 25+ indices stay
       scannable instead of reading as one undifferentiated run. */
    var lastGroup = null;
    el.innerHTML = STRIP.map(function (s) {
      var sep = (s.group && s.group !== lastGroup && lastGroup !== null)
        ? '<div class="si-sep" aria-hidden="true"></div>' : "";
      if (s.group) lastGroup = s.group;
      return sep + siCell(s);
    }).join("");
  }

  function siCellAll() { return null; }

  function siCell(s) {
    return (function (s) {
      var isVix = s.name === "INDIA VIX";
      /* GIFT and the USD index trade outside NSE hours, so their timestamp
         runs ahead of the rest. Flag them rather than let the mismatch look
         like a bug. */
      var offHours = s.source !== "allIndices";
      var dirClass = isVix ? cls(-(s.chgPct || 0)) : cls(s.chgPct);
      var arrow = (s.chgPct || 0) >= 0 ? "&#9650;" : "&#9660;";

      var title = s.label + "  " + n2(s.last) +
        (s.open != null ? "\nO " + n2(s.open) + "  H " + n2(s.high) +
                          "  L " + n2(s.low) + "  PC " + n2(s.prevClose) : "") +
        (s.ts ? "\nas of " + s.ts : "");

      return '<div class="si' + (offHours ? " si-alt" : "") +
        '" data-chart="' + esc(s.name) + '" title="' + esc(title) + " &mdash; click for chart\">" +
        '<div class="si-k">' + (offHours ? '<span class="si-live"></span>' : "") +
          esc(s.label) + "</div>" +
        '<div class="si-v">' + n2(s.last) + "</div>" +
        '<div class="si-c ' + dirClass + '">' + arrow + " " + sgn(s.chg, 2) +
          "  " + sgn(s.chgPct, 2) + "%</div>" +
      "</div>";
    })(s);
  }

  /* ==========================================================
     6g. CANDLESTICK OVERLAY
         TradingView's lightweight-charts, vendored locally so
         the page has no CDN dependency. Created on first open
         and reused -- building a chart per click leaks.
     ========================================================== */
  var CHARTS = {};
  var CKS = { chart: null, candles: null, vol: null, series: null,
             name: null, range: 120 };

  var CK_RANGES = [
    { label: "1M", n: 22 }, { label: "3M", n: 66 },
    { label: "6M", n: 132 }, { label: "1Y", n: 252 }, { label: "All", n: 0 }
  ];

  /* The strip uses NSE names ("NIFTY BANK"); tabs use our keys ("NIFTY").
     Both must resolve to the same series. */
  function resolveSeries(name) {
    if (CHARTS[name]) return name;
    var up = String(name).toUpperCase();
    var hit = Object.keys(CHARTS).filter(function (k) {
      return k.toUpperCase() === up;
    })[0];
    if (hit) return hit;
    var m = MODEL[name];
    if (m && CHARTS[m.cfg.label]) return m.cfg.label;
    return null;
  }

  function ckTheme() {
    var cs = getComputedStyle(document.documentElement);
    var g = function (v) { return cs.getPropertyValue(v).trim(); };
    return {
      layout: { background: { color: g("--surface") }, textColor: g("--ink-2"),
                fontFamily: g("--font-num") || "monospace", fontSize: 10 },
      grid: { vertLines: { color: g("--line-soft") },
              horzLines: { color: g("--line-soft") } },
      crosshair: { mode: 0,
                   vertLine: { color: g("--ink-3"), width: 1, style: 2, labelBackgroundColor: g("--surface-3") },
                   horzLine: { color: g("--ink-3"), width: 1, style: 2, labelBackgroundColor: g("--surface-3") } },
      rightPriceScale: { borderColor: g("--line") },
      timeScale: { borderColor: g("--line"), rightOffset: 4 },
      handleScroll: true, handleScale: true
    };
  }

  function openChart(name) {
    var key = resolveSeries(name);
    var panel = document.getElementById("ckPanel");
    var scrim = document.getElementById("ckScrim");
    var chartEl = document.getElementById("ckChart");
    var tip = document.getElementById("ckTip");

    panel.classList.add("open");
    scrim.classList.add("open");

    if (typeof LightweightCharts === "undefined") {
      chartEl.innerHTML = '<div class="ck-empty"><b>Chart library not loaded.</b><br>' +
        "web/vendor/lightweight-charts.js is missing.</div>";
      return;
    }
    if (!key || !CHARTS[key] || CHARTS[key].length < 2) {
      chartEl.innerHTML = '<div class="ck-empty"><b>No price history stored for ' +
        esc(name) + ".</b><br>Run <em>python backfill_indices.py</em>.</div>";
      return;
    }

    CKS.name = key;
    var bars = CHARTS[key];

    document.getElementById("ckName").textContent = key;
    var last = bars[bars.length - 1], prev = bars[bars.length - 2];
    var chg = last.c - prev.c, chgP = chg / prev.c * 100;
    document.getElementById("ckLast").textContent = n2(last.c);
    var chgEl = document.getElementById("ckChg");
    chgEl.className = "ck-chg " + cls(chg);
    chgEl.textContent = sgn(chg, 2) + "  " + sgn(chgP, 2) + "%";
    document.getElementById("ckMeta").textContent =
      bars.length + " sessions  &middot;  " + bars[0].t + " &rarr; " + last.t;

    document.getElementById("ckRanges").innerHTML = CK_RANGES.map(function (r) {
      return '<button class="ck-r" data-ckr="' + r.n + '" aria-selected="' +
        (r.n === CKS.range) + '">' + r.label + "</button>";
    }).join("");

    if (!CKS.chart) {
      chartEl.innerHTML = "";
      CKS.chart = LightweightCharts.createChart(chartEl, ckTheme());
      CKS.candles = CKS.chart.addCandlestickSeries({
        upColor: "#26a69a", downColor: "#ef5350",
        borderUpColor: "#26a69a", borderDownColor: "#ef5350",
        wickUpColor: "#26a69a", wickDownColor: "#ef5350"
      });
      CKS.vol = CKS.chart.addHistogramSeries({
        priceFormat: { type: "volume" }, priceScaleId: "vol",
        color: "rgba(120,140,160,.4)"
      });
      CKS.chart.priceScale("vol").applyOptions({
        scaleMargins: { top: 0.82, bottom: 0 }
      });

      CKS.chart.subscribeCrosshairMove(function (p) {
        if (!p || !p.time || !p.seriesData) { tip.hidden = true; return; }
        var d = p.seriesData.get(CKS.candles);
        if (!d) { tip.hidden = true; return; }
        var v = p.seriesData.get(CKS.vol);
        var up = d.close >= d.open;
        tip.hidden = false;
        tip.innerHTML =
          '<div class="ck-tip-date">' + esc(String(d.time)) + "</div>" +
          '<div class="ck-tip-big ' + (up ? "pos" : "neg") + '">' + n2(d.close) + "</div>" +
          '<div class="ck-tip-grid">' +
            "<span>Open</span><b>" + n2(d.open) + "</b>" +
            "<span>High</span><b>" + n2(d.high) + "</b>" +
            "<span>Low</span><b>" + n2(d.low) + "</b>" +
            "<span>Close</span><b>" + n2(d.close) + "</b>" +
          "</div>" +
          (v && v.value ? '<div class="ck-tip-vol">Volume ' +
            n1(v.value / 1e7) + " Cr shares</div>" : "");
      });

      window.addEventListener("resize", function () {
        if (CKS.chart) CKS.chart.applyOptions({
          width: chartEl.clientWidth, height: chartEl.clientHeight
        });
      });
    }

    applyRange(bars);
  }

  function applyRange(bars) {
    var use = CKS.range > 0 ? bars.slice(-CKS.range) : bars;
    CKS.candles.setData(use.map(function (b) {
      return { time: b.t, open: b.o, high: b.h, low: b.l, close: b.c };
    }).filter(function (b) {
      return b.open != null && b.high != null && b.low != null && b.close != null;
    }));
    CKS.vol.setData(use.filter(function (b) { return b.v; }).map(function (b) {
      return { time: b.t, value: b.v,
               color: b.c >= b.o ? "rgba(38,166,154,.35)" : "rgba(239,83,80,.35)" };
    }));
    CKS.chart.timeScale().fitContent();
    var el = document.getElementById("ckChart");
    CKS.chart.applyOptions({ width: el.clientWidth, height: el.clientHeight });
  }

  function closeChart() {
    document.getElementById("ckPanel").classList.remove("open");
    document.getElementById("ckScrim").classList.remove("open");
    document.getElementById("ckTip").hidden = true;
  }

  /* ==========================================================
     6h. LIVE POLLING
         live.json is written by live.py during market hours and
         is entirely separate from the EOD snapshot. If it is
         absent or stale the page falls back to EOD and says so
         -- it never presents old numbers as current.
     ========================================================== */
  var LIVE = null;
  var LIVE_TIMER = null;
  var CLOCK_TIMER = null;
  /* live.json is a local file, so reading it costs nothing -- poll it fast
     so a new value appears the moment the poller writes one. The upstream
     limit is NSE's own ~60s cache, not this. */
  var LIVE_EVERY = 2000;
  var STALE_AFTER = 180000;   /* 3 min without a new tick = stale */
  var PREV_VALS = {};         /* for change flashing */

  function liveAgeMs() {
    if (!LIVE || !LIVE.ts) return Infinity;
    var t = Date.parse(LIVE.ts);
    return isFinite(t) ? (Date.now() - t) : Infinity;
  }

  function liveState() {
    if (!LIVE) return { cls: "closed", text: "EOD" };

    /* A live file left over from an earlier session is not "stale data from
       today" -- it is a session we never captured. Comparing its trade date
       against the settled one distinguishes the two, instead of reporting
       "stale 2880m" and implying the feed is merely lagging. */
    var m = MODEL[state.idx];
    if (m && LIVE.tradeDate && m.tradeDate && LIVE.tradeDate < m.tradeDate) {
      return { cls: "closed", text: "EOD" };
    }

    var age = liveAgeMs();
    var st = LIVE.state;
    if (st === "open" || st === "pre-open" || st === "closing") {
      return age > STALE_AFTER
        ? { cls: "stale", text: "stale " + Math.round(age / 60000) + "m" }
        : { cls: "", text: st === "open" ? "Live" : st };
    }
    return { cls: "closed", text: "Closed" };
  }

  function pollLive() {
    getJson("live.json").then(function (d) {
      if (!d || !d.ts) return;
      var isNew = !LIVE || LIVE.ts !== d.ts;
      LIVE = d;

      /* Only let the live feed drive the strip when it is at least as
         current as the settled data. A live file left over from an earlier
         session was overwriting today's closes with the previous day's
         intraday prints -- the strip read 24,154.90 while the Overview
         beneath it read 24,078.30, and both were "correct" for different
         days. Stale live data is worse than none. */
      var m0 = MODEL[state.idx];
      var liveIsCurrent = !m0 || !d.tradeDate || !m0.tradeDate
                          || d.tradeDate >= m0.tradeDate;

      if (liveIsCurrent && d.strip && d.strip.length) {
        STRIP = d.strip;
        renderStrip();
        if (isNew) flashChanges();
      }
      paintLiveStamp();
    }).catch(function () {
      /* live.py not running -- the EOD snapshot stays on screen. */
    });
  }

  /* A once-a-minute feed reads as dead unless the change is visible when it
     lands. Flash only the cells that actually moved. */
  function flashChanges() {
    STRIP.forEach(function (s) {
      var prev = PREV_VALS[s.name];
      PREV_VALS[s.name] = s.last;
      if (prev == null || s.last == null || prev === s.last) return;
      var cell = document.querySelector('.si[data-chart="' + cssEsc(s.name) + '"]');
      if (!cell) return;
      var dir = s.last > prev ? "flash-up" : "flash-down";
      cell.classList.remove("flash-up", "flash-down");
      void cell.offsetWidth;              /* restart the animation */
      cell.classList.add(dir);
      setTimeout(function () { cell.classList.remove(dir); }, 1400);
    });
  }

  function cssEsc(s) { return String(s).replace(/["\\]/g, "\\$&"); }

  function paintLiveStamp() {
    var m = MODEL[state.idx];
    if (!m) return;
    var st = liveState();
    var badge = '<span class="live-badge ' + st.cls + '">' +
      (st.cls === "" ? '<span class="si-pulse"></span>' : "") + esc(st.text) + "</span>";

    var extra = "";
    if (LIVE && LIVE.ts && st.cls !== "closed") {
      var secs = Math.max(0, Math.round(liveAgeMs() / 1000));
      extra = ' <span class="age">' + secs + "s ago</span>" +
              " &middot; " + esc(LIVE.ts.slice(11, 19)) + " IST";
      if (LIVE.nseTimestamp) {
        extra += ' <span class="age" title="NSE refreshes this roughly once a minute">' +
                 "NSE " + esc(LIVE.nseTimestamp.slice(-5)) + "</span>";
      }
      if (LIVE.chain && LIVE.chain[state.idx]) {
        var c = LIVE.chain[state.idx];
        extra += " &middot; spot " + n2(c.spot) +
                 (c.pcr != null ? " &middot; PCR " + n2(c.pcr) : "");
      }
    } else {
      extra = " EOD " + esc(m.tradeDate);
    }
    document.getElementById("stamp").innerHTML = badge + extra;
  }

  function startLive() {
    pollLive();
    if (LIVE_TIMER) clearInterval(LIVE_TIMER);
    LIVE_TIMER = setInterval(pollLive, LIVE_EVERY);

    /* Seconds-since-update ticks every second. It is the only way to tell a
       working feed from a dead one when the data itself moves once a
       minute -- without it, a frozen page and a calm market look identical. */
    if (CLOCK_TIMER) clearInterval(CLOCK_TIMER);
    CLOCK_TIMER = setInterval(paintLiveStamp, 1000);
  }

  function setFresh(tag, msg, state, age) {
    var bar = document.getElementById("freshness");
    bar.hidden = false;
    bar.className = "mock" + (state ? " " + state : "");
    document.getElementById("freshTag").textContent = tag;
    document.getElementById("freshMsg").textContent = msg;
    document.getElementById("freshAge").textContent = age || "";
  }

  /* The last session that should have settled by now.

     NSE publishes the day's closes well after the bell, so before the
     evening run the newest settled session is the PREVIOUS weekday.
     Holidays are not modelled -- which is why one session behind is
     reported as "check", not as stale. Two or more is unambiguous. */
  function expectedSession() {
    /* Shift the epoch by IST's offset and read it with UTC getters. Using
       local getters here double-counts the viewer's own offset -- on a
       UTC+4 machine it reported the previous session as the expected one,
       so a current desk would have shown "CHECK". */
    var ist = new Date(Date.now() + 330 * 60000);
    var d = new Date(Date.UTC(ist.getUTCFullYear(), ist.getUTCMonth(),
                              ist.getUTCDate()));
    if (ist.getUTCHours() < 18) d.setUTCDate(d.getUTCDate() - 1);
    while (d.getUTCDay() === 0 || d.getUTCDay() === 6) {
      d.setUTCDate(d.getUTCDate() - 1);
    }
    return d.toISOString().slice(0, 10);
  }

  function sessionsBetween(from, to) {
    var a = new Date(from + "T00:00:00"), b = new Date(to + "T00:00:00"), n = 0;
    while (a < b) {
      a.setDate(a.getDate() + 1);
      if (a.getDay() !== 0 && a.getDay() !== 6) n++;
    }
    return n;
  }

  function freshness(m, man) {
    var want = expectedSession();
    var have = m.tradeDate || "";
    var behind = have && have < want ? sessionsBetween(have, want) : 0;

    var gen = (man && man.generatedAt) || "";
    var age = "";
    if (gen) {
      var mins = Math.round((Date.now() - new Date(gen).getTime()) / 60000);
      age = mins < 0 ? "just now"
          : mins < 60 ? "updated " + mins + "m ago"
          : mins < 1440 ? "updated " + Math.round(mins / 60) + "h ago"
          : "updated " + Math.round(mins / 1440) + "d ago";
    }

    var tag, state, msg;
    if (!have) {
      tag = "NO DATA"; state = "stale"; msg = "The snapshot has no trade date.";
    } else if (behind === 0) {
      tag = "UP TO DATE"; state = "ok";
      msg = "Data through " + have + ", the latest settled session.";
    } else if (behind === 1) {
      tag = "CHECK"; state = "warn";
      msg = "Data through " + have + "; " + want + " is not in yet. Normal on a " +
            "holiday or before the evening run, otherwise run  ./desk.sh";
    } else {
      tag = "STALE"; state = "stale";
      msg = "Data through " + have + " \u2014 " + behind +
            " sessions behind " + want + ". Run  ./desk.sh";
    }
    msg += "  \u00b7  " + m.sessionsStored + " sessions stored";
    return { tag: tag, state: state, msg: msg, age: age };
  }

  function boot() {
    setFresh("Loading", "Reading snapshot&hellip;");
    getJson("manifest.json").then(function (man) {
      MANIFEST = man;
      var keys = man.indices || [];
      if (!keys.length) throw new Error("manifest lists no indices");
      return Promise.all(keys.map(function (k) {
        return getJson(k.toLowerCase() + ".json");
      }));
    }).then(function (arr) {
      arr.forEach(function (d) {
        MODEL[d.index] = normalise(d);
        INDICES.push({ key: d.index, label: d.label });
      });
      return Promise.all([
        getJson("accuracy.json").catch(function () { return {}; }),
        getJson("market.json").catch(function () { return { strip: [] }; }),
        getJson("watchlist.json").catch(function () { return { lists: [] }; }),
        getJson("charts.json").catch(function () { return { series: {} }; }),
        getJson("history.json").catch(function () { return {}; }),
        getJson("stocks.json").catch(function () { return {}; }),
        getJson("techfund.json").catch(function () { return {}; })
      ]);
    }).then(function (both) {
      var acc = both[0], mkt = both[1], wl = both[2], ch = both[3],
          mh = both[4], stk = both[5], tf = both[6];
      ACCURACY = acc || {};
      STRIP = (mkt && mkt.strip) || [];
      WATCH = (wl && wl.lists) || [];
      CHARTS = (ch && ch.series) || {};
      MHIST = mh || {};
      STOCKS = stk || {};
      TECHFUND = tf || {};
      if (WATCH.length) state.wl = WATCH[0].id;
      state.idx = INDICES[0].key;
      renderStrip();
      render();
      startLive();
      var m = MODEL[state.idx];
      var fr = freshness(m, MANIFEST);
      setFresh(fr.tag, fr.msg, fr.state, fr.age);
    }).catch(function (err) {
      setFresh("NO DATA", "Could not read the snapshot (" + err.message +
        "). Run  ./desk.sh  then reload.", "stale", "");
    });
  }

  /* ==========================================================
     7. STRIKE DRAWER
     ========================================================== */
  function legBlock(name, leg, color, m) {
    var b = classify(leg.chgPct, leg.chgOi);
    /* The chain endpoint carries LTP, change and prev close -- not per-contract
       OHLC. Showing four copies of LTP under an OHLC heading would be inventing
       data, so the real four are shown instead. True per-leg OHLC needs the F&O
       bhavcopy, which is a separate source. */
    var hasOhlc = leg.o != null && leg.h != null && leg.l != null && leg.c != null;
    var cells = hasOhlc
      ? [["OPEN", n2(leg.o)], ["HIGH", n2(leg.h)], ["LOW", n2(leg.l)], ["CLOSE", n2(leg.c)]]
      : [["LTP", n2(leg.ltp)], ["PREV", n2(leg.prevClose)],
         ["CHG", sgn(leg.chg, 2)], ["CHG %", sgn(leg.chgPct, 2) + "%"]];

    return '<div class="leg-hd" style="color:' + color + '"><span class="bar" style="background:' + color + '"></span>' +
      name +
      (hasOhlc ? "" : '<span style="margin-left:auto;font-size:9px;letter-spacing:.08em;' +
        'color:var(--ink-3)">no per-contract OHLC in live feed</span>') +
      '</div>' +
      '<div class="ohlc-row">' +
      cells.map(function (c) {
        return '<div class="ohlc-cell"><div class="ohlc-k">' + c[0] +
          '</div><div class="ohlc-v">' + c[1] + "</div></div>";
      }).join("") + "</div>" +
      '<div class="leg-grid">' +
      lgc("LTP", n2(leg.ltp)) +
      lgc("Chg", '<span class="' + cls(leg.chgPct) + '">' + sgn(leg.chgPct, 2) + "%</span>") +
      lgc("Prev close", n2(leg.prevClose)) +
      lgc(leg.settle != null ? "Settlement" : "Bid / Ask",
          leg.settle != null ? n2(leg.settle) : n2(leg.bid) + " / " + n2(leg.ask)) +
      lgc("Open interest", n2(leg.oi) + " L") +
      lgc("Chg in OI", '<span class="' + cls(leg.chgOi) + '">' + sgn(leg.chgOi, 2) + " L</span>") +
      lgc("Volume", n1(leg.vol) + " L") +
      lgc("Implied vol", n2(leg.iv) + " %") +
      lgc("Turnover", "\u20b9" + n1(leg.turnover) + " Cr") +
      lgc("Action", '<span class="pill ' + b.c + '">' + b.t + "</span>") +
      "</div>";
  }
  function lgc(k, v) { return '<div class="lg"><div class="lg-k">' + k + '</div><div class="lg-v">' + v + "</div></div>"; }

  function openDrawer(strike) {
    var m = MODEL[state.idx];
    var r = m.rows.filter(function (x) { return x.strike === strike; })[0];
    if (!r) return;
    state.strike = strike;

    var moneyness = strike < m.cfg.spot ? "Call ITM \u00b7 Put OTM" :
                    strike > m.cfg.spot ? "Call OTM \u00b7 Put ITM" : "At the money";
    var tags = [];
    if (strike === m.callWall) tags.push("heaviest call wall");
    if (strike === m.putWall) tags.push("heaviest put wall");
    if (strike === m.maxPain) tags.push("max pain strike");
    if (strike === m.atm) tags.push("nearest to spot");

    document.getElementById("drawerTitle").innerHTML = n0(strike) + " " + esc(m.cfg.label);
    document.getElementById("drawerSub").innerHTML = esc(m.cfg.expiry) + " \u00b7 lot " + m.cfg.lot + " \u00b7 " + moneyness;

    document.getElementById("drawerBody").innerHTML =
      '<div class="readout"><p>Strike is <b>' + n0(Math.abs(strike - m.cfg.spot)) + " pts " +
        (strike > m.cfg.spot ? "above" : strike < m.cfg.spot ? "below" : "from") + "</b> spot " + n2(m.cfg.spot) + "." +
        (tags.length ? " Flagged as <b>" + tags.join("</b>, <b>") + "</b>." : "") + "</p>" +
        "<p>Call OI <b>" + n2(r.ce.oi) + "L</b> vs put OI <b>" + n2(r.pe.oi) + "L</b> \u2014 strike-level PCR <b>" +
        n2(r.pe.oi / r.ce.oi) + "</b>.</p></div>" +
      legBlock("Call \u00b7 CE", r.ce, "var(--calls)", m) +
      legBlock("Put \u00b7 PE", r.pe, "var(--puts)", m);

    document.getElementById("drawer").classList.add("open");
    document.getElementById("scrim").classList.add("open");
    document.getElementById("drawerClose").focus();
  }

  function closeDrawer() {
    document.getElementById("drawer").classList.remove("open");
    document.getElementById("scrim").classList.remove("open");
    state.strike = null;
  }

  /* ==========================================================
     8. EVENTS
     ========================================================== */
  document.addEventListener("click", function (e) {
    /* Anything carrying data-chart opens the candlestick view. Checked
       first so an index tab can both switch the dashboard and, on its
       chart affordance, open the chart. */
    var ch = e.target.closest("[data-chart]");
    if (ch) { openChart(ch.getAttribute("data-chart")); return; }

    var ckr = e.target.closest("[data-ckr]");
    if (ckr) {
      CKS.range = Number(ckr.getAttribute("data-ckr"));
      Array.prototype.forEach.call(
        document.getElementById("ckRanges").querySelectorAll("[data-ckr]"),
        function (b) {
          b.setAttribute("aria-selected", Number(b.getAttribute("data-ckr")) === CKS.range);
        });
      if (CKS.chart && CKS.name) applyRange(CHARTS[CKS.name]);
      return;
    }

    var idx = e.target.closest("[data-idx]");
    if (idx) { state.idx = idx.getAttribute("data-idx"); closeDrawer(); render(); return; }

    var view = e.target.closest("[data-view]");
    if (view) { state.view = view.getAttribute("data-view"); closeDrawer(); render(); return; }

    var mh = e.target.closest("[data-mh]");
    if (mh) {
      var card = mh.parentNode;
      card.classList.toggle("open");
      return;
    }

    var wl = e.target.closest("[data-wl]");
    if (wl) { state.wl = wl.getAttribute("data-wl"); state.wlExpiry = 0; render(); return; }

    var we = e.target.closest("[data-wlexp]");
    if (we) { state.wlExpiry = Number(we.getAttribute("data-wlexp")); render(); return; }

    var so = e.target.closest("[data-sort]");
    if (so) {
      var k = so.getAttribute("data-sort");
      /* Second click on the same column reverses it. Symbol reads best
         ascending, every numeric column reads best largest-first. */
      if (stockSort.key === k) stockSort.dir *= -1;
      else stockSort = { key: k, dir: k === "symbol" ? 1 : -1 };
      render();
      return;
    }

    var st = e.target.closest("[data-strike]");
    if (st) { openDrawer(Number(st.getAttribute("data-strike"))); return; }
  });

  document.getElementById("drawerClose").addEventListener("click", closeDrawer);
  document.getElementById("scrim").addEventListener("click", closeDrawer);
  document.getElementById("ckClose").addEventListener("click", closeChart);
  document.getElementById("ckScrim").addEventListener("click", closeChart);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeDrawer(); closeChart(); }
  });

  document.getElementById("themeBtn").addEventListener("click", function () {
    var root = document.documentElement, cur = root.getAttribute("data-theme");
    if (!cur) cur = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    root.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
  });

  boot();
})();
</script>
<script src="vendor/lightweight-charts.js"></script>
