<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Desk | India, Metals, Energy &amp; Global</title>

<style>
/* ============================================================
   TOKENS -- "Warm Paper". Dark-first: :root carries the warm-charcoal
   night palette. Day is dimmed sepia paper, defined for both the media-query
   (unstamped) case and the explicit [data-theme="light"] stamp.
   No pure black or pure white anywhere: long reading sessions.
   Every text colour meets WCAG AA (4.5:1) on bg, surface and surface-2.
   ============================================================ */
:root {
  /* Freshness state. Defined here as well as on the state classes, because
     a token that exists only inside .mock.ok resolves to nothing before the
     verdict is known -- the bar would render with no colour at all. */
  --fresh:     #9D917F;
  --fresh-dim: rgba(157,145,127,.10);

  --bg:        #1A1714;
  --surface:   #221E1A;
  --surface-2: #2A2520;
  --surface-3: #332D27;
  --line:      #3A332B;
  --line-soft: #2C2722;

  --ink:   #E9E1D3;
  --ink-2: #C2B6A5;
  --ink-3: #9D917F;

  /* Data identity. Calls cool (ceiling), puts warm (floor). */
  --calls:      #7FB2D9;
  --calls-dim:  rgba(127,178,217,.15);
  --puts:       #E2A55B;
  --puts-dim:   rgba(226,165,91,.15);
  --maxpain:    #CF93BC;

  /* Direction -- reserved. Never used for call/put identity. */
  --up:   #8CC084;
  --down: #E8806F;

  --warn: #D9B060;
  --ok:   #8CC084;

  --shadow: 0 1px 2px rgba(0,0,0,.28), 0 10px 28px -16px rgba(0,0,0,.55);
  --shadow-lg: -18px 0 48px -18px rgba(0,0,0,.6);

  --font-uWi: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-ui:  "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-num: "Cascadia Mono", "Consolas", ui-monospace, "SF Mono", Menlo, monospace;

  --r: 8px;
  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:        #DDD3C0;
    --surface:   #E7DECD;
    --surface-2: #DCD2BF;
    --surface-3: #D1C6B1;
    --line:      #C4B8A1;
    --line-soft: #D3C9B6;

    --ink:   #28231D;
    --ink-2: #4D4439;
    --ink-3: #5C5145;

    --calls:     #255577;
    --calls-dim: rgba(37,85,119,.14);
    --puts:      #844508;
    --puts-dim:  rgba(132,69,8,.15);
    --maxpain:   #733B60;

    --up:   #2F622D;
    --down: #943024;

    --warn: #6A4E00;
    --ok:   #2F622D;

    --shadow: 0 1px 2px rgba(60,45,25,.06), 0 10px 28px -18px rgba(60,45,25,.24);
    --shadow-lg: -18px 0 48px -20px rgba(60,45,25,.28);
    color-scheme: light;
  }
}

:root[data-theme="light"] {
  --bg:        #DDD3C0;
  --surface:   #E7DECD;
  --surface-2: #DCD2BF;
  --surface-3: #D1C6B1;
  --line:      #C4B8A1;
  --line-soft: #D3C9B6;

  --ink:   #28231D;
  --ink-2: #4D4439;
  --ink-3: #5C5145;

  --calls:     #255577;
  --calls-dim: rgba(37,85,119,.14);
  --puts:      #844508;
  --puts-dim:  rgba(132,69,8,.15);
  --maxpain:   #733B60;

  --up:   #2F622D;
  --down: #943024;

  --warn: #6A4E00;
  --ok:   #2F622D;

  --shadow: 0 1px 2px rgba(60,45,25,.06), 0 10px 28px -18px rgba(60,45,25,.24);
  --shadow-lg: -18px 0 48px -20px rgba(60,45,25,.28);
  color-scheme: light;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.pos { color: var(--up); } .neg { color: var(--down); } .neu { color: var(--ink-2); }

:where(a, button, [tabindex]):focus-visible {
  outline: 2px solid var(--calls);
  outline-offset: 2px;
  border-radius: 3px;
}

/* ---------- mockup banner ---------- */
.mock {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 7px 16px;
  background: var(--fresh-dim, var(--puts-dim));
  border-bottom: 1px solid var(--line);
  border-left: 3px solid var(--fresh, var(--puts));
  font-size: 11.5px; color: var(--ink-2);
}
.mock strong {
  font-family: var(--font-num); font-size: 10.5px; letter-spacing: .09em;
  color: var(--fresh, var(--puts));
  border: 1px solid var(--fresh, var(--puts)); border-radius: 3px;
  padding: 2px 7px; text-transform: uppercase;
}
/* The one thing a glance must answer: is what I am looking at current? */
.mock.ok    { --fresh: var(--up);   --fresh-dim: rgba(63,185,80,.10); }
.mock.warn  { --fresh: var(--maxpain); --fresh-dim: rgba(230,159,0,.12); }
.mock.stale { --fresh: var(--down); --fresh-dim: rgba(248,81,73,.12); }
.mock .age { margin-left: auto; font-family: var(--font-num); font-size: 10.5px;
             color: var(--ink-3); }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 208px minmax(0,1fr); min-height: 100vh; }

.rail {
  border-right: 1px solid var(--line);
  background: var(--surface);
  display: flex; flex-direction: column; gap: 22px;
  padding: 18px 0 20px;
}
.brand { display: flex; flex-direction: column; gap: 3px; padding: 0 18px; }
.brand b { font-family: var(--font-uWi); font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.brand span {
  font-family: var(--font-num); font-size: 9.5px; letter-spacing: .16em;
  color: var(--ink-3); text-transform: uppercase;
}

.rail-group { display: flex; flex-direction: column; gap: 2px; }
.rail-label {
  font-family: var(--font-num); font-size: 9.5px; letter-spacing: .14em;
  color: var(--ink-3); text-transform: uppercase; padding: 0 18px 6px;
}
.rail-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 18px; color: var(--ink-2); cursor: pointer;
  border: 0; border-left: 2px solid transparent; background: none;
  width: 100%; text-align: left; font: inherit;
}
.rail-item:hover { background: var(--surface-2); color: var(--ink); }
.rail-item[aria-current="true"] {
  color: var(--ink); background: var(--surface-2);
  border-left-color: var(--calls); font-weight: 600;
}
.rail-item .tag {
  font-family: var(--font-num); font-size: 9px; letter-spacing: .06em;
  color: var(--ink-3); border: 1px solid var(--line); padding: 1px 5px; border-radius: 3px;
}
.rail-item .spark { font-family: var(--font-num); font-size: 10px; }

.rail-foot {
  margin-top: auto; padding: 0 18px;
  font-family: var(--font-num); font-size: 9.5px; color: var(--ink-3); letter-spacing: .06em;
}

/* ---------- collapsing rail ---------- */
.shell[data-rail="collapsed"] { grid-template-columns: 46px minmax(0,1fr); }
.shell { transition: grid-template-columns .22s ease; }
@media (prefers-reduced-motion: reduce) { .shell { transition: none; } }

.rail { overflow: hidden; }
.rail-top { display: flex; align-items: flex-start; gap: 8px; padding: 0 18px; }
.rail-top .brand { padding: 0; min-width: 0; }
.rail-tog {
  margin-left: auto; width: 26px; height: 26px; flex: none;
  display: grid; place-items: center; cursor: pointer;
  border-radius: 4px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--ink-2);
  font: inherit; font-size: 12px; line-height: 1;
}
.rail-tog:hover { color: var(--calls); border-color: var(--calls); }
.rail-tog:focus-visible { outline: 2px solid var(--calls); outline-offset: 2px; }

/* The mark is the label when there is no room for the label. */
.rail-mono {
  display: none; font-family: var(--font-num); font-size: 9.5px;
  font-weight: 600; letter-spacing: .04em; color: var(--ink-3);
}
.rail-item[aria-current="true"] .rail-mono { color: var(--calls); }

.shell[data-rail="collapsed"] .rail-top { padding: 0; justify-content: center; }
.shell[data-rail="collapsed"] .rail-top .brand { display: none; }
.shell[data-rail="collapsed"] .rail-tog { margin: 0; }
.shell[data-rail="collapsed"] .rail-label,
.shell[data-rail="collapsed"] .rail-foot,
.shell[data-rail="collapsed"] .rail-item .tag,
.shell[data-rail="collapsed"] .rail-item .spark,
.shell[data-rail="collapsed"] .rail-item .rail-txt { display: none; }
.shell[data-rail="collapsed"] .rail-mono { display: block; }
.shell[data-rail="collapsed"] .rail-item {
  justify-content: center; padding: 7px 0;
}
/* A hairline where a group heading used to be, so the three groups stay
   distinguishable once their names are gone. */
.shell[data-rail="collapsed"] .rail-group + .rail-group {
  border-top: 1px solid var(--line-soft); padding-top: 10px;
}

/* ---------- topbar ---------- */
.main { min-width: 0; display: flex; flex-direction: column; }

.topbar {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 0 20px; border-bottom: 1px solid var(--line);
  background: var(--surface); min-height: 46px;
}
.idx-tabs { display: flex; gap: 2px; align-self: stretch; }
.idx-tab {
  border: 0; background: none; font: inherit; cursor: pointer;
  padding: 0 13px; color: var(--ink-3); border-bottom: 2px solid transparent;
  font-family: var(--font-num); font-size: 11.5px; letter-spacing: .04em;
}
.idx-tab:hover { color: var(--ink-2); }
.idx-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--calls); font-weight: 700; }

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.stamp {
  font-family: var(--font-num); font-size: 10.5px; color: var(--ink-3);
  letter-spacing: .04em; display: flex; align-items: center; gap: 7px;
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.warnd { background: var(--warn); } .dot.idle { background: var(--ink-3); }
.tgl {
  background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2);
  border-radius: var(--r); padding: 4px 10px; cursor: pointer;
  font-family: var(--font-num); font-size: 10.5px;
}
.tgl:hover { color: var(--ink); border-color: var(--ink-3); }

/* ---------- persistent market strip ----------
   Sits above the tab row and sticks to the top, so the market level stays
   on screen on every tab and at any scroll position. */
.strip-wrap {
  position: sticky; top: 0; z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.strip {
  display: flex; align-items: stretch; overflow-x: auto;
  scrollbar-width: thin;
}
.strip::-webkit-scrollbar { height: 4px; }
.strip::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

.si {
  flex: 0 0 auto; display: flex; flex-direction: column; gap: 1px;
  padding: 7px 16px; border-right: 1px solid var(--line-soft);
  cursor: default; position: relative; min-width: 132px;
}
.si:hover { background: var(--surface-2); }
.si-k {
  font-family: var(--font-num); font-size: 9px; letter-spacing: .13em;
  color: var(--ink-3); text-transform: uppercase; white-space: nowrap;
  display: flex; align-items: center; gap: 5px;
}
.si-v {
  font-family: var(--font-num); font-size: 14px; font-weight: 600;
  font-variant-numeric: tabular-nums; letter-spacing: -.015em; line-height: 1.15;
}
.si-c {
  font-family: var(--font-num); font-size: 10px;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.si-live {
  width: 5px; height: 5px; border-radius: 50%; background: var(--maxpain);
  flex: none;
}
.si.si-alt { background: var(--surface-2); }
.si.si-alt .si-k { color: var(--maxpain); }

/* live badge */
.si-sep {
  flex: 0 0 auto; width: 1px; margin: 6px 0;
  background: var(--line); align-self: stretch;
}

/* Flash only what moved. A once-a-minute feed is indistinguishable from a
   dead one unless the change announces itself. */
@keyframes flashUp   { 0% { background: rgba(63,185,80,.30); } 100% { background: transparent; } }
@keyframes flashDown { 0% { background: rgba(248,81,73,.30); } 100% { background: transparent; } }
.si.flash-up   { animation: flashUp 1.4s ease-out; }
.si.flash-down { animation: flashDown 1.4s ease-out; }
@media (prefers-reduced-motion: reduce) {
  .si.flash-up, .si.flash-down { animation: none; }
}

.age {
  font-family: var(--font-num); font-size: 9.5px; color: var(--ink-3);
  border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px;
  margin-left: 4px;
}
.si-pulse {
  width: 5px; height: 5px; border-radius: 50%; background: var(--up);
  flex: none; animation: pulse 2.2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .si-pulse { animation: none; } }

.live-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-num); font-size: 10px; letter-spacing: .1em;
  text-transform: uppercase; padding: 2px 8px; border-radius: 3px;
  border: 1px solid var(--up); color: var(--up);
}
.live-badge.stale { border-color: var(--ink-3); color: var(--ink-3); }
.live-badge.closed { border-color: var(--line); color: var(--ink-3); }

@media (max-width: 860px) {
  .strip-wrap { position: static; }
  .si { min-width: 118px; padding: 6px 12px; }
}

/* ---------- the briefing ---------- */
.br-body { padding: 4px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
.br-inst { display: flex; flex-direction: column; gap: 4px; }
.br-hd { font-family: var(--font-num); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); padding: 8px 0 2px; display: flex; align-items: center; gap: 8px; }
.br-line {
  display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left;
  background: var(--surface-2); border: 1px solid var(--line-soft); border-left-width: 3px; border-radius: 6px;
  padding: 8px 12px; cursor: pointer; font: inherit; color: var(--ink-2); font-size: 12.5px; line-height: 1.55;
}
.br-line:hover, .br-line:focus-visible { border-color: var(--ink-3); outline: none; background: var(--surface-3); }
.br-line b { color: var(--ink); }
.br-line .br-txt { max-width: 92ch; }
.br-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--ink-3); }
.br-line.up { border-left-color: var(--up); }     .br-line.up .br-dot { background: var(--up); }
.br-line.down { border-left-color: var(--down); } .br-line.down .br-dot { background: var(--down); }
.br-line.warn { border-left-color: var(--warn); } .br-line.warn .br-dot { background: var(--warn); }
.br-line.info { border-left-color: var(--line); }
.br-key { font-family: var(--font-num); font-size: 10px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.br-key i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.br-key i.up { background: var(--up); } .br-key i.down { background: var(--down); } .br-key i.warn { background: var(--warn); }
/* ---------- metals and oil ---------- */
.mo-tiles .kpi[data-chart] { cursor: pointer; }
.mo-tiles .kpi[data-chart]:hover { border-color: var(--calls); }
.mo-inst .levels { border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); }
.mo-read { padding: 12px 16px 4px; }
.mo-read p { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--ink-2); max-width: 78ch; }
.mo-read b { color: var(--ink); }
.mo-cone { padding: 8px 16px 4px; }
.mo-sub {
  font-family: var(--font-num); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-3); padding: 12px 16px 4px;
}
.mo-hz tr[data-pt], .mo-ev tr[data-pt] { cursor: pointer; }
.mo-hz tr[data-pt]:hover td, .mo-ev tr[data-pt]:hover td { background: var(--surface-2); }
.mo-score { padding: 8px 16px 12px; font-size: 12px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mo-score b { color: var(--ink); font-family: var(--font-num); }
.mo-hist { padding: 0 16px 12px; }
.mo-hist summary { cursor: pointer; font-size: 12px; color: var(--ink-2); padding: 6px 0; }
.mo-hist[open] summary { color: var(--ink); }

/* ---------- analysis tabs ---------- */
.atabs {
  display: flex; gap: 3px; padding: 0 20px; flex-wrap: wrap;
  border-bottom: 1px solid var(--line); background: var(--bg);
}
.atab {
  border: 0; border-bottom: 2px solid transparent; background: none; font: inherit;
  cursor: pointer; padding: 9px 12px; color: var(--ink-3); font-size: 12.5px;
}
.atab:hover { color: var(--ink-2); }
.atab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--calls); font-weight: 600; }

/* ---------- content ---------- */
.content { padding: 16px 20px 48px; display: flex; flex-direction: column; gap: 14px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.page-intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-intro h1 { margin: 0; font-family: var(--font-uWi); font-size: 24px; font-weight: 650; letter-spacing: -.025em; }
.page-intro p { margin: 5px 0 0; max-width: 760px; color: var(--ink-2); font-size: 12.5px; }
.page-meta { font-family: var(--font-num); font-size: 10px; color: var(--ink-3); }
.market-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.market-card { min-width: 0; overflow: hidden; }
.market-card-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 13px 15px; border-bottom: 1px solid var(--line-soft); }
.market-card-hd h2 { margin: 0; font-family: var(--font-uWi); font-size: 14px; font-weight: 650; }
.market-card-hd span { color: var(--ink-3); font-family: var(--font-num); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; }
.market-card-body { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); }
.market-card-body[data-count="1"] { grid-template-columns: 1fr; }
.market-asset { min-width: 0; padding: 12px 15px; border-bottom: 1px solid var(--line-soft); }
.market-asset:nth-child(odd) { border-right: 1px solid var(--line-soft); }
.market-asset-k { color: var(--ink-2); font-size: 11px; }
.market-asset-v { margin-top: 3px; color: var(--ink); font-family: var(--font-num); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.market-asset-m { margin-top: 3px; color: var(--ink-3); font-family: var(--font-num); font-size: 10px; }
.market-asset-m .pos, .market-asset-m .neg { font-weight: 600; }
.market-asset-missing .market-asset-v { color: var(--ink-3); font-family: var(--font-ui); font-size: 12px; font-weight: 500; }
.market-card-ft { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 15px; }
.market-card-ft small { color: var(--ink-3); font-size: 10px; }
.page-link { border: 1px solid var(--line); border-radius: 4px; background: var(--surface-2); color: var(--ink); cursor: pointer; font: inherit; font-size: 11px; padding: 5px 9px; }
.page-link:hover { border-color: var(--calls); color: var(--calls); }
.coverage-note { padding: 11px 14px; border-left: 2px solid var(--warn); background: var(--surface-2); color: var(--ink-2); font-size: 11.5px; line-height: 1.55; }
.coverage-note b { color: var(--ink); }
.driver-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); }
.driver-cell { padding: 12px 14px; border-right: 1px solid var(--line-soft); }
.driver-cell:last-child { border-right: 0; }
.driver-cell b { display: block; margin-bottom: 4px; font-family: var(--font-num); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--calls); }
.driver-cell p { margin: 0; color: var(--ink-2); font-size: 11.5px; line-height: 1.5; }
.source-list { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); }
.source-item { padding: 11px 14px; border-bottom: 1px solid var(--line-soft); }
.source-item a { color: var(--calls); font-size: 12px; font-weight: 600; text-decoration: none; }
.source-item a:hover { text-decoration: underline; }
.source-item p { margin: 4px 0 0; color: var(--ink-2); font-size: 11px; line-height: 1.45; }
.research-feed { display: flex; flex-direction: column; }
.research-item { display: grid; grid-template-columns: minmax(100px,150px) minmax(0,1fr); gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
.research-item:last-child { border-bottom: 0; }
.research-source { color: var(--ink-3); font-family: var(--font-num); font-size: 9px; letter-spacing: .06em; text-transform: uppercase; }
.research-item h3 { margin: 0; font-size: 12px; font-weight: 600; }
.research-item p { margin: 4px 0 0; color: var(--ink-2); font-size: 11.5px; line-height: 1.5; }
.research-item a { color: var(--calls); text-decoration: none; }
.research-item a:hover { text-decoration: underline; }
.brf-pad { padding: 12px 14px; display: grid; gap: 10px; }
.brf-flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
@media (max-width: 760px) { .brf-flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.brf-flow > div { background: var(--surface); padding: 8px 10px; display: grid; gap: 1px; font-size: 12px; }
.brf-step { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--calls); }
.brf-dim { color: var(--ink-3); font-size: 11px; }
.brf-one { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; align-items: baseline; font-size: 13.5px; }
.brf-one .brf-dim { grid-column: 2; }
.brf-tag { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--calls); }
.brf-heat { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 4px; }
.brf-heat > div { border-radius: 4px; padding: 6px 8px; font-size: 11.5px; display: grid; }
.brf-num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.brf-hu2 { background: rgba(63,185,80,.28); } .brf-hu1 { background: rgba(63,185,80,.13); }
.brf-hd1 { background: rgba(248,81,73,.13); } .brf-hd2 { background: rgba(248,81,73,.26); } .brf-h0 { background: var(--surface-2); }
.brf-stories { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
@media (max-width: 900px) { .brf-stories { grid-template-columns: 1fr; } }
.brf-story { display: grid; grid-template-rows: auto 1fr auto; margin: 0; }
.brf-title { padding: 10px 14px; border-bottom: 1px solid var(--line-soft); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; align-items: baseline; font-size: 14px; }
.brf-body { padding: 10px 14px; display: grid; gap: 10px; align-content: start; }
.brf-body p { margin: 0; color: var(--ink-2); font-size: 12.5px; line-height: 1.55; }
.brf-h { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px; }
.brf-why { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.brf-why li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; font-size: 12.5px; color: var(--ink-2); align-items: baseline; }
.brf-src { font-size: 10px; border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; white-space: nowrap; color: var(--ink-3); text-decoration: none; }
.brf-src.brf-desk { color: var(--calls); border-color: var(--calls); }
.brf-src.brf-gap { color: var(--warn); border-color: var(--warn); }
a.brf-src:hover { text-decoration: underline; }
.brf-so { background: var(--calls-dim); border-radius: 4px; padding: 8px 10px; font-size: 12.5px; }
.brf-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; padding: 8px 14px; border-top: 1px solid var(--line-soft); font-size: 11.5px; }
.brf-learn { color: var(--ok); cursor: pointer; font-weight: 600; }
.brf-open { color: var(--calls); cursor: pointer; }
.brf-learn:hover, .brf-open:hover { text-decoration: underline; }
.brf-learn:focus-visible, .brf-open:focus-visible { outline: 2px solid var(--calls); outline-offset: 2px; }
.brf-chip { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.brf-chip.brf-down { color: var(--down); } .brf-chip.brf-up { color: var(--up); } .brf-chip.brf-sell { color: var(--up); } .brf-chip.brf-buy { color: var(--calls); } .brf-chip.brf-none { color: var(--ink-3); }
.brf-table td { vertical-align: top; }
.brf-grp td { background: var(--surface-2); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.brf-focus td { background: var(--calls-dim); }
.brf-lesson { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 20px; padding: 12px 14px; }
@media (max-width: 760px) { .brf-lesson { grid-template-columns: 1fr; } }
.brf-lesson p { margin: 0; font-size: 12.5px; color: var(--ink-2); }
.ana-pick { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 14px 0; }
.ana-pick button { font: inherit; font-size: 11px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); cursor: pointer; }
.ana-pick button.on { border-color: var(--calls); color: var(--calls); background: var(--calls-dim); }
.ana-pick button .pos, .ana-pick button .neg { margin-left: 4px; font-family: var(--font-num); }
.ana-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0; }
.ana-block { padding: 12px 14px; border-top: 1px solid var(--line-soft); min-width: 0; }
.ana-block h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.ana-block p { margin: 0 0 8px; color: var(--ink-2); font-size: 12px; line-height: 1.55; }
.ana-head { padding: 12px 14px 4px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; }
.ana-head .big { font-family: var(--font-num); font-size: 20px; color: var(--ink); }
.ana-news { list-style: none; margin: 0; padding: 0; }
.ana-news li { padding: 6px 0; border-bottom: 1px solid var(--line-soft); font-size: 12px; line-height: 1.45; }
.ana-news li:last-child { border-bottom: 0; }
.ana-news a { color: var(--ink); text-decoration: none; }
.ana-news a:hover { color: var(--calls); text-decoration: underline; }
.ana-meta { display: block; color: var(--ink-3); font-size: 10.5px; margin-top: 2px; }
.ana-tier { display: inline-block; font-size: 9.5px; padding: 0 5px; border-radius: 3px; border: 1px solid var(--line); margin-right: 4px; }
.ana-tier.t1 { color: var(--up); border-color: var(--up); }
.ana-tier.t2 { color: var(--calls); border-color: var(--calls); }
.ana-tier.t3 { color: var(--ink-3); }
.ana-ok { color: var(--ok); } .ana-stale { color: var(--warn); } .ana-missing { color: var(--down); }
.page-columns { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.source-unavailable { color: var(--warn); font-size: 10px; }

.card-hd {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 14px; border-bottom: 1px solid var(--line-soft);
}
.card-hd h2 { margin: 0; font-family: var(--font-uWi); font-size: 12.5px; font-weight: 650; }
.card-hd .sub {
  font-family: var(--font-num); font-size: 10px; color: var(--ink-3);
  letter-spacing: .05em; text-transform: uppercase;
}
.card-hd .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

/* ---------- verdict ---------- */
.verdict { display: grid; grid-template-columns: minmax(230px,300px) minmax(0,1fr); overflow: hidden; }
.verdict-main { padding: 16px 18px; border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 9px; }
.verdict-eyebrow {
  font-family: var(--font-num); font-size: 9.5px; letter-spacing: .16em;
  color: var(--ink-3); text-transform: uppercase;
}
.verdict-call {
  font-family: var(--font-uWi); font-size: 27px; font-weight: 680;
  letter-spacing: -.022em; line-height: 1.05; text-wrap: balance;
}
.conf { display: flex; align-items: center; gap: 9px; }
.conf-track { flex: 1; height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.conf-fill { height: 100%; background: var(--calls); border-radius: 3px; }
.conf-val { font-family: var(--font-num); font-size: 11px; color: var(--ink-2); }

.drivers { padding: 14px 18px; display: flex; flex-direction: column; gap: 9px; }
.driver { display: grid; grid-template-columns: 15px minmax(96px,132px) minmax(0,1fr); gap: 10px; align-items: baseline; }
.driver .ico { font-family: var(--font-num); font-size: 12px; text-align: center; }
.driver .k {
  font-family: var(--font-num); font-size: 10px; letter-spacing: .07em;
  color: var(--ink-3); text-transform: uppercase;
}
.driver .v { color: var(--ink-2); font-size: 12.5px; }
.driver .v b { color: var(--ink); font-weight: 600; }

/* ---------- KPI ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px,1fr)); gap: 10px; }
.kpi { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.kpi-k {
  font-family: var(--font-num); font-size: 9.5px; letter-spacing: .13em;
  color: var(--ink-3); text-transform: uppercase; display: flex; align-items: center; gap: 6px;
}
.kpi-v {
  font-family: var(--font-num); font-size: 21px; font-weight: 600;
  letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1;
}
.kpi-m { font-family: var(--font-num); font-size: 10.5px; color: var(--ink-3); }
.swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }

/* ---------- ladder ---------- */
.ladder-wrap { padding: 4px 14px 16px; overflow-x: auto; }
.ladder { min-width: 580px; display: flex; flex-direction: column; }
.ladder-head {
  display: grid; grid-template-columns: 1fr 92px 1fr; gap: 10px;
  padding: 8px 0 7px; border-bottom: 1px solid var(--line-soft);
  font-family: var(--font-num); font-size: 9.5px; letter-spacing: .13em;
  color: var(--ink-3); text-transform: uppercase;
}
.ladder-head .c { text-align: center; }
.ladder-head .r { text-align: right; }

.rung {
  display: grid; grid-template-columns: 1fr 92px 1fr; gap: 10px;
  align-items: center; padding: 1.5px 0; position: relative;
  border: 0; background: none; font: inherit; width: 100%; cursor: pointer;
  border-radius: 3px;
}
.rung:hover { background: var(--surface-2); }
.rung:hover .barfill { filter: brightness(1.22); }
.rung:hover .strike { color: var(--ink); }
.rung[aria-pressed="true"] { background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--line); }

.side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.side.l { flex-direction: row-reverse; }
.bartrack { flex: 1; height: 15px; display: flex; min-width: 0; }
.side.l .bartrack { justify-content: flex-end; }
.barfill { height: 100%; border-radius: 2px; }
.side.l .barfill { background: var(--calls); border-radius: 2px 0 0 2px; }
.side.r .barfill { background: var(--puts); border-radius: 0 2px 2px 0; }
.barval {
  font-family: var(--font-num); font-size: 10.5px; color: var(--ink-2);
  font-variant-numeric: tabular-nums; flex: none; width: 44px;
}
.side.l .barval { text-align: right; }
.side.r .barval { text-align: left; }

.strike {
  font-family: var(--font-num); font-size: 11.5px; text-align: center;
  color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.rung.wall-c .barfill { box-shadow: 0 0 0 1px var(--surface), 0 0 0 2px var(--calls); }
.rung.wall-p .barfill { box-shadow: 0 0 0 1px var(--surface), 0 0 0 2px var(--puts); }
.rung.spot { background: var(--surface-2); }
.rung.spot .strike { color: var(--ink); font-weight: 700; }
.rung.mp .strike { color: var(--maxpain); font-weight: 700; }

.rung .flag {
  position: absolute; right: 0; top: 50%; transform: translateY(-50%);
  font-family: var(--font-num); font-size: 8.5px; letter-spacing: .1em;
  padding: 1px 5px; border-radius: 3px; text-transform: uppercase; pointer-events: none;
}
.flag.spot { color: var(--ink); border: 1px solid var(--ink-3); background: var(--surface); }
.flag.mp   { color: var(--maxpain); border: 1px solid var(--maxpain); background: var(--surface); }
.flag.cw   { color: var(--calls); border: 1px solid var(--calls); background: var(--surface); }

.legend {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 0 2px; margin-top: 6px; border-top: 1px solid var(--line-soft);
  font-family: var(--font-num); font-size: 10px; color: var(--ink-3); letter-spacing: .05em;
}
.legend span { display: flex; align-items: center; gap: 6px; }

/* ---------- charts ---------- */
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px,1fr)); gap: 14px; }
.chart-body { padding: 12px 14px 14px; }
.chart-body svg { width: 100%; height: auto; display: block; }
.axis { font-family: var(--font-num); font-size: 9px; fill: var(--ink-3); }
.gridline { stroke: var(--line-soft); stroke-width: 1; }

/* ---------- tables ---------- */
.tablewrap { overflow-x: auto; }

/* Strike-indexed views open centred on the money and scroll both ways, so
   the market's actual level is never buried at the bottom of a long list. */
.tablewrap.tall { max-height: 480px; overflow-y: auto; }
.ladder-wrap.tall { max-height: 520px; overflow-y: auto; }
tr[data-atm] td { box-shadow: inset 0 1px 0 var(--calls), inset 0 -1px 0 var(--calls); }
table.dt { width: 100%; border-collapse: collapse; }
table.dt th, table.dt td { padding: 6px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line-soft); }
table.dt thead th {
  font-family: var(--font-num); font-size: 9.5px; letter-spacing: .1em;
  color: var(--ink-3); text-transform: uppercase; font-weight: 500;
  border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1;
}
table.dt thead th.grp-c { color: var(--calls); }
table.dt thead th.grp-p { color: var(--puts); }
table.dt td { font-family: var(--font-num); font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
table.dt td.lft, table.dt th.lft { text-align: left; }
table.dt tbody tr.clickable { cursor: pointer; }
table.dt tbody tr.clickable:hover td { background: var(--surface-2); }
table.dt td.strike-cell {
  text-align: center; color: var(--ink); font-weight: 600; background: var(--surface-2);
  border-left: 1px solid var(--line-soft); border-right: 1px solid var(--line-soft);
}
table.dt tbody tr.atm td { background: var(--calls-dim); }
table.dt tbody tr.atm td.strike-cell { background: var(--calls-dim); }
.itm-c { background: var(--calls-dim); }
.itm-p { background: var(--puts-dim); }
table.chain { min-width: 760px; }
table.bu { min-width: 700px; }
table.hist { min-width: 620px; }

/* ---------- buildup pills ---------- */
.pill {
  font-family: var(--font-num); font-size: 9.5px; letter-spacing: .06em;
  padding: 2px 7px; border-radius: 3px; border: 1px solid; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: 5px;
}
.pill.lb { color: var(--up);      border-color: var(--up); }
.pill.sb { color: var(--down);    border-color: var(--down); }
.pill.sc { color: var(--calls);   border-color: var(--calls); }
.pill.lu { color: var(--puts);    border-color: var(--puts); }
.pill.nx { color: var(--ink-3);   border-color: var(--line); }

/* ---------- technicals ---------- */
.tech { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px,1fr)); gap: 0; }
.tcell { padding: 12px 14px; border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 5px; }
.tcell-k { font-family: var(--font-num); font-size: 9.5px; letter-spacing: .11em; color: var(--ink-3); text-transform: uppercase; }
.tcell-v { font-family: var(--font-num); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tcell-m { font-family: var(--font-num); font-size: 10px; color: var(--ink-3); }
.meter { height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; margin-top: 2px; }
.meter i { display: block; height: 100%; border-radius: 2px; }

.levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap: 0; }
.lvl { padding: 10px 14px; border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 3px; }
.lvl-k { font-family: var(--font-num); font-size: 9.5px; letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase; }
.lvl-v { font-family: var(--font-num); font-size: 14px; font-variant-numeric: tabular-nums; }

/* ---------- pipeline ---------- */
.pipe { display: flex; flex-wrap: wrap; }
.step { flex: 1 1 150px; padding: 11px 14px; border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 4px; }
.step:last-child { border-right: 0; }
.step-k { font-family: var(--font-num); font-size: 9.5px; letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
.step-v { font-family: var(--font-num); font-size: 12.5px; color: var(--ink); }
.step-m { font-family: var(--font-num); font-size: 10px; color: var(--ink-3); }

/* ---------- drawer ---------- */
.scrim {
  position: fixed; inset: 0; background: rgba(16,12,8,.48);
  opacity: 0; pointer-events: none; transition: opacity .18s ease; z-index: 40;
}
.scrim.open { opacity: 1; pointer-events: auto; }

.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100vw);
  background: var(--surface); border-left: 1px solid var(--line);
  box-shadow: var(--shadow-lg); transform: translateX(100%);
  transition: transform .2s ease; z-index: 41;
  display: flex; flex-direction: column; overflow: hidden;
}
.drawer.open { transform: translateX(0); }
.drawer-hd {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px; border-bottom: 1px solid var(--line);
}
.drawer-hd h3 { margin: 0; font-family: var(--font-uWi); font-size: 18px; font-weight: 660; letter-spacing: -.015em; }
.drawer-hd .sub { font-family: var(--font-num); font-size: 10px; color: var(--ink-3); letter-spacing: .07em; text-transform: uppercase; }
.xbtn {
  margin-left: auto; background: var(--surface-2); border: 1px solid var(--line);
  color: var(--ink-2); border-radius: var(--r); cursor: pointer;
  font-family: var(--font-num); font-size: 13px; line-height: 1; padding: 6px 9px;
}
.xbtn:hover { color: var(--ink); border-color: var(--ink-3); }
.drawer-body { overflow-y: auto; padding: 0 0 24px; }

.leg-hd {
  display: flex; align-items: center; gap: 8px; padding: 11px 16px 8px;
  font-family: var(--font-num); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
}
.leg-hd .bar { width: 3px; height: 13px; border-radius: 2px; }
.leg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 1px solid var(--line-soft); }
.lg { padding: 9px 16px; border-bottom: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 2px; }
.lg:nth-child(odd) { border-right: 1px solid var(--line-soft); }
.lg-k { font-family: var(--font-num); font-size: 9.5px; letter-spacing: .09em; color: var(--ink-3); text-transform: uppercase; }
.lg-v { font-family: var(--font-num); font-size: 14px; font-variant-numeric: tabular-nums; color: var(--ink); }
.ohlc-row { display: flex; gap: 0; border-bottom: 1px solid var(--line-soft); }
.ohlc-cell { flex: 1; padding: 9px 10px; border-right: 1px solid var(--line-soft); text-align: center; }
.ohlc-cell:last-child { border-right: 0; }
.ohlc-k { font-family: var(--font-num); font-size: 9px; letter-spacing: .12em; color: var(--ink-3); }
.ohlc-v { font-family: var(--font-num); font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink); }

.readout { padding: 12px 16px; display: flex; flex-direction: column; gap: 7px; border-bottom: 1px solid var(--line-soft); }
.readout p { margin: 0; color: var(--ink-2); font-size: 12.5px; }
.readout p b { color: var(--ink); }

/* A pill already carries a coloured border and the headline is set large;
   a dotted underline on either reads as damage rather than as an
   affordance, so each keeps its own shape and only the cursor changes. */
/* The pill keeps the border it already had; only the cursor says it is
   now a control, because a restyled border reads as a state change. */
.pill.has-term { text-decoration: none; cursor: pointer; }
.pill.has-term:hover { color: inherit; filter: brightness(1.25); }
h2.has-term { text-decoration: none; cursor: pointer; }

/* Dim until it is the active sort, so a sortable column reads as sortable
   without competing with the label beside it. */
/* Drawn over the chart rather than under it: the numbers are wanted
   sometimes, and the chart is wanted always. */
.ck-table {
  position: absolute; inset: 0; z-index: 4;
  overflow: auto; background: var(--bg);
  border-top: 1px solid var(--line);
}
.ck-tbl-bar {
  position: sticky; top: 0; z-index: 2;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px 12px; background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.ck-tbl-name {
  font-size: 17px; font-weight: 700; letter-spacing: -.01em;
  margin-right: 4px;
}
.ck-tbl-n {
  font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink-3); margin-left: auto; padding-right: 4px;
}
.ck-tool, .ck-tbl-btn {
  font: inherit; font-size: 11px; font-weight: 600;
  padding: 4px 11px; border-radius: 4px; cursor: pointer;
  color: var(--ink-2); background: var(--surface-2);
  border: 1px solid var(--line);
}
.ck-tool:hover, .ck-tbl-btn:hover { color: var(--ink); border-color: var(--ink-3); }
.ck-tool[aria-pressed="true"] {
  background: var(--calls-dim); border-color: var(--calls); color: var(--ink);
}
.ck-tool:focus-visible, .ck-tbl-btn:focus-visible {
  outline: 2px solid var(--calls); outline-offset: 2px;
}
.ck-tbl-btn.done { color: var(--up); border-color: var(--up); }

/* The column picker. Left open while several are toggled, because
   choosing columns one dialog at a time is its own annoyance. */
.ck-cols { position: relative; }
.ck-colmenu {
  position: absolute; top: calc(100% + 5px); left: 0; z-index: 5;
  min-width: 190px; padding: 6px;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 5px; box-shadow: 0 10px 28px rgba(0,0,0,.34);
  display: flex; flex-direction: column; gap: 1px;
}
.ck-colmenu[hidden] { display: none; }
.ck-col {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 8px; border-radius: 3px; cursor: pointer;
  font-size: 12px; color: var(--ink-2); background: none; border: 0;
  font: inherit; text-align: left; width: 100%;
}
.ck-col:hover { background: var(--line-soft); color: var(--ink); }
.ck-col .tick { width: 12px; color: var(--calls); font-size: 11px; }
.ck-col[aria-pressed="true"] { color: var(--ink); }

.ck-table .dt { font-size: 11.5px; }
.ck-table .dt td, .ck-table .dt th { padding: 4px 12px; }
.ck-table .dt thead th { position: sticky; top: 52px; z-index: 1; }

.so {
  margin-left: 5px; font-size: 9px; cursor: pointer;
  color: var(--ink-3); opacity: .45;
}
.so:hover, .so.on { opacity: 1; color: var(--calls); }
.so:focus-visible { outline: 2px solid var(--calls); outline-offset: 2px; }
h2.has-term:hover { color: var(--calls); }

.verdict-call.has-term, .verdict-eyebrow.has-term, .conf-val.has-term {
  text-decoration: none; cursor: pointer;
}
.verdict-call.has-term:hover, .verdict-eyebrow.has-term:hover,
.conf-val.has-term:hover { color: var(--calls); }

table.pf { border-collapse: collapse; width: 100%; margin: 6px 0 0;
  font-family: var(--font-num); font-size: 11.5px; }
table.pf th, table.pf td {
  padding: 5px 9px; text-align: right; border-bottom: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
table.pf th {
  font-size: 9px; font-weight: 600; letter-spacing: .07em;
  text-transform: uppercase; color: var(--ink-3);
  background: var(--surface-2); border-bottom: 1px solid var(--line);
}
table.pf th.lft, table.pf td.lft { text-align: left; }
table.pf tbody tr:last-child td { border-bottom: 0; }
table.pf td.pf-v { color: var(--ink); font-weight: 600; }

.pf-rule {
  margin-top: 9px; padding: 8px 11px; border-radius: 4px;
  background: var(--surface-2); border: 1px solid var(--line);
  font-family: var(--font-num); font-size: 11.5px; color: var(--ink);
  letter-spacing: .02em;
}
.pf-note { margin: 9px 0 0; font-size: 12.5px; color: var(--ink-2); }

.pt-why { margin: 7px 0 0; padding-left: 17px; }
.pt-why li { margin-bottom: 6px; }
.pt-why li:last-child { margin-bottom: 0; }
.pt-why li::marker { color: var(--ink-3); }

.pt-arrow { color: var(--calls); font-weight: 700; margin-right: 3px; }

.pt-lv {
  display: flex; align-items: baseline; gap: 8px;
  padding: 4px 0; border-bottom: 1px solid var(--line-soft);
}
.pt-lv:last-child { border-bottom: 0; }
.pt-lv-d { font-size: 8px; line-height: 1; }
.pt-lv:nth-child(1) .pt-lv-d { color: var(--down); }
.pt-lv:nth-child(2) .pt-lv-d { color: var(--up); }
.pt-lv:nth-child(3) .pt-lv-d { color: var(--maxpain); }
.pt-lv-n { min-width: 74px; color: var(--ink-2); }
.pt-lv-v { font-family: var(--font-num); font-size: 14px; }
.pt-lv-m { margin-left: auto; font-size: 10.5px; color: var(--ink-3); }

.pt-if { display: flex; gap: 8px; padding: 3px 0; align-items: baseline; }
.pt-if-a { color: var(--ink-3); width: 12px; flex: none; }

.pt-more {
  margin-top: 12px; padding-top: 10px;
  border-top: 1px solid var(--line);
}
.pt-more > summary {
  cursor: pointer; list-style: none; font-size: 10px; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3);
}
.pt-more > summary::-webkit-details-marker { display: none; }
.pt-more > summary::after { content: " \25be"; }
.pt-more[open] > summary::after { content: " \25b4"; }
.pt-more > summary:hover { color: var(--calls); }
.pt-more p { margin: 9px 0 0; color: var(--ink-2); }

.pt-rk.has-term, .si-k.has-term, .lg-k.has-term, .ohlc-k.has-term,
td.has-term, h2.has-term, .bandrow-k.has-term,
th.has-term, .k.has-term, .qk.has-term, .tcell-k.has-term,
.stack-k.has-term, .grp-c.has-term, .grp-p.has-term, .pill.has-term,
.tagx.has-term, .sub-k.has-term, .conf-val.has-term,
.verdict-call.has-term, .verdict-eyebrow.has-term, .lvl-k.has-term, .kpi-k.has-term, .ck.has-term,
.dt.legend td.has-term {
  cursor: pointer; text-decoration: underline dotted var(--ink-3) 1px;
  text-underline-offset: 3px;
}
.k.has-term:hover, .qk.has-term:hover, .tcell-k.has-term:hover,
.stack-k.has-term:hover, .pill.has-term:hover, .tagx.has-term:hover,
.conf-val.has-term:hover, .verdict-call.has-term:hover,
th.has-term:hover, .lvl-k.has-term:hover, .kpi-k.has-term:hover,
.ck.has-term:hover, .dt.legend td.has-term:hover {
  color: var(--calls); text-decoration-color: var(--calls);
}
th.has-term:focus-visible, .lvl-k.has-term:focus-visible {
  outline: 2px solid var(--calls); outline-offset: 2px;
}

.prob.has-term { cursor: pointer; border-radius: 5px; transition: background .12s ease; }
.prob.has-term:hover { background: var(--surface-2); }
.prob.has-term:focus-visible { outline: 2px solid var(--calls); outline-offset: 2px; }
.term-mark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 12px; height: 12px; margin-left: 5px; border-radius: 50%;
  border: 1px solid var(--ink-3); color: var(--ink-3);
  font-size: 8px; line-height: 1; vertical-align: middle;
}
.prob.has-term:hover .term-mark { border-color: var(--calls); color: var(--calls); }
.pt-sec { margin-top: 9px; font-size: 12px; line-height: 1.55; color: var(--ink-2); }
.pt-sec b { color: var(--ink); }
.pt-sk {
  display: block; font-family: var(--font-num); font-size: 9px;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--calls); margin-bottom: 2px;
}

/* ---------- clickable chart points ---------- */
.clickable-chart { cursor: pointer; }
.clickable-chart:focus-visible { outline: 2px solid var(--calls); outline-offset: 3px; }
[data-pt] { cursor: pointer; }
[data-pt]:hover { filter: brightness(1.25); }

.pt-panel {
  position: fixed; right: 18px; bottom: 18px; z-index: 60;
  width: min(400px, calc(100vw - 36px));
  max-height: 70vh; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line);
  border-left: 3px solid var(--calls); border-radius: 8px;
  box-shadow: var(--shadow-lg); padding: 14px 16px;
}
.pt-hd { display: flex; align-items: flex-start; gap: 10px; }
.pt-hd > div { flex: 1; }
.pt-t { font-family: var(--font-uWi); font-size: 14px; font-weight: 650; }
.pt-s { font-size: 11px; color: var(--ink-3); }
.pt-big { font-family: var(--font-num); font-size: 26px; font-weight: 650;
          letter-spacing: -.02em; margin: 6px 0 8px; }
.pt-rows { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px;
           font-size: 12px; }
.pt-row { display: contents; }
.pt-row span { color: var(--ink-3); }
.pt-row b { font-family: var(--font-num); color: var(--ink); font-weight: 600; }
.pt-note { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line);
           font-size: 11.5px; color: var(--ink-2); line-height: 1.5; }

/* ---------- learning: click to expand ---------- */
.lrn.has-deep { cursor: pointer; transition: border-color .12s ease; }
.lrn.has-deep:hover { border-color: var(--calls); }
.lrn.has-deep:focus-visible { outline: 2px solid var(--calls); outline-offset: 2px; }
.lrn-chev { float: right; color: var(--ink-3); font-size: 11px;
            transition: transform .15s ease; }
.lrn.open .lrn-chev { transform: rotate(180deg); color: var(--calls); }
.lrn-deep { display: none; margin-top: 10px; padding-top: 10px;
            border-top: 1px solid var(--line); }
.lrn.open .lrn-deep { display: block; }
.lrn-d { margin-bottom: 9px; font-size: 12.5px; line-height: 1.6;
         color: var(--ink-2); }
.lrn-d:last-child { margin-bottom: 0; }
.lrn-dk { display: block; font-family: var(--font-num); font-size: 9.5px;
          letter-spacing: .12em; text-transform: uppercase;
          color: var(--calls); margin-bottom: 2px; }
.lrn-d b { color: var(--ink); }

.dt.legend td { vertical-align: top; padding: 8px 12px; line-height: 1.5; }
.dt.legend td:first-child { width: 130px; white-space: nowrap; color: var(--ink); }
.dt.legend td:last-child { color: var(--ink-2); font-size: 12.5px; }

.dt .grp-hd th { font-size: 9px; letter-spacing: .18em; padding-bottom: 2px;
                 border-bottom: 1px solid var(--line); }
.dt .grp-hd .grp-c { color: var(--calls); }
.dt .grp-hd .grp-p { color: var(--puts); }

.killrow { padding: 9px 14px; margin-bottom: 6px; border-radius: 0 6px 6px 0;
           background: var(--puts-dim); border-left: 3px solid var(--down);
           font-size: 13px; line-height: 1.55; color: var(--ink-2); }
.killrow b { color: var(--ink); }

/* ---------- tech-fund ---------- */
.pbar { position: relative; height: 6px; border-radius: 3px;
        background: var(--surface-3); min-width: 110px; }
.pbar i { position: absolute; top: -2px; width: 3px; height: 10px;
          border-radius: 2px; transform: translateX(-50%); }
.notecall { padding: 12px 16px; margin: 2px 0 12px; border-radius: 6px;
            background: var(--calls-dim); border-left: 3px solid var(--calls);
            font-size: 13.5px; line-height: 1.55; }
.legs-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
            padding: 10px 0 4px; }
.leg-chip { font-family: var(--font-num); font-size: 11px; padding: 3px 9px;
            border-radius: 4px; border: 1px solid; }
.leg-chip.sell { color: var(--puts); border-color: var(--puts); }
.leg-chip.buy  { color: var(--calls); border-color: var(--calls); }

/* ---------- sortable table headers ---------- */
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--ink); }
th.sortable.on { color: var(--calls); }

/* ---------- strategy / seller desk ---------- */
.caution {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 11px 14px; border-left: 3px solid var(--warn);
  background: var(--surface-2); border-radius: 0 var(--r) var(--r) 0;
}
.caution b { color: var(--ink); }
.caution p { margin: 0; color: var(--ink-2); font-size: 12px; }
.caution p + p { margin-top: 5px; }

.rangebar { padding: 20px 18px 12px; }
.rb { position: relative; height: 46px; }
.rb-band { position: absolute; top: 12px; height: 22px; border-radius: 3px; }
.rb-2sd { background: var(--surface-3); }
.rb-1sd { background: var(--calls-dim); box-shadow: inset 0 0 0 1px var(--calls); }
.rb-tick { position: absolute; top: 4px; width: 2px; height: 38px; border-radius: 1px; }
.rb-lab {
  position: absolute; font-family: var(--font-num); font-size: 9.5px;
  color: var(--ink-3); letter-spacing: .05em; white-space: nowrap; transform: translateX(-50%);
}
.rb-lab.top { top: -14px; } .rb-lab.bot { top: 46px; }
.rb-legend {
  display: flex; gap: 18px; flex-wrap: wrap; padding-top: 26px;
  font-family: var(--font-num); font-size: 10px; color: var(--ink-3); letter-spacing: .05em;
}
.rb-legend span { display: flex; align-items: center; gap: 6px; }

/* ---------- crosshair readouts ---------- */
.rb { cursor: crosshair; }
.rb-cross {
  position: absolute; top: 2px; bottom: 2px; width: 1px;
  background: var(--ink); opacity: .9; pointer-events: none; display: none;
}
.rb-cross::after {
  content: ""; position: absolute; left: -3px; top: 50%; width: 7px; height: 7px;
  border-radius: 50%; background: var(--ink); transform: translateY(-50%);
}
.rb-tip {
  position: absolute; bottom: 44px; transform: translateX(-50%);
  background: var(--surface-3); border: 1px solid var(--line);
  border-radius: 4px; padding: 5px 9px; white-space: nowrap;
  font-family: var(--font-num); font-size: 11px; color: var(--ink);
  pointer-events: none; display: none; z-index: 6; box-shadow: var(--shadow);
}
.rb-tip b { color: var(--ink); font-size: 12.5px; }
.rb-tip i { font-style: normal; color: var(--ink-3); }
.rb.live .rb-cross, .rb.live .rb-tip { display: block; }

.ch-wrap { position: relative; cursor: crosshair; }
.ch-cross {
  position: absolute; top: 0; bottom: 18px; width: 1px;
  background: var(--ink-3); pointer-events: none; display: none;
}
.ch-dot {
  position: absolute; width: 8px; height: 8px; border-radius: 50%;
  transform: translate(-50%, -50%); pointer-events: none; display: none;
  box-shadow: 0 0 0 2px var(--surface);
}
.ch-tip {
  position: absolute; top: 2px; transform: translateX(-50%);
  background: var(--surface-3); border: 1px solid var(--line);
  border-radius: 5px; padding: 8px 10px; white-space: nowrap;
  font-family: var(--font-num); color: var(--ink);
  pointer-events: none; display: none; z-index: 6; box-shadow: var(--shadow);
  min-width: 148px;
}
.ch-tip i { font-style: normal; color: var(--ink-3); }
.ch-wrap.live .ch-cross, .ch-wrap.live .ch-dot, .ch-wrap.live .ch-tip { display: block; }

.tip-date { font-size: 9.5px; letter-spacing: .12em; color: var(--ink-3); text-transform: uppercase; }
.tip-big {
  font-size: 18px; font-weight: 650; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums; margin-top: 1px;
}
.tip-chg { font-size: 10.5px; margin-top: 1px; }
.tip-grid {
  display: grid; grid-template-columns: auto auto; gap: 1px 12px;
  margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--line);
}
.tip-grid span { font-size: 9.5px; letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase; }
.tip-grid b { font-size: 11px; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.tip-vol { margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--line); }
.tip-vol-k { font-size: 9.5px; letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase; }
.tip-vol-bar { height: 5px; border-radius: 3px; background: var(--surface); margin: 3px 0 2px; overflow: hidden; }
.tip-vol-bar i { display: block; height: 100%; background: var(--calls); border-radius: 3px; }
.tip-vol-v { font-size: 11px; font-variant-numeric: tabular-nums; }

/* ladder hover readout */
.rung-tip {
  position: fixed; transform: translate(-50%, -120%);
  background: var(--surface-3); border: 1px solid var(--line);
  border-radius: 5px; padding: 7px 10px; white-space: nowrap;
  font-family: var(--font-num); font-size: 11px; color: var(--ink);
  pointer-events: none; z-index: 50; box-shadow: var(--shadow); display: none;
}
.rung-tip.live { display: block; }
.rung-tip .rt-k { font-size: 9.5px; letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase; }
.rung-tip .rt-big { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
.rung-tip .rt-row { display: flex; justify-content: space-between; gap: 16px; margin-top: 2px; }

.bar-dual { display: flex; flex-direction: column; gap: 4px; }
.bar-cap {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  font-family: var(--font-num); font-size: 10px; letter-spacing: .11em;
  color: var(--ink-3); text-transform: uppercase; padding: 0 18px;
}
.bar-cap b { color: var(--ink); font-size: 12.5px; letter-spacing: 0; text-transform: none; }
.bar-cap .tagx {
  border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px;
  font-size: 9px; letter-spacing: .07em; color: var(--ink-3);
}

.probs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); }
.prob { padding: 12px 14px; border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 5px; }
.prob:last-child { border-right: 0; }
.prob-k { font-family: var(--font-num); font-size: 9.5px; letter-spacing: .11em; color: var(--ink-3); text-transform: uppercase; }
.prob-v { font-family: var(--font-num); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }

table.strat { min-width: 780px; }
table.strat td.verdict-cell { text-align: left; }
.pill.go   { color: var(--up);    border-color: var(--up); }
.pill.mid  { color: var(--warn);  border-color: var(--warn); }
.pill.no   { color: var(--ink-3); border-color: var(--line); }
.pill.risk { color: var(--down);  border-color: var(--down); }

.struct { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); }
.struct-c { padding: 12px 14px; border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 4px; }
.struct-k { font-family: var(--font-num); font-size: 9.5px; letter-spacing: .11em; color: var(--ink-3); text-transform: uppercase; }
.struct-v { font-family: var(--font-num); font-size: 15px; font-variant-numeric: tabular-nums; color: var(--ink); }
.struct-m { font-family: var(--font-num); font-size: 10px; color: var(--ink-3); }

.legs { display: flex; flex-direction: column; }
.leg-row {
  display: grid; grid-template-columns: 74px 1fr auto; gap: 12px; align-items: center;
  padding: 9px 14px; border-bottom: 1px solid var(--line-soft);
}
.leg-act {
  font-family: var(--font-num); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 3px; border: 1px solid; text-align: center;
}
.leg-act.sell { color: var(--down); border-color: var(--down); }
.leg-act.buy  { color: var(--up);   border-color: var(--up); }
.leg-desc { font-family: var(--font-num); font-size: 12.5px; color: var(--ink); }
.leg-prem { font-family: var(--font-num); font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

.checks { display: flex; flex-direction: column; }
.check {
  display: grid; grid-template-columns: 18px minmax(120px,170px) minmax(0,1fr);
  gap: 12px; align-items: baseline; padding: 10px 14px; border-bottom: 1px solid var(--line-soft);
}
.check:last-child { border-bottom: 0; }
.check .mk { font-family: var(--font-num); font-size: 12px; color: var(--calls); text-align: center; }
.check .ck { font-family: var(--font-num); font-size: 10px; letter-spacing: .09em; color: var(--ink-3); text-transform: uppercase; }
.check .cv { color: var(--ink-2); font-size: 12.5px; }
.check .cv b { color: var(--ink); font-family: var(--font-num); font-variant-numeric: tabular-nums; }

table.gap { min-width: 560px; }
.bar-pl { display: inline-block; height: 9px; border-radius: 2px; vertical-align: middle; }

/* ---------- candlestick overlay ---------- */
.ck-scrim {
  position: fixed; inset: 0; background: rgba(16,12,8,.62);
  opacity: 0; pointer-events: none; transition: opacity .16s ease; z-index: 60;
}
.ck-scrim.open { opacity: 1; pointer-events: auto; }

.ck-panel {
  position: fixed; inset: 3vh 3vw; z-index: 61;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: var(--shadow-lg);
  display: none; flex-direction: column; overflow: hidden;
}
.ck-panel.open { display: flex; }

.ck-hd {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 11px 16px; border-bottom: 1px solid var(--line);
}
.ck-name { font-family: var(--font-uWi); font-size: 16px; font-weight: 660; letter-spacing: -.01em; }
.ck-last {
  font-family: var(--font-num); font-size: 20px; font-weight: 650;
  font-variant-numeric: tabular-nums; letter-spacing: -.02em;
}
.ck-chg { font-family: var(--font-num); font-size: 12px; }
.ck-meta { font-family: var(--font-num); font-size: 10px; color: var(--ink-3); letter-spacing: .05em; }
.ck-ranges { margin-left: auto; display: flex; gap: 3px; }
.ck-r {
  border: 1px solid var(--line); background: none; color: var(--ink-2);
  border-radius: var(--r); padding: 4px 10px; cursor: pointer;
  font-family: var(--font-num); font-size: 10.5px;
}
.ck-r:hover { color: var(--ink); border-color: var(--ink-3); }
.ck-r[aria-selected="true"] { background: var(--calls-dim); border-color: var(--calls); color: var(--ink); }

.ck-body { flex: 1; position: relative; min-height: 0; }

  </div>

<script>
(function () {
  "use strict";

  /* ==========================================================
     1. DATA LAYER &mdash; reads static JSON written by the daily job.
        The page never contacts NSE and never computes analytics
        it could get wrong; every number here was produced by
        compute.py and stored before the page loaded.
     ========================================================== */
  var SNAPSHOT = "snapshot/";
  var INDICES = [];          /* filled from manifest + per-index files */
  var ACCURACY = {};
  var MANIFEST = {};
  var STRIP = [];            /* market.json -- rendered once, never re-rendered */
  var STRIP_EOD = [];        /* market.json as loaded, kept for off-hours rows */
  var WATCH = [];            /* watchlist.json */
  var MHIST = {};            /* history.json -- per-day audit trail */
  var TECHFUND = {};         /* techfund.json -- note + valuation */
  var STOCKS = {};           /* stocks.json  -- index constituents */
  var ANALYSIS = {};         /* analysis.json -- why markets moved, sources */
  var BRIEF = {};            /* brief.json -- the morning brief on the Overview */

  function getJson(name) {
    return fetch(SNAPSHOT + name, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error(name + " -> HTTP " + r.status);
      return r.json();
    });
  }

  var PAGES = [
    { key:"market-overview", label:"Overview", mark:"OV" },
    { key:"india-index", label:"Nifty Index", mark:"NF" },
    { key:"metal-index", label:"Metal Index", mark:"MT" },
    { key:"energy-index", label:"Energy Index", mark:"EN" },
    { key:"international", label:"International", mark:"GL" }
  ];

  var VIEWS = [
    { key:"today",    label:"Today" },
    { key:"options",  label:"Options &amp; OI" },
    { key:"analysis", label:"Analysis" },
    { key:"stocks",   label:"NIFTY 50 stocks" },
    { key:"record",   label:"Track record" }
  ];

  /* ==========================================================
     2. NORMALISE &mdash; snapshot JSON into the shape the views use.
        OI, change-in-OI and volume arrive as raw contract counts
        and are converted to lakh once, here, so no view has to
        remember which unit it is holding.
     ========================================================== */
  var LAKH = 1e5;

  function normLeg(b) {
    if (!b) return null;
    return {
      ltp: b.ltp, prevClose: b.prevClose, chg: b.chg, chgPct: b.chgPct,
      oi: (b.oi || 0) / LAKH, chgOi: (b.chgOi || 0) / LAKH,
      vol: (b.vol || 0) / LAKH, iv: b.iv,
      bid: b.bid, ask: b.ask, buildup: b.buildup,
      /* Present only for sessions rebuilt from the F&O bhavcopy. Left null
         where the live chain was the source, so the drawer can say so
         rather than repeat LTP four times. */
      o: b.o, h: b.h, l: b.l, c: b.c, settle: b.settle,
      turnover: 0
    };
  }

  /* A strike can arrive with only one side quoted. Fill the gap with an
     explicit empty leg so views never have to test for null. */
  var EMPTY_LEG = {
    ltp: 0, prevClose: 0, chg: 0, chgPct: 0, oi: 0, chgOi: 0, vol: 0,
    iv: null, bid: 0, ask: 0, buildup: null, o: 0, h: 0, l: 0, c: 0, turnover: 0
  };

  function normalise(d) {
    var rows = (d.rows || []).map(function (r) {
      return {
        strike: r.strike,
        ce: normLeg(r.ce) || Object.assign({}, EMPTY_LEG),
        pe: normLeg(r.pe) || Object.assign({}, EMPTY_LEG)
      };
    });

    var o = d.ohlc || {};
    var cfg = {
      key: d.index, label: d.label, lot: d.lot, step: d.step,
      spot: d.spot, prevClose: o.prevClose || d.spot,
      open: o.open || d.spot, high: o.high || d.spot, low: o.low || d.spot,
      vix: (d.vix && d.vix.value) || 0, vixChg: (d.vix && d.vix.chgPct) || 0,
      expiry: d.expiry, iv: d.atmIv
    };

    var maxOi = rows.reduce(function (mx, r) {
      return Math.max(mx, r.ce ? r.ce.oi : 0, r.pe ? r.pe.oi : 0);
    }, 0) || 1;

    var cands = (d.candidates || []).map(function (c) {
      return {
        side: c.side, strike: c.strike, delta: c.delta, pop: c.pop,
        credit: c.ltp, creditRs: c.credit_rs, rom: c.rom_pct,
        margin: c.margin, liquid: c.verdict !== "illiquid",
        leg: { oi: (c.oi || 0) / LAKH, vol: (c.vol || 0) / LAKH, iv: c.iv },
        verdict: VERDICT[c.verdict] || { c: "no", t: c.verdict }
      };
    });

    return {
      cfg: cfg, rows: rows, atm: d.atm, maxOi: maxOi,
      totC: (d.totalCeOi || 0) / LAKH, totP: (d.totalPeOi || 0) / LAKH,
      pcr: d.pcr, maxPain: d.maxPain,
      callWall: d.callWall, putWall: d.putWall,
      sd1: d.sd1, range1: d.range1sd, range2: d.range2sd,
      sdNext: d.sdNext, rangeNext1: d.rangeNext1sd,
      rangeNextCalibrated: d.rangeNextCalibrated, bandFactor: d.bandFactor,
      an: d.analysis || null,
      dte: d.dte, t: Math.max(d.dte, 0.5) / 365,
      atmIv: d.atmIv, tradeDate: d.tradeDate, nseTimestamp: d.nseTimestamp,
      sessionsStored: d.sessionsStored, nStrikes: d.nStrikes,
      cands: cands,
      piv: pivots(cfg.high, cfg.low, cfg.spot),
      hist: (d.history || []).map(function (h) {
        return { date: new Date(h.date + "T00:00:00Z"), close: h.close,
                 pcr: h.pcr, mp: h.maxPain, vix: h.vix, atmIv: h.atmIv,
                 o: h.o, h: h.h, l: h.l, c: h.c,
                 chgPct: h.chgPct, volume: h.volume, turnover: h.turnover };
      })
    };
  }

  var VERDICT = {
    candidate:    { c: "go",   t: "Candidate" },
    marginal:     { c: "mid",  t: "Marginal" },
    thin_premium: { c: "mid",  t: "Thin premium" },
    too_close:    { c: "risk", t: "Too close" },
    illiquid:     { c: "no",   t: "Illiquid" }
  };


  /* The pill carries the row that produced it. Without this the card can
     only describe the rule; with it the card can prove this strike. */

  /* The gates scale to this chain's own depth -- 5% of the deepest strike
     and 2% of the busiest -- with an absolute floor underneath. Using the
     absolute floor alone showed strikes clearing a bar the pipeline had
     already failed them on. */
  var MIN_OI_L = 500 / 1e5, MIN_VOL_L = 1000 / 1e5;
  var LIQ_OI_FRAC = 0.05, LIQ_VOL_FRAC = 0.02;

  function liqFloors(m) {
    var maxOi = 0, maxVol = 0;
    (m.rows || []).forEach(function (r) {
      ["ce", "pe"].forEach(function (l) {
        var leg = r[l];
        if (!leg) return;
        if (leg.oi > maxOi) maxOi = leg.oi;
        if (leg.vol > maxVol) maxVol = leg.vol;
      });
    });
    return {
      oi: Math.max(MIN_OI_L, maxOi * LIQ_OI_FRAC),
      vol: Math.max(MIN_VOL_L, maxVol * LIQ_VOL_FRAC)
    };
  }


  function maxPainCtx() {
    return " data-ctx='" + JSON.stringify({ p: "maxpain" }) + "'";
  }


  function verdictPill(x, m) {
    var f = liqFloors(m);
    var ctx = {
      p: "verdict", t: x.verdict.t, k: x.strike, side: x.side,
      delta: x.delta, pop: x.pop, rom: x.rom, credit: x.credit,
      creditRs: x.creditRs, margin: x.margin,
      oi: (x.leg || {}).oi, vol: (x.leg || {}).vol,
      oiFloor: f.oi, volFloor: f.vol
    };
    return '<span class="pill ' + x.verdict.c + '" data-term="' +
      esc(x.verdict.t) + '" data-ctx=' + "'" + JSON.stringify(ctx) + "'" +
      ' tabindex="0" role="button">' + x.verdict.t + "</span>";
  }

  /* A level tile that names a wall carries the side it belongs to, so the
     card can rank that side rather than guessing from the strike. */
  function wallCtx(side) {
    return " data-ctx='" + JSON.stringify({ p: "wall", side: side }) + "'";
  }

  function dmaCtx(r) {
    return " data-ctx='" + JSON.stringify({
      p: "dma", sym: r.symbol, close: r.close, dma50: r.dma50,
      weightPct: r.weightPct, contribPts: r.contribPts
    }) + "'";
  }

  function buildupPill(b, r, side, strike) {
    var leg = r[side] || {};
    var ctx = {
      p: "buildup", k: strike, side: side.toUpperCase(),
      oi: leg.oi, chgOi: leg.chgOi, ltp: leg.ltp, prevClose: leg.prevClose,
      chg: leg.chg, chgPct: leg.chgPct, vol: leg.vol, iv: leg.iv
    };
    return '<span class="pill ' + b.c + '" data-term="' + esc(b.t) +
      /* Single-quoted with raw JSON inside, the same shape data-pt uses.
         Stringifying twice escapes the inner quotes into the attribute,
         which is not valid markup and parses back to nothing. */
      '" data-ctx=' + "'" + JSON.stringify(ctx) + "'" +
      ' tabindex="0" role="button">' + b.t + "</span>";
  }

  function classify(chgPct, chgOi) {
    if (chgOi >= 0 && chgPct >= 0) return { c:"lb", t:"Long build-up" };
    if (chgOi >= 0 && chgPct <  0) return { c:"sb", t:"Short build-up" };
    if (chgOi <  0 && chgPct >= 0) return { c:"sc", t:"Short covering" };
    return { c:"lu", t:"Long unwinding" };
  }

  function pivots(h, l, c) {
    var p = (h + l + c) / 3, rng = h - l;
    return { p:p, r1:2*p-l, s1:2*p-h, r2:p+rng, s2:p-rng, r3:h+2*(p-l), s3:l-2*(h-p) };
  }

  var MODEL = {};

  /* ==========================================================
     3. FORMATTERS
     ========================================================== */
  /* NSE reports no IV for illiquid strikes, and a chain can carry a strike
     with only one leg. Formatters absorb that rather than every call site
     guarding for it \u2014 one unguarded null used to take the whole page down. */
  var nf = function (v, d) {
    if (v === null || v === undefined) return "\u2014";
    v = Number(v);
    if (!isFinite(v)) return "\u2014";
    return v.toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d });
  };
  var n0 = function (v) { return nf(v, 0); };
  var n2 = function (v) { return nf(v, 2); };
  var sgn = function (v, d) {
    if (v === null || v === undefined || !isFinite(Number(v))) return "\u2014";
    return (v >= 0 ? "+" : "\u2212") + nf(Math.abs(v), d);
  };
  var cls = function (v) {
    if (v === null || v === undefined || !isFinite(Number(v))) return "neu";
    return v >= 0 ? "pos" : "neg";
  };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" })[c]; }); };
  var DT = function (d) { return d.toLocaleDateString("en-GB", { day:"2-digit", month:"short" }); };

  /* ==========================================================
     4. STATE
     ========================================================== */
  var state = { idx: "NIFTY", page: "market-overview", view: "today", strike: null,
                wl: null, wlExpiry: 0, anaSym: "JPY=X" };

  /* Keep the open tab across a refresh. The address carries it:
     #india-index/analysis, #metal-index/silver, #energy-index.
     render() writes it back with replaceState, so a refresh reopens
     the same place and the link can be shared. */
  var NAV_HASH = (function () {
    try {
      var h = String(location.hash || "").replace(/^#/, "").split("/");
      return { page: decodeURIComponent(h[0] || ""), sub: decodeURIComponent(h[1] || ""),
               exp: decodeURIComponent(h[2] || "") };
    } catch (e) { return { page: "", sub: "", exp: "" }; }
  })();
  if (PAGES.some(function (p) { return p.key === NAV_HASH.page; })) {
    state.page = NAV_HASH.page;
    if (state.page === "india-index" && NAV_HASH.sub) state.view = NAV_HASH.sub;
  }
  function navWriteHash() {
    try {
      var sub = state.page === "india-index" ? state.view :
        state.page === "metal-index" ? mtlState.metal : "";
      var h = "#" + state.page + (sub ? "/" + sub : "");
      /* The open expiry tab on Nifty Today, so a refresh lands on it. */
      if (state.page === "india-index" && (state.view === "today" || state.view === "options") &&
          typeof hzState !== "undefined" && hzState.exp) h += "/" + hzState.exp;
      if (location.hash !== h && history && history.replaceState) history.replaceState(null, "", h);
    } catch (e) { /* no address bar (tests, file://): nothing to keep */ }
  }

  /* ==========================================================
     5. RENDER &mdash; chrome
     ========================================================== */

  /* ---------- the rail ---------- */
  /* Two letters, because at 46px a label is not an option and an invented
     icon set would be worse than initials a trader can learn in a day. */
  var RAIL_MARK = {
    overview: "OV", strategy: "DS", metoil: "MO", model: "MD", watchlist: "WL",
    stocks: "50", chain: "OC", technicals: "TF", history: "HI",
    learning: "LN"
  };

  function railMark(key, label) {
    var m = RAIL_MARK[key];
    if (m) return m;
    /* An index, or a view added later: initials from the label, digits
       kept, so NIFTY 50 reads N50 rather than NI. */
    var t = String(label).replace(/&[a-z]+;/g, " ").trim();
    var num = t.match(/\d+/);
    var alpha = t.replace(/[^A-Za-z ]/g, "").trim().split(/\s+/);
    return (alpha[0] || "?").charAt(0).toUpperCase() +
      (num ? num[0] : (alpha[1] || alpha[0] || "").charAt(1) || "").toString()
        .toUpperCase();
  }

  /* The candlestick chart is the one thing on the page that does not
     reflow: it measures its container when it draws and keeps that number.
     Everything else is grid and flex and looks after itself. */
  function resizeChart() {
    if (!CKS || !CKS.chart) return;
    var el = document.getElementById("ckChart");
    if (!el || !el.clientWidth) return;
    CKS.chart.applyOptions({ width: el.clientWidth, height: el.clientHeight });
  }

  var RAIL_KEY = "desk.rail";

  function railCollapsed() {
    return document.getElementById("shell")
      .getAttribute("data-rail") === "collapsed";
  }

  function setRail(collapsed, remember) {
    var shell = document.getElementById("shell");
    shell.setAttribute("data-rail", collapsed ? "collapsed" : "open");
    var b = document.getElementById("railTog");
    if (b) {
      b.setAttribute("aria-expanded", String(!collapsed));
      b.setAttribute("title", (collapsed ? "Expand" : "Collapse") +
                              " the sidebar  [");
      b.innerHTML = collapsed ? "&#9654;" : "&#9776;";
    }
    if (remember) {
      /* Storage is unavailable in private windows on some browsers, and a
         layout preference is not worth an exception. */
      try { localStorage.setItem(RAIL_KEY, collapsed ? "1" : "0"); }
      catch (e) { /* the choice simply will not persist */ }
    }
    /* The chart measures its container when it draws and keeps the old
       width otherwise, so it is told again once the column has finished
       moving. Anything else on the page reflows on its own. */
    setTimeout(resizeChart, 240);
  }

  function toggleRail() { setRail(!railCollapsed(), true); }

  function initRail() {
    var saved = null;
    try { saved = localStorage.getItem(RAIL_KEY); } catch (e) { saved = null; }
    /* Below the layout's own breakpoint the width matters more than the
       labels do, so a first visit there starts folded. */
    var narrow = window.matchMedia
      ? window.matchMedia("(max-width: 860px)").matches : false;
    setRail(saved == null ? narrow : saved === "1", false);
  }

  function renderChrome() {
    var inIndia = state.page === "india-index";
    document.getElementById("idxTabs").style.display = inIndia ? "" : "none";
    document.getElementById("aTabs").style.display = inIndia ? "" : "none";

    }).join("");

    document.getElementById("railAnalysis").innerHTML = PAGES.map(function (p) {
      return '<button class="rail-item" data-page="' + p.key + '" aria-current="' +
