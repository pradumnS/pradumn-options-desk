  <div class="drawer-hd">
    <div>
      <h3 id="drawerTitle">&mdash;</h3>
      <div class="sub" id="drawerSub">&mdash;</div>
    </div>
    <button class="xbtn" id="drawerClose" type="button" aria-label="Close strike detail">&times;</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<script>
(function () {
  "use strict";

  /* ==========================================================
     1. DATA LAYER &mdash; reads static JSON written by the daily job.
        The page never contacts NSE and never computes analytics
        it could get wrong; every number here was produced by
        compute.py and stored before the page loaded.
     ========================================================== */
  var SNAPSHOT = "snapshot/";
  var INDICES = [];          /* filled from manifest + per-index files */
  var ACCURACY = {};
  var MANIFEST = {};
  var STRIP = [];            /* market.json -- rendered once, never re-rendered */
  var WATCH = [];            /* watchlist.json */
  var MHIST = {};            /* history.json -- per-day audit trail */
  var TECHFUND = {};         /* techfund.json -- note + valuation */
  var STOCKS = {};           /* stocks.json  -- index constituents */

  function getJson(name) {
    return fetch(SNAPSHOT + name, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error(name + " -> HTTP " + r.status);
      return r.json();
    });
  }

  var VIEWS = [
    { key:"overview",  label:"Overview" },
    { key:"strategy",  label:"Direction &amp; strategy" },
    { key:"model",     label:"Model data" },
    { key:"watchlist", label:"Watchlist" },
    { key:"stocks",    label:"NIFTY 50 stocks" },
    { key:"chain",     label:"Option chain &amp; OI" },
    { key:"technicals",label:"Tech-Fund" },
    { key:"history",   label:"History" }
  ];

  /* ==========================================================
     2. NORMALISE &mdash; snapshot JSON into the shape the views use.
        OI, change-in-OI and volume arrive as raw contract counts
        and are converted to lakh once, here, so no view has to
        remember which unit it is holding.
     ========================================================== */
  var LAKH = 1e5;

  function normLeg(b) {
    if (!b) return null;
    return {
      ltp: b.ltp, prevClose: b.prevClose, chg: b.chg, chgPct: b.chgPct,
      oi: (b.oi || 0) / LAKH, chgOi: (b.chgOi || 0) / LAKH,
      vol: (b.vol || 0) / LAKH, iv: b.iv,
      bid: b.bid, ask: b.ask, buildup: b.buildup,
      /* Present only for sessions rebuilt from the F&O bhavcopy. Left null
         where the live chain was the source, so the drawer can say so
         rather than repeat LTP four times. */
      o: b.o, h: b.h, l: b.l, c: b.c, settle: b.settle,
      turnover: 0
    };
  }

  /* A strike can arrive with only one side quoted. Fill the gap with an
     explicit empty leg so views never have to test for null. */
  var EMPTY_LEG = {
    ltp: 0, prevClose: 0, chg: 0, chgPct: 0, oi: 0, chgOi: 0, vol: 0,
    iv: null, bid: 0, ask: 0, buildup: null, o: 0, h: 0, l: 0, c: 0, turnover: 0
  };

  function normalise(d) {
    var rows = (d.rows || []).map(function (r) {
      return {
        strike: r.strike,
        ce: normLeg(r.ce) || Object.assign({}, EMPTY_LEG),
        pe: normLeg(r.pe) || Object.assign({}, EMPTY_LEG)
      };
    });

    var o = d.ohlc || {};
    var cfg = {
      key: d.index, label: d.label, lot: d.lot, step: d.step,
      spot: d.spot, prevClose: o.prevClose || d.spot,
      open: o.open || d.spot, high: o.high || d.spot, low: o.low || d.spot,
      vix: (d.vix && d.vix.value) || 0, vixChg: (d.vix && d.vix.chgPct) || 0,
      expiry: d.expiry, iv: d.atmIv
    };

    var maxOi = rows.reduce(function (mx, r) {
      return Math.max(mx, r.ce ? r.ce.oi : 0, r.pe ? r.pe.oi : 0);
    }, 0) || 1;

    var cands = (d.candidates || []).map(function (c) {
      return {
        side: c.side, strike: c.strike, delta: c.delta, pop: c.pop,
        credit: c.ltp, creditRs: c.credit_rs, rom: c.rom_pct,
        margin: c.margin, liquid: c.verdict !== "illiquid",
        leg: { oi: (c.oi || 0) / LAKH, vol: (c.vol || 0) / LAKH, iv: c.iv },
        verdict: VERDICT[c.verdict] || { c: "no", t: c.verdict }
      };
    });

    return {
      cfg: cfg, rows: rows, atm: d.atm, maxOi: maxOi,
      totC: (d.totalCeOi || 0) / LAKH, totP: (d.totalPeOi || 0) / LAKH,
      pcr: d.pcr, maxPain: d.maxPain,
      callWall: d.callWall, putWall: d.putWall,
      sd1: d.sd1, range1: d.range1sd, range2: d.range2sd,
      sdNext: d.sdNext, rangeNext1: d.rangeNext1sd,
      rangeNextCalibrated: d.rangeNextCalibrated, bandFactor: d.bandFactor,
      an: d.analysis || null,
      dte: d.dte, t: Math.max(d.dte, 0.5) / 365,
      atmIv: d.atmIv, tradeDate: d.tradeDate, nseTimestamp: d.nseTimestamp,
      sessionsStored: d.sessionsStored, nStrikes: d.nStrikes,
      cands: cands,
      piv: pivots(cfg.high, cfg.low, cfg.spot),
      hist: (d.history || []).map(function (h) {
        return { date: new Date(h.date + "T00:00:00Z"), close: h.close,
                 pcr: h.pcr, mp: h.maxPain, vix: h.vix, atmIv: h.atmIv,
                 o: h.o, h: h.h, l: h.l, c: h.c,
                 chgPct: h.chgPct, volume: h.volume, turnover: h.turnover };
      })
    };
  }

  var VERDICT = {
    candidate:    { c: "go",   t: "Candidate" },
    marginal:     { c: "mid",  t: "Marginal" },
    thin_premium: { c: "mid",  t: "Thin premium" },
    too_close:    { c: "risk", t: "Too close" },
    illiquid:     { c: "no",   t: "Illiquid" }
  };

  function classify(chgPct, chgOi) {
    if (chgOi >= 0 && chgPct >= 0) return { c:"lb", t:"Long build-up" };
    if (chgOi >= 0 && chgPct <  0) return { c:"sb", t:"Short build-up" };
    if (chgOi <  0 && chgPct >= 0) return { c:"sc", t:"Short covering" };
    return { c:"lu", t:"Long unwinding" };
  }

  function pivots(h, l, c) {
    var p = (h + l + c) / 3, rng = h - l;
    return { p:p, r1:2*p-l, s1:2*p-h, r2:p+rng, s2:p-rng, r3:h+2*(p-l), s3:l-2*(h-p) };
  }

  var MODEL = {};

  /* ==========================================================
     3. FORMATTERS
     ========================================================== */
  /* NSE reports no IV for illiquid strikes, and a chain can carry a strike
     with only one leg. Formatters absorb that rather than every call site
     guarding for it \u2014 one unguarded null used to take the whole page down. */
  var nf = function (v, d) {
    if (v === null || v === undefined) return "\u2014";
    v = Number(v);
    if (!isFinite(v)) return "\u2014";
    return v.toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d });
  };
  var n0 = function (v) { return nf(v, 0); };
  var n2 = function (v) { return nf(v, 2); };
  var sgn = function (v, d) {
    if (v === null || v === undefined || !isFinite(Number(v))) return "\u2014";
    return (v >= 0 ? "+" : "\u2212") + nf(Math.abs(v), d);
  };
  var cls = function (v) {
    if (v === null || v === undefined || !isFinite(Number(v))) return "neu";
    return v >= 0 ? "pos" : "neg";
  };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" })[c]; }); };
  var DT = function (d) { return d.toLocaleDateString("en-GB", { day:"2-digit", month:"short" }); };

  /* ==========================================================
     4. STATE
     ========================================================== */
  var state = { idx: "NIFTY", view: "overview", strike: null,
                wl: null, wlExpiry: 0 };

  /* ==========================================================
     5. RENDER &mdash; chrome
     ========================================================== */
  function renderChrome() {
    document.getElementById("idxTabs").innerHTML = INDICES.map(function (c) {
      return '<button class="idx-tab" role="tab" data-idx="' + c.key + '" aria-selected="' +
        (c.key === state.idx) + '">' + esc(c.label) + "</button>";
    }).join("");

    document.getElementById("aTabs").innerHTML = VIEWS.map(function (v) {
      return '<button class="atab" role="tab" data-view="' + v.key + '" aria-selected="' +
        (v.key === state.view) + '">' + v.label + "</button>";
    }).join("");

    document.getElementById("railAnalysis").innerHTML = VIEWS.map(function (v) {
      return '<button class="rail-item" data-view="' + v.key + '" aria-current="' +
        (v.key === state.view) + '">' + v.label + "</button>";
    }).join("");

    var rl = document.getElementById("railLearn");
    if (rl) rl.setAttribute("aria-current", state.view === "learning");

    document.getElementById("railIndices").innerHTML = INDICES.map(function (c) {
      var m = MODEL[c.key], chg = (c.spot - c.prevClose) / c.prevClose * 100;
      return '<button class="rail-item" data-idx="' + c.key + '" aria-current="' + (c.key === state.idx) + '">' +
        "<span>" + esc(c.label) + "</span>" +
        '<span class="spark ' + cls(chg) + '" data-chart="' + esc(c.label) +
          '" title="chart">' + sgn(chg, 2) + "%</span></button>";
    }).join("");
  }

  /* ==========================================================
     6. RENDER &mdash; views
     ========================================================== */
  function ladder(m) {
    var rows = m.rows.slice().reverse();
    return rows.map(function (r) {
      var k = [];
      if (r.strike === m.callWall) k.push("wall-c");
      if (r.strike === m.putWall) k.push("wall-p");
      if (r.strike === m.atm) k.push("spot");
      if (r.strike === m.maxPain) k.push("mp");
      var flag = "";
      if (r.strike === m.atm) flag = '<span class="flag spot">Spot ' + n0(m.cfg.spot) + "</span>";
      else if (r.strike === m.maxPain) flag = '<span class="flag mp">Max pain</span>';
      else if (r.strike === m.callWall) flag = '<span class="flag cw">Call wall</span>';
      else if (r.strike === m.putWall) flag = '<span class="flag mp" style="color:var(--puts);border-color:var(--puts)">Put wall</span>';

      return '<button class="rung ' + k.join(" ") + '" data-strike="' + r.strike +
        '" data-rung=\'' + JSON.stringify({
          k: n0(r.strike),
          ceOi: n2(r.ce.oi), peOi: n2(r.pe.oi),
          ceChg: sgn(r.ce.chgOi, 2), peChg: sgn(r.pe.chgOi, 2),
          ceUp: r.ce.chgOi >= 0, peUp: r.pe.chgOi >= 0,
          ceLtp: n2(r.ce.ltp), peLtp: n2(r.pe.ltp),
          ceIv: r.ce.iv != null ? n2(r.ce.iv) + "%" : "\u2014",
          peIv: r.pe.iv != null ? n2(r.pe.iv) + "%" : "\u2014",
          pcr: r.ce.oi ? n2(r.pe.oi / r.ce.oi) : "\u2014",
          dist: sgn(r.strike - m.cfg.spot, 0)
        }).replace(/'/g, "&#39;") + "'>" +
        '<span class="side l"><span class="barval">' + n1(r.ce.oi) + '</span><span class="bartrack">' +
          '<span class="barfill" style="width:' + (r.ce.oi / m.maxOi * 100).toFixed(1) + '%"></span></span></span>' +
        '<span class="strike">' + n0(r.strike) + "</span>" +
        '<span class="side r"><span class="bartrack">' +
          '<span class="barfill" style="width:' + (r.pe.oi / m.maxOi * 100).toFixed(1) + '%"></span></span>' +
          '<span class="barval">' + n1(r.pe.oi) + "</span></span>" + flag + "</button>";
    }).join("");
  }
  function n1(v) { return nf(v, 1); }

  function verdict(m) {
    var c = m.cfg;
    var mpGap = c.spot - m.maxPain;
    var pcr = m.pcr;
    var call, conf;
    if (pcr > 1.15 && mpGap > 0) { call = "Bullish,<br>supported"; conf = 72; }
    else if (pcr < 0.85) { call = "Bearish<br>pressure"; conf = 68; }
    else { call = "Range-bound,<br>" + (mpGap > 0 ? "upward tilt" : "downward tilt"); conf = 61; }

    var d = [
      ["=", "neu", "PCR " + n2(pcr), pcr > 1.1 ? "Put writers dominant \u2014 <b>supportive</b> tone." :
        pcr < 0.9 ? "Call writers dominant \u2014 <b>capped</b> upside." :
        "Neutral. Put and call writing near balance \u2014 <b>no directional conviction</b> from the ratio alone."],
      [mpGap > 0 ? "\u2193" : "\u2191", mpGap > 0 ? "neg" : "pos", "Max pain",
        "Spot sits <b>" + n0(Math.abs(mpGap)) + " pts " + (mpGap > 0 ? "above" : "below") +
        "</b> max pain " + n0(m.maxPain) + " \u2014 mild pull " + (mpGap > 0 ? "lower" : "higher") + " into expiry."],
      ["\u2191", "pos", "OI walls",
        "Put base at <b>" + n0(m.putWall) + "</b>; heaviest call wall at <b>" + n0(m.callWall) + "</b>. Expected range between them."],
      [c.vixChg < 0 ? "\u2191" : "\u2193", c.vixChg < 0 ? "pos" : "neg", "Volatility",
        "India VIX <b>" + n2(c.vix) + "</b>, " + sgn(c.vixChg, 2) + "% \u2014 " +
        (c.vixChg < 0 ? "no stress bid. Supports range persistence." : "creeping higher. Watch for expansion.")]
    ];

    return '<section class="card verdict"><div class="verdict-main">' +
      '<div class="verdict-eyebrow">Positioning read</div>' +
      '<div class="verdict-call">' + call + "</div>" +
      '<div class="conf"><div class="conf-track"><div class="conf-fill" style="width:' + conf + '%"></div></div>' +
      '<div class="conf-val">' + conf + "% confidence</div></div>" +
      '<div class="kpi-m">Expiry ' + esc(c.expiry) + " \u00b7 4 sessions left</div></div>" +
      '<div class="drivers">' + d.map(function (x) {
        return '<div class="driver"><div class="ico ' + x[1] + '">' + x[0] + '</div>' +
          '<div class="k">' + x[2] + '</div><div class="v">' + x[3] + "</div></div>";
      }).join("") + "</div></section>";
  }

  function kpis(m) {
    var c = m.cfg, chg = c.spot - c.prevClose, chgP = chg / c.prevClose * 100;
    var mpGap = c.spot - m.maxPain;
    var t = [
      ["Spot close", n0(Math.floor(c.spot)) + '<span style="font-size:14px;color:var(--ink-3)">.' +
        c.spot.toFixed(2).split(".")[1] + "</span>",
        '<span class="' + cls(chg) + '">' + sgn(chg, 2) + " &nbsp;" + sgn(chgP, 2) + "%</span>"],
      ["Day range", '<span style="font-size:15px">' + n0(c.low) + " &ndash; " + n0(c.high) + "</span>",
        "O " + n0(c.open) + " \u00b7 PC " + n2(c.prevClose)],
      ["Put / call ratio", n2(m.pcr), "5d avg " + n2(m.pcr * 0.96) + " \u00b7 neutral 0.9\u20131.1"],
      ['<span class="swatch" style="background:var(--maxpain)"></span> Max pain', n0(m.maxPain),
        "spot " + sgn(mpGap, 0) + " pts from strike"],
      ["India VIX", n2(c.vix), '<span class="' + cls(-c.vixChg) + '">' + sgn(c.vixChg, 2) + "%</span> \u00b7 20d band"],
      ["Total OI", n1(m.totC + m.totP) + '<span style="font-size:13px;color:var(--ink-3)">L</span>',
        "C " + n1(m.totC) + "L \u00b7 P " + n1(m.totP) + "L"]
    ];
    return '<section class="kpis">' + t.map(function (x) {
      return '<div class="card kpi"><div class="kpi-k">' + x[0] + '</div><div class="kpi-v">' + x[1] +
        '</div><div class="kpi-m">' + x[2] + "</div></div>";
    }).join("") + "</section>";
  }

  /* A line needs two points. With one stored session the honest output is a
     note about how many more are needed, not a chart of a single dot. */
  function needMore(have, need, what) {
    return '<div class="caution"><p><b>' + have + " of " + need + " sessions stored.</b> " +
      esc(what) + " appears once the daily job has run " + (need - have) +
      " more time" + (need - have === 1 ? "" : "s") + ".</p></div>";
  }

  function DTS(d) { return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" }); }

  function chartWrap(svg, series) {
    return '<div class="ch-wrap" data-series=\'' +
      JSON.stringify(series).replace(/'/g, "&#39;") + "'>" + svg +
      '<div class="ch-cross"></div><div class="ch-dot"></div><div class="ch-tip"></div></div>';
  }

  function sparkSvg(m) {
    var h = m.hist.slice().reverse().filter(function (x) { return x.close != null; });
    if (h.length < 2) return needMore(h.length, 2, "The price history chart");

    var vals = h.map(function (x) { return x.close; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), rng = hi - lo || 1;
    var maxVol = h.reduce(function (mx, x) { return Math.max(mx, x.volume || 0); }, 0);
    var pts = [], coords = [];
    h.forEach(function (x, i) {
      var px = i / (h.length - 1) * 320, py = 82 - (x.close - lo) / rng * 70;
      coords.push(px.toFixed(1) + "," + py.toFixed(1));
      pts.push({
        x: px, y: py, date: DTS(x.date), iso: x.date, big: n2(x.close),
        chg: x.chgPct != null ? sgn(x.chgPct, 2) + "%" : null,
        chgUp: x.chgPct != null ? x.chgPct >= 0 : null,
        rows: [["Open", n2(x.o)], ["High", n2(x.h)], ["Low", n2(x.l)], ["Close", n2(x.c)]],
        vol: x.volume ? {
          pct: maxVol ? (x.volume / maxVol * 100) : 0,
          label: n1(x.volume / 1e7) + " Cr sh" +
                 (x.turnover ? "  &middot;  &#8377;" + n0(x.turnover) + " Cr" : "")
        } : null
      });
    });
    var last = pts[pts.length - 1];

    var svg = '<svg viewBox="0 0 330 104" role="img" aria-label="' + esc(m.cfg.label) +
      " close over the last " + h.length + ' sessions.">' +
      '<line class="gridline" x1="0" y1="12" x2="330" y2="12"></line>' +
      '<line class="gridline" x1="0" y1="47" x2="330" y2="47"></line>' +
      '<line class="gridline" x1="0" y1="82" x2="330" y2="82"></line>' +
      '<text class="axis" x="0" y="9">' + n0(hi) + "</text>" +
      '<text class="axis" x="0" y="93">' + n0(lo) + "</text>" +
      '<polygon fill="var(--calls-dim)" points="' + coords.join(" ") + ' 320,82 0,82"></polygon>' +
      '<polyline fill="none" stroke="var(--calls)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="' +
        coords.join(" ") + '"></polyline>' +
      '<circle cx="' + last.x.toFixed(1) + '" cy="' + last.y.toFixed(1) +
        '" r="3.4" fill="var(--calls)" stroke="var(--surface)" stroke-width="2"></circle>' +
      "</svg>";

    return chartWrap(svg, { pts: pts, color: "var(--calls)",
                            vbWidth: 330, vbTop: 0, vbHeight: 104 });
  }

  function pcrSvg(m) {
    var h = m.hist.slice().reverse().filter(function (x) { return x.pcr != null; });
    if (h.length < 2) return needMore(h.length, 2, "The PCR trend");

    var pts = [], coords = [];
    h.forEach(function (x, i) {
      var px = i / (h.length - 1) * 330;
      var py = 82 - Math.min(1, Math.max(0, (x.pcr - 0.8) / 0.5)) * 70;
      coords.push(px.toFixed(1) + "," + py.toFixed(1));
      pts.push({
        x: px, y: py, date: DTS(x.date), iso: x.date, big: n2(x.pcr),
        chg: x.pcr > 1.1 ? "put-heavy" : x.pcr < 0.9 ? "call-heavy" : "neutral",
        chgUp: x.pcr >= 1,
        rows: [["Close", n2(x.close)], ["Max pain", n0(x.mp)],
               ["ATM IV", x.atmIv != null ? n2(x.atmIv) + "%" : "&mdash;"],
               ["India VIX", n2(x.vix)]],
        vol: null
      });
    });
    var last = pts[pts.length - 1];

    var svg = '<svg viewBox="0 0 330 104" role="img" aria-label="Put-call ratio over ' +
      h.length + ' sessions.">' +
      '<rect x="0" y="33" width="330" height="28" fill="var(--surface-2)"></rect>' +
      '<line class="gridline" x1="0" y1="54" x2="330" y2="54" stroke-dasharray="3 3"></line>' +
      '<text class="axis" x="0" y="30">1.10</text><text class="axis" x="0" y="74">0.90</text>' +
      '<polyline fill="none" stroke="var(--puts)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="' +
        coords.join(" ") + '"></polyline>' +
      '<circle cx="' + last.x.toFixed(1) + '" cy="' + last.y.toFixed(1) +
        '" r="3.4" fill="var(--puts)" stroke="var(--surface)" stroke-width="2"></circle>' +
      "</svg>";

    return chartWrap(svg, { pts: pts, color: "var(--puts)",
                            vbWidth: 330, vbTop: 0, vbHeight: 104 });
  }

  function viewOverview(m) {
    return verdict(m) + kpis(m) +
      '<section class="card"><div class="card-hd"><h2>Open interest by strike</h2>' +
      '<span class="sub">' + esc(m.cfg.expiry) + " \u00b7 lakh contracts</span>" +
      '<div class="right"><span class="sub">Click a strike for detail</span></div></div>' +
      '<div class="ladder-wrap tall"><div class="ladder"><div class="ladder-head">' +
      '<div class="l">&larr; Call OI (resistance)</div><div class="c">Strike</div>' +
      '<div class="r">Put OI (support) &rarr;</div></div>' + ladder(m) +
      '<div class="legend">' +
      '<span><span class="swatch" style="background:var(--calls)"></span> Call OI</span>' +
      '<span><span class="swatch" style="background:var(--puts)"></span> Put OI</span>' +
      '<span><span class="swatch" style="background:var(--maxpain)"></span> Max pain strike</span>' +
      "<span>Ringed bar = heaviest wall on that side</span></div></div></div></section>" +
      '<div class="two">' +
      '<section class="card"><div class="card-hd"><h2>' + esc(m.cfg.label) + " &mdash; 15 sessions</h2>" +
      '<span class="sub">daily close</span></div><div class="chart-body">' + sparkSvg(m) + "</div></section>" +
      '<section class="card"><div class="card-hd"><h2>PCR trend</h2><span class="sub">15 sessions</span>' +
      '<div class="right"><span class="kpi-m">neutral band 0.9 &ndash; 1.1</span></div></div>' +
      '<div class="chart-body">' + pcrSvg(m) + "</div></section></div>" + pipeline(m);
  }

  /* The chain and the build-up were two tabs reading the same rows. Only
     "Chg OI" appeared in both, so merging them costs nothing and stops you
     paging back and forth to line a strike's OI up against what that OI
     was doing. Column order runs outside-in on each side: what the strike
     holds, then what changed, then what it costs. */
  function viewChain(m) {
    var rows = m.rows.slice().reverse().map(function (r) {
      var c = r.strike < m.cfg.spot ? " itm-c" : "";
      var p = r.strike > m.cfg.spot ? " itm-p" : "";
      var bc = classify(r.ce.chgPct, r.ce.chgOi);
      var bp = classify(r.pe.chgPct, r.pe.chgOi);
      return '<tr class="clickable' + (r.strike === m.atm ? " atm" : "") +
        '" data-strike="' + r.strike + '">' +
        '<td class="lft' + c + '"><span class="pill ' + bc.c + '">' + bc.t + "</span></td>" +
        '<td class="' + c + '">' + n2(r.ce.oi) + "</td>" +
        '<td class="' + c + " " + cls(r.ce.chgOi) + '">' + sgn(r.ce.chgOi, 2) + "</td>" +
        '<td class="' + c + '">' + n1(r.ce.vol) + "L</td>" +
        '<td class="' + c + '">' + n1(r.ce.iv) + "</td>" +
        '<td class="' + c + '">' + n2(r.ce.ltp) + "</td>" +
        '<td class="' + c + " " + cls(r.ce.chgPct) + '">' + sgn(r.ce.chgPct, 1) + "%</td>" +
        '<td class="strike-cell">' + n0(r.strike) + "</td>" +
        '<td class="' + p + " " + cls(r.pe.chgPct) + '">' + sgn(r.pe.chgPct, 1) + "%</td>" +
        '<td class="' + p + '">' + n2(r.pe.ltp) + "</td>" +
        '<td class="' + p + '">' + n1(r.pe.iv) + "</td>" +
        '<td class="' + p + '">' + n1(r.pe.vol) + "L</td>" +
        '<td class="' + p + " " + cls(r.pe.chgOi) + '">' + sgn(r.pe.chgOi, 2) + "</td>" +
        '<td class="' + p + '">' + n2(r.pe.oi) + "</td>" +
        '<td class="lft' + p + '"><span class="pill ' + bp.c + '">' + bp.t + "</span></td></tr>";
    }).join("");

    return chainAnalysis(m) +
      '<section class="card"><div class="card-hd"><h2>Option chain &amp; OI</h2>' +
      '<span class="sub">' + esc(m.cfg.label) + " \u00b7 " + esc(m.cfg.expiry) + "</span>" +
      '<div class="right"><span class="kpi-m">OI and volume in lakh &middot; ' +
      "shaded = in-the-money &middot; click a row to drill in</span></div></div>" +
      '<div class="tablewrap tall"><table class="dt chain"><thead>' +
      '<tr class="grp-hd"><th class="grp-c lft" colspan="7">CALLS</th>' +
      '<th>&nbsp;</th><th class="grp-p lft" colspan="7">PUTS</th></tr>' +
      "<tr>" +
      '<th class="grp-c lft">Action</th><th class="grp-c">OI</th>' +
      '<th class="grp-c">Chg OI</th><th class="grp-c">Volume</th>' +
      '<th class="grp-c">IV</th><th class="grp-c">LTP</th><th class="grp-c">Chg LTP</th>' +
      '<th style="text-align:center">Strike</th>' +
      '<th class="grp-p">Chg LTP</th><th class="grp-p">LTP</th><th class="grp-p">IV</th>' +
      '<th class="grp-p">Volume</th><th class="grp-p">Chg OI</th>' +
      '<th class="grp-p">OI</th><th class="grp-p lft">Action</th>' +
      "</tr></thead><tbody>" + rows + "</tbody></table></div></section>" +
      chainLegend(m);
  }

  /* Every column, in the order it appears. A table nobody can read is a
     table nobody uses, and the four build-up quadrants are the part people
     most often get backwards. */
  function chainLegend(m) {
    function row(term, text) {
      return '<tr><td class="lft"><b>' + term + '</b></td>' +
             '<td class="lft">' + text + "</td></tr>";
    }
    var cols =
      row("Action", "The four quadrants below, computed from that strike's " +
          "change in OI against its change in premium.") +
      row("OI", "Open interest &mdash; contracts still held at that strike, " +
          "in lakh. Not volume: volume counts trades made today, OI counts " +
          "positions that survived the day.") +
      row("Chg OI", "The day's move in open interest. Positive means new " +
          "positions were opened at that strike; negative means positions " +
          "were closed.") +
      row("Volume", "Contracts traded today, in lakh. High volume with " +
          "little OI change means intraday churn rather than commitment.") +
      row("IV", "Implied volatility for that strike, annualised. The market's " +
          "price for uncertainty. Rising IV makes every option dearer " +
          "regardless of direction.") +
      row("LTP", "Last traded price of the contract, in rupees per unit. " +
          "Multiply by the lot (" + m.cfg.lot + ") for the rupee value.") +
      row("Chg LTP", "The day's percentage move in that premium. Read it " +
          "against Chg OI &mdash; the pair is what the Action column means.") +
      row("Strike", "The price at which the option can be exercised. The " +
          "highlighted row is the strike nearest spot.") +
      row("Shading", "Shaded cells are in-the-money: calls below spot, puts " +
          "above it. Their premium is mostly intrinsic value.");

    var quad =
      row("Long build-up", "OI <b>up</b>, premium <b>up</b>. Fresh buyers " +
          "entering. Conviction in that direction.") +
      row("Short build-up", "OI <b>up</b>, premium <b>down</b>. Fresh writers " +
          "selling that strike. It becomes a barrier &mdash; and as a seller, " +
          "this is the company you are keeping.") +
      row("Short covering", "OI <b>down</b>, premium <b>up</b>. Writers buying " +
          "back. The barrier is breaking, and that is how a level fails.") +
      row("Long unwinding", "OI <b>down</b>, premium <b>down</b>. Buyers " +
          "leaving. Interest draining from the strike.");

    function tbl(inner) {
      return '<div class="tablewrap"><table class="dt legend"><tbody>' +
             inner + "</tbody></table></div>";
    }

    return '<section class="card"><div class="card-hd">' +
      "<h2>How to read this table</h2>" +
      '<span class="sub">every column, and the four quadrants</span></div>' +
      tbl(cols) +
      '<div class="card-hd" style="margin-top:14px"><h2>The Action column</h2>' +
      '<span class="sub">open interest against premium</span></div>' +
      tbl(quad) +
      '<div class="caution"><p><b>Open interest is a two-sided number.</b> ' +
      "Every contract has a buyer and a writer, so OI rising says a position " +
      "was opened, never who was right. What gives it meaning is the premium " +
      "moving with it &mdash; that is the whole content of the Action column. " +
      "And none of it is a forecast: this desk grades the OI walls, and the " +
      "call wall has held on 92.9% of graded sessions while max pain has " +
      "resolved on 50.2%, which is a coin flip.</p></div></section>";
  }

  /* The numbers you would otherwise have to read off the table yourself. */
  function chainAnalysis(m) {
    var rows = m.rows || [];
    var ceOi = 0, peOi = 0, ceChg = 0, peChg = 0, ceVol = 0, peVol = 0;
    var counts = { "Long build-up": 0, "Short build-up": 0,
                   "Short covering": 0, "Long unwinding": 0 };
    rows.forEach(function (r) {
      ceOi += r.ce.oi || 0; peOi += r.pe.oi || 0;
      ceChg += r.ce.chgOi || 0; peChg += r.pe.chgOi || 0;
      ceVol += r.ce.vol || 0; peVol += r.pe.vol || 0;
      [classify(r.ce.chgPct, r.ce.chgOi), classify(r.pe.chgPct, r.pe.chgOi)]
        .forEach(function (b) { if (counts[b.t] != null) counts[b.t]++; });
    });

    var pcr = m.pcr;
    var pcrRead = pcr > 1.15 ? "put writers dominant \u2014 supportive"
                : pcr < 0.85 ? "call writers dominant \u2014 capped upside"
                : "near balance \u2014 no directional conviction";

    var netRead = (ceChg > peChg)
      ? "Writers added more to calls than puts, which caps rallies before it supports dips."
      : "Writers added more to puts than calls, which builds a floor before it caps upside.";

    var top = Object.keys(counts).sort(function (a, b) {
      return counts[b] - counts[a];
    })[0];

    return '<section class="card"><div class="card-hd"><h2>What the chain says</h2>' +
      '<span class="sub">' + esc(m.cfg.expiry) + " \u00b7 " + rows.length +
      " strikes</span>" +
      '<div class="right"><span class="kpi-m">computed from the table below</span></div></div>' +
      '<div class="probs">' +
        pr("Put / call ratio", n2(pcr), "", pcrRead) +
        pr("Call wall", n0(m.callWall), "", "heaviest call OI \u00b7 resistance") +
        pr("Put wall", n0(m.putWall), "", "heaviest put OI \u00b7 support") +
        pr("Max pain", n0(m.maxPain), "", "weak signal \u00b7 50.2% historically") +
      "</div>" +
      '<div class="probs">' +
        '<div class="prob"><div class="prob-k">Call OI</div><div class="prob-v">' +
          n1(ceOi) + 'L</div><div class="kpi-m">' + sgn(ceChg, 1) + "L today</div></div>" +
        '<div class="prob"><div class="prob-k">Put OI</div><div class="prob-v">' +
          n1(peOi) + 'L</div><div class="kpi-m">' + sgn(peChg, 1) + "L today</div></div>" +
        '<div class="prob"><div class="prob-k">Volume</div><div class="prob-v">' +
          n1(ceVol + peVol) + 'L</div><div class="kpi-m">C ' + n1(ceVol) +
          "L \u00b7 P " + n1(peVol) + "L</div></div>" +
        '<div class="prob"><div class="prob-k">ATM IV</div><div class="prob-v">' +
          n2(m.atmIv) + '%</div><div class="kpi-m">strike ' + n0(m.atm) + "</div></div>" +
      "</div>" +
      '<div class="caution"><p><b>Positioning.</b> ' + netRead +
      " Across " + (rows.length * 2) + " legs the commonest pattern is <b>" +
      top + "</b> (" + counts[top] + " legs): " +
      "long build-up " + counts["Long build-up"] +
      " \u00b7 short build-up " + counts["Short build-up"] +
      " \u00b7 short covering " + counts["Short covering"] +
      " \u00b7 long unwinding " + counts["Long unwinding"] + ". " +
      "The expected range implied by the walls is <b>" + n0(m.putWall) +
      "\u2013" + n0(m.callWall) + "</b>.</p></div></section>";
  }

  /* ---------------------------------------------------------------
     Tech-Fund: the fundamental half, and today's note.

     The option chain prices the next few sessions; P/E and dividend yield
     price the next several years. A raw multiple says nothing on its own,
     so every figure is shown against its own percentile -- and the reading
     inverts for yield, where HIGH is cheap and low is dear.
     --------------------------------------------------------------- */
  function pctBar(pct, cheapLow) {
    if (pct == null) return "";
    var cheap = cheapLow ? pct <= 33 : pct >= 67;
    var dear = cheapLow ? pct >= 67 : pct <= 33;
    var col = cheap ? "var(--up)" : dear ? "var(--down)" : "var(--maxpain)";
    return '<div class="pbar"><i style="left:' + pct.toFixed(1) +
           '%;background:' + col + '"></i></div>';
  }

  function fundBlock(m) {
    var d = (TECHFUND || {})[m.cfg.key] || {};
    var v = d.valuation;
    if (!v) return "";

    var rows = [
      ["P/E", v.pe, v.pe_pctile, v.pe_min, v.pe_max, true,
       "earnings multiple \u2014 low is cheap"],
      ["P/B", v.pb, v.pb_pctile, v.pb_min, v.pb_max, true,
       "price to book \u2014 low is cheap"],
      ["Dividend yield", v.div_yield, v.div_yield_pctile,
       v.div_yield_min, v.div_yield_max, false,
       "HIGH is cheap \u2014 this one reads the other way"]
    ];

    var body = rows.map(function (r) {
      if (r[1] == null) return "";
      return '<tr><td class="lft"><b>' + r[0] + "</b></td>" +
        "<td>" + n2(r[1]) + (r[0] === "Dividend yield" ? "%" : "") + "</td>" +
        "<td>" + (r[2] == null ? "\u2014" : n0(r[2]) + "th") + "</td>" +
        "<td>" + n2(r[3]) + " \u2013 " + n2(r[4]) + "</td>" +
        '<td class="lft" data-pt="' + esc(JSON.stringify({
            t: r[0], s: "valuation against its own history",
            big: n2(r[1]) + (r[0] === "Dividend yield" ? "%" : ""),
            rows: [["Now", n2(r[1])], ["Percentile", r[2] == null ? null : n0(r[2]) + "th"],
                   ["Lowest seen", n2(r[3])], ["Highest seen", n2(r[4])],
                   ["Sessions", v.pe_n]],
            note: r[5]
              ? "Low is cheap for this measure."
              : "<b>High is cheap</b> for dividend yield &mdash; it reads the " +
                "opposite way to the other two."
          })) + '">' + pctBar(r[2], r[5]) + "</td>" +
        '<td class="lft"><span class="kpi-m">' + r[6] + "</span></td></tr>";
    }).join("");

    var erp = v.equity_risk_premium, erpNote = "";
    if (erp != null) {
      erpNote = '<div class="caution"><p><b>Earnings yield ' +
        n2(v.earnings_yield) + "% against a 6.50% risk-free rate is an equity " +
        "risk premium of " + sgn(erp, 2) + "pp.</b> " +
        (erp < 0
          ? "Negative: the index earns less than doing nothing. That times " +
            "nothing \u2014 it can stay negative for years \u2014 but it is the " +
            "condition in which a shock has least valuation support beneath it."
          : "Positive: equities are paid for the risk taken over the " +
            "risk-free alternative.") + "</p></div>";
    }

    return '<section class="card"><div class="card-hd"><h2>Valuation</h2>' +
      '<span class="sub">' + esc(v.trade_date) + " \u00b7 exchange-published</span>" +
      '<div class="right"><span class="kpi-m">percentile over ' +
      (v.pe_n || 0) + " stored sessions</span></div></div>" +
      '<div class="tablewrap"><table class="dt"><thead><tr>' +
      '<th class="lft">Measure</th><th>Now</th><th>Pctile</th><th>Range</th>' +
      '<th class="lft">&nbsp;</th><th class="lft">&nbsp;</th>' +
      "</tr></thead><tbody>" + body + "</tbody></table></div>" + erpNote +
      "</section>";
  }

  function noteBlock(m) {
    var d = (TECHFUND || {})[m.cfg.key] || {};
    var n = d.note;
    if (!n) {
      return '<section class="card"><div class="card-hd"><h2>Today\u2019s note</h2>' +
        '</div><div class="caution"><p><b>Not composed yet.</b> Run ' +
        "<code>./run.sh</code> once the evening archives publish.</p></div></section>";
    }

    var c = n.call || {}, s = n.structure || {}, i = n.internals || {};
    var q = n.quality || {}, sc = n.scorecard || {}, p = n.positioning || {};
    var a = n.appendix || {}, rng = c.next_range || [];
    var out = "";

    function card(title, sub, right, body) {
      return '<section class="card"><div class="card-hd"><h2>' + title + "</h2>" +
        (sub ? '<span class="sub">' + sub + "</span>" : "") +
        (right ? '<div class="right"><span class="kpi-m">' + right + "</span></div>" : "") +
        "</div>" + body + "</section>";
    }
    function para(t) { return '<div class="caution"><p>' + t + "</p></div>"; }

    /* ---------------------------------------------- the call */
    var call = s.kind === "stand_aside"
      ? "Stand aside \u2014 no strike pays enough to be worth selling into it."
      : "Sellers of premium, not buyers of direction. Stand down below " +
        n0(rng[0]) + ".";

    out += card("Today\u2019s note",
      "on the " + esc(n.data_date) + " close \u00b7 published for " + esc(n.note_date),
      "one session only \u2014 every past session is in reports/",
      '<div class="notecall"><b>' + call + "</b> Expected range <b>" +
      n0(rng[0]) + "\u2013" + n0(rng[1]) + "</b>." +
      (c.p_positive == null ? "" :
        " Positive close <b>" + n1(c.p_positive) + "%</b>, inside the band <b>" +
        n1(c.p_inside) + "%</b>, break above " + n0((n.range1 || [])[1]) +
        " <b>" + n1(c.p_break_up) + "%</b>. " +
        '<span class="kpi-m">from the ' + esc(c.p_source || "") + "</span>") +
      "</div>" +
      '<div class="probs">' +
        '<div class="prob"><div class="prob-k">Close</div><div class="prob-v ' +
          cls(i.move) + '">' + n2(n.spot) + '</div><div class="kpi-m">' +
          sgn(i.move, 2) + " pts</div></div>" +
        '<div class="prob"><div class="prob-k">VWAP</div><div class="prob-v">' +
          n2(i.vwap) + '</div><div class="kpi-m">constituent-weighted</div></div>' +
        '<div class="prob"><div class="prob-k">India VIX</div><div class="prob-v">' +
          n2(n.vix) + '</div><div class="kpi-m">' + sgn(n.vix_chg, 2) + "%</div></div>" +
        '<div class="prob"><div class="prob-k">ATM IV</div><div class="prob-v">' +
          n2(n.atm_iv) + '%</div><div class="kpi-m">' + esc(n.expiry || "") + "</div></div>" +
        '<div class="prob"><div class="prob-k">IV / RV</div><div class="prob-v ' +
          ((q.vrp || {}).ratio > 1.1 ? "pos" : "") + '">' + n2((q.vrp || {}).ratio) +
          '</div><div class="kpi-m">' +
          ((q.vrp || {}).ratio > 1.1 ? "implied rich" : "roughly fair") + "</div></div>" +
      "</div>");

    /* ------------------------------- 1. the argument against us */
    var body1 = "<p>The " + esc(n.data_date) + " session moved <b>" +
      sgn(i.move, 2) + "</b> points on " + i.advances + " advances against " +
      i.declines + " declines.</p>";

    if (i.attribution_ok && i.drivers && i.drivers.length) {
      var names = i.drivers.map(function (x) {
        return esc(x[0]) + " " + sgn(x[1], 1);
      }).join(", ");
      /* On a near-flat session the constituents cancel and a percentage of
         the net move is not a share -- 21-Aug produced "280.9% of the
         advance". The points are still exactly true, so say those. */
      var lead = i.driver_share
        ? "<b>Three stocks produced " + n1(i.driver_share) + "% of the " +
          ((i.move || 0) < 0 ? "decline" : "advance") + ".</b>"
        : "<b>Three stocks contributed " + sgn(i.driver_points, 1) +
          " points against a net " + sgn(i.move, 1) + ".</b>";
      body1 += "<p>" + lead + " " + names + ". Attribution reconciles to " +
        n1(i.attributed) + " points against an actual " + n1(i.move) +
        " \u2014 a residual of " + n1(Math.abs(i.residual)) + ".</p>";
    } else {
      body1 += "<p><b>Contribution is not reported for this session.</b> The " +
        "attribution reconciles to " + n1(i.attributed) + " against an actual " +
        n1(i.move) + ", and a residual that size cannot support a claim about " +
        "which stocks drove the day.</p>";
    }
    if (i.above_dma != null) {
      body1 += "<p><b>Participation.</b> " + i.above_dma + " of 50 above their " +
        i.dma_window + "-session average" +
        (i.above_dma_prev == null ? "" :
          ", " + (i.above_dma < i.above_dma_prev ? "down" : "up") + " from " +
          i.above_dma_prev + " a week ago") + ".</p>";
    }
    if (i.delivery != null && i.delivery_avg != null) {
      var rich = i.delivery > i.delivery_avg;
      body1 += "<p><b>Delivery " + (rich ? "corroborates" : "does not corroborate") +
        " the move.</b> " + n2(i.delivery) + "% against a 20-session " +
        n2(i.delivery_avg) + "% \u2014 " +
        (rich ? "real stock changed hands." : "churn, not accumulation.") + "</p>";
    }
    var peers = i.peers || {}, pr = [];
    ["NIFTY BANK", "NIFTY MIDCAP 100", "NIFTY IT"].forEach(function (k) {
      if (peers[k] != null) pr.push(k.replace("NIFTY ", "") + " " + sgn(peers[k], 2) + "%");
    });
    if (pr.length) {
      body1 += "<p><b>Across the market.</b> " + pr.join(" \u00b7 ") +
        " against the index " + sgn(peers["NIFTY 50"], 2) + "%.</p>";
    }
    out += card("1 \u00b7 The argument against us", "taken first", "", para(body1));

    /* ----------------------------------------- 2. positioning */
    var f = p.fii || {}, body2 = "";
    if (f.ratio != null) {
      body2 += "<p><b>FII index-futures long/short is " + n2(f.ratio) + ".</b> " +
        n0(f.long) + " long against " + n0(f.short) + " short, net " + n0(f.net) +
        ". That is the <b>" + n1(f.pctile) + "th percentile</b> of " + f.n +
        " stored sessions, against a 20-session " + n2(f.avg20) + ".</p>";
    }
    var fl = p.flows || {}, fk = Object.keys(fl);
    if (fk.length) {
      body2 += "<p><b>Cash flows.</b> " + fk.sort().map(function (k) {
        return esc(k) + " " + sgn(fl[k].net_cr, 0) + "cr";
      }).join(" \u00b7 ") + ".</p>";
    }
    var g = p.gamma || {};
    if (g.regime) {
      body2 += "<p><b>Dealer gamma is " + g.regime + " across the whole \u00b1" +
        n0(g.span_pct) + "% band</b> \u2014 " + n0(g.at_spot_cr) +
        " crore per point at spot" +
        (g.flip == null ? ", with no flip between " + n0(g.lo) + " and " + n0(g.hi)
                        : ", flip at " + n0(g.flip)) + ". " +
        (g.regime === "long"
          ? "Long gamma means dealer hedging sells rallies and buys weakness \u2014 a range being enforced."
          : "Short gamma means hedging amplifies whatever the market starts doing.") +
        ' <span class="kpi-m">Estimated: the participant file gives aggregate ' +
        "positions, not their distribution across strikes.</span></p>";
    }
    var fw = p.forward || {};
    if (fw.basis != null) {
      body2 += "<p>Futures carry a <b>" + n1(fw.basis) +
        "-point basis</b> with the forward at " + n2(fw.forward) + ".</p>";
    }

    var divTable = "";
    if (p.divergence && p.divergence.length) {
      divTable = '<div class="tablewrap"><table class="dt"><thead><tr>' +
        '<th class="lft">Outcome at expiry</th><th>Chain</th><th>Lognormal</th>' +
        "<th>Divergence</th></tr></thead><tbody>" +
        p.divergence.map(function (x) {
          return '<tr><td class="lft">Close ' + (x.side === "below" ? "&lt;" : "&gt;") +
            " " + n0(x.level) + "</td><td>" + n1(x.market) + "%</td><td>" +
            n1(x.lognormal) + '%</td><td class="' + cls(x.diff) + '">' +
            sgn(x.diff, 1) + "pp</td></tr>";
        }).join("") + "</tbody></table></div>";
    } else if (p.rnd_reason) {
      divTable = para("<b>Chain-implied distribution not reported.</b> " +
        esc(p.rnd_reason) + " \u2014 a density whose mean is not the forward is " +
        "not risk-neutral, so it is withheld rather than published.");
    }
    out += card("2 \u00b7 Why we override it", "positioning", "", divTable + para(body2));

    /* -------------------------------------- 3. qualification */
    var rel = q.reliability || {}, keys = Object.keys(rel);
    var relTable = "";
    if (keys.length) {
      keys.sort(function (x, y) { return rel[y].pct - rel[x].pct; });
      relTable = '<div class="tablewrap"><table class="dt"><thead><tr>' +
        '<th class="lft">Claim</th><th>Graded</th><th>Correct</th><th>Hit rate</th>' +
        '<th class="lft">&nbsp;</th></tr></thead><tbody>' +
        keys.map(function (k) {
          var v = rel[k];
          var col = v.pct >= 70 ? "var(--up)" : v.pct >= 55 ? "var(--maxpain)" : "var(--down)";
          return '<tr><td class="lft">' + esc(k.replace(/_/g, " ")) + "</td><td>" +
            v.n + "</td><td>" + v.k + '</td><td style="color:' + col +
            ';font-weight:600">' + n1(v.pct) + '%</td><td class="lft">' +
            '<div class="pbar" style="background:var(--surface-3)"><i style="left:' +
            Math.min(100, v.pct).toFixed(1) + "%;background:" + col +
            '"></i></div></td></tr>';
        }).join("") + "</tbody></table></div>";
    }
    var v3 = q.vrp || {}, har = q.har || {}, body3 = "";
    if (v3.ratio) {
      body3 = "<p><b>Premium.</b> ATM implied " + n2(v3.iv) +
        "% against a forecast realised " + n2(v3.rv) + "%" +
        (har.r2 ? " (HAR-RV, R\u00b2 " + n2(har.r2) + ")" : "") +
        " is " + sgn(v3.spread_vol_pts, 2) + " vol points, a ratio of " +
        n2(v3.ratio) + ". IV rank " + n1(q.iv_rank) + ", percentile " +
        n1(q.iv_pctile) + ".</p>";
    }
    out += card("3 \u00b7 The honest qualification",
      "every graded claim this desk has made", "", relTable +
      para("<b>Read the ranges and the walls. Discount the direction.</b> " +
           "That ordering is not modesty, it is what the table says.") + (body3 ? para(body3) : ""));

    /* ------------------------------------------- 4. levels */
    var lv = n.levels || [];
    if (lv.length) {
      var marks = { 1: "\u25c6", 2: "\u25c7", 3: "\u25b2" };
      var groups = {};
      lv.forEach(function (x) {
        if (x.cluster) (groups[x.cluster] = groups[x.cluster] || []).push(x);
      });
      var conf = Object.keys(groups).map(function (gid) {
        var mem = groups[gid];
        var lo = Math.min.apply(null, mem.map(function (x) { return x.value; }));
        var hi = Math.max.apply(null, mem.map(function (x) { return x.value; }));
        return "<p><b>Confluence " + (marks[gid] || gid) + "</b> \u2014 " +
          mem.map(function (x) { return esc(x.name); }).join(", ") +
          " within " + n0(hi - lo) + " points, at " + n0(lo) + "\u2013" + n0(hi) +
          ". Independent methods agreeing makes that zone more significant " +
          "than any single line.</p>";
      }).join("");

      out += card("4 \u00b7 Levels", "with derivation", "",
        '<div class="tablewrap"><table class="dt"><thead><tr>' +
        '<th class="lft">Level</th><th>Value</th><th class="lft">Derived from</th>' +
        "</tr></thead><tbody>" + lv.map(function (x) {
          var mk = x.cluster ? " " + (marks[x.cluster] || "") : "";
          return "<tr" + (x.cluster ? ' style="background:var(--puts-dim)"' : "") +
            '><td class="lft"><b>' + esc(x.name) + mk + "</b></td><td>" +
            n0(x.value) + '</td><td class="lft"><span class="kpi-m">' +
            esc(x.source) + "</span></td></tr>";
        }).join("") + "</tbody></table></div>" + (conf ? para(conf) : ""));
    }

    /* --------------------------------------- 5. expression */
    var body5;
    if (s.kind === "stand_aside") {
      body5 = para("<b>No position.</b> " + esc(s.reason || "") +
        ". For a seller that is a valid answer \u2014 forcing a trade when " +
        "premium does not compensate for gap risk is how sellers give back " +
        "months of gains.");
    } else {
      var chips = (s.legs || []).map(function (l) {
        return '<span class="leg-chip ' + (l.act === "sell" ? "sell" : "buy") + '">' +
          (l.act === "sell" ? "Sell" : "Buy") + " " + n0(l.strike) + " " + l.side +
          " @ " + n2(l.prem) + "</span>";
      }).join("");
      body5 = '<div class="legs-row">' + chips + "</div>" +
        '<div class="probs">' +
        '<div class="prob"><div class="prob-k">Net credit</div><div class="prob-v">&#8377;' +
          n0(s.credit_rs) + '</div><div class="kpi-m">lot ' + s.lot + "</div></div>" +
        '<div class="prob"><div class="prob-k">Combined POP</div><div class="prob-v">' +
          n1((s.pop || 0) * 100) + '%</div><div class="kpi-m">both legs expire worthless</div></div>' +
        '<div class="prob"><div class="prob-k">Breakevens</div><div class="prob-v">' +
          n0((s.breakevens || [])[0]) + "\u2013" + n0((s.breakevens || [])[1]) +
          '</div><div class="kpi-m">at expiry</div></div>' +
        '<div class="prob"><div class="prob-k">Max loss</div><div class="prob-v neg">' +
          (s.max_loss ? "&#8377;" + n0(s.max_loss) : "Unlimited") +
          '</div><div class="kpi-m">' + (s.defined ? "capped by wings" : "naked") + "</div></div>" +
        '<div class="prob"><div class="prob-k">Return on margin</div><div class="prob-v">' +
          n1(s.rom) + '%</div><div class="kpi-m">' + n.dte + " days</div></div>" +
        "</div>" +
        para("<b>Exit, set now.</b> Take profit at combined " + n2(s.take_profit) +
          " (half the credit) \u00b7 stop at " + n2(s.stop) + " (2\u00d7) \u00b7 " +
          "hard close <b>" + esc(s.close_by || "") + "</b>, the session before expiry." +
          (s.defined ? " Wings are not optional at VIX " + n2(s.vix) +
            ", below the " + n1(s.vix_gate) + " gate." : ""));
    }
    out += card("5 \u00b7 How we express it",
      s.kind === "stand_aside" ? "no position" : esc(s.kind.replace(/_/g, " ")),
      "", body5);

    /* ------------------------------------ 6. what kills this */
    var kills = "";
    if (rng[0]) {
      kills += '<div class="killrow"><b>Hard stand-down</b> \u2014 sustained trade below ' +
        n0(rng[0]) + ", the \u22121\u03c3 session boundary" +
        (g.regime === "long" ? " and the lower edge of the long-gamma shelf" : "") +
        ". Size for it rather than widening the stop.</div>";
    }
    kills += '<div class="killrow"><b>Volatility</b> \u2014 close the short premium if ' +
      "India VIX gains more than 15% in a session. IV expansion hurts a " +
      "short-premium book before direction does, and at " + n2(n.vix) +
      " there is more room above than below.</div>";
    if (f.ratio != null) {
      kills += '<div class="killrow"><b>Positioning</b> \u2014 abandon the range if the ' +
        "FII short base covers hard. The ratio moving from " + n2(f.ratio) +
        " toward " + n2(f.avg20) + " with the index rising is short-covering.</div>";
    }
    if (peers["NIFTY BANK"] != null) {
      kills += '<div class="killrow"><b>Leadership</b> \u2014 reduce if Bank Nifty rolls ' +
        "over while the index holds. It closed " + sgn(peers["NIFTY BANK"], 2) +
        "% against the index " + sgn(peers["NIFTY 50"], 2) + "%.</div>";
    }
    out += card("6 \u00b7 What kills this view", "decided now, not in the drawdown", "", kills);

    /* --------------------------------------- 7. scorecard */
    var claims = sc.claims || [], scTable = "";
    if (claims.length) {
      scTable = '<div class="tablewrap"><table class="dt"><thead><tr>' +
        '<th class="lft">Called</th><th class="lft">Outcome</th><th>&nbsp;</th>' +
        "</tr></thead><tbody>" + claims.map(function (x) {
          var mark = x.correct == null ? '<span class="kpi-m">\u00b7</span>'
            : x.correct ? '<span style="color:var(--up)">\u2713</span>'
                        : '<span style="color:var(--down)">\u2717</span>';
          var res = x.correct == null ? "not yet resolved"
            : (x.actual == null ? (x.correct ? "held" : "missed") : n2(x.actual));
          return '<tr><td class="lft">' + esc(x.claim.replace(/_/g, " ")) +
            " \u2014 " + esc(x.stated || "") + '</td><td class="lft">' +
            '<span class="kpi-m">' + res + "</span></td><td>" + mark + "</td></tr>";
        }).join("") + "</tbody></table></div>";
    }
    var roll = sc.rolling || {}, rk = Object.keys(roll);
    var at = sc.all_time || {};
    out += card("7 \u00b7 Scorecard",
      "the note published " + esc(sc.for_date || "previously"), "", scTable +
      para("<b>" + (sc.correct || 0) + " of " + (sc.graded || 0) + " graded.</b>" +
        (rk.length ? " Rolling next-session containment " + rk.sort(function (x, y) { return x - y; })
          .map(function (k) { return n1(roll[k].pct) + "% over " + roll[k].n; })
          .join(" \u00b7 ") + "." : "") +
        (at.n ? " All claims all time " + at.k + "/" + at.n + " = " + n1(at.pct) + "%." : "")));

    /* ---------------------------------------- appendix */
    var fit = a.weights || {}, rv = a.realised || {}, ha = a.har || {};
    var rvTxt = Object.keys(rv).sort(function (x, y) { return x - y; })
      .map(function (k) { return k + "d " + n2(rv[k].yang_zhang) + "%"; }).join(" \u00b7 ");
    var app = "";
    if (fit.sessions) {
      app += "<p><b>Index weights</b> \u2014 NSE publishes none. Recovered by " +
        "non-negative least squares of index changes on the 50 constituent " +
        "changes over " + fit.sessions + " sessions (" + fit.kept +
        " kept after trimming corporate actions), rescaled once so the level " +
        "identity holds. Residual <b>" + n2(fit.rmse_pts) + " index points</b>, " +
        "R\u00b2 " + n2(fit.r2) + ", no negative weights. Fit dated " +
        esc(fit.as_of || "") + ".</p>";
    }
    app += "<p><b>Contribution</b> \u2014 (close \u2212 exchange-adjusted previous " +
      "close) \u00d7 coefficient per name, from the UDiFF cash bhavcopy.</p>" +
      "<p><b>Index VWAP</b> \u2014 per-stock turnover \u00f7 volume, combined " +
      "through the same coefficients as a ratio to the reconstructed close, " +
      "which makes it immune to coefficient drift.</p>" +
      "<p><b>Delivery</b> \u2014 index-weighted from the MTO file, " +
      (i.delivery_matched || 0) + " of 50 matched.</p>" +
      "<p><b>Dealer gamma</b> \u2014 \u03a3 \u0393(S,K,\u03c3,T) \u00d7 OI \u00d7 sign, " +
      "lot " + n.lot + ". The sign is taken from the observed proprietary net " +
      "position, not assumed. <b>Still an estimate:</b> the file gives aggregate " +
      "positions, not their strike distribution.</p>";
    if (rvTxt) {
      app += "<p><b>Realised volatility</b> \u2014 Yang-Zhang, gap-aware and " +
        "drift-independent. " + rvTxt + ".</p>";
    }
    if (ha.forecast) {
      app += "<p><b>HAR-RV</b> \u2014 RV(t+1) = c + \u03b2d\u00b7RVd + \u03b2w\u00b7RVw + " +
        "\u03b2m\u00b7RVm \u2192 <b>" + n2(ha.forecast) + "%</b>, R\u00b2 " +
        n2(ha.r2) + " over " + ha.n_obs + " observations.</p>";
    }
    app += "<p><b>Bands</b> \u2014 trading-time scaling; variance accrues only on " +
      "sessions the market is open. " + a.sessions_to_expiry +
      " sessions to expiry, not " + n.dte + " calendar days.</p>";

    var mp = rel.max_pain_pull || {};
    app += "<p><b>Reported as no signal today</b> \u2014 PCR (OI) " + n2(n.pcr) +
      ", mid-range. Max pain " + n0(n.max_pain) + ", correct on " +
      n1(mp.pct) + "% of " + (mp.n || 0) + " graded sessions, which is a coin " +
      "flip and is stated as one.</p>";

    app += '<p class="kpi-m">Personal research tool. Not investment advice, ' +
      "not a recommendation, and not produced by a registered research analyst. " +
      "Generated automatically from public NSE data. Estimated quantities are " +
      "labelled at the point of use. Past accuracy is measured in section 7 and " +
      "is not indicative of future results.</p>";

    out += card("Appendix", "workings and disclosures",
      "the same document is in reports/NIFTY/report.docx", para(app));

    return out;
  }

  function viewTechnicals(m) {
    var c = m.cfg, p = m.piv;

    /* Chronological closes from stored history. Indicators that need more
       sessions than exist say so rather than showing a number. */
    var closes = m.hist.slice().reverse().map(function (h) { return h.close; })
                  .filter(function (v) { return v != null; });

    function sma(n) {
      if (closes.length < n) return null;
      var s = closes.slice(-n).reduce(function (a, b) { return a + b; }, 0);
      return s / n;
    }

    function rsi14() {
      if (closes.length < 15) return null;
      var g = 0, l = 0;
      for (var i = closes.length - 14; i < closes.length; i++) {
        var d = closes[i] - closes[i - 1];
        if (d >= 0) g += d; else l -= d;
      }
      if (l === 0) return 100;
      var rs = (g / 14) / (l / 14);
      return 100 - 100 / (1 + rs);
    }

    function tcell(k, v, m2, meterPct, meterCol) {
      return '<div class="tcell"><div class="tcell-k">' + k + '</div><div class="tcell-v">' + v + "</div>" +
        (meterPct != null ? '<div class="meter"><i style="width:' + meterPct + "%;background:" + meterCol + '"></i></div>' : "") +
        '<div class="tcell-m">' + m2 + "</div></div>";
    }

    function maCell(label, n) {
      var v = sma(n);
      if (v == null) {
        return tcell(label, "&mdash;", "needs " + n + " sessions &middot; have " + closes.length, null);
      }
      return tcell(label, n0(v), c.spot > v ? "Price above" : "Price below", null);
    }

    var r = rsi14();
    var tech =
      (r == null
        ? tcell("RSI (14)", "&mdash;", "needs 15 sessions &middot; have " + closes.length, null)
        : tcell("RSI (14)", n1(r), r > 60 ? "Strong, not extended" : r < 40 ? "Weak" : "Neutral zone",
                r, r > 60 ? "var(--up)" : r < 40 ? "var(--down)" : "var(--calls)")) +
      tcell("ATM IV", m.atmIv != null ? n2(m.atmIv) + "%" : "&mdash;",
            m.atmIv != null && m.atmIv < 11 ? "Low \u2014 thin premium" : "Workable", null) +
      maCell("20 DMA", 20) + maCell("50 DMA", 50) + maCell("200 DMA", 200) +
      tcell("India VIX", c.vix ? n2(c.vix) : "&mdash;",
            c.vix && c.vix < 13 ? "Low \u2014 complacent" : "Elevated", null);

    var lv = [["R3", p.r3], ["R2", p.r2], ["R1", p.r1], ["Pivot", p.p], ["S1", p.s1], ["S2", p.s2], ["S3", p.s3]];

    return '<section class="card"><div class="card-hd"><h2>Indicators</h2>' +
      '<span class="sub">' + esc(c.label) + " \u00b7 daily</span></div>" +
      '<div class="tech">' + tech + "</div></section>" +
      '<section class="card"><div class="card-hd"><h2>Classic pivots</h2>' +
      '<span class="sub">from today\u2019s high / low / close</span>' +
      '<div class="right"><span class="kpi-m">H ' + n0(c.high) + " \u00b7 L " + n0(c.low) + " \u00b7 C " + n2(c.spot) + "</span></div></div>" +
      '<div class="levels">' + lv.map(function (x) {
        var isP = x[0] === "Pivot";
        return '<div class="lvl"><div class="lvl-k">' + x[0] + '</div><div class="lvl-v"' +
          (isP ? ' style="color:var(--ink);font-weight:700"' : "") + ">" + n0(x[1]) + "</div></div>";
      }).join("") + "</div></section>" +
      '<section class="card"><div class="card-hd"><h2>Option-implied levels</h2>' +
      '<span class="sub">from OI, not price</span></div><div class="levels">' +
      '<div class="lvl"><div class="lvl-k">Call wall</div><div class="lvl-v" style="color:var(--calls)">' + n0(m.callWall) + "</div></div>" +
      '<div class="lvl"><div class="lvl-k">Max pain</div><div class="lvl-v" style="color:var(--maxpain)">' + n0(m.maxPain) + "</div></div>" +
      '<div class="lvl"><div class="lvl-k">Put wall</div><div class="lvl-v" style="color:var(--puts)">' + n0(m.putWall) + "</div></div>" +
      '<div class="lvl"><div class="lvl-k">Implied range</div><div class="lvl-v">' + n0(m.putWall) + "&ndash;" + n0(m.callWall) + "</div></div>" +
      "</div></section>" + fundBlock(m) + noteBlock(m);
  }

  function viewHistory(m) {

      "</tr></thead><tbody>" + rows + "</tbody></table></div></section>";
